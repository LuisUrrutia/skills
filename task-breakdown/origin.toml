[[sources]]
id = "matt-to-tickets"
author = "Matt Pocock"
repository = "https://github.com/mattpocock/skills"
remote = "git@github.com:mattpocock/skills.git"
ref = "refs/heads/main"
license = "MIT; original notice retained in THIRD-PARTY-NOTICES.txt"
role = "ideas"
baseline_commit = "4588b32ecab9ecc9fc8cc6b6c5e7d675b6004b0d"
reviewed_through = "49dd158d1076134a641b33efb035946536778336"
baseline_paths = ["skills/engineering/to-tickets/SKILL.md", "LICENSE"]
paths = ["skills/engineering/to-tickets/SKILL.md", "LICENSE"]

[[sources.ideas]]
idea = "A delivery unit is the smallest useful behavior that can be demonstrated once its real prerequisites land. It includes every layer that behavior needs, such as data access, backend, frontend and behavioral tests. Further capabilities become separate units, each named after what it delivers rather than a file or widget."
serves = "Each PR shows working behavior that a reviewer can check."
where = [
  "SKILL.md#choose-functional-boundaries",
  "references/staged-delivery.md#separate-layers-only-for-a-concrete-reason",
]
shapes = "Opens Choose functional boundaries with this rule and the statistics-dashboard example, and makes a split by technical layer the exception that needs a named reason."
adapted = "A backend prerequisite, frontend contract or integration unit is allowed when a complete vertical slice is impractical for a concrete reason, with its verification limits stated."

[[sources.ideas]]
idea = "A dependency records the exact capability or contract a unit consumes. Shared files or environments may need coordination but do not create a functional blocker, and neither is the same as a preferred execution order."
serves = "Prevents false blockers that serialize independent work, and hidden ones that break a unit."
where = ["SKILL.md#choose-functional-boundaries"]
shapes = "Adds a dependency paragraph that separates functional blockers, coordination constraints and preferred order, resolves cycles through a smaller shared contract or a cohesive unit, and forbids forcing independent units into a stack."

[[sources.ideas]]
idea = "For a change whose consumers cannot move together, the breakdown considers expand, migrate, contract: introduce a compatible form, migrate bounded groups of consumers, then retire the old form after checking that every required consumer has moved. Each stage has its supported behavior and deciding check."
serves = "Keeps every stage working while a broad change moves through its consumers."
where = ["references/staged-delivery.md#stage-compatibility-changes"]
shapes = "Gives the staged-delivery reference a section for compatibility changes built on these three stages."
adapted = "It applies to any change whose consumers cannot move together, including deployed clients and data, not only a mechanical wide refactor. An empty repository search does not prove an external contract unused."

[[sources.ideas]]
idea = "When units cannot pass independently, the breakdown identifies the coupled group and the first point where its combined checks can pass, and it assigns the first real end-to-end check to an explicit unit with its prerequisites and expected result."
serves = "Prevents a sequence of units that each report success while the connected feature is never exercised."
where = [
  "references/staged-delivery.md#separate-layers-only-for-a-concrete-reason",
  "references/staged-delivery.md#stage-compatibility-changes",
  "SKILL.md#check-the-breakdown-and-continue",
]
shapes = "Makes the integration unit the last step of the backend, frontend and integration split, places the combined check at the first stage that can exercise the real connection, and requires the final check to name where the combined capability is verified."
adapted = "The integration unit stays within its own review budget and must not hide most of the feature; buildable, behavior-preserving intermediate states are preferred."

[[sources.declined]]
feature = "Publishing the approved tickets to the configured tracker as part of the breakdown."
reason = "Drafting stays in this skill; publication goes to the issue-workflow skill only when it is requested."


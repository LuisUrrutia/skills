[[sources.ideas]]
idea = "Units rest on repository evidence: the request, the authoritative plan, decisions, existing tasks and project instructions, plus the affected code, callers, tests and configured checks. Settled scope and contracts stay settled, so decomposition does not become a new design exercise."
serves = "Prevents boundaries drawn on assumed structure, and prevents the breakdown from reopening decisions the plan already made."
where = ["SKILL.md#establish-the-input"]
shapes = "Makes reading the authoritative inputs and the affected code the first section, before any boundary is drawn, and forbids reopening settled contracts there."

[[sources.ideas]]
idea = "Enough context travels with each unit for an executor who never saw the conversation: relevant source paths, authoritative decisions, consumed and produced contracts, and contract excerpts when links alone are not enough."
serves = "Lets a fresh executor implement a unit without reconstructing the planning discussion."
where = ["SKILL.md#make-each-unit-executable"]
shapes = "Sets the source, decision and contract line of the unit field list and the closing rule that context travels with each unit."

[[sources.ideas]]
idea = "Each unit carries observable acceptance scenarios with their deciding commands or interactions, and its true prerequisites by unit ID, kept apart from coordination or release constraints."
serves = "Each unit can be checked on its own, and its start condition is clear."
where = ["SKILL.md#make-each-unit-executable", "SKILL.md#check-the-breakdown-and-continue"]
shapes = "Adds acceptance-scenario and prerequisite lines to every unit, and makes the final check trace each requirement to a unit and its acceptance evidence."


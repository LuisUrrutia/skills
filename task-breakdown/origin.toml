baseline_paths = ["skills/writing-plans/SKILL.md", "LICENSE"]
paths = ["skills/writing-plans/SKILL.md", "LICENSE"]

[[sources.ideas]]
idea = "A delivery boundary falls where a reviewer can make a meaningful acceptance decision of its own. Parts that only serve the same decision and fit comfortably within the review budget stay together in one unit."
serves = "Separates real review boundaries from internal implementation steps, so each PR is worth reviewing on its own."
where = ["SKILL.md#choose-functional-boundaries"]
shapes = "Adds the rule that each proposed PR needs its own acceptance decision directly after the smallest-behavior rule."
adapted = "The heuristic applies to PR-sized deliveries, not commit-sized tasks. A justified enabling change and a real dependency stay separate units, while a cohesive small delivery stays together."

[[sources.declined]]
feature = "Commit-sized tasks with mandatory TDD steps and a choice of execution method."
reason = "Units are PR-sized deliveries; implementation steps and execution follow the existing workflow."


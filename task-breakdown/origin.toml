baseline_paths = ["spec/SKILL.md", "LICENSE"]
paths = ["spec/SKILL.md", "LICENSE"]

[[sources.ideas]]
idea = "A unit that will be executed later carries the inspected revision or verification date with its source and contract references, and the executor rechecks those references at pickup before relying on them."
serves = "Prevents an executor from building on code facts that changed after the breakdown."
where = ["SKILL.md#make-each-unit-executable"]
shapes = "Adds the deferred-execution rule to the source and contract line of the unit field list."
adapted = "The local rule records the inspected revision as well as a date, and it requires revalidation at pickup."

[[sources.declined]]
feature = "Filing the spec as an issue, sizing issues by days of work, and spawning an agent to execute it."
reason = "Ticket publication belongs to the issue-workflow skill, and units are sized for human review. Ordinary implementation choices stay with the executor, and execution follows the existing workflow."


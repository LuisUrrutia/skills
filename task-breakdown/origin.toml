format_version = 2
skill = "task-breakdown"
created = "2026-10-06"
approach = "derive"
goal = "Divide a defined feature or implementation plan into delivery units that a person can review as one PR and an executor can implement and verify, each with its acceptance checks and real dependencies. A ready unit fits its review budget and any explicit size cap and demonstrates its stated result; work that is not ready stays a draft or blocked unit with its unknowns recorded."

[[invariants]]
rule = "This skill owns delivery boundaries, acceptance checks and dependencies. The wayfinder skill owns direction, the planning skill the overall approach, the issue-workflow skill ticket publication, the pr skill individual PR publication, and the stacked-pr skill dependent branches."
reason = "Delivery decomposition was extracted from the planning skill into its own skill so that it can be invoked on its own."
where = ["SKILL.md#task-breakdown"]

[[invariants]]
rule = "A breakdown request authorizes only its requested artifact. Implementation, ticket publication, branch creation and deployment continue only when they are already authorized."
where = ["SKILL.md#task-breakdown", "SKILL.md#check-the-breakdown-and-continue"]

[[invariants]]
rule = "A numeric line count or rough target is review guidance, not a hard cap, and the skill invents no default ceiling. A numeric cap applies only when the user, project rules or the authoritative task record explicitly establishes it, and only that authority can change it."
reason = "The user defined this human review size contract and gave a line count as an illustration, not as a default ceiling."
where = ["SKILL.md#budget-for-human-review"]

[[invariants]]
rule = "When an explicit cap applies, a unit is ready only when the credible upper bound of its estimate fits the cap with room for fixes, and the publishing owner measures the actual PR diff, additions plus deletions between the intended base and head, before publication."
reason = "The user defined this human review size contract; an estimate alone does not prove that a PR fits it."
where = ["SKILL.md#budget-for-human-review"]

[[invariants]]
rule = "The breakdown keeps one authoritative task record in the requested format. A table in the plan or in chat can be enough; no separate document or ticket per unit is required."
where = ["SKILL.md#establish-the-input", "SKILL.md#make-each-unit-executable"]


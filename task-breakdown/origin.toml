reviewed_through = "33c00aaffa56e5d394bccce1c8df59fb842e84c5"
baseline_paths = [
  "src/resources/skills/decompose-into-slices/SKILL.md",
  "src/resources/extensions/gsd/templates/roadmap.md",
  "src/resources/extensions/gsd/prompts/plan-slice.md",
  "LICENSE",
]
paths = [
  "src/resources/skills/decompose-into-slices/SKILL.md",
  "src/resources/extensions/gsd/templates/roadmap.md",
  "src/resources/extensions/gsd/prompts/plan-slice.md",
  "LICENSE",
]

[[sources.ideas]]
idea = "Material uncertainties already identified in the plan map to the delivery units and the evidence that resolve them, and the plan's risk-reduction order is kept where dependencies permit."
serves = "Retires the riskiest unknowns early instead of discovering them in the last unit."
where = ["SKILL.md#choose-functional-boundaries"]
shapes = "Adds a closing paragraph to Choose functional boundaries that ties each material uncertainty to a unit and keeps the plan's risk order."
adapted = "The risks come from the plan, and decomposition does not reopen settled design decisions."

[[sources.ideas]]
idea = "For a large plan, a delivery map of all units can come before the detailed execution contracts. Later units stay drafts with a stable ID, outcome, known dependencies, explicit unknowns and the review budget until their scope, dependencies, acceptance checks and sizing meet the readiness requirements."
serves = "Lets a large plan start with the next ready units without inventing detail for later ones."
where = ["SKILL.md#establish-the-input", "SKILL.md#check-the-breakdown-and-continue"]
shapes = "Adds the draft-unit paragraph to Establish the input, and makes the final check and the return separate ready, draft and blocked units."
adapted = "Progressive detail is optional, and a draft is never treated as ready work, including when it is published."

[[sources.declined]]
feature = "The roadmap parser format, tool-owned slice state, user approval before the roadmap is written, parallel worker dispatch, and splitting into as many thin slices as possible."
reason = "Units use the project's task format and one authoritative record. A cohesive change stays in one unit when it fits the review budget, and the execution workflow chooses the worker topology."


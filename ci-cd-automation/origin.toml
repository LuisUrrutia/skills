format_version = 2
skill = "ci-cd-automation"
created = "2026-10-04"
approach = "derive"
goal = "Design, review or improve a project's CI/CD so that each stage has a stated purpose and evidence, and a candidate advances only on evidence bound to its exact identity. Success is a stage graph with concise stage contracts, deployments with defined acceptance signals and recovery, and speed or cost changes that keep required coverage, reported with the observed checks and the remaining gaps."

[[invariants]]
rule = "Provider syntax and configuration stay with the platform specialist, the github-actions skill for GitHub Actions; this skill keeps no provider rules. Without a specialist, authorized implementation uses current primary provider documentation and reports that gap."
where = ["SKILL.md#cicd-automation", "SKILL.md#implement-and-verify-the-contract"]

[[invariants]]
rule = "The verify skill owns execution evidence, the verification-authoring skill owns project verification recipes, and the pr-followup skill owns repairing and watching an existing PR's failing checks and feedback. This skill defines the stage contract they serve."
where = ["SKILL.md#implement-and-verify-the-contract"]

[[invariants]]
rule = "Designing automation grants no additional authority to publish, deploy or change protection settings, and existing authorization governs deployment and recovery. A design or review request produces recommendations; a setup request includes implementation within the user's existing authorization."
where = ["SKILL.md#cicd-automation", "SKILL.md#implement-and-verify-the-contract"]

[[invariants]]
rule = "The project's established approval policy, availability requirements and cost limits are preserved, and the skill asks only about an unresolved choice that materially changes the design. It does not invent environments, coverage quotas or manual approvals for a project."
where = ["SKILL.md#establish-the-delivery-contract"]

[[sources]]
id = "addy-ci-cd-gates"
author = "Addy Osmani"
repository = "https://github.com/addyosmani/agent-skills"
remote = "git@github.com:addyosmani/agent-skills.git"
ref = "refs/heads/main"
license = "MIT; original notice retained in THIRD-PARTY-NOTICES.txt"
role = "ideas"
baseline_commit = "1401c8b8030e023baeebb31781a6653fe8e93026"
reviewed_through = "aeac41d4d005999432bb7312f7ff06383a91d59d"
baseline_paths = ["skills/ci-cd-and-automation/SKILL.md", "LICENSE"]
paths = ["skills/ci-cd-and-automation/SKILL.md", "LICENSE"]

[[sources.ideas]]
idea = "Each automated check is chosen for a concrete failure mode and runs before the decision it protects. A required failure blocks that decision, and a failure reaches someone who can act on it."
serves = "Stops a candidate from advancing past a check that failed or never ran, without running checks that protect nothing."
where = ["SKILL.md#choose-stages-by-their-purpose"]
shapes = "Organizes the stages as a table that pairs each phase's selected checks with the evidence that permits progress, and sends periodic failures to a responsible owner instead of a gate."
adapted = "The check set comes from the product contract and its failure modes, not from a fixed gate list."

[[sources.ideas]]
idea = "Deployment and exposure are separate. A feature flag can ship code without enabling it, but turning the flag off does not reverse the writes, messages or payments that the exposed code caused. A temporary flag has an owner and a removal condition."
serves = "Lets risky code reach production unexposed without treating a flag as a full recovery path."
where = ["references/delivery-boundaries.md#specify-advancement-and-recovery"]
shapes = "Limits the flag guidance: flags separate deployment from exposure but do not count as recovery of writes or external effects, and each temporary flag gets an owner and a removal condition."
adapted = "The donor presents turning a flag off as a rollback without redeploying and calls every deployment reversible. Locally a flag only limits exposure, because data changes and external effects need their own recovery."

[[sources.ideas]]
idea = "Delivery feedback stays short: independent stages run in parallel, and expensive broader suites can move to periodic maintenance. Scheduled work never replaces a required release gate."
serves = "Keeps developers waiting only on the checks that protect the current decision."
where = ["SKILL.md#choose-stages-by-their-purpose"]
shapes = "Turns the pipeline into a dependency graph that runs independent stages in parallel, and adds a periodic maintenance phase for expensive suites that cannot replace a release gate."
adapted = "There is no fixed duration target; speed changes follow the measured approach in references/pipeline-efficiency.md."

[[sources.declined]]
feature = "A universal gate list (lint, type check, unit tests, build, integration, E2E, npm audit, bundle size) in which no gate can be skipped."
reason = "Checks are selected from the product contract and concrete failure modes, and a justified exclusion is stated explicitly."

[[sources.declined]]
feature = "A fixed staging-then-production chain, a ten-minute pipeline target, a required review count and an auto-merge policy."
reason = "These come from the project's established policy and requirements, not from a universal template."

[[sources.declined]]
feature = "GitHub Actions workflow YAML, Dependabot or Renovate configuration, secrets-storage layout, and the loop that feeds CI failures back to an agent for repair."
reason = "Provider mechanics belong to the platform specialist, and an existing PR's failing checks belong to the pr-followup skill."

[[sources.declined]]
feature = "The claim that every deployment is reversible, with a rollback workflow as the recovery plan."
reason = "Reverting code cannot undo every data change or external effect, so recovery is defined explicitly for data and external effects."


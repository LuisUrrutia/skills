id = "pstack-idempotency-and-shared-state"
author = "Lauren Tan / pstack"
repository = "https://github.com/cursor/plugins"
remote = "git@github.com:cursor/plugins.git"
ref = "refs/heads/main"
license = "MIT; original notice retained in THIRD-PARTY-NOTICES.txt"
role = "ideas"
baseline_commit = "e43c7ee26e0038c6c1fa8380dd34ce86ff94cb2a"
reviewed_through = "e5136d82418d2db3165ea1050d17577cd618cc05"
baseline_paths = [
  "pstack/skills/principle-make-operations-idempotent/SKILL.md",
  "pstack/skills/principle-separate-before-serializing-shared-state/SKILL.md",
  "pstack/LICENSE",
]
paths = [
  "pstack/skills/principle-make-operations-idempotent/SKILL.md",
  "pstack/skills/principle-separate-before-serializing-shared-state/SKILL.md",
  "pstack/LICENSE",
]

[[sources.ideas]]
idea = "Before a mutating step is retried or cancelled, its actual state is established, including partial effects of an interrupted run. The delivery design states which operations can repeat safely."
serves = "Prevents a retry from doubling an effect or building on unknown partial state."
where = [
  "SKILL.md#make-deployment-recoverable",
  "references/delivery-boundaries.md#specify-advancement-and-recovery",
]
shapes = "Adds a state check before any retry or cancellation of a mutating step, and a definition of which operations can retry and how partial progress is found."
adapted = "Applied to deployment steps and migrations: a timed-out request is reconciled before another attempt, and the state after recovery is verified."

[[sources.ideas]]
idea = "Independent mutable targets are isolated first. Serialization is enforced only where one shared target is a real invariant, and then structurally rather than by convention."
serves = "Avoids races between deployments without serializing work that never shares state."
where = [
  "SKILL.md#make-deployment-recoverable",
  "references/delivery-boundaries.md#protect-state-during-mixed-version-operation",
  "references/pipeline-efficiency.md#preserve-state-and-cache-boundaries",
]
shapes = "Orders isolation before serialization for targets, migrations and shared build resources, and extends serialization to retries, manual reruns and recovery."
adapted = "Applied to deployment targets, migrations and shared build resources. Beyond serializing overlapping writes, an obsolete candidate is rejected."

[[sources.declined]]
feature = "PID-based stale-lock detection and universal self-healing startup."
reason = "The skill applies the principles to deployment targets, migrations and shared build resources, not to process lock recipes."


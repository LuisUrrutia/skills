[[sources]]
id = "wshobson-pipeline-design"
author = "Seth Hobson / wshobson"
repository = "https://github.com/wshobson/agents"
remote = "git@github.com:wshobson/agents.git"
ref = "refs/heads/main"
license = "MIT; original notice retained in THIRD-PARTY-NOTICES.txt"
role = "ideas"
baseline_commit = "156b7a5e7a8b93642628a339ee4039c925b34c7f"
reviewed_through = "044b4b21f083948e69ec878a7b07c8d0951a6ffa"
baseline_paths = [
  "plugins/cicd-automation/skills/deployment-pipeline-design/SKILL.md",
  "plugins/cicd-automation/skills/deployment-pipeline-design/references/details.md",
  "plugins/cicd-automation/skills/deployment-pipeline-design/references/advanced-strategies.md",
  "LICENSE",
]
paths = [
  "plugins/cicd-automation/skills/deployment-pipeline-design/SKILL.md",
  "plugins/cicd-automation/skills/deployment-pipeline-design/references/details.md",
  "plugins/cicd-automation/skills/deployment-pipeline-design/references/advanced-strategies.md",
  "LICENSE",
]

[[sources.ideas]]
idea = "A pipeline is a dependency graph of stages from change validation through release candidate to delivery. The artifact verified in an earlier stage is the one promoted to later stages, without a rebuild."
serves = "Makes the deployed artifact the one that passed the checks."
where = ["SKILL.md#choose-stages-by-their-purpose", "SKILL.md#preserve-evidence-across-stages"]
shapes = "Sets the phase order from change validation to delivery and makes promotion reuse the verified artifact, with its identity recorded."
adapted = "When a target requires a distinct build, that output is verified as its own artifact and its relationship to the source candidate is recorded. Promotion evidence and approvals bind to the exact artifact identity, never to a branch, job name or mutable tag."

[[sources.ideas]]
idea = "Rollout criteria exist before rollout: acceptance and abort signals, observation bounds and a recovery owner. After deployment, the candidate is verified at the consumer boundary through meaningful requests or jobs; process liveness or a successful deployment API response proves less than functional readiness."
serves = "Prevents declaring a release healthy from a deployment that only started."
where = [
  "SKILL.md#make-deployment-recoverable",
  "references/delivery-boundaries.md#match-the-release-unit-to-its-consumer",
  "references/delivery-boundaries.md#specify-advancement-and-recovery",
]
shapes = "Moves acceptance and abort signals, observation bounds and the recovery owner ahead of rollout, and adds consumer-specific verification for each release unit after it."
adapted = "Success, failure and inconclusive telemetry stay separate. No telemetry is an unknown outcome, not a healthy release. An inconclusive result, which pauses an Argo rollout, is not treated as a failed analysis: someone is named to investigate it and the rollout stays bounded meanwhile. Liveness, readiness and rollout acceptance also stay distinct, because making every dependency a liveness requirement can turn a dependency outage into restart churn."

[[sources.ideas]]
idea = "During a schema or data transition, old and new producers and consumers run together. The deploy order and compatibility window cover in-flight work and a possible return to the prior application, and staged migrations use expansion, backfill, reader and writer transition, and eventual removal."
serves = "Prevents a deploy or rollback from breaking the consumers that still use the old contract."
where = ["references/delivery-boundaries.md#protect-state-during-mixed-version-operation"]
shapes = "Makes mixed-version operation its own section and orders a staged migration as expansion, backfill, reader and writer transition, and removal."
adapted = "Each transition names what proves it safe. Elapsed time or a fixed number of releases alone does not prove that old consumers have retired, unlike the donor's three-release expand and contract schedule."

[[sources.ideas]]
idea = "The rollout pattern and observation depth follow from the product's compatibility, traffic and recovery cost, and each pattern has its own precondition: rolling needs mixed-version compatibility and capacity, blue-green needs shared-data and cutover checks, and a canary needs representative exposure and candidate-specific signals."
serves = "Picks a rollout whose safety assumptions actually hold for the product."
where = [
  "SKILL.md#make-deployment-recoverable",
  "references/delivery-boundaries.md#specify-advancement-and-recovery",
]
shapes = "Replaces a menu of strategies with a precondition for each pattern, and derives rollout and observation depth from product factors."
adapted = "No pattern carries a promise of automatic rollback, instant recovery or zero downtime. Thresholds and windows come from the service's requirements and baseline."

[[sources.declined]]
feature = "Provider pipeline examples (GitHub Actions, GitLab CI, Azure Pipelines), Kubernetes and Argo Rollouts commands, and platform-specific troubleshooting."
reason = "Provider syntax and platform behavior belong to the platform specialist or current primary provider documentation."

[[sources.declined]]
feature = "Promises of automatic rollback, instant rollback or zero downtime for a deployment strategy."
reason = "Recovery speed and downtime depend on shared data, compatibility and external effects, so the skill states each strategy's conditions instead."

[[sources.declined]]
feature = "A mandatory staging environment and fixed DORA metric targets."
reason = "Environments and thresholds come from the project's own requirements."


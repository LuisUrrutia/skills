id = "compound-deployment-verification"
author = "Every / Compound Engineering"
repository = "https://github.com/EveryInc/compound-engineering-plugin"
remote = "git@github.com:EveryInc/compound-engineering-plugin.git"
ref = "refs/heads/main"
license = "MIT; original notice retained in THIRD-PARTY-NOTICES.txt"
role = "ideas"
baseline_commit = "9af474a70e7f2a844338519ad9e92aafbd92d4fb"
reviewed_through = "bdc53d034ccfa5baf01b6139cd46082145ff95cc"
baseline_paths = [
  "skills/ce-code-review/references/personas/deployment-verification-agent.md",
  "LICENSE",
]
paths = ["skills/ce-code-review/references/personas/deployment-verification-agent.md", "LICENSE"]

[[sources.ideas]]
idea = "A delivery that changes data names its invariants, read-only checks before and after the change with expected results, the recovery limits and the owner of a failure."
serves = "Turns 'the deploy looked fine' into observations that show whether the data contract held."
where = [
  "references/delivery-boundaries.md#protect-state-during-mixed-version-operation",
  "references/delivery-boundaries.md#specify-advancement-and-recovery",
  "SKILL.md#make-deployment-recoverable",
]
shapes = "Adds a record of invariants and before-and-after checks to data-changing deliveries, separates repository evidence from live-state prerequisites, and names the recovery owner before rollout and in the release record."
adapted = "Observation windows and thresholds come from the service's requirements and baseline, not from a fixed schedule."

[[sources.ideas]]
idea = "Rolling back code differs from restoring data and from effects that cannot be undone. Completed effects are inspected before choosing rollback, roll-forward or repair, and the resulting state is verified after recovery."
serves = "Prevents a code rollback from being reported as recovery while data or external effects remain changed."
where = [
  "SKILL.md#make-deployment-recoverable",
  "references/delivery-boundaries.md#specify-advancement-and-recovery",
]
shapes = "Replaces a single rollback step with a choice among rollback, roll-forward and repair, made after inspecting completed effects and followed by a check of the resulting state."
adapted = "The donor accepts a pre-migration backup as a way to roll back. Locally, restoration access and allowed data loss are verified, because the existence of a backup is not a tested restore."

[[sources.declined]]
feature = "A deployment-verification reviewer persona that produces a mandatory go/no-go SQL checklist."
reason = "Data-state guidance is a conditional reference for deliveries that change state, and checks are chosen for the data contract instead of a fixed SQL template."

[[sources.declined]]
feature = "Fixed observation windows, such as verification within five minutes and monitoring for the first 24 hours."
reason = "Windows and thresholds come from the service's requirements and baseline."


[[sources]]
id = "mblode-ci-efficiency"
author = "Matthew Blode"
repository = "https://github.com/mblode/agent-skills"
remote = "git@github.com:mblode/agent-skills.git"
ref = "refs/heads/main"
license = "MIT; original notice retained in THIRD-PARTY-NOTICES.txt"
role = "ideas"
baseline_commit = "012e6e5208f512151bdea0e2965dafd01ff61340"
reviewed_through = "872bc83bdb6dd54a9ff456fbf1181beea6db7875"
baseline_paths = [
  "skills/ci-speedup/SKILL.md",
  "skills/ci-speedup/references/measuring.md",
  "skills/ci-speedup/references/levers.md",
  "skills/ci-speedup/references/ledger.md",
  "LICENSE.md",
]
paths = [
  "skills/ci-speedup/SKILL.md",
  "skills/ci-speedup/references/measuring.md",
  "skills/ci-speedup/references/levers.md",
  "skills/ci-speedup/references/ledger.md",
  "LICENSE.md",
]

[[sources.ideas]]
idea = "Pipeline speed is measured on the critical path from real run, job and step timestamps. Queue and approval waits, setup, execution and artifact transfer are separated, developer wait and runner cost are measured separately, and spread and cold or warm cache state are compared across several runs."
serves = "Directs a speed or cost change at the part that actually limits completion time."
where = ["references/pipeline-efficiency.md#measure-the-waiting-path"]
shapes = "Makes measurement the first step of any efficiency change and limits credit to comparable executed work at the changed revision."
adapted = "The guidance is a reference that loads only for path filters, caching, sharding, topology or speed and cost changes, not the skill's main workflow. Without a measured baseline, the skill gives a hypothesis and the runs needed to test it."

[[sources.ideas]]
idea = "Change-based selection stays conservative. Changed-path detection includes dependent packages and shared build inputs, and the comparison range covers every unverified change, including work skipped by a superseded run. Expected coverage is defined independently of discovered tasks, so a workspace or shard that silently skipped its checks is detected."
serves = "Prevents a filter or shard plan from turning a skipped check into a green result."
where = ["references/pipeline-efficiency.md#make-selection-conservative"]
shapes = "Makes the broader checks the fallback when the comparison range or dependency graph is unknown, and requires the final required result to propagate failed, cancelled or missing prerequisites."

[[sources.ideas]]
idea = "Disposable validation is separate from publishing and deployment. Obsolete validation can be cancelled when its effects are safe to discard; a cancelled deployment can continue remotely or leave partial state, so target serialization and a supersession policy cover it."
serves = "Prevents a speed setting from cancelling a deployment halfway."
where = ["references/pipeline-efficiency.md#preserve-state-and-cache-boundaries"]
shapes = "Splits the cancellation policy by effect: disposable validation can be cancelled, while deployment needs target serialization and a supersession policy."

[[sources.ideas]]
idea = "A cache accelerates work but never establishes eligibility. Cached results are keyed by every input that changes their meaning, a miss performs the work, and a broad fallback cache or stale artifact cannot stand in for a different candidate."
serves = "Keeps coverage and release evidence intact when caching is added."
where = [
  "references/pipeline-efficiency.md#preserve-state-and-cache-boundaries",
  "SKILL.md#preserve-evidence-across-stages",
]
shapes = "Replaces cache recipes with validity conditions and removes caches from the evidence that can permit promotion."
adapted = "Stated as conditions on every cache, including isolated writers and trust domains and integrity checks where cached output crosses a release boundary, instead of a universal cache or cancellation recipe."

[[sources.declined]]
feature = "A bundled timing script, hosted-runner prices, published speedup numbers and a fixed push-to-green duration target."
reason = "Gains are credited only from comparable runs at the changed revision, and the project sets its own targets."

[[sources.declined]]
feature = "A mandatory before-and-after timing ledger and prescribed test-runner flags."
reason = "The skill imposes neither; durable decisions go to the project's existing CI/CD documentation when file changes are authorized, otherwise to the response."

[[sources.declined]]
feature = "Pushing to the working branch without a check-in in order to measure the change."
reason = "Implementation stays within the user's existing authorization."

[[sources.declined]]
feature = "Universal cache and cancellation recipes, such as cancelling in-progress runs only on pull requests or fixed Docker cache tags."
reason = "Cache keys and cancellation follow from each pipeline's inputs, trust domains and side effects."


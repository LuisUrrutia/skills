[[sources.ideas]]
idea = "A plan is grounded in the real code path. The planner reads the request, any existing plan and the project instructions, then inspects the affected implementation, callers, tests and configured commands far enough to see where the change belongs and what already provides part of it. Existing behavior stays distinct from intended behavior, and a conflict between code and docs is a finding to resolve."
serves = "Prevents plans built on assumed structure or on a stale description of the code."
where = ["SKILL.md#ground-the-work"]
shapes = "Makes evidence gathering the first section, before the plan's size or content is chosen."

[[sources.ideas]]
idea = "Each material acceptance criterion maps to an observable scenario with an expected result and the command or interaction that checks it, including failure behavior where the requirement makes it material. \"Tests pass\" or \"run the suite\" does not replace that mapping."
serves = "Lets the executor and the reviewer check that the outcome works, not only that the build passes."
where = [
  "SKILL.md#describe-executable-work",
  "assets/implementation-plan.md#id-verifiable-result",
  "assets/implementation-plan.md#combined-verification",
]
shapes = "Defines the Verification item of the plan contents and the paragraph that rejects suite-level acceptance, and gives each work entry an acceptance line and the template a combined verification section."

[[sources.ideas]]
idea = "Each piece of work has one authoritative plan. The plan names its location, checks that the next executor can reach it, and states the retention limit and how to preserve the plan when the only copy is host-private, ignored, temporary or checkout-local. Work on the same effort reuses that plan instead of starting a competing record."
serves = "Prevents an executor from working from a lost copy or from competing plans."
where = ["SKILL.md#choose-the-plans-size-and-home"]
shapes = "Joins the home and access rules to the sizing section, so a plan's location is decided together with its level of detail."
adapted = "The plan uses the requested output and the project's artifact convention; `docs/plans/<topic>.md` is only the fallback for a durable handoff. A map from the wayfinder skill, or a spec, keeps its own authority, and the plan links its decisions instead of keeping a second decision history."

[[sources.ideas]]
idea = "A handoff plan works without the conversation: it carries the relevant decisions, source pointers, prerequisites and the evidence that would require replanning. A resumed plan first reconciles actual work and changed premises, reopens affected decisions instead of reversing them silently, and keeps real progress distinct from planned checkboxes."
serves = "Lets a fresh executor continue without guessing and stops work that rests on premises that no longer hold."
where = [
  "SKILL.md#check-readiness-and-continue",
  "assets/implementation-plan.md#readiness-and-continuation",
]
shapes = "Gives the readiness section a handoff paragraph and a resumption rule, and gives the template a readiness section that names replanning triggers and access limits."
adapted = "Replanning triggers travel inside the plan; there is no separate implementation-notes file beside it."

[[sources.ideas]]
idea = "Consequential claims about interfaces, dependencies, compatibility and verification are checked against accessible evidence. The readiness review corrects evidenced gaps and repeats only after material changes or new evidence."
serves = "Prevents both unverified claims and endless review loops."
where = ["SKILL.md#ground-the-work", "SKILL.md#check-readiness-and-continue"]
shapes = "Puts claim checks into grounding and makes the readiness review stop once the evidenced gaps are resolved."
adapted = "The review traces requirements to work and evidence without rubric scores or a target score."

[[sources.ideas]]
idea = "Repository questions are answered by investigation, and routine choices are made within delegated judgment. The user is asked only when an unresolved choice materially changes scope, behavior, a contract or a hard-to-reverse action and neither evidence nor existing authority settles it; the question states the consequence and a supported recommendation."
serves = "Saves the user's attention for the choices that change the work."
where = ["SKILL.md#ground-the-work"]
shapes = "Places the questioning rule after investigation in Ground the work, so a question comes only after the evidence runs out."

[[sources.ideas]]
idea = "When planning and implementation are both authorized, the skill finishes the plan and continues in the host's active mode. It keeps the host's required approvals and adds no second approval gate."
serves = "Prevents a plan review from stalling work that is already authorized."
where = ["SKILL.md#planning", "SKILL.md#check-readiness-and-continue"]
shapes = "Closes the opening scope paragraph with this rule and sets the continuation paragraph at the end of the readiness section."

[[sources.declined]]
feature = "An interview mode that grills the user to explore decisions interactively."
reason = "Exploring the direction with the user is the wayfinder skill's work; this skill asks only about consequential unresolved choices in executable work."

[[sources.declined]]
feature = "A fixed question-count threshold, rubric score targets and a required implementation-notes file beside the plan."
reason = "The plan follows the project's existing output and approval conventions, and review stops when the evidenced gaps are resolved."


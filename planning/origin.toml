[[sources]]
id = "matt-to-tickets"
author = "Matt Pocock"
repository = "https://github.com/mattpocock/skills"
remote = "git@github.com:mattpocock/skills.git"
ref = "refs/heads/main"
license = "MIT; original notice retained in THIRD-PARTY-NOTICES.txt"
role = "ideas"
baseline_commit = "4588b32ecab9ecc9fc8cc6b6c5e7d675b6004b0d"
reviewed_through = "49dd158d1076134a641b33efb035946536778336"
baseline_paths = ["skills/engineering/to-tickets/SKILL.md", "LICENSE"]
paths = ["skills/engineering/to-tickets/SKILL.md", "LICENSE"]

[[sources.ideas]]
idea = "Work is divided into narrow, complete behavior changes that can be checked as they land. Implementation stays with its behavioral tests, and setup and documentation stay with the outcome they enable unless they are useful on their own. A dependency records a real prerequisite."
serves = "Each landed change shows working behavior instead of an unverifiable layer."
where = ["SKILL.md#describe-executable-work", "assets/implementation-plan.md#id-verifiable-result"]
shapes = "Sets the paragraph after the plan contents list that prefers narrow complete changes, and gives each work entry a prerequisites line."
adapted = "Detailed delivery units, their size budgets and integration stages belong to the task-breakdown skill. A small change stays together, and one plan can hold all the work."

[[sources.ideas]]
idea = "A change whose consumers cannot all move at once is planned through supported transition states. The plan names the intermediate states, release prerequisites, rollback or forward recovery, and the observation that permits retiring the old behavior."
serves = "Prevents a migration that breaks consumers between steps or has no way back."
where = [
  "SKILL.md#describe-executable-work",
  "assets/implementation-plan.md#transition-and-recovery",
]
shapes = "Defines the Risk and recovery item of the plan contents and the template's transition and recovery section."
adapted = "Planning keeps the transition states and recovery; the detailed expand, migrate and contract procedure lives in the task-breakdown skill."

[[sources.ideas]]
idea = "The plan states how the complete changed behavior is checked as a whole, because separate checks of each piece do not prove the combined result."
serves = "Prevents claiming that the outcome works when only its parts were checked."
where = [
  "SKILL.md#check-readiness-and-continue",
  "assets/implementation-plan.md#combined-verification",
]
shapes = "Adds the combined result to the readiness review's checks and gives the template a combined verification section."
adapted = "Placing the first integration check when intermediate units cannot pass alone is detailed in the task-breakdown skill."

[[sources.declined]]
feature = "One file per ticket for every breakdown."
reason = "A small change stays together, and one plan can hold the whole work."

[[sources.declined]]
feature = "Publishing the approved tickets to the tracker with native blocking links and triage labels."
reason = "Ticket publication belongs to the issue-workflow skill, whose record keeps the related source ideas."

[[sources.declined]]
feature = "Leaving file paths and code snippets out of tickets because they go stale."
reason = "Verified entry points and contract excerpts help the executor. The plan separates verified locations from proposed files, and a resumed plan reconciles changed premises before relying on them."


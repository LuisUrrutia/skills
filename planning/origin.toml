[[sources]]
id = "sentimony-scope-triage"
author = "Ihor Orlovskyi / Sentimony"
repository = "https://github.com/sentimony/skills"
remote = "git@github.com:sentimony/skills.git"
ref = "refs/heads/main"
license = "MIT; original notice retained in THIRD-PARTY-NOTICES.txt"
role = "ideas"
baseline_commit = "53d0630136d6e1d7ee70e3744bc250683b6c57f9"
reviewed_through = "1c70204aa780528dafbe491a4841a9f1abb24480"
baseline_paths = [
  "skills/scope-triage/SKILL.md",
  "skills/scope-triage/references/attribution.md",
  "skills/scope-triage/LICENSE",
]
paths = [
  "plugins/devflow/skills/scope-triage/SKILL.md",
  "plugins/devflow/skills/scope-triage/references/attribution.md",
  "plugins/devflow/skills/scope-triage/LICENSE",
]

[[sources.ideas]]
idea = "The plan's detail follows how settled the outcome, contract and decisions are, together with dependencies and the executor's context. A small, settled change may need only a short ordered plan with its deciding check; file counts, minute estimates and task counts do not set the size."
serves = "Gives uncertain work enough detail to expose integration risk without loading a settled change with ceremony."
where = ["SKILL.md#choose-the-plans-size-and-home"]
shapes = "Opens the sizing section with this rule, which replaces size proxies as the measure of detail."
adapted = "No route skips the plan: a direct planning request still gets a proportionate plan."

[[sources.ideas]]
idea = "Facts that the repository or other accessible sources can answer are found by investigation, not asked. A consequential unknown stays explicit and keeps the affected work blocked, because calling a guess an assumption does not make it executable."
serves = "Prevents asking the user for facts and prevents execution on hidden guesses."
where = ["SKILL.md#ground-the-work"]
shapes = "Makes investigation precede questions in Ground the work and ends the questioning paragraph with the blocked-work rule."

[[sources.declined]]
feature = "Skipping the plan when a request is classified as a direct change."
reason = "A direct planning request still gets a proportionate plan."

[[sources.declined]]
feature = "A confidence percentage, an assumption-ledger route classification, a section-by-section design approval loop and a forced full-design route under any uncertainty."
reason = "Detail scales with what is unsettled, and existing host approval governs; this skill adds no classification ritual or approval loop."

[[sources.declined]]
feature = "The donor's full design workflow before planning: clarifying questions, two or three approaches, a coverage check and a saved, reviewed spec."
reason = "Direction finding belongs to the wayfinder skill; this skill starts from a defined outcome."


format_version = 2
skill = "planning"
created = "2026-10-06"
approach = "derive"
goal = "Turn a defined outcome into a plan that another engineer or agent can execute and verify without this conversation, carrying the reasoning, constraints and dependencies that execution needs without writing the implementation in advance. A plan is ready when its scoped work can proceed without inventing a consequential decision and its completion can be checked."

[[invariants]]
rule = "Planning alone authorizes the requested planning artifacts, not product changes, tracker publication or implementation status transitions."
where = ["SKILL.md#planning"]

[[invariants]]
rule = "A review-only request returns findings and proposed corrections without editing the plan; the plan changes only when writing or revision is authorized."
where = ["SKILL.md#planning", "SKILL.md#check-readiness-and-continue"]

[[invariants]]
rule = "Planning turns a defined outcome into executable work. Connected direction decisions go to the wayfinder skill, PR-sized delivery decomposition to the task-breakdown skill and ticket publication to the issue-workflow skill."
reason = "The plan reuses the decisions of those skills instead of duplicating their procedures."
where = ["SKILL.md#planning", "SKILL.md#ground-the-work", "SKILL.md#describe-executable-work"]

[[invariants]]
rule = "Planned checks are not observed evidence: future tests, proposed code and another agent's confidence are never reported as passing results, and proxies such as file counts do not prove a plan's quality."
where = ["SKILL.md#describe-executable-work", "SKILL.md#choose-the-plans-size-and-home"]

[[invariants]]
rule = "Authorization already given in the task carries across turns. A pending material choice blocks only the work it affects, and independent work continues."
where = ["SKILL.md#ground-the-work"]


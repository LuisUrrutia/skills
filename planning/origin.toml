paths = ["plan-eng-review/sections/review-sections.md", "LICENSE"]

[[sources.ideas]]
idea = "A proposed test earns its place by naming the credible regression it would catch and the gap in existing coverage. When an existing test already exercises the same contract, extending it is preferred over adding a near-duplicate."
serves = "Prevents tests that catch nothing new and duplicate coverage."
where = ["SKILL.md#describe-executable-work"]
shapes = "Closes the Verification item of the plan contents with these two questions for each proposed test."
adapted = "The rule is two questions inside the plan's verification guidance; writing the tests stays with the project's test workflow."

[[sources.declined]]
feature = "Test value cards, coverage ratings and percentages, a separate test-plan artifact and the gstack plan-review sequence."
reason = "Two questions per proposed test in the plan's verification guidance carry the rule; this skill adds no separate test artifact or review ritual."


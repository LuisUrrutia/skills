[[sources]]
id = "superpowers-writing-plans"
author = "Jesse Vincent / Superpowers"
repository = "https://github.com/obra/superpowers"
remote = "git@github.com:obra/superpowers.git"
ref = "refs/heads/main"
license = "MIT; original notice retained in THIRD-PARTY-NOTICES.txt"
role = "ideas"
baseline_commit = "8ca22dba9a94f28898bbce59f2537ff4d87c747d"
reviewed_through = "bb92a77741419a4ab5f06e711a283343f1ada0c3"
baseline_paths = ["skills/writing-plans/SKILL.md", "LICENSE"]
paths = ["skills/writing-plans/SKILL.md", "LICENSE"]

[[sources.ideas]]
idea = "Each work item delivers an independently testable result and carries the decisions the executor cannot infer: settled names, signatures, values and the checks that prove the result. Ordinary implementation details stay with the executor."
serves = "The executor can work without guessing what was decided, and the plan does not become a transcript of the code."
where = ["SKILL.md#describe-executable-work", "assets/implementation-plan.md#id-verifiable-result"]
shapes = "Defines the Implementation work item of the plan contents and the template's work entry, which is titled by its verifiable result."
adapted = "Source paths and other detail appear in proportion to the handoff, not as exact files and line ranges for every task."

[[sources.ideas]]
idea = "When separate implementers must agree, each work item states the interfaces it consumes and produces, and the readiness review checks that those contracts connect across items."
serves = "Prevents mismatched names or types between pieces that are built separately."
where = [
  "SKILL.md#describe-executable-work",
  "SKILL.md#check-readiness-and-continue",
  "assets/implementation-plan.md#id-verifiable-result",
]
shapes = "Adds a consumes and produces line to work entries and interface consistency to the readiness checks."

[[sources.ideas]]
idea = "Fixed constraints and the failure cases that the requirement makes material stay visible in the plan, while the plan stays a set of decisions rather than a transcript of the implementation. Steps that decide nothing are removed."
serves = "Prevents the executor from missing a global constraint or an important failure case, and keeps the plan short."
where = [
  "SKILL.md#describe-executable-work",
  "SKILL.md#check-readiness-and-continue",
  "assets/implementation-plan.md#outcome-and-constraints",
]
shapes = "Puts fixed constraints into the Outcome and scope item and failure behavior into Verification, and makes the readiness review remove speculative scope and steps that decide nothing."

[[sources.declined]]
feature = "A required choice between subagent-driven and native execution, worktree setup, a TDD micro-step template and a plan review before implementation."
reason = "The active host mode and the existing development workflow decide how work runs; this skill chooses no worker topology and adds no repeated approval."

[[sources.declined]]
feature = "A mandatory plan header, a fixed plan directory and five Review Focus cases per plan."
reason = "The plan follows the project's format and artifact conventions with task-relevant detail; `docs/plans/<topic>.md` is only the fallback location."


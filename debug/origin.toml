[[sources.ideas]]
idea = "When a meaningful local test path exists, a focused regression test is observed failing for the reported reason before the production change and passing after it. When such a test would need disproportionate infrastructure or would miss the actual failure, the closest meaningful executable check replaces it and the report explains the gap."
serves = "Proves that the fix addresses the reported failure without forcing a bad or costly test."
where = ["SKILL.md#correct-and-verify-when-authorized"]
shapes = "The section requires seeing the check fail before production edits and adds a separate fallback paragraph for an impractical test."
adapted = "The fallback never waives the user's explicit testing request or a required project check."

[[sources.ideas]]
idea = "Fix the mechanism that produced the failure. A legitimate triggering state is handled where the code broke on it; a state that should never exist is corrected where it was produced, not masked by a guard, retry, catch, clamp or default where it surfaced. Related instances change only when evidence shows that they share the mechanism."
serves = "Prevents symptom patches that leave the cause in place."
where = ["SKILL.md#correct-and-verify-when-authorized"]
shapes = "The fix paragraph splits the triggering state into the legitimate and the impossible case, names the masking patches to avoid, and limits related changes to evidence and the authorized scope."
adapted = "Valid input checks, recovery behavior and boundary guards stay unless evidence shows that one is wrong or redundant, and the donor's rule to fix every instance of a pattern is not taken."

[[sources.ideas]]
idea = "Persisted state, such as configuration, caches and generated artifacts, is part of what actually ran, and it is a suspect when behavior changes after a restart or a cleared cache. Evidence is preserved before an authorized reset, because clearing state can hide the trigger without repairing its mechanism."
serves = "Prevents blaming code for stale state, and prevents a reset that destroys the evidence."
where = [
  "references/investigation.md#compare-the-actual-execution",
  "references/investigation.md#no-reproduction-yet",
]
shapes = "The comparison paragraph lists persisted state among what actually ran, and the paragraph on production actions requires preserving evidence before a reset."

[[sources.ideas]]
idea = "After a costly investigation, the report proposes, without implementing it, a cheap always-on signal that would have exposed the cause at first look."
serves = "Shortens the next investigation of the same kind without widening the current task."
where = ["SKILL.md#finish-with-evidence"]
shapes = "The report paragraph adds this proposal after the cause, checks and remaining gaps."

[[sources.ideas]]
idea = "To explain how a failing path executes, follow its entrypoint, data transformations, state ownership and failing boundary by reading the implementations rather than inferring behavior from names, and name any connection that remains untraced."
serves = "Keeps the explanation of the failure grounded in the code that actually runs."
where = [
  "references/investigation.md#behavior-history-and-affected-consumers",
  "SKILL.md#test-the-explanation",
]
shapes = "This is the 'How it executes' branch of the uncertainty list, and the main skill starts the explanation by tracing the failing path."
adapted = "Taken from the how skill's explorer steps into one branch of a conditional reference, used only for the current uncertainty and without its explorer and explainer agents."

[[sources.ideas]]
idea = "Code proves mechanics, not historical intent. A question about what changed or why code exists uses diffs, blame, tests, ADRs and relevant issue or incident records. Each claim is qualified by its evidence, an unavailable source is kept apart from a searched source with no result, and contradictory evidence is preserved."
serves = "Prevents presenting a guessed motive or history as fact."
where = [
  "references/investigation.md#behavior-history-and-affected-consumers",
  "references/investigation.md#no-reproduction-yet",
]
shapes = "This is the 'What changed or why it exists' branch of the uncertainty list, and the no-reproduction branch separates observed facts, supported inferences and untested hypotheses."
adapted = "Taken from the why skill into one branch of the same reference. Searches cover only the sources relevant to the current uncertainty, not every available connector category."

[[sources.ideas]]
idea = "What a fix can affect reaches beyond direct symbol matches: shared state, serialization, ordering and downstream consumers. The assumptions that keep their contracts are identified, and the important ones are exercised through real code where practical."
serves = "Catches breakage that a symbol search would miss before a fix is called safe."
where = ["references/investigation.md#behavior-history-and-affected-consumers"]
shapes = "This is the 'What a fix can affect' branch of the uncertainty list."
adapted = "Taken from the blast-radius skill into one branch of the same reference. The donor's single safety fact that clears most risks is not taken: one proven assumption does not clear independent risks."

[[sources.declined]]
feature = "Fixing every instance of a pattern found by search."
reason = "Only the related instances that evidence shows share the mechanism change, within the authorized scope."

[[sources.declined]]
feature = "Running the agent orchestration of the how, why or blast-radius skills, or taking over their broader explanation, history-research and change-audit tasks."
reason = "Debug applies their criteria to the current uncertainty only; those tasks stay separate when they are requested in their own right."

[[sources.declined]]
feature = "Discovering every available MCP server and querying each evidence category in parallel."
reason = "Searches stay scoped to the current uncertainty; the availability of a connector is not a reason to search it."

[[sources.declined]]
feature = "Fixed agents, model slugs, Cursor tool names, donor invocation flags such as readonly, and the unslop skill as a writing dependency."
reason = "Debug runs with the host's own tools; donor orchestration is not a local requirement."


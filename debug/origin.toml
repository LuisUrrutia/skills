[[sources.ideas]]
idea = "Invalid state is traced backward to the point where it first became invalid, and it is corrected there when that state should never exist."
serves = "Puts the fix at the origin instead of at the frame where the symptom appeared."
where = [
  "references/investigation.md#compare-the-actual-execution",
  "SKILL.md#correct-and-verify-when-authorized",
]
shapes = "The comparison branch ends by tracing backward inside the localized component, and the fix paragraph corrects an impossible state at its producer."

[[sources.ideas]]
idea = "A cause is accepted only after the failing path is compared with a working one: the explanation must predict the difference between them."
serves = "Prevents accepting a plausible cause that the working case would contradict."
where = [
  "SKILL.md#test-the-explanation",
  "references/investigation.md#compare-the-actual-execution",
]
shapes = "The explanation section asks for a contrasting prediction wherever a working comparison exists, and the comparison branch starts from the working case."

[[sources.ideas]]
idea = "At each component boundary on the failing path, the effective inputs, outputs and configuration are observed instead of assumed."
serves = "Locates the failing layer from evidence."
where = ["references/investigation.md#compare-the-actual-execution"]
shapes = "The multi-component paragraph compares the observed inputs, outputs and effective configuration at each boundary."
adapted = "Observation stays at the boundaries that matter; the skill neither adds validation at every layer nor prints broad environment output."

[[sources.ideas]]
idea = "A check waits for the actual completion event or state with a bounded deadline instead of a sleep that happens to pass, and uses controlled time when elapsed time itself is the contract."
serves = "Removes timing guesses that make tests and probes flaky."
where = ["references/investigation.md#intermittent-failures"]
shapes = "The intermittent-failure branch prefers deterministic schedules and condition waits over sleeps."
adapted = "No polling interval is prescribed."

[[sources.ideas]]
idea = "When a fix or probe contradicts its prediction, the explanation is revised before another patch is added; a disappearing symptom alone does not confirm the proposed cause."
serves = "Prevents stacking speculative patches on an unsupported explanation."
where = [
  "SKILL.md#test-the-explanation",
  "references/investigation.md#when-attempts-stop-adding-evidence",
]
shapes = "The explanation section requires a revision after a failed prediction, and the stalled-attempts branch reviews predictions against outcomes."
adapted = "A count of failed attempts does not establish an architecture defect. The skill distinguishes missing evidence, wrong premises, incomplete fixes and real contract conflicts, and asks only when a conflict needs a product decision outside the task."

[[sources.declined]]
feature = "Questioning the architecture after three or more failed fixes."
reason = "A count alone does not prove an architecture problem."

[[sources.declined]]
feature = "An iron law that allows no fix before root-cause investigation is complete, even in an emergency."
reason = "Useful static investigation and an emergency mitigation that the task already authorizes stay allowed; the mitigation is kept separate from the root-cause correction."

[[sources.declined]]
feature = "Defense-in-depth validation added at every layer after the root cause is found."
reason = "The fix is the smallest coherent change that preserves nearby contracts."

[[sources.declined]]
feature = "Printing environment variables to check their propagation across layers."
reason = "Only the needed diagnostic fields are collected and secrets are filtered before display; whole environments are never dumped."

[[sources.declined]]
feature = "Required use of the superpowers test-driven-development and verification-before-completion skills."
reason = "The sources are inspiration, not runtime dependencies."

[[sources.declined]]
feature = "Claiming that a fix with layered validation makes the bug impossible."
reason = "Finite checks show only that the exercised cases pass; the report states the remaining gaps."

[[sources.declined]]
feature = "Session forensics from the diagnosing-superpowers skill."
reason = "It is a separate reviewed candidate, not part of debug and not an active source feed; session forensics stays a separate task rather than a new trigger for debug."


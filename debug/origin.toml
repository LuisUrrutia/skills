tack/skills/blast-radius/SKILL.md: Step 6 says more than one model instead of several models. Cosmetic."], deferred = [], validation = ["Verified baseline, cursor and candidate ancestry; read the complete scoped diff e43c7ee26e00..e5136d82418d and the changed files at both commits.", "reports/skill-atlas/upstream-refresh-validation.json"] },

[[sources.ideas]]
idea = "Diagnosis rests on a feedback loop: the cheapest observation that reaches the user's reported symptom, not merely an exit code or a nearby failure. The loop is reduced while it still shows the same failure, and the original, unreduced scenario is kept and rerun as the final check."
serves = "Prevents fixing a different failure, or a reduced case that no longer matches what the user saw."
where = [
  "SKILL.md#establish-the-failure",
  "SKILL.md#correct-and-verify-when-authorized",
  "references/investigation.md#no-reproduction-yet",
  "references/investigation.md#intermittent-failures",
]
shapes = "Building and reducing the observation is the first section, before any explanation is tested, and the verification paragraph reruns the original scenario after the regression check. The investigation reference adds separate branches for a missing reproduction and for intermittent failures."
adapted = "Reduction stops once the scenario can distinguish causes. A missing reproduction allows bounded investigation instead of stopping the work, and an intermittent failure gets a bounded repetition budget with its remaining uncertainty reported, because the skill keeps working under limited evidence and states the limits."

[[sources.ideas]]
idea = "Each unresolved cause states a prediction, and each probe is chosen to tell that cause apart from the alternatives. One relevant condition changes at a time, and the result confirms, rejects or narrows the explanation."
serves = "Turns each probe into evidence instead of trial and error."
where = ["SKILL.md#test-the-explanation"]
shapes = "The section opens by pairing each unresolved cause with a prediction and a distinguishing probe, before its rules on instrumentation and revision."
adapted = "No fixed number of hypotheses is required; a simple failure may need only one."

[[sources.ideas]]
idea = "A regression test counts only at a boundary that reproduces the real failure. It drives public behavior with real collaborators or controlled system boundaries, includes the interacting callers or state transitions that cause the bug, and takes its expected values from the contract or an independently worked example. A shallow test that misses the interaction gives false confidence."
serves = "Prevents a passing test from claiming coverage of a failure it never exercised."
where = ["SKILL.md#correct-and-verify-when-authorized"]
shapes = "The regression-test paragraph sets these conditions before any production change, and the next paragraph gives the fallback when no such boundary is practical."
adapted = "The test boundary is chosen without asking the user to approve seams, and the authorized correction may include a refactor that it needs, because a request to fix already authorizes regression tests and repair."

[[sources.ideas]]
idea = "A performance regression is measured before it is changed. The current behavior and an available known-good version or target are measured first, and a profiler, query plan or resource observations distinguish the causes."
serves = "Prevents choosing a fix from a guess about where the time goes."
where = ["references/investigation.md#performance-regressions"]
shapes = "The performance branch requires both measurements before a fix is chosen and keeps intrusive diagnostics apart from scored timings."
adapted = "The verify skill assesses the measurement evidence, and version or configuration bisection runs only with a meaningful signal and an authorized checkout strategy."

[[sources.ideas]]
idea = "Temporary instrumentation and experimental edits are tracked while debugging and removed before the work ends, and the final diff is inspected for accidental changes."
serves = "Keeps diagnostic edits out of the delivered change."
where = ["SKILL.md#test-the-explanation", "SKILL.md#correct-and-verify-when-authorized"]
shapes = "The probe paragraph requires tracking temporary changes, and the verification paragraph ends with their removal and a review of the final diff."

[[sources.declined]]
feature = "Three to five ranked hypotheses before any of them is tested."
reason = "A simple failure need not acquire a fixed number of hypotheses."

[[sources.declined]]
feature = "Minimizing until every remaining element is needed for the failure, as a gate before forming hypotheses."
reason = "Reduction stops once the scenario can distinguish causes; exhaustive minimization is not a prerequisite."

[[sources.declined]]
feature = "A feedback loop that must run in seconds, and raising a flaky failure's reproduction rate by looping the trigger 100 times or adding stress."
reason = "No universal speed target applies. An intermittent failure gets a bounded repetition budget that can reveal the reported failure rate, and the result states the remaining uncertainty."

[[sources.declined]]
feature = "A human-in-the-loop shell script template for steps that a person must perform."
reason = "Any test, command, request or interaction that reaches the symptom can serve as the observation; the skill prescribes no interactive template."

[[sources.declined]]
feature = "Refusing to read code for a theory or to form hypotheses until a reproduction command exists."
reason = "Reading code and forming labeled hypotheses stays useful without a reproduction; the missing evidence limits what the result can claim."

[[sources.declined]]
feature = "Confirming test seams with the user before writing any test, and keeping refactoring out of the fix."
reason = "A request to fix already authorizes regression tests, and a refactor that the authorized correction needs is part of that correction."

[[sources.declined]]
feature = "Stating the confirmed hypothesis in a commit or PR message during cleanup."
reason = "Repository instructions and the active caller own commits and PRs; debug reports the cause in its own result."


format_version = 2
skill = "debug"
created = "2026-10-02"
approach = "derive"
goal = "Explain an observed software failure or performance regression with evidence and, when the task authorizes it, correct its cause. A run ends with a verified repair, a supported diagnosis with its confidence, or a precise statement of the evidence still needed, and no claim goes beyond its evidence."

[[invariants]]
rule = "Debug starts from the user's report; it needs no work-mode or earlier phase."
where = ["SKILL.md#debug"]

[[invariants]]
rule = "Diagnosis alone leaves project source, tests, configuration and remote state unchanged. A request to fix already authorizes normal investigation, regression tests and repair; debug asks only when an unresolved choice materially changes the intended behavior or needs authority the task does not give."
where = ["SKILL.md#debug", "SKILL.md#test-the-explanation"]

[[invariants]]
rule = "No claim goes beyond its evidence. Without an observed reproduction, the result is a supported diagnosis or a labeled hypothesis, not a verified cause or fix."
where = [
  "SKILL.md#establish-the-failure",
  "SKILL.md#finish-with-evidence",
  "references/investigation.md#no-reproduction-yet",
]

[[invariants]]
rule = "When a permanent regression test would need disproportionate infrastructure or would miss the actual failure, the closest meaningful executable check replaces it and the coverage gap is stated. This fallback never waives the user's explicit testing request or a required project check."
where = ["SKILL.md#correct-and-verify-when-authorized"]

[[invariants]]
rule = "Debug removes only its own experimental changes and keeps the user's other work and index. It never stashes or resets their checkout as a diagnostic shortcut."
where = [
  "SKILL.md#test-the-explanation",
  "references/investigation.md#compare-the-actual-execution",
]

[[invariants]]
rule = "Production instrumentation, production load, data changes and destructive state resets need the task's corresponding authorization."
where = [
  "references/investigation.md#no-reproduction-yet",
  "references/investigation.md#intermittent-failures",
]

[[invariants]]
rule = "Repository instructions and the active caller own commits, worktrees, PRs and further delivery. Debug does not start those workflows, install dependencies, or start a general review or PR-monitoring workflow."
where = ["SKILL.md#finish-with-evidence"]

[[invariants]]
rule = "The sources are inspiration, not runtime dependencies. Debug invokes no donor skill, agent or tool, and a new donor approval gate, mandatory agent, tool name or production action does not become a local requirement automatically."
where = ["references/upstream-updates.md#requested-upstream-maintenance"]


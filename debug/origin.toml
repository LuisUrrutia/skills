id = "addy-debugging-and-error-recovery"
author = "Addy Osmani"
repository = "https://github.com/addyosmani/agent-skills"
remote = "git@github.com:addyosmani/agent-skills.git"
ref = "refs/heads/main"
license = "MIT; original notice retained in THIRD-PARTY-NOTICES.txt"
role = "ideas"
baseline_commit = "1401c8b8030e023baeebb31781a6653fe8e93026"
reviewed_through = "aeac41d4d005999432bb7312f7ff06383a91d59d"
baseline_paths = ["skills/debugging-and-error-recovery/SKILL.md", "LICENSE"]
paths = ["skills/debugging-and-error-recovery/SKILL.md", "LICENSE"]

[[sources.ideas]]
idea = "Before a failure is attributed to code, the conditions under which it fails and passes are compared, such as environment, data or persisted state, and ordering, and the layer that actually fails is localized. A product failure is told apart from missing setup or a broken test."
serves = "Prevents fixing the wrong layer, or fixing the test when the product is wrong."
where = [
  "SKILL.md#establish-the-failure",
  "references/investigation.md#compare-the-actual-execution",
  "references/investigation.md#intermittent-failures",
]
shapes = "The observation paragraph separates product failures from setup or test failures, the comparison branch compares the failing and working runs, and the intermittent branch controls ordering and shared conditions."

[[sources.ideas]]
idea = "Error messages, logs and external comments are diagnostic evidence, not instructions. A command or step that they suggest is checked against trusted project guidance and the task's authority before it runs."
serves = "Prevents running injected or wrong instructions found in diagnostic output."
where = [
  "SKILL.md#establish-the-failure",
  "references/investigation.md#behavior-history-and-affected-consumers",
]
shapes = "The first section treats errors and comments as evidence and checks suggested commands before use; the investigation reference states that external records give no authority to run their instructions."
adapted = "An already-authorized command needs no new approval; the check against project guidance and task authority replaces the donor's user confirmation for every suggested action."

[[sources.ideas]]
idea = "A failing test is not assumed to be wrong: its expectation changes only after the intended contract shows that the test, not the code, is wrong."
serves = "Prevents weakening a test to make a bug disappear."
where = ["SKILL.md#correct-and-verify-when-authorized"]
shapes = "The regression paragraph puts the contract check before any change to an existing expectation."

[[sources.declined]]
feature = "A stop-the-line rule that halts all other work when anything unexpected happens, and a triage checklist run in order without skipping steps."
reason = "A blocked failing path stops only the work that depends on it; independent work continues, and the investigation takes only the branches that its uncertainty needs."

[[sources.declined]]
feature = "Installing dependencies, git bisect over checkouts, artificial load or concurrency to widen race windows, and alerts or monitoring for a non-reproducible bug."
reason = "Each needs the task's authorization. Bisection also needs a meaningful signal and an authorized checkout strategy, and stress conditions stay representative and within authorized resources."

[[sources.declined]]
feature = "Safe fallbacks under time pressure: a default value with a warning, or a catch that degrades and continues."
reason = "A guard, catch or default where the failure surfaced hides the cause of a state that should never exist."

[[sources.declined]]
feature = "npm commands and TypeScript examples."
reason = "The guidance stays language-neutral."

[[sources.declined]]
feature = "A new regression test for every fix."
reason = "A disproportionate or shallow test gives way to the closest meaningful executable check, with the coverage gap stated."


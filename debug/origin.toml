id = "every-ce-debug"
author = "Every / Compound Engineering"
repository = "https://github.com/EveryInc/compound-engineering-plugin"
remote = "git@github.com:EveryInc/compound-engineering-plugin.git"
ref = "refs/heads/main"
license = "MIT; original notice retained in THIRD-PARTY-NOTICES.txt"
role = "ideas"
baseline_commit = "9af474a70e7f2a844338519ad9e92aafbd92d4fb"
reviewed_through = "bdc53d034ccfa5baf01b6139cd46082145ff95cc"
baseline_paths = [
  "skills/ce-debug/SKILL.md",
  "skills/ce-debug/references/investigate.md",
  "skills/ce-debug/references/fix.md",
  "skills/ce-debug/references/anti-patterns.md",
  "skills/ce-debug/references/investigation-techniques.md",
  "LICENSE",
]
paths = [
  "skills/ce-debug/SKILL.md",
  "skills/ce-debug/references/investigate.md",
  "skills/ce-debug/references/fix.md",
  "skills/ce-debug/references/anti-patterns.md",
  "skills/ce-debug/references/investigation-techniques.md",
  "LICENSE",
]

[[sources.ideas]]
idea = "Supplied issue threads and earlier attempts establish the current symptom and what was already ruled out, so the investigation does not repeat a dead end. Missing history is requested only when it would change the next step."
serves = "Starts from the latest known state of the failure instead of the first report."
where = ["SKILL.md#establish-the-failure"]
shapes = "The first section reads the supplied thread and prior attempts before it chooses the first observation."

[[sources.ideas]]
idea = "Establish which code, runtime, dependencies, configuration and state actually ran, and compare the failing run with a working one. Across components, follow one operation through its boundaries and compare observed values, not assumed ones, to find where the expected contract first diverges."
serves = "Prevents blaming committed code for a failure caused by local changes, the environment or another component."
where = ["references/investigation.md#compare-the-actual-execution"]
shapes = "The comparison section first fixes what actually ran, then walks one operation across its boundaries to the first divergence."
adapted = "Instrumentation stays targeted at the deciding boundary and correlates events by request or event identity; the skill neither logs every boundary nor dumps whole environments or payloads."

[[sources.ideas]]
idea = "A prediction names a contrasting input, environment or path that should behave differently. Restating or repeating the symptom does not distinguish explanations."
serves = "Prevents mistaking a repeated observation for a test of the explanation."
where = ["SKILL.md#test-the-explanation"]
shapes = "The section requires a contrasting prediction wherever a working comparison exists and states that an unchanged retry adds no causal evidence."

[[sources.ideas]]
idea = "When attempts stop adding evidence, review the attempted explanations, their predictions and their actual outcomes, and separate verified premises from assumptions before another edit."
serves = "Breaks a loop of patches built on a wrong premise."
where = ["references/investigation.md#when-attempts-stop-adding-evidence"]
shapes = "A dedicated branch of the investigation reference handles stalled attempts by rechecking premises and the observation method before any further edit."
adapted = "Repeated failures can reveal missing evidence, a wrong model, a partial correction or a shared design constraint; their count alone does not lead to an architecture conclusion."

[[sources.ideas]]
idea = "The regression check uses or strengthens the existing test that owns the behavior when there is one. An existing expectation changes only when evidence shows that it conflicts with the established contract or that the authorized change supersedes it."
serves = "Keeps the fix inside the real contract instead of rewriting a test to match the code."
where = ["SKILL.md#correct-and-verify-when-authorized"]
shapes = "The regression paragraph names the owning test as the first choice and adds the rule for changing an existing expectation."

[[sources.ideas]]
idea = "Observation can change a failure. When logging or a debugger hides it, that change is evidence about observation effects, so a less disruptive probe or a controlled schedule follows, and the correction is verified after the instrumentation is removed."
serves = "Prevents declaring a fix when the instrumentation only hid the failure."
where = ["references/investigation.md#intermittent-failures"]
shapes = "The intermittent-failure branch treats a failure that vanishes under observation as evidence and requires verification without the instrumentation."

[[sources.ideas]]
idea = "Secrets are protected when a command is built, not after its output appears: credentials stay out of arguments, only the needed diagnostic fields are collected, and output is filtered before it is displayed or saved."
serves = "Prevents exposing credentials in diagnostic output that cannot be taken back."
where = ["SKILL.md#establish-the-failure"]
shapes = "The observation paragraph sets these limits on what a diagnostic command may collect and show."

[[sources.declined]]
feature = "A fix-choice question to the user before any repair, including a trivial fix."
reason = "A request to fix already authorizes repair; diagnosis-only work stops at the explanation."

[[sources.declined]]
feature = "Escalating after a fixed number of exhausted hypotheses or failed fixes, and concluding an architecture problem from that count or from hypotheses that point to different subsystems."
reason = "A count alone does not prove an architecture problem; the skill separates missing evidence, a wrong model, a partial correction and a real contract conflict."

[[sources.declined]]
feature = "Stashing the user's uncommitted work to test whether it caused the failure."
reason = "The user's work and index stay intact; an authorized isolated comparison replaces the stash."

[[sources.declined]]
feature = "Delivery after a fix: creating a feature branch, committing, pushing, opening or updating a PR, linking the found ticket, and offering learning capture."
reason = "Repository instructions and the active caller own delivery."

[[sources.declined]]
feature = "A reproduction that fails on the exact symptom as a precondition for forming hypotheses."
reason = "Bounded evidence still narrows the question; the result states what the missing reproduction leaves unverified."

[[sources.declined]]
feature = "Logging what enters and exits every component boundary, with the relevant environment, in one run."
reason = "Targeted instrumentation at the deciding boundary and correlation by request identity give the evidence without broad output."

[[sources.declined]]
feature = "Pipeline and return-to-caller modes with fixed status values, and post-fix simplify and review steps."
reason = "Delivery and review keep their existing local owners."


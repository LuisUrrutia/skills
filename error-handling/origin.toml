  "pstack/.cursor-plugin/plugin.json",
  "pstack/LICENSE",
]
paths = [
  "pstack/skills/principle-boundary-discipline/SKILL.md",
  "pstack/skills/principle-make-operations-idempotent/SKILL.md",
  "pstack/skills/principle-test-behavior-not-implementation/SKILL.md",
  "pstack/.cursor-plugin/plugin.json",
  "pstack/LICENSE",
]

[[sources.ideas]]
idea = "Place validation and translation at the boundary that owns them, and keep domain behavior independent of transport details where the existing structure permits."
serves = "Keeps domain rules free of transport representations and keeps checks where their input enters."
where = ["SKILL.md#propagate-to-an-owner-that-can-act"]
shapes = "Opens the propagation section by assigning validation and translation to their boundaries."
adapted = "Internal code relies on an established invariant only while its evidence still holds, because persisted data, concurrent changes and lifecycle transitions can invalidate an earlier check."

[[sources.ideas]]
idea = "Before replaying a state change, determine whether the operation was rejected, completed, partly completed or remains unknown. Query or reconcile the existing state when that can establish the outcome; otherwise preserve the uncertainty for the caller. Trace every effect of a retried transaction or workflow, including those outside its atomic boundary."
serves = "Prevents duplicate effects and false success after a lost response or an interrupted run."
where = ["references/recovery.md#establish-whether-repeating-work-is-safe"]
shapes = "Puts the replay-safety check before every retry, fallback or restart decision in the recovery reference."
adapted = "An idempotency key protects replay only when the receiving system enforces it; its operation scope, payload binding, retention, atomic recording with the effect and behavior under concurrent attempts are checked. A new key per attempt, an in-memory flag or a read-before-write check does not prove durable deduplication, and no operation is assumed safe to replay."

[[sources.ideas]]
idea = "A later attempt must be able to tell whether a lock, lease, claim, temporary file or partial record left by an interrupted attempt is stale, from evidence that holds at every point where that attempt could have stopped."
serves = "Keeps an interruption from turning into manual cleanup or a wrong recovery."
where = ["references/recovery.md#preserve-state-through-recovery"]
shapes = "Adds a staleness requirement for leftovers to the state-preservation rules."
adapted = "Stated as a property that recovery must have; the upstream temp-file-and-rename recipe and other lifecycle-specific cleanup recipes stay out."

[[sources.ideas]]
idea = "Exercise the real error boundary through caller-visible results and effects against independent expectations: cover the failure, the permitted recovery path and the effects that must not repeat, and assert the classification, code or type that callers branch on, with message text only where a user or caller consumes it."
serves = "Gives tests that fail when the failure contract breaks, not when internals change."
where = [
  "SKILL.md#make-failures-understandable-and-testable",
  "references/recovery.md#verify-the-recovery-decision",
]
shapes = "Makes the testing paragraph and the recovery verification drive the real boundary with controllable dependencies and time instead of replacing the behavior under test with a mock."
adapted = "Absence of a side effect, a status or an interaction is a meaningful assertion when it is tied to the observed failure contract."

[[sources.declined]]
feature = "Trusting internal code unconditionally once a boundary has validated it."
reason = "An invariant holds only while its evidence holds across persistence, concurrency and lifecycle changes."

[[sources.declined]]
feature = "Lifecycle cleanup recipes such as convergent startup, PID-based stale-lock detection and temp-file-and-rename."
reason = "Recovery follows the operation's contract, and the skill states what a later attempt must be able to tell instead of prescribing a recipe."

[[sources.declined]]
feature = "A universal rule to rewrite or delete tests whose only assertions are about absence, interactions or status."
reason = "Such assertions stay when they establish a failure contract, such as an effect that must not repeat."


format_version = 2
skill = "error-handling"
created = "2026-10-03"
approach = "derive"
goal = "Help developers design, implement or review how software reports and recovers from failures across its boundaries, in the language and with the error representations the project already uses. Success is a failure contract that callers can observe and act on, recovery only where the operation's semantics support it, and evidence that effects were neither duplicated nor concealed."

[[invariants]]
rule = "The skill stays language-independent: it applies the language, runtime and framework already in use and preserves caller-visible behavior such as public codes, response shapes, exit status, queue acknowledgement and exception identity unless the requested change revises that contract."
reason = "The skill was derived to keep the donors' contract, boundary and testing criteria while replacing their language-specific recipes and unsafe general defaults."
where = ["SKILL.md#error-handling", "SKILL.md#establish-the-contract"]

[[invariants]]
rule = "The skill keeps the caller's requested boundary: a review or design request produces findings or a proposal, implementation needs the active task's authority, and an undecided fallback, data-loss or retry policy is resolved before the affected behavior is implemented while independent work continues. The skill starts no publication or PR monitoring."
where = ["SKILL.md#error-handling", "SKILL.md#establish-the-contract", "SKILL.md#return-the-result"]

[[sources]]
id = "ecc-error-handling"
author = "Affaan Mustafa and ECC contributors"
repository = "https://github.com/affaan-m/ECC"
remote = "git@github.com:affaan-m/ECC.git"
ref = "refs/heads/main"
license = "MIT; original notice retained in THIRD-PARTY-NOTICES.txt"
role = "ideas"
baseline_commit = "ef648e01899ba3e8dc6371642deaaf64b4477775"
reviewed_through = "b92f181b3b748d1abbc2afd94af6aa7d8c8fca29"
baseline_paths = ["skills/error-handling/SKILL.md", "LICENSE"]
paths = ["skills/error-handling/SKILL.md", "LICENSE"]

[[sources.ideas]]
idea = "Errors are a caller-visible contract. For each material failure, establish what the caller can observe, which effects may already have happened and who can decide the next action, and classify failures that need different handling: expected domain outcomes, invalid input or denied access, dependency failures, broken internal invariants, and cancellation or deadline expiry."
serves = "Gives every failure a defined meaning that callers can branch on."
where = ["SKILL.md#establish-the-contract"]
shapes = "Makes the contract and its classification the first section, ahead of every propagation or recovery decision."
adapted = "Classification follows the actual operation and runtime semantics instead of message matching or a blanket rule for a whole status range, and a known failure is kept separate from an unknown outcome after a lost response."

[[sources.ideas]]
idea = "Handle a failure where code can recover, add useful context, translate its representation or perform required cleanup; otherwise let it propagate, and keep the cause and useful classification when wrapping."
serves = "Delivers each failure to an owner that can act on it without losing its cause."
where = ["SKILL.md#propagate-to-an-owner-that-can-act"]
shapes = "Limits catching to the four reasons listed and makes propagation the default otherwise."
adapted = "A catch that only logs does not establish recovery, and an empty value, default result or successful exit must not conceal an unfulfilled operation."

[[sources.ideas]]
idea = "Keep the message a user or caller sees separate from diagnostic context: the user gets an accurate outcome and a next action that is actually available, without technical causes, while appropriate internal evidence stays available for investigation."
serves = "Prevents leaking internals to users and prevents losing the evidence needed to investigate."
where = [
  "SKILL.md#propagate-to-an-owner-that-can-act",
  "SKILL.md#make-failures-understandable-and-testable",
]
shapes = "Splits each failure into a public response and a diagnostic record, and gives the reporting paragraph one owner per failure."
adapted = "Secrets, payloads and personal data are filtered before they are recorded, including raw exception text and cause chains, and a generic public message does not justify logging unrestricted internal data. One reporting owner keeps a failure traceable without duplicate alerts at every layer."

[[sources.ideas]]
idea = "Inspect asynchronous boundaries: every piece of asynchronous work has an owner that observes its completion and failures, including work outside a request or UI render boundary."
serves = "Prevents failures that disappear because no caller awaits the work."
where = ["SKILL.md#propagate-to-an-owner-that-can-act"]
shapes = "Closes the propagation section with an ownership rule for asynchronous work."

[[sources.ideas]]
idea = "Retry only failures classified as transient for this operation, with one layer owning the retries, bounded attempts and elapsed time, and backoff with a delay cap and jitter."
serves = "Prevents retry storms, nested retry loops and repeated failures that cannot succeed."
where = [
  "SKILL.md#choose-recovery-from-the-operations-semantics",
  "references/recovery.md#bound-retries-and-respect-control-flow",
]
shapes = "Moves retry decisions into the recovery reference, where they follow the replay-safety check."
adapted = "Replay must be safe for the operation, server retry guidance and a server's minimum wait are respected, rate limits, conflicts, authentication, malformed input and programming failures are distinguished by their contracts, cancellation and deadlines are checked before and during waits, and the budget follows the caller's deadline."

[[sources.declined]]
feature = "A fixed AppError hierarchy, a Result type, a standard JSON error envelope and language-specific code examples."
reason = "The skill reuses the project's language and existing error representation and adds no universal type or dependency to follow the skill."

[[sources.declined]]
feature = "Counting a catch block that only logs as handling, and logging full error context server-side."
reason = "Logging alone is not recovery, and causal evidence is kept while sensitive data is filtered before it is recorded."

[[sources.declined]]
feature = "A retry helper that retries every error by default, and a blanket rule that excludes all 4xx responses from retries."
reason = "Retries depend on operation-specific replay safety, transient classification, cancellation and budgets."

[[sources.declined]]
feature = "Circuit breakers as a standard pattern for unreliable dependencies."
reason = "A circuit breaker is conditional design work for a demonstrated need to contain dependency failure, not a mandatory new dependency; the donor names circuit breakers, but its examples do not demonstrate one."


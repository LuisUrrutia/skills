[[sources.ideas]]
idea = "The learner is whoever will use the lesson, which can differ from the caller. Use only the current learner's context, and when a workflow such as a learning plan calls the skill, return the requested lesson, observed difficulty and any suggested adjustment to it and leave continuation to that workflow."
serves = "Prevents teaching the wrong person, applying another person's records, or taking over a caller's workflow."
where = ["SKILL.md#establish-the-lesson", "SKILL.md#deliver-and-continue"]
shapes = "Separates the current learner from shared installation and from plan callers, and makes delivery return results to a plan that owns continuation."

[[sources.ideas]]
idea = "A delivered lesson states its material limits. Claims whose evidence was unavailable stay marked as unknown, and a standalone lesson is complete when it covers the requested objective, examples and those limits."
serves = "Lets the learner use the lesson accurately without separate notes."
where = ["SKILL.md#ground-the-subject", "SKILL.md#deliver-and-continue"]
shapes = "Makes grounding name unknowns and material limits, and defines a standalone lesson's completion by its objective, examples and limits."

[[sources.ideas]]
idea = "Practice tests applying the mechanism or recognizing its limits, not recalling the explanation's wording, and its answers address the gap a plausible wrong answer exposes. Tasks in a standalone lesson come with answer guidance kept apart from the prompts."
serves = "Exposes real misconceptions and keeps saved lessons usable on their own."
where = [
  "references/practice.md#choose-the-task",
  "references/practice.md#give-diagnostic-feedback",
  "references/lesson-artifacts.md",
]
shapes = "Makes the practice reference test application first and keep answer guidance apart from prompts in standalone tasks, and makes the artifact reference require answer guidance for requested exercises."
adapted = "The donor's check-in is static text that never waits for a reply. Locally a live learner attempts the task before the solution appears and gets feedback, and interactive artifacts are made when requested."

[[sources.declined]]
feature = "Static-only check-ins that never pose a question in the conversation."
reason = "Live feedback and interactive artifacts are supported when requested."

[[sources.declined]]
feature = "The CE configuration file, its artifact root, model tiers and its publishing service."
reason = "Lessons use the requested destination and the host's tools, and teaching does not publish material."


format_version = 2
skill = "teach"
created = "2026-10-04"
approach = "base"
goal = "Teach the intended learner any subject, from one direct lesson in the conversation to study across sessions, through short source-grounded lessons with tight feedback. Continued study keeps the learner's mission, the evidence of what they learned and, for a broad mission, an ordered roadmap in a teaching workspace, so each session teaches the next thing the evidence supports. Success is the learner doing what the lesson or mission targets, shown by application rather than exposure, with no mastery claimed without evidence."

[[invariants]]
rule = "An explicit request from the learner about format, files, questions, practice or answers wins over the skill's defaults, including \"keep it in chat\", \"don't save files\", \"no quiz\", \"no questions now\" and \"just tell me\". The practice opt-out lives in SKILL.md, not only in a reference."
reason = "Local behavior carried from the earlier teach and learning-plan skills. A 2026 review found plans that required practice despite an explicit opt-out and moved the opt-out into the entrypoint (reports/skill-atlas/teaching-validation.json, reviewFindings)."
where = ["SKILL.md#choose-the-shape", "SKILL.md#skills"]

[[invariants]]
rule = "The skill never withholds an answer to enforce a teaching technique. It holds back a solution only while the learner is attempting it and has not asked for it."
where = ["SKILL.md#skills", "references/practice.md#choose-the-task"]

[[invariants]]
rule = "Each workspace belongs to one learner. The learner can differ from the person or workflow that asked; another person's records, goals or level never apply, and a record whose owner is unclear stays unused until that is resolved."
reason = "A shared installation or machine does not share learner knowledge or preferences."
where = ["SKILL.md#teach", "SKILL.md#zone-of-proximal-development", "MISSION-FORMAT.md#rules"]

[[invariants]]
rule = "Reported, supported, independent and retained evidence stay distinct. Coverage is not learning, a declined practice leaves understanding unmeasured, and no mastery claim, percentage or score appears without evidence."
where = [
  "LEARNING-RECORD-FORMAT.md#evidence",
  "ROADMAP-FORMAT.md#status-values",
  "references/practice.md#record-the-evidence",
]

[[invariants]]
rule = "Unknown facts stay unknown: no invented links, company numbers, historical rationale or delivery guarantees. Illustrative numbers are labeled fictional, a marketing claim is not a result, and a claim that needed a source none could be reached for is labeled unverified model knowledge."
where = ["SKILL.md#knowledge", "RESOURCES-FORMAT.md#rules", "references/business.md"]

[[invariants]]
rule = "Teaching authorizes writes inside the workspace only. It does not publish material, enroll the learner in a community or course, create calendar events or reminders, or change project instructions, and it commits a workspace only when the learner asks."
where = ["SKILL.md#boundaries", "SKILL.md#acquiring-wisdom"]

[[invariants]]
rule = "A workspace keeps only what resuming needs: the mission, preferences, resources and evidence of learning. It never saves a transcript or personal details the teaching does not need."
reason = "Carried from the retired learning-plan skill, which saved no transcript or sensitive detail merely because it was available; a workspace now exists for all continued study."
where = ["SKILL.md#teaching-workspace", "LEARNING-RECORD-FORMAT.md#what-does-_not_-qualify"]

[[invariants]]
rule = "The skill never chooses a code project or a worktree for a workspace; its default is `~/learning/<topic>/`, stated when created. A location the learner, or a calling workflow, explicitly names wins, including one inside a worktree or a tracked project: the skill states once that worktree cleanup can delete it or that the files enter project history, then uses it without asking again. \"Never\" constrains the agent's choice, not the learner's."
reason = "User decision of 2026-10-18 (analysis option 2(b), clarified by the coordinator the same day): the current directory is used only when it already holds a workspace or the learner names it."
where = ["SKILL.md#teaching-workspace"]

[[invariants]]
rule = "A request for a complete course delivers the full content of every requested lesson, not an outline with an offer to fill it in later. A plan-only request ends with the mission, the roadmap and a starting point."
reason = "Carried from the retired learning-plan skill, whose trials covered both requests."
where = ["SKILL.md#roadmap"]

[[invariants]]
rule = "The pace comes from the learner's stated time. With no stated time the roadmap uses stages without dates, never an invented weekly commitment; a deadline that does not fit gets deferred objectives or a stated tradeoff, never a promise of mastery."
reason = "Carried from the retired learning-plan skill."
where = ["SKILL.md#roadmap", "ROADMAP-FORMAT.md#rules"]

[[invariants]]
rule = "A plain request to trace code, an agent orienting itself, and a question about past decisions with no wish to learn stay with explain-code and explain-decisions and do not become lessons."
where = ["SKILL.md#boundaries"]

[[invariants]]
rule = "No donor skill is a runtime dependency. The local skills the lesson draws on are optional, and when they are unavailable the skill uses accessible evidence directly and names any material limit."
where = ["SKILL.md#knowledge"]


[[sources.ideas]]
idea = "Choose the explanation medium by what the learner must see or manipulate: prose for an idea, a diagram for relationships, and an interactive view for changing an input and observing its effect. An interactive control must drive the mechanism; a decorative slider or animation adds nothing."
serves = "Matches the medium to the shape of the idea instead of to habit."
where = ["SKILL.md#build-understanding", "references/lesson-artifacts.md"]
shapes = "Maps content shapes to forms in the representation paragraph, and requires interactive views in the artifact reference to expose the controlling input and its consequences."

[[sources.ideas]]
idea = "Before delivery, inspect the rendered visual and use each interactive control, because a diagram that does not render or a control that misbehaves fails the learner."
serves = "Prevents delivering a broken or inconsistent artifact."
where = ["references/lesson-artifacts.md"]
shapes = "Adds an inspection of the rendered artifact and its controls as the final step before delivery."
adapted = "The donor prescribes specific renderers and a headless-browser screenshot. Locally the relevant available tools do the check, the report separates syntax checks, execution, visual inspection and unverified behavior, and a render proves only that the artifact displays."

[[sources.ideas]]
idea = "When an explanation fails, change the example, framing or medium instead of repeating the same words. An analogy may introduce an idea, but its limits are stated."
serves = "Gives a stuck learner a new path to the idea."
where = ["SKILL.md#build-understanding"]
shapes = "Replaces repetition with a diagnosis of the missing prerequisite or misconception, followed by a new example, framing or medium."
adapted = "The local rule first identifies the missing prerequisite or misconception and returns from the analogy to the real mechanism."

[[sources.declined]]
feature = "Asking the learner before choosing a representation beyond a diagram."
reason = "A useful representation needs no separate permission; the requested format or the smallest useful one decides."

[[sources.declined]]
feature = "A fixed media stack: self-contained HTML pages, Manim explainer videos, narration services and a headless-browser screenshot step."
reason = "The host's available tools are used, and local specialists such as the write-documentation skill own presentation mechanics."


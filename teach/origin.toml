[[sources.ideas]]
idea = "A study roadmap is a route from a baseline to an outcome. First establish what the learner can already do and what they must be able to do, then order objectives from the fundamentals they lack to applied practice, and end each stage with a milestone: a real application whose feedback criteria are stated in advance."
serves = "A broad mission gets an order and observable places to stop, which closes the base's missing exit criteria."
where = ["SKILL.md#roadmap", "SKILL.md#the-mission", "ROADMAP-FORMAT.md#template"]
shapes = "Puts the roadmap after the mission and the baseline check and before the first lesson, and gives ROADMAP-FORMAT.md its stages, Needs, Checkpoint and Milestone fields."
adapted = "The learner's stated time sets the pace; without it the stages carry no dates."

[[sources.ideas]]
idea = "After a milestone, compare the completed work with the target outcome, find the recurring blockers and weak concepts, decide what to reinforce and what to defer, and set the next checkpoint."
serves = "The route changes on evidence rather than momentum."
where = ["SKILL.md#zone-of-proximal-development", "ROADMAP-FORMAT.md#template"]
shapes = "Adds the step after a milestone to the selection procedure, which then proposes real application instead of new material, and gives the roadmap its Deferred list."

[[sources.declined]]
feature = "Collecting the learner's answers through a mandatory question tool."
reason = "The skill asks in one ordinary message, and only when the mission or the language is unclear."

[[sources.declined]]
feature = "Time-boxed checkpoints in every plan, with a week-by-week schedule as one of its output forms."
reason = "The pace comes from the learner's stated time; dates appear only when the learner gave a deadline or schedule, and no weekly commitment is invented."

[[sources.declined]]
feature = "Practice and reflection required in every phase."
reason = "An explicit opt-out from practice wins."


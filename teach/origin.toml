format_version = 2
skill = "teach"
created = "2026-10-04"
approach = "derive"
goal = "Teach the intended learner a concept, skill, system or business through a lesson adapted to their purpose and prior knowledge, with concrete examples and optional practice, in the conversation or as a requested artifact. Success is that the learner can explain, predict or do what the lesson targeted, with the lesson's evidence limits stated and no mastery claimed without evidence."

[[invariants]]
rule = "Donor skills are not runtime dependencies. Local skills support teaching when they are available, and the skill uses accessible evidence directly when they are not."
reason = "The skill is a standalone derivation of selected teaching and learning-design mechanisms."
where = ["SKILL.md#ground-the-subject", "SKILL.md#source-maintenance"]

[[invariants]]
rule = "Teaching does not create profiles, change project instructions, enroll the learner or publish material. Files are created only when the request calls for a saved artifact or a continuing learning record, at the requested destination."
where = ["SKILL.md#deliver-and-continue"]

[[invariants]]
rule = "A lesson never claims mastery, long-term retention or a measured learning gain without evidence."
where = ["SKILL.md#deliver-and-continue", "references/practice.md#carry-evidence-forward"]


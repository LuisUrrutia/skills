[[sources.ideas]]
idea = "Tie each lesson to the learner's real goal and bound it to the few things the learner should be able to explain, predict or do afterward."
serves = "Keeps lessons concrete and small enough to complete."
where = ["SKILL.md#establish-the-lesson"]
shapes = "Adds a step that chooses the lesson's few targets after the learner's purpose is established."
adapted = "The donor keeps the goal in a mission file and interviews the learner when it is unclear. Here the purpose comes from the request and conversation, a lesson can finish in one session, and the learning-plan skill owns a multi-session roadmap."

[[sources.ideas]]
idea = "Knowledge becomes a usable skill through practice with feedback: the learner applies the idea and receives diagnostic feedback on the attempt."
serves = "Turns an explanation the learner followed into something they can do."
where = ["SKILL.md#practice-and-feedback", "references/practice.md#give-diagnostic-feedback"]
shapes = "Adds a practice step after the explanation that loads the practice reference, whose feedback compares the attempt with an evidence-backed solution and names the specific gap."
adapted = "Practice is optional here. It runs when the learner asks for it or it is part of the agreed lesson, an explanation alone needs no test, and the skill never withholds an answer to enforce a technique."

[[sources.ideas]]
idea = "Presented material is not evidence of understanding. Distinguish material presented, self-reported familiarity, success with hints and independent application, and choose the next step from what the learner actually does. In-the-moment success does not establish long-term retention; recall later in a changed context can check it."
serves = "Prevents an illusion of mastery from steering the next lesson."
where = ["SKILL.md#practice-and-feedback", "references/practice.md#carry-evidence-forward"]
shapes = "Makes the next step depend on the kind of evidence observed, and makes the practice reference pass that evidence forward for ongoing study."
adapted = "Ongoing study hands the observed attempt, support used and remaining gap to the learning-plan skill or an authorized learning record, which keeps demonstrated and self-reported knowledge distinct. The record does not compute a zone of proximal development."

[[sources.ideas]]
idea = "Multiple-choice questions give no answer clues through wording, formatting or position, and the position of the correct option varies across questions."
serves = "Makes a correct answer reflect understanding rather than pattern spotting."
where = ["references/practice.md#give-diagnostic-feedback"]
shapes = "Adds a multiple-choice rule to the feedback section that removes clues from wording, formatting and position."
adapted = "The donor also makes every option the same length. Locally clarity takes priority over identical word counts."

[[sources.declined]]
feature = "Treating the current directory as a teaching workspace with a mission file, resources list, notes, learning records, glossary, and HTML lessons and assets."
reason = "One-session teaching is supported, and files are created only when a saved artifact or continuing learning record is requested."

[[sources.declined]]
feature = "Making every quiz answer exactly the same number of words and characters."
reason = "Clarity comes first; wording, formatting and position avoid clues instead."

[[sources.declined]]
feature = "Delegating questions that need real-world wisdom to a community the learner should join."
reason = "Teaching does not enroll the learner in anything."

[[sources.declined]]
feature = "Using learning records to calculate the learner's zone of proximal development."
reason = "A record holds observed evidence; it does not compute a psychological measure."


paths = ["skills/eli5/SKILL.md", "skills/eli5/references/formats.md", "LICENSE.md"]

[[sources.ideas]]
idea = "Choose a lesson's form on a ladder: prose by default, a diagram for parts, sequences, states or a data path, and an interactive element only when the learner learns by changing one input and seeing the effect. Each step up costs more to build and to check, so take the lowest one that carries the idea."
serves = "The form fits the shape of the idea, and lessons avoid decorative interactivity."
where = ["references/lesson-artifacts.md#choose-the-form"]
shapes = "Opens the artifact reference with the ladder, before any construction detail."

[[sources.ideas]]
idea = "An interactive element is built around the one variable that drives the mechanism, and every lesson is rendered and each control used once before the learner gets it, because a diagram that does not render or a control that misbehaves is worse than prose."
serves = "Lessons work when the learner opens them."
where = ["references/lesson-artifacts.md#choose-the-form", "references/lesson-artifacts.md#check-before-delivery", "SKILL.md#lessons"]
shapes = "Ends the artifact reference with a check before delivery, and makes the Lessons section read that reference before opening a lesson for the learner."
adapted = "The donor names specific renderers and a screenshot step. Here the available browser tool does the check, and the report names which checks ran."

[[sources.ideas]]
idea = "An analogy is used only when it clarifies the mechanism, with its limit stated. When an explanation fails, change the example or framing instead of repeating it at greater length."
serves = "Gives a stuck learner a new way into the idea without leaving them with a misleading picture."
where = ["SKILL.md#direct-lessons"]

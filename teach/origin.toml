[[sources.deviations]]
change = "Removed `disable-model-invocation: true` and `argument-hint` from the frontmatter, and left out `agents/openai.yaml`, whose policy sets `allow_implicit_invocation: false`."
reason = "User decision of 2026-10-18: teach stays model-invocable, as the local teach and learning-plan skills were. The agent-instructions host guidance also preserves an existing invocation policy."
where = ["SKILL.md"]

[[sources.deviations]]
change = "Replaced the description \"Teach the user a new skill or concept, within this workspace\" with a description of learning intent that names lessons, practice, study plans and courses, and the next session of a workspace."
reason = "A model-invocable skill is selected by its description, and teach now also receives the study-plan and course requests that went to the retired learning-plan skill."
where = ["SKILL.md"]

[[sources.deviations]]
change = "Replaced the opening \"This is a stateful request - they intend to learn the topic over multiple sessions\" with a choice of shape. A concrete topic with no sign of continued study, including a passing question outside the current workspace's mission, gets a direct lesson in the conversation and one offer of a workspace. A workspace starts only when the learner signals continued study, asks to save the lesson, or asks for something the mission of their current workspace covers. A calling workflow or non-interactive run gets the content in its reply and a workspace only at a location it names. An explicit request about format, files, questions, practice or answers wins over all of these."
reason = "User decision of 2026-10-18. The base's own documentation says it is \"not the tool for one explanation in passing\", and a model-invocable teach now receives exactly those requests."
where = ["SKILL.md#teach", "SKILL.md#choose-the-shape", "SKILL.md#direct-lessons"]

[[sources.deviations]]
change = "Replaced \"Treat the current directory as a teaching workspace\", resolved from \"the directory `/teach` was run in\", with a location rule: continue in the current directory when its MISSION.md is this learner's, otherwise create `~/learning/<topic>/` and state the path, use another directory only when the learner or a caller names it, and never choose a code project or a worktree; a learner-named location inside one is used after the skill states once that worktree cleanup can delete it or that the files enter project history."
reason = "User decision of 2026-10-18 on the location and its root. Sessions usually start in a code repository or a disposable worktree, whose cleanup would delete the lessons; the base's documentation also says to keep the workspace out of the project you are working in. `/teach` is Claude Code slash syntax, and the skill also runs in Codex."
where = ["SKILL.md#teaching-workspace"]

[[sources.deviations]]
change = "Added a language rule: workspace files are written in the learner's language even where other rules put written artifacts in English. On workspace creation the skill reads the system language (`defaults read -g AppleLanguages`, `locale` or `(Get-UICulture).Name`), asks when the system lists several languages or the learner writes in another one and writes no workspace file until the answer arrives, records the answer as the first line of NOTES.md, repeats the check when NOTES.md records no language, and assumes the request's language only when nobody can answer."
reason = "User decision of 2026-10-18: teach follows the user's language and keeps the detection procedure. The user's global rule currently sends every artifact that leaves the conversation to English; until the user changes it for personal material, teach states the language of its own workspace files. One of the user's Macs lists only es-ES and another lists English and Spanish."
where = ["SKILL.md#teaching-workspace", "SKILL.md#notesmd"]

[[sources.deviations]]
change = "Replaced \"the user\" with \"the learner\" throughout, and made each workspace belong to one learner: MISSION.md gains a `Learner` line and the rule \"One mission and one learner per workspace\"."
reason = "The invariant that the learner can differ from the requester or caller and that another person's records never apply."
where = ["SKILL.md#teach", "MISSION-FORMAT.md#template", "MISSION-FORMAT.md#rules", "GLOSSARY-FORMAT.md"]

[[sources.deviations]]
change = "Added ROADMAP.md, its format file and a Roadmap section: ordered observable objectives with prerequisites, checkpoints, statuses backed by evidence, stages that end in a milestone, a pace taken from the learner's stated time, and a Deferred list. MISSION.md's Constraints now name time available and deadline, and its size rule sends the plan to ROADMAP.md."
reason = "The user retired the learning-plan skill into teach, so study plans and courses need a home. The base's documentation reports that the skill does not know when to stop or switch to review, and its own mission rule says a mission that grows into a plan has stopped being a compass."
where = ["SKILL.md#roadmap", "ROADMAP-FORMAT.md", "MISSION-FORMAT.md#template", "MISSION-FORMAT.md#rules"]

[[sources.deviations]]
change = "Restructured Zone Of Proximal Development into a two-step procedure over the roadmap and the learning records: choose the lesson's target (finish an objective in progress, otherwise the earliest open objective whose needs are satisfied), then add a changed-context retrieval task for every objective that is due, turning the lesson into a review when several are. After a milestone the skill reviews and proposes real application; when every success item is met it stops producing lessons; a skipped objective is deferred unless the learner states they know it; a learner who declined practice still advances, with presented objectives satisfying prerequisites. Removed \"used to calculate the zone of proximal development\" from the learning-record description."
reason = "The base's documentation reports that nothing schedules a review and that the skill lacks exit criteria. A learning record holds observed evidence; it does not compute a psychological measure."
where = ["SKILL.md#zone-of-proximal-development", "LEARNING-RECORD-FORMAT.md"]

[[sources.deviations]]
change = "Replaced \"If the user is unclear about the mission, or the MISSION.md is not populated, your first job should be to question the user\" with asking, in one message, only what the learner's words leave unclear, including a baseline check of what they already know and can do for the first objectives and any language question, then writing MISSION.md from what they said and answered. Stated knowledge is recorded with its depth and used without retesting, and a learner who declines questions gets a provisional mission with marked assumptions instead of a blocked session."
reason = "The base's documentation calls assumed knowledge and undefined terms the most common real complaint and records the missing assessment step as a standing request (https://github.com/mattpocock/skills/issues/725). Local teaching uses stated knowledge without retesting and lets the learner decline questions."
where = ["SKILL.md#the-mission", "MISSION-FORMAT.md#template", "MISSION-FORMAT.md#rules"]

[[sources.deviations]]
change = "Linked GLOSSARY-FORMAT.md from the workspace file list and named the glossary file GLOSSARY.md in Reference Documents."
reason = "The base ships the format but no longer links it, so learners get a glossary only on request (https://github.com/mattpocock/skills/issues/559)."
where = ["SKILL.md#teaching-workspace", "SKILL.md#reference-documents"]

[[sources.deviations]]
change = "Replaced \"each answer should be exactly the same number of words\" and \"Vary which position holds the correct answer\" with a quiz component in assets/ that shuffles the options at each render, options of comparable length and form, plausible distractors, and feedback on every option."
reason = "The base's documentation reports an instruction-level position fix that still put the correct answer first 33 times out of 33 and calls for a shuffling component (https://github.com/mattpocock/skills/issues/335). Local practice keeps clarity ahead of identical word counts."
where = ["SKILL.md#assets", "SKILL.md#skills", "references/practice.md#write-quiz-questions"]

[[sources.deviations]]
change = "Replaced the posture that the learner cannot skip a quiz with learner-decided practice: an explicit opt-out wins, worked examples replace the practice, and understanding stays unmeasured."
reason = "The invariants that an explicit learner request wins and that answers are never withheld to enforce a technique."
where = ["SKILL.md#skills"]

[[sources.deviations]]
change = "Extended \"Never trust your parametric knowledge\": supplied material is used, facts that change are checked against current primary sources, examples match the learner's version and period, a procedure or precise notation needs a source or an executed check, and only claims that needed an unreachable source are labeled unverified. Research stays proportional: the resource hunt applies to a workspace, and a direct lesson cites what it checked in the reply."
reason = "The base's documentation reports a learner who received invented Rubik's cube move sequences and puts the highest risk in procedural domains with precise notation. Local teaching kept research proportional and used supplied material, and a direct lesson has no RESOURCES.md."
where = ["SKILL.md#philosophy", "SKILL.md#knowledge"]

[[sources.deviations]]
change = "Added grounding routes by kind of subject: an existing codebase through the explain-code and explain-decisions skills, a business through references/business.md, and other subjects through their own sources."
reason = "The base's resources assume an external subject. Local teaching covers codebases and businesses, which need evidence from the code and from the organization."
where = ["SKILL.md#knowledge", "references/business.md"]

[[sources.deviations]]
change = "Added an Evidence section to the learning-record format with four levels (reported, supported, independent, retained), required for a record that claims a capability; added an optional Objective field; listed declined practice under what does not qualify."
reason = "A 2026 source review asked that evidence be required whenever a record claims demonstrated capability (reports/skill-atlas/teaching-validation.json, reviewRuns). The levels come from the retired learning-plan skill and serve the invariant that evidence levels stay distinct."
where = ["LEARNING-RECORD-FORMAT.md#evidence", "LEARNING-RECORD-FORMAT.md#optional-sections", "LEARNING-RECORD-FORMAT.md#what-does-_not_-qualify"]

[[sources.deviations]]
change = "Replaced \"If possible, open the lesson file for the user by running a CLI command\" with a check before delivery in references/lesson-artifacts.md, then opening the lesson when the host offers a way and always giving its path."
reason = "The skill runs in Claude Code and Codex, which offer different preview and file-opening tools. The base's documentation reports large output differences between harnesses, so a lesson is checked in a browser before the learner gets it."
where = ["SKILL.md#lessons", "references/lesson-artifacts.md#check-before-delivery"]

[[sources.deviations]]
change = "Added resource rules: check each entry's title, author, availability and access from the resource itself, never invent a link, mark paid resources, and list a paid resource or class only when no free one meets the mission's need."
reason = "Carried from the retired learning-plan skill, and the invariant that unknown facts stay unknown."
where = ["RESOURCES-FORMAT.md#rules", "RESOURCES-FORMAT.md#structure"]

[[sources.deviations]]
change = "Added a Boundaries section naming the neighboring skills and the authority limits, and made community suggestions explicit about never joining or enrolling for the learner."
reason = "teach is model-invocable among neighbors that explain code, rewrite prose, write documentation and plan software. The invariant on authority limits."
where = ["SKILL.md#boundaries", "SKILL.md#acquiring-wisdom"]


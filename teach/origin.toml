[[sources.ideas]]
idea = "Start from why the learner asks and what they already know. Read the purpose, prior knowledge and desired depth from the request and conversation instead of quizzing the learner, and skip what they plainly know."
serves = "Puts the lesson's depth where the learner's question is and avoids reteaching known material."
where = ["SKILL.md#establish-the-lesson"]
shapes = "Puts the learner's purpose, prior knowledge and depth first in the lesson setup, so stated knowledge is used without retesting and questions are limited to information that changes the lesson."

[[sources.ideas]]
idea = "Teach the mechanism, not a reference list. Give a plain definition first, tie it to the learner's case, and walk one concrete example through how it works; a glossary or list of parts is reference, not teaching."
serves = "Lets the learner see why the steps relate instead of memorizing names."
where = ["SKILL.md#build-understanding"]
shapes = "Orders the explanation from definition to the learner's purpose to one worked example, with a contrasting case or limit when it changes the answer."
adapted = "The donor gives a one- or two-sentence first answer and then stops. Here the response matches the requested depth: a live lesson uses manageable chunks that adapt to replies, and a one-shot artifact or non-interactive caller gets the requested content without waiting."

[[sources.ideas]]
idea = "When investigators supply a code mechanism and its history, combine their findings into one explanation and keep their confidence language, because their hedges are findings, not style. The reply is the explanation itself, not a report about the work."
serves = "Keeps the lesson as certain as its evidence and no more."
where = ["SKILL.md#ground-the-subject", "SKILL.md#deliver-and-continue"]
shapes = "Makes the codebase bullet preserve the investigators' evidence and uncertainty, and makes delivery return the explanation, lesson or feedback itself."
adapted = "The donor always runs its how and why skills. Here the explain-code skill establishes mechanism and ownership for an existing codebase, the explain-decisions skill runs only when historical reasons affect the lesson, and a general concept needs neither. When they are unavailable, the skill uses accessible evidence directly and names any material limit."

[[sources.declined]]
feature = "A fixed short first answer of one or two sentences followed by a stop."
reason = "Depth follows the request; the skill does not stop after a fixed number of sentences."

[[sources.declined]]
feature = "Redrawing a diagram once per added part for anything with three or more moving parts."
reason = "Progressive reveal is used when it aids understanding, without a fixed number of diagrams."

[[sources.declined]]
feature = "Generating whiteboard-style images for spatial ideas."
reason = "The smallest useful representation and the host's available tools decide the medium."

[[sources.declined]]
feature = "Writing every response in plain spoken English through the donor's prose skill."
reason = "The active output-language rules govern conversation and artifacts, and the communicate-clearly skill handles prose when available."


[[sources.ideas]]
idea = "The learner is whoever will use the lesson, which can differ from the person or workflow that asked. Depth and form come from that learner, and a calling workflow receives the complete content with no menu of follow-up offers, because continuation belongs to the caller."
serves = "Teaching a teammate, or teaching for another workflow, does not start a workspace for the requester or take over the caller's flow."
where = ["SKILL.md#teach", "SKILL.md#choose-the-shape"]
shapes = "Opens the skill with who the learner is, and gives Choose The Shape a rule for a calling workflow or non-interactive run: complete content in the reply, no offers, and a workspace only at a location the caller names."

[[sources.ideas]]
idea = "Questions test applying the mechanism or recognizing its limits, not recalling the lesson's wording. In a static document every question comes before any answer, and each answer states what a correct response contains and names the gap a plausible wrong answer reveals."
serves = "Practice exposes real misconceptions instead of rewarding recognition."
where = ["references/practice.md#practice-and-feedback", "references/practice.md#choose-the-task", "references/practice.md#write-quiz-questions"]
shapes = "Opens the practice reference with what practice tests, keeps answers apart from prompts in static work, and gives every quiz option its own feedback."
adapted = "The donor's check-ins are always static. Here an HTML lesson checks answers on the page, and a live learner attempts before the solution appears."

[[sources.ideas]]
idea = "An explanation states the limits of its evidence where they apply, and a claim whose evidence was unavailable is marked as such instead of sounding established."
serves = "The learner can use a lesson accurately and knows which parts to check."
where = ["SKILL.md#knowledge"]
shapes = "Adds the unverified label to Knowledge."
adapted = "The label applies only to claims that needed a source that could not be reached; facts that need no check, and claims checked in supplied material, carry none."

[[sources.declined]]
feature = "Check-ins that are always static text and never pose a question in the conversation."
reason = "Workspace lessons give immediate feedback on the page, and live practice waits for the learner's attempt."

[[sources.declined]]
feature = "The donor's configuration file, artifact root, run directory, model tiers and publishing service."
reason = "Lessons live in the teaching workspace, and teaching does not publish material."


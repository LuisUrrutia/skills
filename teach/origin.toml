[[sources.ideas]]
idea = "A direct lesson starts with a plain definition, ties it to the learner's case, then walks one concrete example through the mechanism, with a contrasting case or limit when it changes the answer. A list of parts or functions is reference material, not teaching."
serves = "A lesson given in the conversation lands as an understood mechanism instead of a list of names."
where = ["SKILL.md#direct-lessons"]
shapes = "Gives the Direct lessons subsection its order: definition, the learner's case, mechanism through one example, then limits."
adapted = "The donor always gives a one- or two-sentence first answer and stops. Here the learner's requested depth decides; the smallest complete answer applies only when they set none, and a non-interactive caller gets the complete lesson."

[[sources.ideas]]
idea = "Read the learner's purpose and prior knowledge from what they already said, skip what they plainly know, and do not quiz them to discover it."
serves = "Puts the lesson's depth where the learner is and avoids reteaching known material."
where = ["SKILL.md#the-mission"]
shapes = "Makes the mission interview a single message, and makes stated prior knowledge a record that is used without retesting until an attempt contradicts it."
adapted = "The donor never asks. Here an unclear mission still gets one round of questions, as the base requires, and a learner who declines gets a provisional mission instead."

[[sources.ideas]]
idea = "For a codebase subject, one investigator establishes how the code works and another why it is that way. The lesson teaches from their findings and keeps their confidence wording, because their hedges are findings, not style."
serves = "Code lessons rest on evidence without repeating the investigation, and no rationale is invented."
where = ["SKILL.md#knowledge"]
shapes = "Makes the codebase route in Knowledge name explain-code and explain-decisions and require their uncertainty to survive into the lesson."
adapted = "The donor teaches only bodies of code and runs its how and why skills on each, both for a subsystem and perhaps one for a small change. Here explain-decisions runs only when the reasons matter, a subject other than a codebase needs neither, and accessible evidence replaces them when they are unavailable."

[[sources.declined]]
feature = "No quizzes in any lesson."
reason = "Practice with feedback builds storage strength in the base's philosophy; the learner can still opt out explicitly."

[[sources.declined]]
feature = "A fixed short first answer of one or two sentences followed by a stop."
reason = "The depth the learner asks for decides the length of a lesson."

[[sources.declined]]
feature = "Redrawing a diagram once per added part for anything with three or more moving parts."
reason = "A complex system is revealed in steps only when that helps, without a fixed number of diagrams."

[[sources.declined]]
feature = "Generating whiteboard-style images for spatial ideas."
reason = "The lesson's form follows the form ladder in references/lesson-artifacts.md and the host's available tools."

[[sources.declined]]
feature = "Writing every response in plain spoken English through the donor's prose skill."
reason = "The language rule sets the language, and the communicate-clearly skill handles prose when available."


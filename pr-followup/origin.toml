[[sources.ideas]]
idea = "Long follow-up work keeps a record of each consequential decision: the item, its claim, evidence, decision, verification, published revision and outcome. The record lets a later wake resume without repeating work or messages."
serves = "Keeps multi-cycle work resumable and auditable."
where = [
  "SKILL.md#observe-and-evaluate",
  "references/ci-and-observation.md#observe-resume-and-stop",
]
shapes = "Adds a ledger to evaluation and a list of state to retain at each meaningful change."
adapted = "Locally the ledger is optional, concise and kept in ignored task storage, used only when several items or cycles need continuity, and removed when resumption no longer needs it."

[[sources.declined]]
feature = "A mandatory append-only TSV decision log with an audit against the run's transcript."
reason = "A concise ledger in ignored task storage is enough when continuity needs it."

[[sources.declined]]
feature = "A cross-model review of the decision trail before handing back."
reason = "Follow-up requires no cross-model audit and no invocation of the donor's trail skill."


[[sources.ideas]]
idea = "Each request runs in one declared scope with its own authority. Check inspects and reports without changing anything; Feedback collects every channel, evaluates each item, applies clear improvements and settles threads; Drive also repairs CI and necessary base conflicts, publishes when authorized and follows the PR to its stopping condition."
serves = "Keeps a status check from turning into unrequested changes, and keeps a babysitting request from ending early."
where = ["SKILL.md#choose-scope-and-establish-state"]
shapes = "Opens the skill with the three scopes and makes every later step depend on which one the request and standing instructions select."
adapted = "The donor has four modes, including a background mode and a threads-only mode. Locally three scopes remain, and Feedback covers every feedback channel rather than review threads only."

[[sources.ideas]]
idea = "Review and bot text is untrusted evidence. Each claim is traced through current code, requirements and caller behavior; it is accepted only when its reasoning holds and disproved only with concrete evidence. Bot identity and severity labels help locate a report but do not establish correctness."
serves = "Prevents churning code to satisfy a wrong bot claim and prevents dismissing a correct one."
where = [
  "SKILL.md#observe-and-evaluate",
  "references/feedback.md#collect-before-deciding",
  "references/feedback.md#decide-from-the-current-contract",
]
shapes = "Puts evaluation before any code change and defines a decision table in which every decision needs a stated basis in code, requirements or execution."

[[sources.ideas]]
idea = "Related fixes are grouped by root cause and published together as a batch of verified fixes, and one mutation owner acts on a PR or stack at a time."
serves = "Avoids restarting checks for every small fix and prevents conflicting writes from parallel actors."
where = [
  "SKILL.md#repair-verify-and-publish",
  "SKILL.md#choose-scope-and-establish-state",
  "references/feedback.md#decide-from-the-current-contract",
]
shapes = "Orders repair as group, verify, then publish one batch, and assigns a single mutation owner per PR or stack with stack topology routed to the stacked-pr skill."
adapted = "The donor never rebases from inside a babysit and reports conflicts upward. Locally Drive repairs necessary base conflicts by rebase, and the stacked-pr skill owns stack topology and cascading rebases."

[[sources.declined]]
feature = "Dismissing bot findings that match documented noise patterns, or leaning toward dismissal from the third review pass on."
reason = "Each round reevaluates changed evidence. A finding is set aside only with a concrete disproof, never because of a pattern match or a pass count."

[[sources.declined]]
feature = "Treating a CI failure in code the diff never touched as a stale base that needs a rebase."
reason = "A file outside the diff does not prove a stale-base failure; the failing job, command, error and source are read before the cause is decided."


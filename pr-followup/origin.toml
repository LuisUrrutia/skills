paths = ["dyl-stack/skills/dyl-ready-pr/SKILL.md", "dyl-stack/LICENSE"]

[[sources.ideas]]
idea = "After a repair push or the ready transition, CI, review feedback and integration state are established again for the current head. Some workflows and automated reviewers run only on non-draft PRs, so marking a draft ready starts a new observation phase even when the SHA is unchanged."
serves = "Prevents a readiness claim based on checks and reviews that predate the latest change or the ready state."
where = [
  "SKILL.md#move-a-settled-draft-to-review",
  "references/ci-and-observation.md#observe-resume-and-stop",
]
shapes = "Adds a post-ready phase that invalidates the draft-era snapshot, discovers newly triggered workflows and reviewers, and collects every channel again."
adapted = "The donor marks the draft ready as soon as its review skill reports green. Locally the draft becomes ready only when a fresh snapshot shows CI passed, feedback settled and no known work left."

[[sources.declined]]
feature = "A required roster of companion plugins and a forced deep-review phase repeated until green before the PR is marked ready."
reason = "Support skills load only at the boundary that needs them; a bounded review claim can go to the review-code-changes skill in read-only mode."

[[sources.declined]]
feature = "A fixed wait for a bot to register on the current SHA that ends as a stop after 30 minutes."
reason = "Expected reviewers are identified from configuration and current run state; unknown reviewer completion keeps the PR waiting or blocked rather than ending on a timer."


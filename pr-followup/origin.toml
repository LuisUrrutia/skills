format_version = 2
skill = "pr-followup"
created = "2026-10-03"
approach = "derive"
goal = "Bring the user's own open PR to the requested stopping point, from a read-only inspection through repaired feedback and CI, a draft moved to review, a verified approval or an authorized merge, with evidence for its current revision. Success means every observed feedback item and review thread is accounted for, readiness rests on the exact current head, and the result states honestly whether the requested scope is complete, waiting or blocked."

[[invariants]]
rule = "Check scope is read-only: no edits, reruns, replies, publication or state changes."
where = ["SKILL.md#choose-scope-and-establish-state"]

[[invariants]]
rule = "In Feedback and Drive scope, every review thread is classified and brought to one disposition: applied, not applicable, outside this PR with a tracking ticket, or needing a confirmation that is reported to the user. The skill replies or resolves as that disposition requires, without a separate authorization for reviewer communication, and never resolves a thread to hide remaining work."
reason = "The user's 2026-10-09 policy makes replying to and resolving review threads part of the feedback work."
where = [
  "SKILL.md#choose-scope-and-establish-state",
  "references/feedback.md#replies-and-thread-resolution",
]

[[invariants]]
rule = "In Feedback or Drive scope, a settled PR whose target repository belongs to the LuisUrrutia personal account is merged directly, without waiting for human or bot approvals, once all feedback is settled and its threads resolved, every enabled automated reviewer has finished and all applicable CI/CD has passed. Ownership is verified from the owner login and User account type, and explicit read-only, create-only, keep-draft or do-not-merge instructions take precedence."
reason = "The user's 2026-10-07 policy authorizes direct merges in the user's personal repositories without approvals."
where = ["SKILL.md#merge-settled-prs-in-luis-urrutias-personal-repositories"]

[[invariants]]
rule = "Outside the personal-repository policy or another explicit merge authorization, the skill has no merge authority. It never merges or enables auto-merge to finish the loop, and Drive ends on a verified merge or a current formal approval."
where = [
  "SKILL.md#stop-with-an-honest-result",
  "references/github-collection.md#verify-an-approval-stop",
]

[[invariants]]
rule = "In Feedback or Drive scope, an eligible draft is marked ready for review without another permission prompt, and the transition starts fresh CI and review observation even when the SHA is unchanged."
reason = "The user's 2026-10-05 policy requires eligible drafts to become ready, followed by fresh CI and review observation."
where = ["SKILL.md#move-a-settled-draft-to-review"]

[[invariants]]
rule = "Current repository policy and evidence for the exact current head decide readiness. Earlier green checks, a bot's success comment, a quiet interval or a stable comment count never do."
where = [
  "SKILL.md#move-a-settled-draft-to-review",
  "references/ci-and-observation.md#observe-resume-and-stop",
]

[[invariants]]
rule = "Waiting uses a resumable host-managed watch, and the agent turn ends while it waits. Drive has no default elapsed-time cutoff, a missing resumable watch is reported as a coverage gap, and a recurring schedule needs an explicit request."
where = [
  "SKILL.md#choose-scope-and-establish-state",
  "references/ci-and-observation.md#observe-resume-and-stop",
]


baseline_paths = [
  "skills/ce-babysit-pr/SKILL.md",
  "skills/ce-babysit-pr/references/settle.md",
  "skills/ce-resolve-pr-feedback/SKILL.md",
  "skills/ce-resolve-pr-feedback/references/evaluation-rubric.md",
  "LICENSE",
]
paths = [
  "skills/ce-babysit-pr/SKILL.md",
  "skills/ce-babysit-pr/references/settle.md",
  "skills/ce-resolve-pr-feedback/SKILL.md",
  "skills/ce-resolve-pr-feedback/references/evaluation-rubric.md",
  "LICENSE",
]

[[sources.ideas]]
idea = "Feedback and CI progress independently. Pending CI, an inaccessible channel or one disputed item never freezes unrelated supported fixes, and feedback collection continues while jobs run."
serves = "Prevents serializing all work behind the slowest signal."
where = [
  "SKILL.md#observe-and-evaluate",
  "references/ci-and-observation.md#investigate-failures-without-blocking-independent-feedback",
  "references/ci-and-observation.md#observe-resume-and-stop",
]
shapes = "Separates feedback collection from CI waiting, so repairs continue while unrelated jobs run."

[[sources.ideas]]
idea = "Every observed item has a tracked outcome. An item is finished only when it has its decision and the actions that decision requires, and the final report accounts for each one."
serves = "Prevents silently dropped feedback."
where = ["SKILL.md#observe-and-evaluate", "SKILL.md#stop-with-an-honest-result"]
shapes = "Defines completion of feedback work per item and makes the final report list each unapplied item with its reason."

[[sources.ideas]]
idea = "Publication invalidates earlier CI and readiness evidence. After a push the remote head is read again and a fresh snapshot of checks and feedback is collected for it; results from an older head explain history but never prove that the new revision passed."
serves = "Prevents reporting a stale green state for a new head."
where = [
  "SKILL.md#repair-verify-and-publish",
  "references/ci-and-observation.md#observe-resume-and-stop",
  "references/github-collection.md#ci-and-external-reviewers",
]
shapes = "Adds a re-read of the head after each publication and a rule that rebuilds the analysis when the head or base moves."

[[sources.ideas]]
idea = "Settled checks and readiness are not merge authorization. Ready for review differs from ready to merge, and approval does not establish merge readiness."
serves = "Keeps merging a decision that the user's policy owns."
where = ["SKILL.md#move-a-settled-draft-to-review", "SKILL.md#stop-with-an-honest-result"]
shapes = "Separates the ready gate, the approval stop and the merge into distinct states with their own conditions."
adapted = "In the donor only a stack-land posture authorizes merging. Locally the user's personal-repository policy or another explicit authorization does."

[[sources.declined]]
feature = "A default invocation budget, such as 8 hours of active watch time with a 3-day backstop."
reason = "Drive has no default elapsed-time cutoff; the user can set a time limit or stop it."

[[sources.declined]]
feature = "A self-sustaining in-session watch loop that keeps the agent running between ticks."
reason = "Host-managed event notifications resume the task and the agent turn ends while waiting; without a resumable watch the gap is reported."

[[sources.declined]]
feature = "Defaulting to fixing feedback because most review feedback is correct."
reason = "Each claim is judged on its evidence. Uncertainty is a question to investigate or a scoped decision, not permission to change behavior."


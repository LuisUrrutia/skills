id = "t3code-pr-watch"
author = "T3 Tools / T3 Code"
repository = "https://github.com/pingdotgg/t3code"
remote = "git@github.com:pingdotgg/t3code.git"
ref = "refs/heads/main"
license = "MIT; see LICENSE at the baseline commit; ideas only, no source text copied"
role = "ideas"
baseline_commit = "da04ebc5087477a82deae9ce19c03539a627359f"
reviewed_through = "da04ebc5087477a82deae9ce19c03539a627359f"
baseline_paths = [
  "apps/server/src/orchestration-v2/pullRequestWatch.ts",
  "apps/server/src/orchestration-v2/PullRequestWatchReactor.ts",
  "apps/server/src/mcp/toolkits/pullRequests/tools.ts",
  "packages/provider-core/src/server/runtimeInstructions.ts",
  "docs/user/source-control.md",
  "evals/mcp-tool-use/cases/pull-requests.ndjson",
  "LICENSE",
]
paths = [
  "apps/server/src/orchestration-v2/pullRequestWatch.ts",
  "apps/server/src/orchestration-v2/PullRequestWatchReactor.ts",
  "apps/server/src/mcp/toolkits/pullRequests/tools.ts",
  "packages/provider-core/src/server/runtimeInstructions.ts",
  "docs/user/source-control.md",
  "evals/mcp-tool-use/cases/pull-requests.ndjson",
  "LICENSE",
]

[[sources.ideas]]
idea = "T3 Code's PR watch never wakes the agent for a check that starts after the required-checks wake, a thread resolved without a comment, a merge, base advancement or a BEHIND branch, another actor's ready transition, or the gh user's own comments. The agent checks those at each wake and before claiming readiness or merging, and hands back when the stopping condition waits only on one of them."
serves = "Prevents readiness or merge decisions that assume the watch reported every relevant change."
where = ["references/ci-and-observation.md#t3-code"]
shapes = "Lists the uncovered events in the T3 Code subsection, supplementing the generic rule to disclose uncovered events the stopping condition depends on."
adapted = "Only gaps that follow from the watch's design are listed; the tool description and wake message already state what does wake."

[[sources.ideas]]
idea = "T3 Code checks the PR on its own fixed cadence that the agent cannot set, and wakes the model only when something changed, so the agent does not disclose that interval. Arming immediately after the final snapshot keeps the gap before activation short, so it needs no disclosure either."
serves = "Avoids repeating, on every run, disclosures about a host interval and an arming gap that the user cannot act on."
where = ["references/ci-and-observation.md#t3-code"]
shapes = "Exempts T3 Code from the fixed-interval and arming-gap disclosures of the generic watch rules."

[[sources.ideas]]
idea = "After ten comment-only wakes in a row without a push or check change, T3 Code stops the watch to break reply loops, such as a bot answering each reply. The skill treats that stop as a notification-loop guard, investigated before re-arming."
serves = "Prevents restarting a notification loop that only consumes tokens."
where = ["references/ci-and-observation.md#t3-code"]
shapes = "Names T3 Code's comment-only stop as an instance of the existing loop-guard rule."

[[sources.ideas]]
idea = "When the required checks pass while other checks still run, T3 Code wakes the agent once more after they all finish. On the required-checks wake the agent ends the turn and waits for that wake."
serves = "Prevents re-arming, unwatching or waiting in the shell on a required-checks wake, the failure T3 Code's tool-use evaluations record."
where = ["references/ci-and-observation.md#t3-code"]
shapes = "Adds the remaining-checks wake to the T3 Code subsection."
adapted = "The wake reached T3 Code on 2026-10-22 in https://github.com/pingdotgg/t3code/pull/23904; earlier builds do not send it."

[[sources.ideas]]
idea = "The watch is never replaced by gh run watch or gh pr checks --watch, the shell waits T3 Code's tool-use evaluations record agents starting after a watch wake or after unwatching."
serves = "Keeps waiting on host events instead of a model-held shell wait."
where = ["references/ci-and-observation.md#observe-resume-and-stop"]
shapes = "Names those commands in the existing rule against replacing the watch."

[[sources.ideas]]
idea = "Check scope only reads and does not register the PR with the host. Feedback and Drive register it when it is not yet registered, because they work on the PR; an existing registration persists across pushes."
serves = "Keeps read-only inspections from attaching PRs to the thread; T3 Code's agent instructions reserve linking for PRs the agent creates, takes over or pushes to."
where = ["SKILL.md#choose-scope-and-establish-state"]
shapes = "Limits the host registration step to Feedback and Drive scope."

[[sources.ideas]]
idea = "A delegated child that worked on the PR returns its URL, head SHA and pending check and review state, so the parent that owns the watch can continue."
serves = "Gives the watching parent the state it needs without a second collection."
where = ["SKILL.md#choose-scope-and-establish-state"]
shapes = "Adds the return contract to the rule that leaves watching to the parent."

[[sources.declined]]
feature = "Arming the watch whenever an authorized merge still waits on checks or reviews, as T3 Code's agent instructions direct for work the user asked for."
reason = "Feedback scope does not become indefinite babysitting; its personal-repository merge is a standing-policy step the user did not ask to follow, so it reports the remaining gates instead."


[[sources.ideas]]
idea = "Monitoring and repair are separate. An inspection pass reports state without editing, rerunning, replying or publishing; repairs, replies and publication happen only in a scope that covers them."
serves = "Lets the user ask what blocks a PR without authorizing changes."
where = ["SKILL.md#choose-scope-and-establish-state"]
shapes = "Makes Check a scope of its own with no state changes, and leaves repair to Feedback and Drive."

[[sources.ideas]]
idea = "Collection reads every feedback channel: inline comments with replies, formal review bodies, conversation comments, thread status, check runs and annotations, status contexts and Actions logs. It follows every REST page and every GraphQL cursor, including each thread's own comments cursor. A display limit or a single unresolved-thread query is not a complete inbox."
serves = "Prevents missing feedback that sits on a later page, in a resolved thread or in a successful job's log."
where = [
  "references/github-collection.md#channels-and-pagination",
  "references/feedback.md#collect-before-deciding",
  "SKILL.md#observe-and-evaluate",
]
shapes = "Adds a channel table and pagination rules that collection must satisfy before any decision."

[[sources.ideas]]
idea = "Edited comments and resolved or outdated threads are read again. A body digest or update time is tracked as well as the ID, because bots edit comments in place and reviewers reply after a thread is resolved; a prior disposition does not settle new content."
serves = "Catches feedback that arrives under an old ID or in a thread that looks closed."
where = [
  "SKILL.md#observe-and-evaluate",
  "references/github-collection.md#channels-and-pagination",
  "references/feedback.md#collect-before-deciding",
]
shapes = "Keeps resolved and outdated threads in every collection and makes new content under an old ID trigger reevaluation."

[[sources.ideas]]
idea = "Reply and resolution state is tracked apart from code repair. Locally fixed, verified, published, replied and resolved are distinct states, and none implies the next."
serves = "Prevents reporting a thread as settled because its code changed."
where = [
  "SKILL.md#stop-with-an-honest-result",
  "references/feedback.md#replies-and-thread-resolution",
  "references/github-collection.md#authorized-write-mechanics",
]
shapes = "Splits the final accounting into these states and gives replies and resolutions their own verification steps."
adapted = "The donor replies to the ID of the thread's last comment. Locally the REST reply uses the thread's root comment ID, as GitHub's documentation for review-comment replies requires."

[[sources.declined]]
feature = "Updating the branch whenever GitHub reports it BEHIND."
reason = "The base is updated only when the user asks, conflicts prevent integration, repository policy requires it, or evidence connects a failure to a needed base change."

[[sources.declined]]
feature = "Waiting for pending checks before acting on other work."
reason = "Pending CI does not freeze unrelated supported fixes; feedback repairs continue while jobs run."

[[sources.declined]]
feature = "Deciding how much weight a comment carries from its bot identity or severity markers."
reason = "Bot identity and severity labels help locate a report; they do not establish correctness."

[[sources.declined]]
feature = "A cron or scheduler fallback that polls the PR when no event subscription exists."
reason = "Without a resumable host watch the skill reports the coverage gap; a recurring schedule needs an explicit request."


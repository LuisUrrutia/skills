  "cursor-team-kit/LICENSE",
]
paths = [
  "cursor-team-kit/skills/fix-ci/SKILL.md",
  "cursor-team-kit/skills/loop-on-ci/SKILL.md",
  "cursor-team-kit/skills/fix-merge-conflicts/SKILL.md",
  "cursor-team-kit/LICENSE",
]

[[sources.ideas]]
idea = "A CI failure is diagnosed before it is fixed. The failing job, command, error and relevant source are read, including an external provider's check link, and the failure is classified as a product defect, workflow configuration, environment failure or observed flaky behavior. After each push the full check set for the new head is read again, because the set can change."
serves = "Prevents guessed fixes and conclusions drawn from an outdated check set."
where = [
  "references/ci-and-observation.md#investigate-failures-without-blocking-independent-feedback",
  "references/github-collection.md#ci-and-external-reviewers",
]
shapes = "Makes reading and classifying the failure the first step of CI work, before any edit or rerun."
adapted = "Locally repair targets the root cause: no disabled check, weakened assertion or blanket retry. A transient failure gets one rerun when evidence supports it and the request authorizes reruns, and a recurrence is investigated or reported instead of retried without bound. gh pr checks is a summary, not the full evidence."

[[sources.ideas]]
idea = "Conflict resolution regenerates derived files such as lockfiles with the project's tools instead of hand-editing them, and the resulting revision is verified before publication."
serves = "Prevents corrupted generated files and unverified conflict resolutions."
where = ["references/ci-and-observation.md#update-the-base-when-necessary"]
shapes = "Adds the regeneration rule to the conflict paragraph and puts verification of the result before the exact-lease publication."
adapted = "Locally an ordinary PR is updated by rebase under the user's standing policy, and both sides' intended behavior is read, because compilation alone does not prove a correct resolution."

[[sources.declined]]
feature = "Merging the latest main into the PR branch when a failure looks unrelated and already fixed on main."
reason = "The base is updated by rebase, and only when the user asks, conflicts block integration, repository policy requires it, or evidence connects a failure to a needed base change."


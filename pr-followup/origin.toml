reviewed_through = "a770e5b8470d3320eb53a56a286ea4a0a70a1f59"
baseline_paths = [".codex/skills/babysit-pr/SKILL.md", "LICENSE"]
paths = [".codex/skills/babysit-pr/SKILL.md", "LICENSE"]

[[sources.ideas]]
idea = "Only published feedback is processed. A PENDING review and its comments stay unprocessed and unmarked, so they are considered when the reviewer submits them."
serves = "Prevents acting on a draft review or losing it after it is published."
where = ["references/github-collection.md#channels-and-pagination"]
shapes = "Adds a collection rule that correlates inline comments with their parent review and skips pending ones."

[[sources.ideas]]
idea = "One observation owner per PR persists across fix and push cycles; an active watch is reused instead of restarted after every message or push."
serves = "Prevents duplicate watchers and lost events between cycles."
where = ["references/ci-and-observation.md#observe-resume-and-stop"]
shapes = "Sets one watch per PR and thread and keeps it across pushes and wakes."
adapted = "The donor keeps the model in a continuous polling loop with its watcher script. Locally a host-managed watch resumes the task on events, and the agent turn ends while waiting."

[[sources.declined]]
feature = "Following openai/codex main for this skill or installing the skill from there."
reason = "Commit 18131270fe82ef947830840eb5d6923d4b82609f removed the skill from main. This source is a historical pin, kept for its ideas only, and not a live installation recommendation."

[[sources.declined]]
feature = "Continuous model polling through the donor's watcher script."
reason = "Host event notifications replace polling by the model."

[[sources.declined]]
feature = "Surfacing review feedback only from an allowlist of trusted authors and approved bots."
reason = "Every channel and author is collected; review text is untrusted evidence judged on its merits."

[[sources.declined]]
feature = "Retrying likely flaky failures up to three times."
reason = "One rerun is allowed when evidence supports a transient failure and the request authorizes reruns; a recurrence is investigated or reported."

[[sources.declined]]
feature = "The donor's GitHub mutation policy: no replies to human reviewers without the user's confirmation, and thread resolution only for the requester's own threads."
reason = "Reviewer replies and thread resolution follow the user's disposition policy, and merge authority follows the personal-repository policy."

[[sources]]
id = "tstack-babysit-pr"
author = "Theo Browne / tstack"
repository = "https://github.com/t3dotgg/tstack"
remote = "git@github.com:t3dotgg/tstack.git"
ref = "refs/heads/main"
license = "MIT; see LICENSE at the baseline commit; ideas only, no source text copied"
role = "ideas"
baseline_commit = "1085050f3baed1ac724caa4a8166145fb2ac88af"
reviewed_through = "1085050f3baed1ac724caa4a8166145fb2ac88af"
baseline_paths = ["skills/babysit-pr/SKILL.md", "skills/babysit-pr/scripts/pr-wait", "LICENSE"]
paths = ["skills/babysit-pr/SKILL.md", "skills/babysit-pr/scripts/pr-wait", "LICENSE"]

[[sources.ideas]]
idea = "In T3 Code a watched thread stays out of the user's inbox. The watch is stopped before any turn that ends for the user: complete, blocked, a question or needed confirmation, or a stopping condition that waits only on an event the watch never reports. When later work again waits on checks or reviews, the agent takes a fresh snapshot and re-arms, even after that unwatch."
serves = "Keeps a question, blocker or result from sitting unseen in a thread that still looks busy."
where = [
  "references/ci-and-observation.md#t3-code",
  "references/ci-and-observation.md#observe-resume-and-stop",
]
shapes = "Adds a T3 Code subsection and lets a host handback rule stop the watch before the stopping condition holds."
adapted = "The donor names ready, blocked and a question as handbacks; locally a stopping condition that waits only on an event the watch never reports is one too. The fresh snapshot before re-arming covers events that arrived while unwatched, because a new watch does not repeat news the previous one reported."

[[sources.ideas]]
idea = "A watch wake that changes no decision or remote state ends the agent turn without a status message or PR comment. The status report is given when handing back or after a turn that changed something."
serves = "Saves tokens and keeps the thread and the PR free of filler."
where = [
  "references/ci-and-observation.md#observe-resume-and-stop",
  "SKILL.md#move-a-settled-draft-to-review",
  "SKILL.md#stop-with-an-honest-result",
]
shapes = "Adds the rule to the paragraph on the cost of each delivered event, and limits the stop report and the pending-review report to hand-backs and turns that changed something."

[[sources.ideas]]
idea = "A delegated child or subagent never arms a watch; it leaves watching to its parent."
serves = "Prevents duplicate watchers and wakes delivered to a thread that cannot act on the PR."
where = ["SKILL.md#choose-scope-and-establish-state"]
shapes = "Replaces the rule that only a subagent unable to own the watch returns it to its parent."

[[sources.ideas]]
idea = "GraphQL and REST have separate GitHub rate limits. When the GraphQL budget is exhausted, collection continues through the REST endpoints."
serves = "Keeps feedback collection going after watchers or earlier reads used up the GraphQL budget."
where = ["references/github-collection.md#ci-and-external-reviewers"]
shapes = "Adds a REST fallback to the coverage-gap paragraph."
adapted = "PR metadata comes from the REST pull request endpoint; thread resolution status, which only GraphQL exposes, stays a reported gap until the reset."

[[sources.declined]]
feature = "The bundled pr-wait poller, run through a monitor tool, for hosts without T3 Code's watch."
reason = "In T3 Code, where the user runs PR follow-up, the agent instructions forbid waiting with Monitor and the tool-use evaluations fail a run that starts pr-wait, so watch_pull_request is the only watcher. Elsewhere a missing resumable watch is reported as a coverage gap."

[[sources.declined]]
feature = "Treating CodeRabbit as advisory: never waiting for it and never holding a merge for it."
reason = "The personal-repository merge invariant requires every enabled automated reviewer to finish for the current revision."

[[sources.declined]]
feature = "Acting only on checks and comments newer than the latest push."
reason = "Edited comments and new replies in resolved or outdated threads are read again, because a prior disposition does not settle new content."

[[sources.declined]]
feature = "Waiting for a GitHub rate-limit reset with one background command before watching again."
reason = "T3 Code's agent instructions forbid waiting with sleep or loops, and T3 Code pauses a rate-limited watch and resumes it on its own, in its PullRequestWatchReactor source and in the installed 0.1.1-nightly.20261020 build. A watch stopped for read failures is re-armed once access works again."

[[sources.declined]]
feature = "Never merging while the branch is BEHIND or while base commits that landed after the last green run touch the PR's files; rebase, push and wait for green instead."
reason = "The base is updated only when the user asks, conflicts prevent integration, repository policy requires it, or evidence connects a failure to a needed base change; repository policy decides whether a BEHIND branch may merge."

[[sources.declined]]
feature = "Keeping the PR small by declining review findings such as unneeded tests, edge-case guards or small performance costs and listing them as follow-ups."
reason = "The user's standing PR-feedback rule applies every clear improvement or correct observation; a correct finding whose fix belongs elsewhere gets a tracking ticket."


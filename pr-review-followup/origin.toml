format_version = 2
skill = "pr-review-followup"
created = "2026-10-07"
approach = "create"
goal = "Carry a GitHub PR the user reviewed to approval on the reviewer's behalf: answer the author in the reviewer's own threads, settle what the current head confirms, re-review each new head through the pr-review skill, and approve once nothing that blocks approval remains. Success is an approval of a fully reviewed head through the gate enforced in code, or a report of the blocker that needs the user."

[[invariants]]
rule = "The skill is the reviewer-side counterpart of the pr-followup skill. When the verified gh actor is the PR's author, the pr-followup skill applies instead, and producing a review belongs to the pr-review skill. This skill never edits the reviewed code or requests changes."
where = ["SKILL.md#pr-review-follow-up"]

[[invariants]]
rule = "In T3 Code, T3's PR watch wakes the follow-up, one tick per wake, unless the user names an interval. Otherwise one tick runs every 30 minutes or at the interval the user names."
reason = "The 30-minute default was set at the user's direction when the skill was derived from the supervised PR 1982 follow-up session on 2026-10-07 (local snapshot pr-1982-followup-session). The user chose T3 Code's PR watch over that schedule in T3 Code on 2026-10-29. Using a named interval to select the schedule in T3 Code is inferred from the earlier rule that a named interval sets the cadence."
where = ["references/cadence.md", "SKILL.md#start-the-follow-up"]

[[invariants]]
rule = "An author's reply, or a resolution by someone else, is a claim. A thread is settled only after its claim is checked on the current head, and a resolved thread that is not optional counts only once the current head and base confirm it."
reason = "Set when the skill was derived from the supervised PR 1982 follow-up session on 2026-10-07 (local snapshot pr-1982-followup-session)."
where = ["references/thread-settlement.md", "SKILL.md#run-one-tick"]

[[invariants]]
rule = "Every follow-up on a topic stays in its existing thread. A required finding deferred as out of scope gets a request for a ticket, and the thread is resolved once the author supplies the ticket; a declined or deferred optional point is resolved without one."
reason = "Set when the skill was derived from the supervised PR 1982 follow-up session on 2026-10-07 (local snapshot pr-1982-followup-session). Optional points are exempt by the user decision of 2026-10-27 that they never block approval."
where = ["references/thread-settlement.md"]

[[invariants]]
rule = "Every new head gets a full review through the pr-review skill before the skill approves it."
reason = "In the supervised PR 1982 follow-up session on 2026-10-07, a 15-minute watcher that only reported thread state approved a head it had not reviewed (local snapshot pr-1982-followup-session)."
where = ["SKILL.md#run-one-tick"]

[[invariants]]
rule = "Replies and resolutions are published directly, not kept as drafts. The skill never acts on other reviewers' threads or on an unsubmitted review that belongs to the user."
reason = "Set when the skill was derived from the supervised PR 1982 follow-up session on 2026-10-07 (local snapshot pr-1982-followup-session)."
where = ["SKILL.md#pr-review-follow-up", "SKILL.md#run-one-tick", "references/thread-settlement.md"]

[[invariants]]
rule = "The skill is invoked only explicitly, like the pr-review skill, through allow_implicit_invocation false in agents/openai.yaml. It does not use Claude Code's disable-model-invocation."
reason = "The skill publishes and approves, so it must not start implicitly. disable-model-invocation would also stop it from invoking the pr-review skill and stop scheduled ticks from invoking it."
where = ["agents/openai.yaml"]

[[invariants]]
rule = "scripts/followup.py enforces the approval gate, binds each state file to one PR and reviewer, keeps uncertain-write markers across ticks, and requires verification of threads that someone else resolved. Prose instructions do not carry these guarantees."
reason = "Codex Astra Max and Claude Fable Max reviews found that the first draft relied on prose for them."
where = ["scripts/followup.py", "SKILL.md#run-one-tick"]

[[invariants]]
rule = "Thread replies follow the pr-review skill's rule for published text: they never mention the engines, models or agents behind the review, how it was run, or what it could not cover. An author's question about how the review was done goes to the user."
reason = "User decision on 2026-10-08."
where = ["references/thread-settlement.md"]

[[invariants]]
rule = "Open optional threads, meaning suggestions and nits, never block approval or `done`. A thread's required or optional action comes from the pr-review publication receipt or the follow-up's own classification, never from its label, and a thread without a recorded action counts as required."
reason = "User decision of 2026-10-27, after a follow-up kept listing a lone `suggestion:` thread as an approval blocker. A label is not evidence because the user edits published comments and earlier reviews labeled some required findings `nit:`."
where = ["SKILL.md#run-one-tick", "references/thread-settlement.md", "scripts/followup.py"]

[[invariants]]
rule = "Optional threads still open after a verified approval stay with the author: waiting ends and the final report lists them."
reason = "The user left this choice to the implementation on 2026-10-27. Following those threads would mean a full re-review of every later push until merge, and the author can resolve their own threads."
where = ["SKILL.md#run-one-tick"]

[[invariants]]
rule = "In T3 Code, the watch is stopped before reporting a tick that ends for the user: approval, done, a closed PR, a new blocker that needs the user, or progress that waits only on time or an event the watch never reports. A blocker already reported and unchanged since the user's reply ends the tick waiting, and a tick that ends waiting keeps or arms the watch."
reason = "The user chose to unwatch when handing the turn back (2026-10-29), and T3 Code keeps a watched thread in Working and out of the user's inbox until the agent stops watching, per its source-control documentation and wake message. The list of turns that end for the user is inferred from the skill's blockers and the watch's missing timer."
where = ["references/cadence.md#t3-code-watch"]

[[invariants]]
rule = "Each tick rechecks the events T3 Code's PR watch never reports: a thread resolved without a comment or push, a base change, a merge, comments by the account T3 Code reads with, and time passing. Arming discloses that they and comments posted after the final read wait for another wake or invocation."
reason = "Host constraint in T3 Code's PR watch source; a resolved thread still needs verification on the current head before approval."
where = ["references/cadence.md#t3-code-watch", "SKILL.md#run-one-tick"]


format_version = 2
skill = "tdd"
created = "2026-10-03"
approach = "derive"
goal = "Build requested behavior test-first, when the user or caller selects test-driven development, through short red, green and optional refactor cycles at the boundary that callers use. A run ends with the requested contract implemented and covered, real red and green observations, and the exact final checks, their outcomes and any remaining gaps reported."

[[invariants]]
rule = "Test-first work starts only when the user or caller selects it. Diagnosis, running existing checks and adding coverage for working code are separate work with other completion criteria."
reason = "Diagnosis-only requests, running existing checks and adding coverage for working code have different completion criteria."
where = [
  "SKILL.md#test-driven-development",
  "SKILL.md#establish-the-behavior",
  "SKILL.md#finish-with-evidence",
]

[[invariants]]
rule = "When evidence leaves a material behavior or interface choice unresolved, its tests and implementation pause for the answer. Only work that stays valid under any plausible answer continues, and the open decision never becomes an assumed default, a new parameter or a callback."
reason = "Turning the missing decision into a default, a parameter or a callback also changes the contract."
where = ["SKILL.md#establish-the-behavior"]

[[invariants]]
rule = "When a test cannot run because a prerequisite is inaccessible or needs new authority, the affected cycle stops with the exact blocker. Requested TDD never silently becomes unverified implementation-first work."
where = ["SKILL.md#work-one-behavior-at-a-time"]

[[invariants]]
rule = "Repository instructions and the caller own worktrees, commits, PRs and further delivery. This skill neither starts those tasks nor cancels an existing requirement to perform them."
where = ["SKILL.md#finish-with-evidence"]


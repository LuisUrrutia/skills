format_version = 2
skill = "explain-decisions"
created = "2026-10-03"
approach = "derive"
goal = "Explain to the asker what the available evidence establishes about why existing code or a design decision took its shape: its origin, constraints and tradeoffs. A good answer attaches each claim to its evidence at the confidence that evidence supports, keeps contradictions and unknowns visible, and states the search limits when part of the question stays unanswered."

[[invariants]]
rule = "Ordinary investigation is read-only: it keeps source, tests, configuration and external state unchanged, makes no repairs, contacts no authors, publishes nothing and creates no permanent records or teaching material. A requested explanatory artifact is written only at its agreed destination and within its agreed scope."
where = ["SKILL.md#follow-relevant-evidence"]

[[invariants]]
rule = "Historical motivation stays separate from present validity. Current documents or measurements establish today's constraints, not what an author knew then, and a retired original constraint alone does not make code redundant."
reason = "Current callers and contracts can depend on code after its original reason has lapsed, so removal advice checks them first."
where = ["SKILL.md#locate-the-decision", "SKILL.md#weigh-the-record"]

[[invariants]]
rule = "The investigation stays inside the target's evidence boundary: a supplied snapshot inside another checkout does not grant access to that checkout's index or history."
where = ["references/git-history.md#trace-the-relevant-history"]


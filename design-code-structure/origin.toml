format_version = 2
skill = "design-code-structure"
created = "2026-10-03"
approach = "derive"
goal = "Help a developer resolve the data model, interface or module boundary of a software change, starting from real callers, so the result has a usable interface, clear ownership of data and invariants, and evidence for the chosen shape. A design request ends with a recommendation and a sketch; an implementation request ends with the authorized change and its checks."

[[invariants]]
rule = "The work stays bounded to one concrete design decision and the enforcement of that boundary. Neither a local decision nor an enforcement gap expands it into a repository-wide audit, cleanup or tooling rollout."
where = ["SKILL.md#design-code-structure"]

[[invariants]]
rule = "Implementation follows the active request: a design request ends with a recommendation and a sketch, an implementation request continues through the authorized change and its checks, and an explicit request to stop before implementing is honored. The skill adds no approval checkpoint of its own."
where = ["SKILL.md#design-code-structure", "SKILL.md#carry-the-decision-through-and-verify"]

[[invariants]]
rule = "The workflow stays language- and framework-neutral and uses the project's language, terminology and module conventions."
where = ["SKILL.md#shape-the-interface-from-usage"]

[[invariants]]
rule = "Source updates preserve caller-first design, the exception for established or forced designs, boundaries justified with a single implementation, public protocol contracts, runtime validation and the project's documentation authority."
reason = "These local rules come from different sources, so a change to any one source could otherwise remove a rule that another source established."
where = [
  "SKILL.md#shape-the-interface-from-usage",
  "SKILL.md#compare-and-choose",
  "references/state-and-boundaries.md#define-external-boundaries-and-migration",
  "SKILL.md#carry-the-decision-through-and-verify",
]

[[invariants]]
rule = "Specialist skills run only when their evidence is needed and are resolved by registered name. The skill never claims that an unavailable specialist ran."
where = ["SKILL.md#ground-and-select-the-change"]


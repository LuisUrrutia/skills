  "skills/codebase-architecture/references/vocabulary.md",
  "LICENSE.md",
]

[[sources.ideas]]
idea = "When asked to choose among structural improvements, inspect representative change history in the authorized area, connect substantive changes to current friction, and rank the opportunities before designing alternatives. Each opportunity names its location, affected callers, current requirement or supported upcoming change, the knowledge that would become local, its correctness risk, and its migration and verification costs. Select the one the evidence justifies now, scoped to the smallest change that delivers it."
serves = "Spends design effort where change is expensive now instead of on speculative cleanup."
where = ["SKILL.md#ground-and-select-the-change"]
shapes = "Adds an opportunity-ranking step before interface design that runs only when the caller has not named the decision."
adapted = "History serves only to select improvements: generated files, bulk formatting and renames are discounted, commit counts do not measure design quality, and a consequential low-frequency failure can still take priority. Missing history is a stated evidence gap, not a reason to stop designing."

[[sources.ideas]]
idea = "Enforce the selected boundary through the data model, the public interface or the project's existing type, lint, test or build mechanism, and land the rule together with the handling of existing violations so the check passes. Existing violations are fixed in scope or covered by the tool's narrow, rule-specific exceptions with a reason and a retirement condition, kept in the tool's configuration instead of a separate violation-count baseline."
serves = "Gives the boundary an executable check that lands green instead of a rule that ships red or a prose convention."
where = ["references/structural-checks.md#match-the-mechanism-to-the-contract"]
shapes = "Orders enforcement mechanisms from structure to existing tools, and requires existing violations to be handled in the same change as the rule."
adapted = "The skill reuses established tools and verification entry points, and adds a custom check only when they cannot express the invariant. A warning or report-only stage makes migration visible but is not reported as a blocking gate."

[[sources.ideas]]
idea = "Prove a check through the project's real command with a supported input, a deliberate in-scope violation and the restored input. The failure must come from the intended rule, with a diagnostic that names the violated contract or its correction. Follow the exit status through the actual entry point, because a wrapper that suppresses failure, a filter that skips the path, a conditional skip, cached output or a warn-only rule can make a check prove nothing."
serves = "Prevents a green run that never examined the boundary."
where = ["references/structural-checks.md#exercise-the-real-path"]
shapes = "Adds a three-step probe (valid, violating, restored) and an exit-status trace as the proof a check needs before it counts."
adapted = "Deliberate violations run only in a disposable fixture or isolated copy within the authorized scope. Only the owned mutation is removed, pre-existing and concurrent edits are preserved, and an unrelated syntax error or failing test does not count as detection."

[[sources.ideas]]
idea = "During authorized implementation, prove one cohesive caller-to-result slice before generalizing a wider migration."
serves = "Exposes design errors on one path before a migration spreads them."
where = ["SKILL.md#carry-the-decision-through-and-verify"]
shapes = "Orders authorized implementation so one slice is proven before the migration widens."

[[sources.ideas]]
idea = "Distinguish a proposed check, an observed check and a gate wired into the required verification route, and record the command, inputs, observed status and diagnostic for the valid, violating and restored cases."
serves = "Prevents reporting a proposed or locally observed check as enforced."
where = ["references/structural-checks.md#exercise-the-real-path", "SKILL.md#compare-and-choose"]
shapes = "Splits the reported enforcement status into proposed, observed and wired, each with its own evidence."
adapted = "Workflow changes go to the github-actions skill, requested project guidance to the create-project-instructions or agent-instructions skill, and application-level evidence to the verify skill. A local run never establishes remote enforcement that was not exercised."

[[sources.declined]]
feature = "A separate architecture and repository-hardening workflow with Design, Deepen and Harden modes."
reason = "The prioritization and enforcement ideas were folded into the existing design workflow, so one skill owns structural design."

[[sources.declined]]
feature = "Wiring every check into both a pre-commit hook and CI."
reason = "A check connects to the project's existing required verification route; hooks, remote policies and schedules are separate choices."

[[sources.declined]]
feature = "A checked-in blast-radius rubric that lets an automated reviewer approve or escalate merges."
reason = "Automatic approvals are separate choices, not prerequisites for proving a structural boundary."

[[sources.declined]]
feature = "Installing a general guardrail toolkit (dead code, duplication, cycles, file size) or changing CI policy to protect one boundary."
reason = "Existing tools and verification entry points are reused; a custom check is added only when they cannot express the invariant."

[[sources.declined]]
feature = "Scheduled cleanup passes."
reason = "The skill is bounded to one design decision, and speculative cleanup does not become an automatic backlog."

[[sources.declined]]
feature = "Fixed TypeScript backend layers (handler, service, dao, mapper), an AsyncLocalStorage request context and framework defaults."
reason = "The workflow is language- and framework-neutral and follows the project's conventions."

[[sources.declined]]
feature = "A required vocabulary, adapter and consumer quotas (two adapters per seam, three real consumers before an abstraction), and a mandatory glossary."
reason = "Counts prompt judgment, the project's terminology applies, and a glossary follows the documentation scope."

[[sources.declined]]
feature = "Modes that always continue from design into deepening or hardening."
reason = "A design request ends with a recommendation and a sketch; implementation follows the active request."

[[sources.declined]]
feature = "Treating every incident, repeated mistake or review comment as a missing check."
reason = "The skill is bounded to one design decision, and the debug skill owns regression checks."


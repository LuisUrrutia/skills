[[sources.ideas]]
idea = "An interface is everything a caller must know (types, ordering, errors, configuration, cancellation and relevant resource costs), not only the signature. Prefer a small surface that hides substantial decisions and coordination; a short signature that leaves callers managing internal rules is not a simple interface."
serves = "Measures simplicity by what callers must learn, so hidden coordination counts against a design."
where = ["SKILL.md#shape-the-interface-from-usage"]
shapes = "Defines the interface as the caller's full obligation, which sets what the comparison counts as caller effort."
adapted = "The skill uses the project's terminology instead of the donor's fixed vocabulary of module, seam, adapter, depth, leverage and locality."

[[sources.ideas]]
idea = "Judge a module boundary by its real callers: remove a suspect layer in thought and see whether complexity disappears or spreads into its consumers, and check whether a change would stay local to one place."
serves = "Separates a layer that earns its place from a pass-through."
where = ["SKILL.md#compare-and-choose"]
shapes = "Adds the removal test to candidate screening and makes change locality a comparison criterion."
adapted = "Access control, isolation, adaptation or ownership can justify a boundary with one implementation; counts of files, adapters or callers do not settle its value."

[[sources.ideas]]
idea = "Name observable checks through the interface that callers use, so tests describe behavior and survive internal refactoring; internal tests can supplement them."
serves = "Keeps verification tied to behavior instead of internal structure."
where = ["SKILL.md#carry-the-decision-through-and-verify"]
shapes = "Places verification at the caller-facing interface, with internal tests as a supplement."
adapted = "Useful existing coverage is retained when modules are merged or replaced, instead of being deleted once interface tests exist."

[[sources.ideas]]
idea = "Classify each dependency to choose how to test across it: use real collaborators or lightweight local substitutes for local behavior, and introduce a replaceable dependency only where real variation, ownership, isolation or testability needs it."
serves = "Gives each boundary a test strategy that matches what can actually run locally."
where = ["references/state-and-boundaries.md#define-external-boundaries-and-migration"]
shapes = "Makes the choice of test substitute depend on the kind of dependency, and requires naming integration evidence at an external boundary."
adapted = "A fake at an external boundary cannot prove the remote service's transaction, timing or failure semantics, so the design names the integration evidence needed."

[[sources.ideas]]
idea = "Use concrete scenarios to separate concepts that share a name, and check stated terms against actual code behavior. Surface a conflict that affects correctness instead of renaming it away."
serves = "Prevents a model built on an overloaded or outdated term."
where = [
  "references/state-and-boundaries.md#model-the-domain",
  "SKILL.md#ground-and-select-the-change",
]
shapes = "Makes scenario-based term resolution the first step of domain modeling, and adds a question to the user before design when a conflicting term changes the public contract."
adapted = "Neither an old document nor current code automatically establishes the desired new rule."

[[sources.ideas]]
idea = "Record a consequential, non-obvious choice when real alternatives were considered, and keep glossary terms for durable domain language."
serves = "Keeps a later reader from undoing a deliberate decision without documenting every choice."
where = ["SKILL.md#carry-the-decision-through-and-verify"]
shapes = "Makes decision records and glossary entries conditional outputs of the handover, created only for consequential choices."
adapted = "Glossary and decision-record edits follow the active documentation scope or the project's established convention; neither is required for every decision."

[[sources.declined]]
feature = "A fixed architecture vocabulary (module, interface, seam, adapter, depth, leverage, locality) used exactly, with synonyms such as boundary avoided."
reason = "The skill uses the project's terminology and introduces terms only when they clarify a real distinction."

[[sources.declined]]
feature = "Spawning three or more sub-agents, each with a different design constraint, to produce radically different interfaces."
reason = "One agent's materially different sketches serve as alternatives; the compare-solutions skill owns requested independent attempts and gives them matched constraints."

[[sources.declined]]
feature = "Treating a seam with one adapter as hypothetical and requiring two adapters before adding a port."
reason = "A real isolation or ownership boundary can be justified with one implementation."

[[sources.declined]]
feature = "Deleting old unit tests on shallow modules once tests at the deepened interface exist."
reason = "Useful tests are retained after refactoring."

[[sources.declined]]
feature = "Returning results instead of producing side effects as a general design-for-testability rule."
reason = "Legitimate effects and runtime validation are preserved when a module is restructured."

[[sources.declined]]
feature = "Updating GLOSSARY.md inline as each term resolves and creating glossary and ADR files in fixed locations."
reason = "Documentation edits follow the active documentation scope or project convention."


[[sources.ideas]]
idea = "Before changing ownership or layering, trace a concrete use of the current system from entry point to result, including who owns state and who may change it. Recover the reason behind a consequential existing constraint, so it becomes a design input instead of a guess."
serves = "Prevents a redesign built from filenames or proposed diagrams, and prevents replacing a constraint whose purpose was unknown."
where = ["SKILL.md#ground-and-select-the-change"]
shapes = "Puts grounding first: the skill reads and traces the current system before any interface work, and lists the specialist skills that supply this evidence."
adapted = "The local skill first inventories source and documentation inside a bounded work area with ignore filtering disabled, because a filtered listing cannot show that a contract is absent. Where the donor always runs its how and why skills, the local skill calls the explain-code, explain-decisions, analyze-change-effects and prototype skills by registered name only when their evidence is needed, and reuses a current relevant trace."

[[sources.ideas]]
idea = "Write a representative caller interaction first, with inputs, the result and a material failure or lifecycle case, and derive the public types and operations from it. Usage and signatures must agree."
serves = "Keeps the interface shaped by what callers need instead of by the current implementation."
where = ["SKILL.md#shape-the-interface-from-usage"]
shapes = "Orders interface work so the caller interaction comes before types, and makes the type sketch answer to that usage."

[[sources.ideas]]
idea = "Choose data structures from the valid domain states, transitions and dominant access patterns, and encode known invariants in types or storage constraints where the project can enforce them, for example a discriminated union instead of synchronized booleans. Each invariant has a named owner, behavior is grouped around the knowledge it protects instead of by execution stage, and reliably derivable values are derived instead of stored."
serves = "Makes invalid states hard to represent and keeps one rule from being repeated across load, validate, transform and save stages."
where = [
  "SKILL.md#shape-the-interface-from-usage",
  "references/state-and-boundaries.md#model-the-domain",
]
shapes = "Makes valid states, transitions and invariant ownership the first design output, ahead of operations, and replaces stage-by-stage modules with modules that own one body of knowledge."

[[sources.ideas]]
idea = "When concurrent actors share mutable state, first ask whether each actor can own independent data that is combined at a read boundary. Only a real cross-actor invariant needs one canonical target, and then the design names its structural enforcement, such as a transaction, a unique constraint or a single writer that the real system supports."
serves = "Prevents races caused by shared mutation without discarding an invariant that really spans actors."
where = ["references/state-and-boundaries.md#establish-ownership-and-lifecycle"]
shapes = "Orders the ownership decision: separation is tried first, and structural enforcement is named only when sharing is real."
adapted = "Writer ownership follows the actual invariant instead of a universal one-writer rule, and splitting state must not discard a cross-actor invariant."

[[sources.ideas]]
idea = "For an operation subject to retries or crashes, examine duplication and partial completion: state what is atomic, which identity deduplicates work, and how a later attempt distinguishes completed work from uncertain effects."
serves = "Prevents duplicate effects and restarts whose outcome depends on what an earlier attempt left behind."
where = ["references/state-and-boundaries.md#establish-ownership-and-lifecycle"]
shapes = "Adds atomicity, a deduplication identity and detection of completed work as required answers for an operation that can be retried or interrupted."
adapted = "Stated as questions the design must answer instead of the donor's recipes, such as convergent startup and PID-based stale-lock detection. The skill does not promise exactly-once behavior from a process-local flag or invent external guarantees."

[[sources.ideas]]
idea = "For an unsettled structural choice, sketch at least two materially different designs that meet the same requirements, varying ownership, the data model or the caller's interaction, and include the current shape when it is viable. A renamed version of the same design is not an alternative."
serves = "Prevents locking in the first shape, which often mirrors the current implementation."
where = ["SKILL.md#compare-and-choose"]
shapes = "Makes at least two materially different sketches the entry step of the comparison, before candidates are compared on shared criteria."
adapted = "The local rule keeps the exhaust-the-design-space principle's exception: an established pattern or a design forced by constraints needs no manufactured options, and the skill explains the deciding constraint instead."

[[sources.ideas]]
idea = "Screen candidates for shallow structure: pass-through layers, exposed private representations, duplicated policy, organization by execution stage, and callers that must coordinate internal stages."
serves = "Prevents layers that add reading effort without hiding a decision."
where = ["SKILL.md#shape-the-interface-from-usage", "SKILL.md#compare-and-choose"]
shapes = "Adds a screening step that every candidate passes before the recommendation, and replaces grouping by execution stage with grouping by protected knowledge."
adapted = "Counts of layers, files, adapters or callers prompt judgment but do not decide: access control, isolation, adaptation or ownership can justify a boundary with one implementation."

[[sources.ideas]]
idea = "During implementation, repeated signs that the model is wrong (callers that need hidden rules, type escapes, duplicated policy or unexpected shared writes) trigger a revisit of the affected assumptions and a comparison with a revised shape before workarounds are added. One necessary edge case does not justify a rewrite."
serves = "Prevents bolting workarounds onto a wrong design, and prevents rewrites over isolated edge cases."
where = ["SKILL.md#carry-the-decision-through-and-verify"]
shapes = "Adds a revisit loop to implementation: the listed friction signals send the work back to compare a revised shape instead of adding workarounds."

[[sources.ideas]]
idea = "Judge a candidate by whether an edit made from one caller, file or nearby example stays correct across the subsystem, because the next contributor may see only the files it opened and copy the nearest example."
serves = "Prevents designs whose rules diverge when someone changes one place without seeing the others."
where = ["SKILL.md#compare-and-choose"]
shapes = "Adds partial-context correctness as a comparison criterion beside correctness, caller effort and change locality."

[[sources.ideas]]
idea = "Prefer one maintained route for each contract, because contributors copy whichever route they find first and every parallel route keeps gaining callers."
serves = "Prevents parallel paths for the same contract from drifting apart."
where = ["SKILL.md#compare-and-choose"]
shapes = "Adds a rule that consolidates parallel routes into one, with the retirement of the others tied to an authorized migration."
adapted = "Supported protocol surfaces, platform variants and compatibility paths stay while consumers need them. They are retired only within an authorized migration that accounts for those consumers."

[[sources.ideas]]
idea = "Derive related registries or lists from one authority; when one cannot be derived, check the defined relationship between them."
serves = "Prevents hand-synchronized lists in which an edit updates only the list the contributor saw."
where = ["SKILL.md#compare-and-choose"]
shapes = "Replaces hand-synchronized registry copies with derivation from one authority or a check of their relationship."
adapted = "Independently meaningful lists need not be identical; only their defined relationship is checked."

[[sources.ideas]]
idea = "For each material boundary, name the failure it must prevent, its owner and the existing structural, type, lint, test or build mechanism that can enforce it, so the intended boundary does not rest on prose."
serves = "Prevents a boundary from decaying when a contributor takes the shortest path that compiles."
where = ["SKILL.md#compare-and-choose"]
shapes = "Makes naming each boundary's failure, owner and enforcing mechanism part of choosing a design, and sends check work to the structural-checks reference."
adapted = "During design the skill names the mechanism; installing or changing a check needs implementation authority."

[[sources.ideas]]
idea = "Separate domain meaning from private storage, transport and framework details when callers should not depend on them, and parse external data at the boundary that owns it."
serves = "Keeps callers independent of representations that can change behind the boundary."
where = [
  "references/state-and-boundaries.md#define-external-boundaries-and-migration",
  "references/state-and-boundaries.md#establish-ownership-and-lifecycle",
]
shapes = "Opens the external-boundaries section with the separation of domain meaning from private representations, and keeps validation of current state at the operation that needs it."
adapted = "A protocol library may expose protocol concepts as part of its contract, and tenant identity, cancellation, security and observable errors stay visible when they are the caller's obligation. Unlike the donor's rule to trust internal code unconditionally, validation of current authorization and mutable state stays at the operation that needs it, because types and an earlier parse cannot establish those facts."

[[sources.declined]]
feature = "Cursor-specific tooling and parallel candidate runners on fixed model slugs taken from a pstack models rule."
reason = "Specialists are optional local skills resolved by registered name; the host's tools decide how work runs."

[[sources.declined]]
feature = "Architect's unconditional design-twice rule, which requires two structurally distinct candidates even when the first looks sufficient."
reason = "An established pattern or a design forced by constraints needs no manufactured options."

[[sources.declined]]
feature = "A fixed call-chain limit (flatten when tracing needs more than three files) and collapsing every adapter that has no second implementation."
reason = "Layer and adapter counts prompt judgment; a boundary with one implementation can be justified by access control, isolation, adaptation or ownership."

[[sources.declined]]
feature = "A required multi-model candidate run with adversarial review before synthesis."
reason = "One agent's sketches are alternatives. The compare-solutions skill runs independent attempts only when requested, or when complete independent designs justify the work and delegation is authorized."

[[sources.declined]]
feature = "Committing the synthesized sketch with not-implemented stubs as its own scaffold commit, and planned product breakage while the stubs are filled in."
reason = "Disposable sketches stay in permitted scratch storage outside product code, and implementation preserves supported behavior."

[[sources.declined]]
feature = "Scrapping the sketch and redesigning from first principles across every affected reference, up to a whole-repository rewrite."
reason = "Recurring friction triggers a revisit of the affected assumptions and a compared revised shape; a necessary edge case alone does not justify a rewrite."

[[sources.declined]]
feature = "Moving all callers off the other ways to do a task and deleting those ways in the same change."
reason = "Supported protocol, platform and compatibility routes stay until an authorized migration accounts for their consumers."

[[sources.declined]]
feature = "Requiring hand-maintained lists to be identical, or the build to fail whenever they disagree."
reason = "Independently meaningful lists may differ; the check covers their defined relationship."

[[sources.declined]]
feature = "A universal rule that every boundary violation, such as an import of internals, fails the build, and implementing enforcement during a design-only request."
reason = "Design names the enforcement mechanism; the check is installed only within authorized implementation and matched to the actual contract."

[[sources.declined]]
feature = "Giving every piece of state exactly one writing module as a universal rule."
reason = "Writer ownership follows the actual invariant; independent actors can own separate data combined at a read boundary."


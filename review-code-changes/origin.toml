id = "addy-review"
author = "Addy Osmani"
repository = "https://github.com/addyosmani/agent-skills"
remote = "git@github.com:addyosmani/agent-skills.git"
ref = "refs/heads/main"
license = "MIT; notice retained in THIRD-PARTY-NOTICES.txt"
role = "ideas"
baseline_commit = "a06bc63b3f8b829c14b0bbf53d99fefc39d58092"
reviewed_through = "aeac41d4d005999432bb7312f7ff06383a91d59d"
baseline_paths = [
  "skills/code-review-and-quality/SKILL.md",
  "references/security-checklist.md",
  "references/performance-checklist.md",
  "LICENSE",
]
paths = [
  "skills/code-review-and-quality/SKILL.md",
  "references/security-checklist.md",
  "references/performance-checklist.md",
  "LICENSE",
]

[[sources.ideas]]
idea = "The review applies separate lenses, each with its own questions: correctness, compatibility and security; structure and maintainability; performance and operational workflow; and verification quality. Effort goes deeper where the evidence shows a risk instead of being spread evenly."
serves = "Keeps one kind of concern from hiding another, so a correct but unmaintainable change or a clean but insecure one is still caught."
where = ["references/protocol.md#review-lenses", "references/protocol.md#review-sequence"]
shapes = "The protocol's Review lenses section has one subsection per concern, and step 3 of the review sequence applies them across the changed paths by risk."
adapted = "The lenses apply through the project's language, runtime semantics and actual risk, not as a universal checklist with numeric thresholds."

[[sources.ideas]]
idea = "Review the author's verification story: whether the assertions exercise the changed behavior, including the failure or boundary that motivates the change, and whether the claimed commands, revision and results hold for this snapshot."
serves = "Prevents passing tests or claimed checks from standing in for evidence that the changed behavior works."
where = ["references/protocol.md#verification-quality"]
shapes = "The Verification quality lens checks assertions against the changed behavior and checks the author's claimed commands and results, keeping inspection, reproduction, observation and unrun checks distinct."

[[sources.ideas]]
idea = "A dependency change is a code change. Review dependency and lockfile changes, release notes, migrations and deployed-version interactions against the actual supported versions and contracts. An installed package, a compatible signature or a version label does not prove compatible runtime behavior."
serves = "Catches breakage that enters through dependencies rather than through the edited source."
where = ["references/protocol.md#correctness-compatibility-and-security"]
shapes = "Adds a dependency paragraph to the correctness, compatibility and security lens that treats installation, signatures and version labels as insufficient proof of runtime compatibility."

[[sources.declined]]
feature = "Numeric change-size and file-size thresholds, such as splitting a change near 1000 changed lines or flagging a file that passes about 1000 lines."
reason = "A structural finding needs a demonstrable cost or a violated standard; length alone does not justify a required change."

[[sources.declined]]
feature = "Mutating the reviewed source, for example inverting a condition, to test whether the suite catches a regression."
reason = "The review never alters the reviewed code to test a theory; experimental mutations run only in an authorized isolated copy."

[[sources.declined]]
feature = "Changing dependencies as part of the review."
reason = "The review reads dependency changes; it does not modify the reviewed tree, expectations or dependencies, even to make a check work."

[[sources.declined]]
feature = "Requiring cleanup before submission or a filed bug for deferred cleanup, and other mandatory cleanup or publication steps."
reason = "The review reports findings; repairs, issue filing and publication belong to the enclosing task."

[[sources.declined]]
feature = "The donor's ecosystem-specific security and performance checklists as universal policy."
reason = "Domain advice must match the actual language, framework, version and project conventions; a specialist checklist does not turn an irrelevant recommendation into a defect."


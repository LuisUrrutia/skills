id = "superpowers-review"
author = "Jesse Vincent / obra"
repository = "https://github.com/obra/superpowers"
remote = "git@github.com:obra/superpowers.git"
ref = "refs/heads/main"
license = "MIT; notice retained in THIRD-PARTY-NOTICES.txt"
role = "ideas"
baseline_commit = "8ca22dba9a94f28898bbce59f2537ff4d87c747d"
reviewed_through = "bb92a77741419a4ab5f06e711a283343f1ada0c3"
baseline_paths = [
  "skills/requesting-code-review/SKILL.md",
  "skills/requesting-code-review/code-reviewer.md",
  "skills/receiving-code-review/SKILL.md",
  "LICENSE",
]
paths = [
  "skills/requesting-code-review/SKILL.md",
  "skills/requesting-code-review/code-reviewer.md",
  "skills/receiving-code-review/SKILL.md",
  "LICENSE",
]

[[sources.ideas]]
idea = "A reviewer receives a bounded handoff: the exact scope, the applicable requirements and an output contract, but not the implementer's full reasoning history. It then judges the work product instead of the author's thought process."
serves = "Keeps the review independent of the reasoning that produced the change."
where = ["references/delegation.md#assign-a-bounded-investigation"]
shapes = "The worker contract lists exactly what each worker receives, and first-pass workers stay independent of the implementer's reasoning and of emerging review conclusions."

[[sources.ideas]]
idea = "External review feedback is a claim to check against the reviewed revision and the supported contracts before it is accepted. Stale comments, agreement among reviewers and author confidence are not proof."
serves = "Prevents adopting wrong or outdated feedback as a finding."
where = [
  "SKILL.md#gather-intent-and-review",
  "references/protocol.md#calibrate-and-challenge-findings",
]
shapes = "Gather intent and review validates each feedback claim against the reviewed revision after the independent assessment, and the challenge section requires an outdated comment to be rechecked on the reviewed snapshot."
adapted = "Only the donor's evaluation criteria are taken. Reading feedback gives no authority to repair, reply, resolve threads, or pause other work."

[[sources.declined]]
feature = "Acting on review findings inside the review: fixing critical issues at once and important ones before proceeding."
reason = "The review phase is read-only; an enclosing implementation task can act on the findings after the review ends."

[[sources.declined]]
feature = "Implementing, replying to or resolving received feedback, and stopping all work until unclear feedback items are clarified."
reason = "Feedback reception supplies evaluation criteria only; this skill has no repair, reply, thread-resolution or global pause authority."


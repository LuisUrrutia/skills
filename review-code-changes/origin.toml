[[sources.ideas]]
idea = "A review run is complete only when every assigned pass has a terminal result. A missing, malformed, failed or unfinished result is incomplete work, and a later failure cannot be replaced by an earlier clean result."
serves = "Prevents reporting a clean review when part of it did not finish or failed."
where = ["references/delegation.md#integrate-evidence-and-coverage"]
shapes = "The integration section treats incomplete reports as incomplete work and forbids replacing a later failure with an earlier clean result."
adapted = "Applied to native facet workers and the report's Coverage and Checks sections: an incomplete facet is investigated directly, retried for a concrete recoverable cause, or carried as a coverage gap; a failure never counts as zero findings. The donor runs its passes sequentially through one reviewer, so it is not evidence for independent subagents."

[[sources.declined]]
feature = "The donor's external review runner, with its provider preferences and its result schema."
reason = "Workers use the host's native delegation and return the local canonical report."

[[sources.declined]]
feature = "Tracing limits that come from running the reviewer in an empty sandbox."
reason = "Workers may trace relevant surrounding code within the parent's boundary."

[[sources.declined]]
feature = "Reporting only P0 issues by default, and a confidence score."
reason = "The review keeps every supported finding and states severity as consequence, not confidence."

[[sources.declined]]
feature = "Copying or running the donor's runtime."
reason = "The evidence for the local implementation covers only the donor's completion, attribution and execution rules."


[[sources.ideas]]
idea = "A small change can break behavior in other modules, so the review follows callers, producers, consumers, schemas, configuration and dependencies beyond the diff, through normal, boundary, failure, cancellation, retry and concurrent paths when they apply."
serves = "Catches breakage whose observable failure is outside the changed lines."
where = [
  "SKILL.md#gather-intent-and-review",
  "references/protocol.md#correctness-compatibility-and-security",
]
shapes = "Gather intent and review extends the protocol beyond the diff; the correctness lens lists the paths to follow."

[[sources.ideas]]
idea = "Changes to setup, build, deployment or run contracts can break the developers' established workflow: new mandatory secrets, environment variables, ports, manual tools or generation steps. An optional path or an ordinary configured dependency alone is not such a regression."
serves = "Catches regressions in how people build and run the project, which tests rarely cover."
where = ["references/protocol.md#performance-and-operational-workflow"]
shapes = "Gives the performance and operational workflow lens a second half that traces setup, build, deployment and run contracts and limits what counts as a workflow regression."

[[sources.ideas]]
idea = "Trace feature gates across the UI, the API, background work and data mutations. A visual gate does not protect an endpoint that can be reached on its own."
serves = "Catches gated features that leak through a path the gate does not cover."
where = ["references/protocol.md#correctness-compatibility-and-security"]
shapes = "Makes feature-gate tracing across every reachable surface part of the correctness lens."

[[sources.ideas]]
idea = "A change may intend to break or remove behavior. That breakage is authorized only as far as the request establishes it, and consequences beyond the stated intent are still traced."
serves = "Avoids reporting intended changes as defects without missing their unintended consequences."
where = ["references/protocol.md#requirements-and-standards"]
shapes = "The requirements lens treats intentional removals or breakage as authorized only to the extent of the request."
adapted = "The donor skips an intended high-risk finding when the change is well constrained, unless the author seems unaware of its effects. Here the request sets the authorized extent, and every consequence beyond it is traced."

[[sources.ideas]]
idea = "A structural finding names its concrete maintenance cost and proposes a bounded move that removes that cost while preserving behavior."
serves = "Makes structural feedback actionable and tied to a real cost."
where = ["references/protocol.md#structure-and-maintainability"]
shapes = "Requires each structural finding in the structure lens to state its maintenance cost and a bounded, behavior-preserving remedy."
adapted = "Structural suggestions do not automatically block a change. A useful alternative with no established regression is an optional recommendation, not a presumptive blocker."

[[sources.ideas]]
idea = "Form the independent assessment first, then read external review comments, validate each claim, merge duplicate causes and attribute the external findings that survive."
serves = "Keeps external comments from anchoring the review and keeps one cause from being reported twice."
where = ["SKILL.md#gather-intent-and-review", "references/protocol.md#review-sequence"]
shapes = "External feedback is considered after the independent assessment, and the review sequence validates external feedback last."

[[sources.declined]]
feature = "Fixed line-count limits, such as treating a file that grows past 1000 lines as a presumptive blocker."
reason = "Length does not by itself justify a required change; a structural finding needs a demonstrable cost or a violated standard."

[[sources.declined]]
feature = "Mandatory parallel review seats: one bug and security subagent and one code-quality subagent on every review."
reason = "Facets are chosen from the change's actual risks, and a straightforward change is reviewed directly."

[[sources.declined]]
feature = "An approval verdict or approval bar, with structural issues treated as presumptive blockers."
reason = "No findings means none were supported in this scope, not an approval; structural suggestions do not automatically block a change."

[[sources.declined]]
feature = "Weighting a finding more heavily because several reviewers report it."
reason = "Severity describes consequence, and agreement does not establish correctness or severity."


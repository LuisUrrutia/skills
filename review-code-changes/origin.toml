[[local_snapshots.ideas]]
idea = "Fix one reproducible scope before reviewing. A caller-supplied scope is honored exactly; otherwise one scope is resolved from the request (current changes, a commit, a branch's merge-base, or a supplied diff), so that one reproducible diff command names every path under review."
serves = "Makes the review repeatable and defines the set of paths the report must cover."
where = ["SKILL.md#establish-a-reproducible-scope"]
shapes = "The scope section resolves the comparison for each kind of change and records it before any review work starts."
adapted = "The local skill resolves the actual target base from the caller or PR metadata, resolves refs to commit IDs, saves a JSON changed-path inventory and captures Git state to detect concurrent edits."

[[local_snapshots.ideas]]
idea = "The review is complete only when every changed path appears in Coverage and every finding carries the trace the protocol requires."
serves = "Prevents a report that silently skips paths or keeps findings without their evidence."
where = ["SKILL.md#deliver-the-report"]
shapes = "The finish rule closes the skill: each changed path is accounted for and each retained finding has its required evidence, and no findings is a limited result, not an approval."

[[local_snapshots.ideas]]
idea = "Markdown is the canonical report. The bundled script validates it before delivery, and a validation failure means the review is incomplete. A caller handoff returns one line with the finding count and the report path; a standalone review also renders HTML as derived output, and revisions start from the Markdown."
serves = "Gives every review one checkable artifact and a predictable return to the caller."
where = ["SKILL.md#deliver-the-report"]
shapes = "The delivery section writes, validates and, for a standalone review, renders the report, and returns the paths in a fixed order."
adapted = "The local validation also checks Coverage against the saved changed-path inventory."


[[local_snapshots.ideas]]
idea = "Keep a defect only when the declared change causes or newly exposes it, and name the changed line or contract that starts the failure, even when the observable failure happens in unchanged code. Unrelated pre-existing defects are excluded."
serves = "Ties every finding to the reviewed change."
where = ["references/protocol.md#diff-causality", "references/protocol.md#report-grammar"]
shapes = "Diff causality is the first lens, and every finding carries a Diff cause line."
adapted = "Locally, a pre-existing defect that the change carries, as the carried-defect invariant defines, is also retained, as optional unless it defeats the change's purpose."

[[local_snapshots.ideas]]
idea = "Trace a behavioral claim through each leg that exists for it: the writer that can give the value, the producer that carries it, the consumer where the failure occurs, the schema that constrains it, the final send after later mutations, and the counterpart of a generated, external or cross-module contract."
serves = "Prevents findings built on an incomplete or imagined path."
where = ["references/protocol.md#trace-candidates"]
shapes = "The trace section lists the legs and makes the remaining chain explicit; evidence entries in the report use these leg names as roles."

[[local_snapshots.ideas]]
idea = "A claim about every writer, caller or handler needs a census that starts from the mutation, call or contract that defines the population, and records its size and the affected members. Feature vocabulary is not a complete inventory. When code chooses one record from several, a case where the candidate values differ is traced."
serves = "Prevents claims about a whole population from resting on a sample."
where = ["references/protocol.md#trace-candidates"]
shapes = "The census paragraph defines how a population is counted, and the later caller-evidence rule builds on it."

[[local_snapshots.ideas]]
idea = "Follow accessible in-scope counterparts. At a caller-owned or unreadable seam, record the exact premise and the missing path, repository, revision, permission or check. A premise that decides whether an issue exists stays an open question; a premise that only qualifies the extent of a supported finding stays inside that finding."
serves = "Keeps unknowns visible without guessing across unreadable boundaries, and without suppressing findings the accessible evidence already supports."
where = [
  "references/protocol.md#trace-candidates",
  "references/protocol.md#report-grammar",
  "SKILL.md#gather-intent-and-review",
]
shapes = "The last paragraph of the trace section defines seam handling, and the report grammar gives Open questions a fixed form with the evidence each one needs."

[[local_snapshots.ideas]]
idea = "The report is one Markdown document with fixed sections in a fixed order. Each finding is indexed by a heading with its ID, severity, changed-line anchor and title, and its self-contained body holds the affected population, the diff cause, the impact, leg-tagged evidence and any unresolved premise. Open questions state the evidence each one needs, and Coverage has one entry per changed path."
serves = "Makes every review complete, comparable and machine-checkable."
where = ["references/protocol.md#report-grammar"]
shapes = "The report grammar section defines the sections, the finding form, the evidence entries, Open questions and Coverage."
adapted = "The local grammar adds Review basis and Checks sections, Class and Action fields, requirement, standard, code and probe evidence roles, and partial or unreadable Coverage states."


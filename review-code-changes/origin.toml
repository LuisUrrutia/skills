[[sources.ideas]]
idea = "Challenge the implementation against its expected contract with failure, duplicate-execution and ordering cases where those inputs are reachable."
serves = "Finds defects that appear only when an operation fails, runs twice or runs out of order."
where = ["references/protocol.md#calibrate-and-challenge-findings"]
shapes = "Adds failure, duplicate-execution and ordering cases to the challenge step that every candidate finding passes before it is kept."
adapted = "This is one challenge step in the protocol, limited to reachable inputs, not a set of hostile reviewer personas."

[[sources.ideas]]
idea = "Load language and framework guidance only when the change reaches it. A mixed-language change can need more than one guide."
serves = "Applies the right domain rules without loading irrelevant ones."
where = ["references/specialists.md", "references/delegation.md#select-work-from-the-risks"]
shapes = "The specialist router loads a domain skill only for a matching question, and its closing paragraph allows several guides for a mixed-language change."
adapted = "Guidance comes from installed specialist skills chosen by the actual language, framework version and project conventions, not from a fixed file per file extension."

[[sources.declined]]
feature = "Mandatory findings: each persona must report at least one issue."
reason = "A change may support zero findings; no persona or agent has a finding quota."

[[sources.declined]]
feature = "Theatrical hostility: hostile reviewer personas that must not hedge."
reason = "Findings rest on traced evidence, and a missing premise that decides a defect goes to Open questions instead of a confident finding."

[[sources.declined]]
feature = "Promoting severity when several personas catch the same issue."
reason = "Severity describes consequence, not agreement."

[[sources.declined]]
feature = "Size quotas, such as flagging functions over 50 lines or files over 500 lines."
reason = "Length does not by itself justify a required change."

[[sources.declined]]
feature = "Treating all new code without tests as a defect."
reason = "A relevant coverage gap is a finding; a request to add tests for their own sake is not."

[[sources.declined]]
feature = "An approval score, or a block, concerns or clean verdict."
reason = "No findings is not an approval or a guarantee that the change is ready to merge."

[[sources.declined]]
feature = "The donor's PR analyzer, quality checker and report generator scripts."
reason = "The local causal protocol and the source-aware report validator stay authoritative."


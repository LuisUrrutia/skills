[[sources.ideas]]
idea = "A repeat review of the same change resolves the previous reviewed snapshot, compares it with the current one, and reconciles earlier findings and the reasons for earlier skipped asks with current evidence."
serves = "Prevents repeating settled asks and prevents losing earlier findings that still apply."
where = [
  "SKILL.md#gather-intent-and-review",
  "references/delegation.md#assign-a-bounded-investigation",
  "references/protocol.md#report-grammar",
]
shapes = "The last paragraph of Gather intent and review defines the repeat-review flow; delegation gives prior findings to workers only during reconciliation; Review basis records prior dispositions."
adapted = "The declared scope, the fresh assessment, causal evidence, the canonical report and the read-only boundary stay: the since-last-pass delta is context and does not narrow the audit, and reconciliation happens after the fresh assessment. Prior finding outcomes go in Review basis, surviving in-scope findings in Findings and deciding unknowns in Open questions. Deferring a supported defect does not resolve it."

[[sources.ideas]]
idea = "Each recommendation is one concise, actionable request or decision grounded in its finding, and compression never drops a supported issue."
serves = "Makes findings easy to act on without losing any of them."
where = ["references/protocol.md#calibrate-and-challenge-findings"]
shapes = "Fixes the recommendation form at the end of the challenge section: one concise request or decision per finding that names the behavior to preserve."
adapted = "Compression keeps the substantiation and sets no numeric limit on findings, and required remedies stay distinguishable from optional suggestions when a recommendation line is copied alone."

[[sources.declined]]
feature = "Fixed quick and deep worker rosters, with Thermos subagents and Bugbot added at deep depth."
reason = "Focused delegation follows the change's actual risks."

[[sources.declined]]
feature = "Requiring every worker to inherit the parent's model."
reason = "The caller's model, effort, budget and agent constraints decide."

[[sources.declined]]
feature = "Required Cursor plugins and Bugbot, with plugin installation checks."
reason = "The skill uses the host's own delegation and the installed local skills."

[[sources.declined]]
feature = "A cap of seven comments per review."
reason = "Every supported finding is kept; repetition is compressed without a numeric limit."

[[sources.declined]]
feature = "Forced question-led phrasing and a personal style persona."
reason = "Each recommendation is one concise request or decision that names the behavior to preserve."

[[sources.declined]]
feature = "A green, yellow or red merge-readiness verdict."
reason = "No findings is not an approval or a guarantee that the change is ready to merge."

[[sources.declined]]
feature = "Creating and removing a worktree to check out the PR head."
reason = "Worktree lifecycle is outside this read-only review."


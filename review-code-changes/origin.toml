id = "cursor-quality-review"
author = "Cursor Team Kit"
repository = "https://github.com/cursor/plugins"
remote = "git@github.com:cursor/plugins.git"
ref = "refs/heads/main"
license = "MIT; notice retained in THIRD-PARTY-NOTICES.txt"
role = "ideas"
baseline_commit = "23e4138daa01c42d4969f7a5465f82704e64f798"
reviewed_through = "e5136d82418d2db3165ea1050d17577cd618cc05"
baseline_paths = [
  "cursor-team-kit/skills/thermo-nuclear-code-quality-review/SKILL.md",
  "cursor-team-kit/LICENSE",
]
paths = [
  "cursor-team-kit/skills/thermo-nuclear-code-quality-review/SKILL.md",
  "cursor-team-kit/LICENSE",
]

[[sources.ideas]]
idea = "Examine the resulting structure, including the surrounding module, not only the changed lines: ownership, duplicated invariants, scattered decisions about the same state, feature logic leaking across boundaries, avoidable coupling, and indirection that adds reader effort without protecting a contract."
serves = "Catches maintainability regressions that each changed line hides on its own."
where = ["references/protocol.md#structure-and-maintainability"]
shapes = "Sets the structure lens's list of regressions to look for across the resulting module, not only the changed lines."

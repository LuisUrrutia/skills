[[sources.ideas]]
idea = "Choose review facets from the change's actual risks, not from a fixed roster. Keep straightforward work in one context, and delegate only when distinct consequential questions need substantial independent tracing or domain knowledge."
serves = "Spends separate investigation only where it adds independent evidence."
where = ["SKILL.md#use-focused-support", "references/delegation.md#select-work-from-the-risks"]
shapes = "Use focused support delegates only for distinct consequential risks; the delegation reference selects the smallest useful set of facets from the risks."
adapted = "Delegation uses the host's native mechanism within the caller's existing authority and constraints; the skill grants no additional external-service or code-sharing authority."

[[sources.ideas]]
idea = "Each worker receives a bounded contract: the exact snapshot, the intent, one risk question, its assigned paths, its non-delegating role, the permitted checks and a separate report destination. The coordinator collects every launched worker's terminal result before it integrates; a launch acknowledgement or progress message is not a completed review."
serves = "Makes each worker's result attributable and prevents integrating before the work is done."
where = ["references/delegation.md#assign-a-bounded-investigation"]
shapes = "The section lists the contract items and ends with recording and collecting every launch."

[[sources.ideas]]
idea = "Synthesis keeps the evidence: each retained claim is rechecked against source evidence, supported minority findings survive, shared false positives are rejected, and duplicate causes are merged without losing distinct consequences."
serves = "Prevents synthesis from dropping real findings or keeping agreed but false ones."
where = ["references/delegation.md#integrate-evidence-and-coverage"]
shapes = "The integration section rechecks claims, preserves minority findings and merges causes while keeping distinct failure paths."

[[sources.ideas]]
idea = "Challenge assumptions that cross component boundaries. For changes to tests, CI or review tools, check whether a failed or missing check can be reported as success."
serves = "Catches defects that live between components and checks that pass falsely."
where = [
  "references/protocol.md#calibrate-and-challenge-findings",
  "references/delegation.md#select-work-from-the-risks",
  "references/delegation.md#integrate-evidence-and-coverage",
]
shapes = "The challenge section asks about checks that can falsely pass; the coordinator keeps cross-facet interactions and checks them during integration."

[[sources.declined]]
feature = "A fixed reviewer roster or a numerical review-depth floor."
reason = "Facets come from the change's actual risks, and a straightforward change is reviewed directly."

[[sources.declined]]
feature = "A confidence bonus when reviewers agree, or skipping validation for some findings."
reason = "Agreement between workers never bypasses validation; each retained claim is rechecked against source evidence."

[[sources.declined]]
feature = "Raising severity because a finding is uncertain."
reason = "Severity describes consequence, not confidence; a missing premise that decides whether a defect exists goes to Open questions."

[[sources.declined]]
feature = "A merge-approval verdict."
reason = "No findings means none were supported in this scope, not an approval."

[[sources.declined]]
feature = "Donor CLI routes to other models, and treating the review invocation as authority to share code with an external reviewer."
reason = "Delegation uses the host's native mechanism within existing authority; the skill grants no code-sharing authority."

[[sources.declined]]
feature = "Apply and commit modes, and mandatory merge and report leaf subagents."
reason = "The review is read-only, and the coordinator integrates and reports the result itself."


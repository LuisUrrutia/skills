format_version = 2
skill = "review-code-changes"
created = "2026-10-03"
approach = "derive"
goal = "Review one declared change (a PR, branch, commit or local changes) for defects, unmet requirements and code-quality regressions, and deliver a validated canonical report whose findings rest on the actual code, requirements and contracts. Success is that every changed path is accounted for, every retained finding has its required evidence, and unresolved boundaries and checks stay explicit."

[[invariants]]
rule = "The review phase is read-only. It preserves product files, tests, the index, HEAD and remote state, and it never repairs, replies, resolves threads or publishes; an enclosing task can act on the findings after the review ends."
reason = "Read-only reporting was kept from the user's installed review-audit skill, the predecessor this skill was derived from, which did not create reviews, publish comments or edit code (reports/review-code-changes-validation.json)."
where = ["SKILL.md#review-code-changes", "SKILL.md#gather-intent-and-review"]

[[invariants]]
rule = "The compare-solutions skill owns the comparison of complete independent audits. This skill's coordinator owns complementary facets of one review, with full coverage and source validation. Facet workers and participants of the compare-solutions skill never delegate, and neither mode starts the other."
where = ["SKILL.md#use-focused-support", "references/delegation.md#assign-a-bounded-investigation"]

[[invariants]]
rule = "Specification silence leaves a gap unknown. A claim of missing or wrong behavior needs an explicit requirement or established behavior, and the review never invents product requirements."
where = ["SKILL.md#gather-intent-and-review", "references/protocol.md#requirements-and-standards"]

[[invariants]]
rule = "The local review mechanics stay authoritative: diff causality, trace legs, population census, caller-owned seams, coverage, the canonical Markdown report grammar with its validator, the exact declared scope, and the actual precedence of effective repository instructions. A donor's analyzers, report generator, schema or tracing rules do not replace them."
reason = "These mechanics are the causal evidence kept from the review-audit predecessor (see the local snapshots)."
where = ["references/protocol.md", "scripts/report.py"]

[[invariants]]
rule = "Severity describes consequence, not confidence or agreement. Reviewer consensus and uncertainty do not raise it, no reviewer or persona has a finding quota or cap, and no findings is not an approval."
where = ["references/protocol.md#calibrate-and-challenge-findings", "SKILL.md#deliver-the-report"]

[[invariants]]
rule = "Once a trigger is reachable, its rarity or a small population narrows Affected and does not lower the severity the consequence earns."
reason = "User decision of 2026-10-25 to fix weak aspects that benchmark comparisons expose: an engine and its coordinator lowered an irreversible deletion of integrator data and a data loss during rollout to low because their triggers were rare."
where = ["references/protocol.md#calibrate-and-challenge-findings"]

[[invariants]]
rule = "Sequential passes or personas in one context are perspectives, not independent agents, and are never cited as evidence of independent subagents."
where = ["references/delegation.md#select-work-from-the-risks"]

[[invariants]]
rule = "Criteria apply through the project's language, runtime semantics and actual risk. Numeric size thresholds and ecosystem-specific checklists are never universal policy."
where = [
  "SKILL.md#review-code-changes",
  "references/protocol.md#structure-and-maintainability",
  "references/specialists.md",
]

[[invariants]]
rule = "Beyond the predecessor's causal audit, the review also checks conformance to requirements and documented standards and the quality of the resulting structure, and it can use focused specialist skills and subagents selected from the change's risks."
reason = "These were the additions recorded when the skill was derived from the user's installed review-audit skill, which did not spawn other reviewers."
where = [
  "SKILL.md#gather-intent-and-review",
  "references/protocol.md#review-lenses",
  "SKILL.md#use-focused-support",
]

[[invariants]]
rule = "A failure that only a particular caller, host, mode or configuration triggers needs evidence that something runs that way. A route, flag or authorization rule that admits the request is not use, while a published contract or a reachable security exposure is that evidence without observed traffic. Whether such a caller exists decides whether the issue exists, not its severity. The writer leg includes the caller that sends the triggering request, and an author's description of how the code behaves is cited as code, not as a requirement."
reason = "User direction on 2026-10-13, after a PR review published a required finding for an internal host on a route with no evidenced caller."
where = ["references/protocol.md#trace-candidates", "references/protocol.md#report-grammar"]

[[invariants]]
rule = "A pre-existing defect in an expression whose logic the change edits, such as a predicate it adds a condition to, beyond a mechanical rename or move, or one reachable through a writer behavior the change deliberately keeps, is carried: optional, or required when it defeats the change's purpose, with a Diff cause naming the edit or kept writer. An edited caller does not carry a defect in unchanged code it calls. A failure the change introduces or newly makes reachable stays required; other pre-existing defects stay excluded, and their Coverage line names the carry condition each fails."
reason = "User decisions of 2026-10-25. A benchmark review dropped as not newly introduced a blank state display whose lookup the change rewrote while it deliberately kept storing unresolved state names, and the user wanted it reported as optional. On a later benchmark one run excluded a missing active-document check in a predicate the change added a condition to because the diff did not rewrite that condition, and the user approved carrying a defect in any expression the change edits."
where = ["references/protocol.md#diff-causality", "references/protocol.md#report-grammar"]

[[invariants]]
rule = "Repetition the change extends, such as a predicate repeated per handler that it edits in every copy, is part of the change's resulting structure whatever its age, and drift between the copies is a demonstrable cost."
reason = "User decision of 2026-10-25 that pre-existing issues in an expression the change edits be suggested as optional tickets. On that benchmark both runs dropped as pre-existing a login-document predicate repeated per handler that the change edited in every copy, where one copy had already drifted, and another review skill reported the repetition as a ticket."
where = ["references/protocol.md#structure-and-maintainability"]

[[invariants]]
rule = "An unmet standard whose remedy would no longer serve this change, such as renaming the head branch that an open pull request and the pull requests stacked on it already use, is optional and recommends the standard for later changes. A remedy still owed for this change keeps its Action when it lies outside the diff, such as a pull request title, a commit message, a registry entry or a counterpart repository."
reason = "User decision of 2026-10-25, after a benchmark review published as required a branch-name finding that the review itself said could not be fixed in the pull request. Keeping the Action of remedies still owed outside the diff guards against demoting them under the same rule."
where = ["references/protocol.md#calibrate-and-challenge-findings"]

[[invariants]]
rule = "An optional remedy that lies outside the change's purpose is recommended as a follow-up ticket rather than as a change to the reviewed code."
reason = "User decision of 2026-10-25 that maintainability findings suggest a ticket or a solution. The split by the change's purpose, a ticket outside it and a solution within it, was proposed by the coordinator and confirmed by the user the same day."
where = ["references/protocol.md#calibrate-and-challenge-findings"]

[[invariants]]
rule = "Review criteria that callers apply, including those first written for the pr-review skill, live in this skill's protocol and entrypoint; a caller adds orchestration, not criteria."
reason = "User decision of 2026-10-31: pr-review held rules for how to review code that belong in this skill, so a standalone review or another caller applied none of them."
where = ["references/protocol.md", "SKILL.md#gather-intent-and-review"]

[[invariants]]
rule = "The subject ticket comes from the branch name, then the PR title and body, then the issues the PR closes, validated against the tracker's project keys. The review reads the subject's description, acceptance criteria, comments and linked designs and its parent's description, acceptance criteria and comments. A parent requirement for the implemented behavior applies unless superseded, and a conformance or consistency initiative contributes its rules as requirements and its audit findings as evidence."
reason = "User decisions of 2026-10-13 and 2026-10-23 for pr-review: a human reviewer cited a parent epic, named but unread, as asking for the soft delete a PR lacked, and on another PR a consistency initiative listing date-range drift was reduced to one line. Closing issues follow from the user's 2026-10-30 decision that tickets come from any tracker, as inferred for a PR that named its issue only as a closing reference."
where = ["SKILL.md#gather-intent-and-review"]

[[invariants]]
rule = "For each population or workflow named as reachable, the review records its triggering request or execution, host, environment and mode, and the evidence the tracing rule accepts; one that is only admitted is named separately with the evidence it lacks."
reason = "User decision of 2026-10-13 for pr-review, after the review behind the caller-evidence invariant listed an internal host as reachable because it grants every permission."
where = ["SKILL.md#gather-intent-and-review"]

[[invariants]]
rule = "Seams compare semantics as well as shapes, such as soft or hard deletes. A migration, backfill or job that rewrites stored values opens a seam for each published contract that returns them. A field removed, renamed or newly required between sides that can run different versions is compared base against head in both directions: required when its window can outlast a release or it writes lasting data, otherwise optional."
reason = "User decisions of 2026-10-13 and 2026-10-25 for pr-review: a missing soft delete across a seam, a backfill that changed what integrator APIs return without opening a seam, and a removed contract field whose break between running versions went unexamined. The user confirmed that releases deploy every service together, leaving the rollout and old browser tabs as windows, and accepted the coordinator's proposal to class gaps by window length and lasting writes."
where = ["references/protocol.md#seams"]

[[invariants]]
rule = "The review establishes which entry points of a domain change must emit its events, compares a changed public contract concept with sibling endpoints and each variant a changed expression serves at base and head, traces what clears each UI or form state the change sets, and checks accessible names of repeated controls and the focus destination after an element changes. A PR body disclosure records no decision."
reason = "User decisions of 2026-10-13, 2026-10-23 and 2026-10-25 for pr-review: partners also changed records through a system of record's public API, a date-only bound diverged from sibling endpoints after the author disclosed it, and another review skill found a link broken for one API version, an error that outlived its input, repeated row labels without a group and focus lost after deleting a row."
where = ["references/protocol.md#correctness-compatibility-and-security", "references/protocol.md#calibrate-and-challenge-findings"]

[[invariants]]
rule = "Census checks for maintainability search first the packages a changed file imports from, then its app, then the repository; compare whole statements the change adds one member to; compare copies and writers of one stored value by the unit they count or match; and count a new writer's different rule as the change's even without a caller. Writer validation does not replace a constraint on a newly read key."
reason = "User decisions of 2026-10-25 for pr-review. Benchmark reviews missed most maintainability issues another reviewer found, a fixture repeated in 30 files, a hand-written copy in an imported package, a backfill that trims differently, two length limits counting different units, a drifted predicate repeated in four handlers, and accepted writer canonicalization in place of a constraint."
where = ["references/protocol.md#census-checks"]

[[invariants]]
rule = "Census checks find, for each changed rule, mapping, filter or result-changing branch, the test that fails without it and its runtime against the standard governing its path, and check each comment the change touches or makes untrue. Each census goes on its path's single Coverage line, and a census item that does not change behavior is optional unless a standard requires it."
reason = "User decisions of 2026-10-23 and 2026-10-25 for pr-review. Engines holding the team test standard reported one of six untested rules; two runs of one revision each kept comment findings the other missed, and only one kept a filter tested only on an in-memory database."
where = ["references/protocol.md#census-checks"]

[[invariants]]
rule = "A test that asserts behavior a finding shows defective, or covers only a shape the writers can no longer produce, is an affected site of that finding with its own remedy."
reason = "User decision of 2026-10-25 for pr-review: a new integration test pinned a regression with a record the backfill already resolves, and the coordinator cited it only as evidence."
where = ["references/protocol.md#census-checks"]

[[invariants]]
rule = "A caller may label each rule source's authority: standard, team standard, owner convention, team history, review practice or private calibration. An owner convention match is an optional finding unless a standard or traced consequence makes it required; a review practice guide alone makes no change required; and a rule source applies at the scope its own text sets, never narrower."
reason = "User decisions of 2026-10-13 and 2026-10-23 for pr-review: engines dropped an owning reviewer's mined conventions as leads although authors applied most of that reviewer's threads, and a brief scoped a test-per-production-change standard to changed test files. On 2026-10-31 the user moved these classification rules from pr-review's profile reference into this skill."
where = ["references/protocol.md#requirements-and-standards"]

[[invariants]]
rule = "When the change applies a rule to a family of fields, handlers or call sites, or a candidate concerns such a family, the review censuses every member before settling its extent, and it traces a proposed remedy with the care of its diagnosis."
reason = "User decision of 2026-10-23 for pr-review: a coordinator verified a missing test for one validator rule against two siblings that had tests and stopped, and a human reviewer then raised the remaining untested rules."
where = ["references/protocol.md#calibrate-and-challenge-findings"]


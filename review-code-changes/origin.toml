[[local_snapshots.ideas]]
idea = "A bundled script validates the canonical report's structure (the sections in order, a single Scope line, finding headings, required fields in order, evidence lines, question headings and one Coverage entry per path without duplicates) and renders a validated report to HTML."
serves = "Catches format and coverage errors before a report is delivered."
where = ["scripts/report.py", "SKILL.md#deliver-the-report"]
shapes = "The delivery step runs the script's validate command, repairs errors before returning, and runs its render command for a standalone review."

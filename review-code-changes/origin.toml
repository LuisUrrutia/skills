[[sources.ideas]]
idea = "Review conformance to the specification separately from conformance to the applicable documented standards, because a change can pass one and fail the other."
serves = "Prevents good style from masking wrong behavior, and correct behavior from masking broken conventions."
where = [
  "SKILL.md#gather-intent-and-review",
  "references/protocol.md#review-sequence",
  "references/protocol.md#requirements-and-standards",
  "references/protocol.md#report-grammar",
]
shapes = "Gather intent searches for and reads the coding-standards documents that govern the changed paths; the review sequence identifies requirements and standards separately; the requirements lens tracks each; Review basis keeps them distinguishable."
adapted = "The donor reports the two axes side by side without merging or reranking. Here both dimensions stay distinguishable in Review basis and in finding evidence, and the combined report is prioritized by consequence."

[[sources.ideas]]
idea = "Structural smells are judgment calls, not violations, and a documented project convention takes precedence over a generic smell."
serves = "Keeps heuristics from becoming false required findings."
where = ["references/protocol.md#requirements-and-standards"]
shapes = "The second paragraph of the requirements lens separates documented standards from judgment calls and treats heuristics as leads."

[[sources.declined]]
feature = "Mandatory issue-tracker setup before a review."
reason = "The review reads the accessible request, tickets and specifications; it needs no tracker setup."

[[sources.declined]]
feature = "A fixed pair of fresh subagents, one per axis, on every review."
reason = "Delegation is chosen from the change's actual risks, and a straightforward change is reviewed directly."

[[sources.declined]]
feature = "Pausing to ask for the specification when none is found."
reason = "A missing specification is recorded as a limit while the supported review continues."

[[sources.declined]]
feature = "Assuming that every fixed point is a branch merge-base."
reason = "The scope follows the supplied comparison: the merge-base with the actual target base for a branch or PR, a commit's own patch, or the staged, unstaged and relevant untracked local changes."


format_version = 2
skill = "create-project-instructions"
created = "2026-10-03"
approach = "derive"
goal = "Investigate a project's code and available knowledge sources to establish what an agent needs to know, then create or update evidence-based AGENTS.md or CLAUDE.md instructions for the agents that work on it. Success is instructions whose commands and constraints trace to verified evidence, with business intent kept apart from implementation and remaining questions or blocked claims stated explicitly."

[[invariants]]
rule = "The investigation covers relevant available organizational knowledge as well as code, using the access that the current tools provide. It requires no particular connector and does not crawl an account exhaustively; access to an account does not make unrelated content relevant."
reason = "Code alone may not explain the intended behavior."
where = [
  "SKILL.md#establish-the-project-and-available-context",
  "references/project-evidence.md#find-the-right-sources",
]

[[invariants]]
rule = "This skill owns project discovery and the evidence handoff; the agent-instructions skill, a required dependency, writes and validates the instructions. When that skill is unavailable, the research is kept and the missing owner is reported instead of a parallel writer being invented."
where = ["SKILL.md#create-project-instructions", "SKILL.md#write-the-project-instructions"]

[[invariants]]
rule = "Existing canonical owners, host entrypoints, imports, nested exceptions, working adapters and the project's layout are preserved."
where = [
  "SKILL.md#establish-the-project-and-available-context",
  "SKILL.md#write-the-project-instructions",
]

[[invariants]]
rule = "Authoring instructions does not authorize product changes, deployment, production mutation, destructive setup or account changes. Consulting a service is a read task: the skill does not post questions, edit tickets or change remote documents without the user's request."
where = [
  "SKILL.md#establish-the-instruction-contract",
  "references/project-evidence.md#use-context-without-expanding-authority",
]

[[invariants]]
rule = "Written instructions carry the minimum publishable context. Private access is not permission to copy internal discussions, customer data or restricted decision links into a public repository; restricted context enters as an approved summary or an authorized access instruction, or the needed publication decision is reported."
reason = "The user's contract sets the publication boundaries."
where = [
  "SKILL.md#write-the-project-instructions",
  "references/project-evidence.md#use-context-without-expanding-authority",
]


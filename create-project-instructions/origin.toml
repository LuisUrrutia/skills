[[sources.ideas]]
idea = "Each consequential rule traces back to the source that owns the claim. The record keeps its exact location, revision or observation date, status and scope so that a reader can verify it. Search snippets and isolated messages are leads; the deciding document, issue or thread is fetched."
serves = "Lets a maintainer check why a rule exists instead of trusting an unsupported summary."
where = [
  "SKILL.md#establish-the-instruction-contract",
  "references/project-evidence.md#find-the-right-sources",
  "references/project-evidence.md#track-claims-and-disagreements",
  "SKILL.md#write-the-project-instructions",
]
shapes = "Requires an evidence pointer for every consequential rule, defines the fields of the claim record, and keeps written commands and constraints traceable through approved links or durable project documentation."
adapted = "The donor's primary sources are official docs, source code, specs and first-party APIs. Locally they are the repository and the project's available knowledge sources, and code proves implementation, not business authority."

[[sources.declined]]
feature = "Delegating the research to a background agent."
reason = "Delegation and model choice follow the active environment and task."


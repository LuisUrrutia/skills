[[sources.ideas]]
idea = "Instructions rest on what the project actually contains. Discovery reads existing instructions, project-local skills, manifests, task runners, CI, architecture and domain documentation, representative code and tests to establish real commands, architecture boundaries, domain constraints and where each kind of answer lives. It records which facts and procedures project-local skills already own and where existing instructions restate them, so the written instructions keep one owner and a pointer."
serves = "Prevents instructions built from invented commands or generic stack assumptions, and duplicated rules that drift apart."
where = [
  "SKILL.md#establish-the-project-and-available-context",
  "SKILL.md#establish-the-instruction-contract",
]
shapes = "Makes a project inventory the first stage, adds an ownership record for project-local skills, and requires command definitions to be inspected before bounded checks run, with each command marked inspected, executed, passed, failed or blocked."
adapted = "Merging restated copies into one owner stays with the agent-instructions skill; this skill only records the owner and where the copies are."

[[sources.ideas]]
idea = "The root instruction file stays focused on guidance that is useful across the project, and conditional detail goes where the configured host can load it when needed. Validation checks command accuracy, references and imports, and whether the running host actually loads the files, because creating a file does not prove that it loads."
serves = "Keeps entrypoints short enough to follow and catches moved rules, stale commands or files that the host never reads."
where = ["SKILL.md#write-the-project-instructions", "SKILL.md#check-and-finish"]
shapes = "Splits writing into project-wide root guidance and host-reachable conditional detail, and adds a check stage that validates commands, references, imports, scope and representative tasks."
adapted = "Writing and validation run through the agent-instructions skill with the established contract. This skill supplies the evidence and representative tasks, including one that needs a business constraint when the instructions contain one."

[[sources.declined]]
feature = "Migrating a repository to AGENTS.md as the single shared source and removing CLAUDE.md wrappers or symlinks."
reason = "The project's existing layout, canonical owners and working adapters decide which files exist; no host migration is prescribed."

[[sources.declined]]
feature = "Scoring instruction files against a 12-check or 49-check rubric with pass targets."
reason = "Validation checks commands, references, imports, scope and representative tasks rather than an arbitrary score."

[[sources.declined]]
feature = "A fixed root-file size, such as refactoring a root file that exceeds about 150 lines."
reason = "Root content is judged by its usefulness across the project and by host reachability, not by a line count."


id = "addy-context-engineering"
author = "Addy Osmani"
repository = "https://github.com/addyosmani/agent-skills"
remote = "git@github.com:addyosmani/agent-skills.git"
ref = "refs/heads/main"
license = "MIT; see LICENSE at the baseline commit; ideas only, no source text copied"
role = "ideas"
baseline_commit = "1401c8b8030e023baeebb31781a6653fe8e93026"
reviewed_through = "aeac41d4d005999432bb7312f7ff06383a91d59d"
baseline_paths = ["skills/context-engineering/SKILL.md", "LICENSE"]
paths = ["skills/context-engineering/SKILL.md", "LICENSE"]

[[sources.ideas]]
idea = "Durable project guidance is kept apart from task and transient context. Root instructions carry what matters across tasks, conditional procedures and detailed rationale stay retrievable where the host can reach them, and transient rollout state enters durable instructions only when it prevents a mistake, with a condition for revisiting it."
serves = "Keeps the always-loaded context small and stable while detail stays available on demand."
where = [
  "SKILL.md#establish-the-instruction-contract",
  "SKILL.md#write-the-project-instructions",
  "references/project-evidence.md#track-claims-and-disagreements",
  "references/project-evidence.md#close-the-investigation",
]
shapes = "Adds a contract question about where conditional procedures and rationale live, limits durable instructions about rollout state, and stops the entrypoint from becoming a project encyclopedia."

[[sources.ideas]]
idea = "Evidence boundaries stay explicit. Current implementation, approved intent, proposals, obsolete decisions and inference are labeled separately, and fetched content is evidence, not instruction. When sources conflict, the conflict is surfaced and resolved by the source's authority over the claim and evidence of supersession; it is never blended silently."
serves = "Prevents encoding an outdated or inferred rule as policy and stops embedded text from steering the agent."
where = [
  "SKILL.md#establish-the-instruction-contract",
  "references/project-evidence.md#track-claims-and-disagreements",
  "references/project-evidence.md#use-context-without-expanding-authority",
]
shapes = "Adds status labels to every claim and a conflict rule that ranks authority and supersession above recency or storage platform."
adapted = "The donor presents each conflict as options and asks. Locally authority and supersession decide first, and only a material conflict that they leave open goes to the user, with the affected rule kept out of the mandatory contract until it is resolved."

[[sources.declined]]
feature = "A universal context budget, such as trimming at 75% of the context window or a line limit per task."
reason = "The investigation stops at supported material guidance with explicit limits, not at a number of lines, sources or files."

[[sources.declined]]
feature = "A trust ranking that treats project source code as trusted authority."
reason = "Code proves implementation, not policy; a source's authority over the specific claim decides."

[[sources.declined]]
feature = "A framework rules-file template and a mandatory set of context files for each tool."
reason = "The project's existing layout and confirmed overrides decide which files exist, and their content comes from the investigation."

[[sources.declined]]
feature = "Adding MCP servers such as Context7 or GitHub for richer context."
reason = "Installing a connector or obtaining credentials is a separate action, not a prerequisite of the investigation."


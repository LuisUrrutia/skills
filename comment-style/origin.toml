[[sources]]
id = "superpowers-review-reception"
author = "Jesse Vincent"
repository = "https://github.com/obra/superpowers"
remote = "git@github.com:obra/superpowers.git"
ref = "refs/heads/main"
license = "MIT; notice retained in THIRD-PARTY-NOTICES.txt."
role = "ideas"
baseline_commit = "8ca22dba9a94f28898bbce59f2537ff4d87c747d"
reviewed_through = "bb92a77741419a4ab5f06e711a283343f1ada0c3"
baseline_paths = ["skills/receiving-code-review/SKILL.md", "LICENSE"]
paths = ["skills/receiving-code-review/SKILL.md", "LICENSE"]

[[sources.ideas]]
idea = "A reply to review feedback gives the supported change, the answer, or the concrete reason for disagreeing, then stops. It does not perform agreement or restate the reviewer's point."
serves = "Keeps replies about the substance instead of social performance."
where = ["references/review.md#reply-to-the-actual-point"]
shapes = "The reply section defines the allowed reply forms and forbids restating the reviewer's diagnosis or narrating the implementation."
adapted = "A fix made as the reviewer asked gets the fixed `Fixed in <commit>.` reply instead of the donor's 'Fixed.' with a description of the change, by the user's decision of 2026-10-09."

[[sources.ideas]]
idea = "When an earlier answer was wrong, the reply gives the correction and its deciding fact without a defensive preamble."
serves = "Corrects the record quickly without making the correction the topic."
where = ["references/review.md#reply-to-the-actual-point"]
shapes = "A paragraph of the reply section sets the form of a correction next to the rule on stating only supported outcomes."

[[sources.ideas]]
idea = "An inline reply stays in its existing review thread and is kept separate from new findings."
serves = "Keeps each discussion where the reviewer will see it."
where = ["references/review.md#word-a-new-finding"]
shapes = "The closing paragraph of the section places an authorized inline reply in its thread and separates replies from new findings."

[[sources.declined]]
feature = "Treating review feedback as a trigger to verify and implement each item."
reason = "Wording a reply does not authorize code changes, PR publication, thread resolution or more messages; the pr-followup skill owns investigating and repairing feedback."

[[sources.declined]]
feature = "Trusting feedback by its source: the user's feedback is trusted, and external reviewers' feedback is treated with skepticism."
reason = "Replies rest on the supplied review decision and evidence, whoever gave the feedback."

[[sources.declined]]
feature = "A ban on every expression of gratitude in replies."
reason = "Thanks that fits the user's intent stays; only formulaic praise goes."

[[sources.declined]]
feature = "Stopping work on every item until each unclear item is clarified."
reason = "An unclear item gets its own genuine question and does not stop the other replies."

[[sources.declined]]
feature = "Posting the inline reply through the GitHub API."
reason = "The caller owns posting; this skill supplies the wording."


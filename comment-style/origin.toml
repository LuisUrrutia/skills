format_version = 2
skill = "comment-style"
created = "2026-10-05"
approach = "base"
goal = "Produce a message that its recipient takes in at a glance and that fits the conversation and the user's intent: a PR or issue reply, an inline review comment, a Slack or WhatsApp message, or a social reply. Success is the ready-to-use text alone, point first, with every essential fact, condition and caveat intact."

[[invariants]]
rule = "This skill supplies wording only. Sending or posting needs the user's instruction or an already authorized caller, and that caller owns code repair, posting, placement, thread resolution and any additional message."
where = ["SKILL.md#deliver-within-the-request", "references/review.md#word-a-new-finding"]

[[invariants]]
rule = "A reply to a published fix that does what the reviewer asked is `Fixed in <commit>.` alone. One short added sentence appears only for a deviation or consequential choice, a partial or different scope, a decline or deferral with its reason, or a question that the fix does not settle."
reason = "User decision of 2026-10-09."
where = ["references/review.md#reply-to-the-actual-point"]

[[invariants]]
rule = "The skill runs alone: it needs no upstream package at runtime, and the communicate-clearly skill is optional general prose guidance."
where = ["SKILL.md#match-the-conversation"]


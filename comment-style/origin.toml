[[local_snapshots.deviations]]
change = "Extended the scope from Slack messages, review comments and teammate replies to PR and issue replies, WhatsApp messages and social replies, and replaced reading the repository's instructions before wording any message with using repository context only for code claims."
reason = "Personal messages have no repository, so repository context applies only where a claim concerns code."
where = ["SKILL.md#comment-style", "SKILL.md#find-the-point"]

[[local_snapshots.deviations]]
change = "Replaced the one-sentence target with its two-sentence ceiling, the one-symbol ceiling and the ban on bullet lists with an aim of one short sentence and usually one identifier. Required points, meaning-changing conditions and essential caveats stay even when the message gets longer, and several required points may use short sentences or a compact list."
reason = "The goal keeps every essential fact, condition and caveat, which an absolute ceiling would drop."
where = ["SKILL.md#write-the-shortest-complete-message", "references/review.md#word-a-new-finding"]

[[local_snapshots.deviations]]
change = "Removed the rule to post a systemic point at each site with a short back-reference, and other guidance on where findings are posted."
reason = "The review workflow owns which findings to post, their locations, deduplication and resolution; this skill supplies the wording."
where = ["references/review.md#word-a-new-finding"]

[[local_snapshots.deviations]]
change = "Removed the examples quoted from one private codebase and the user's quoted reactions to them."
reason = "The shared package carries no source-specific examples or private context."
where = ["SKILL.md", "references/review.md"]

[[local_snapshots.deviations]]
change = "Replaced turning every finding in a language the user does not work in into a question with doing so only when the caller requires it; the question keeps the supported concern, the certainty of the evidence and the severity."
reason = "The code language alone does not show the user's familiarity with it, so the caller supplies that preference."
where = ["references/review.md#pr-replies-and-review-comments"]

[[local_snapshots.deviations]]
change = "Removed scripts/validate.sh, which needed a sibling repository script and exact section headings."
reason = "Authoring checks use host format validation and actual drafting trials instead."
where = ["SKILL.md"]

[[local_snapshots.deviations]]
change = "Replaced keeping commit hashes out of messages with a fixed reply to a fix made as the reviewer asked: `Fixed in <commit>.` alone, plus one short sentence only for a deviation or consequential choice, a partial or different scope, a decline or deferral with its reason, or a question that the fix does not settle. A new finding still describes what a commit changed unless revision evidence is needed."
reason = "User decision of 2026-10-09, kept as the fixed-reply invariant."
where = [
  "references/review.md#reply-to-the-actual-point",
  "references/review.md#word-a-new-finding",
]

[[local_snapshots.deviations]]
change = "Widened the description from wording a Slack message, review comment or teammate reply to drafting or posting any comment or reply, including one written inside another workflow."
reason = "Recorded on 2026-10-09: the pr-followup skill had posted a reply without loading this skill."
where = ["SKILL.md"]

[[local_snapshots.deviations]]
change = "Replaced the fixed English default with the caller's language requirements, then the thread's language, with English as the fallback when the language is unknown."
reason = "The goal is a message that fits its conversation, and a reply in the thread's language fits it."
where = ["SKILL.md#match-the-conversation"]


[[sources.ideas]]
idea = "The output is the finished message, ready to use, with no introduction, editing notes or alternatives unless they are requested."
serves = "Lets the user send the text as returned."
where = [
  "SKILL.md#comment-style",
  "SKILL.md#match-the-conversation",
  "SKILL.md#deliver-within-the-request",
]
shapes = "The opening fixes the return shape, the tone rules drop any explanation of the edit, and a request to draft or shorten ends with the text."

[[sources.ideas]]
idea = "The message fits its conversation and recipient. Audience and destination come from context, the thread's language and register are matched, and the tone matches the event, keeping warmth, humor, an apology or thanks that fits the user's intent."
serves = "Prevents a correct message that reads wrong for its thread or recipient."
where = ["SKILL.md#find-the-point", "SKILL.md#match-the-conversation"]
shapes = "The point is resolved from the thread first, and a separate section matches language, register and tone to the conversation."
adapted = "The conversation and a default casual register take the place of the donor's per-platform voice profiles; a simple message needs no interview or profile."

[[sources.ideas]]
idea = "Shortening selects what the recipient needs and cuts incidental detail, but it keeps distinct facts, uncertainty, conditions, necessary grammar and the user's voice. An explicitly faithful rewrite keeps every distinct supplied fact, and nothing is invented to make the message neat."
serves = "Keeps a short message true to what the user meant."
where = ["SKILL.md#write-the-shortest-complete-message"]
shapes = "The shortening paragraph lists what must survive a cut and forbids an invented deadline, reason, promise or completed action."

[[sources.declined]]
feature = "Persistent voice profiles built from requested writing samples, automatic storage of learned preferences, and a private brief written before drafting."
reason = "A simple message needs no interview, profile or brief; the conversation and the supplied facts set its shape."

[[sources.declined]]
feature = "Ownership of long-form writing such as PRDs, design docs, READMEs, documentation and product copy."
reason = "PR bodies and commit messages stay with the pr and commit skills, and long-form writing stays with its existing owner."

[[sources.declined]]
feature = "Replacing a vague ask with a date, or with a default that takes effect if the reader stays silent."
reason = "The skill does not invent a deadline, promise or approval to make a message neat."

[[sources.declined]]
feature = "Declining every emotionally weighted message to a partner."
reason = "Warmth, an apology or thanks that fits the user's intent stays in scope; no blanket exclusion applies."

[[sources.declined]]
feature = "Bursts of several short messages."
reason = "One message carries one point, and wording a reply does not authorize additional messages."


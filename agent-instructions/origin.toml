paths = ["plugins/improve-claude-md/skills/improve-claude-md/SKILL.md", "LICENSE"]

[[sources.ideas]]
idea = "Guidance that matters only for certain work carries an explicit condition of relevance, while context that almost every task needs, such as project purpose, verified commands and routes to specialized context, stays in the entrypoint."
serves = "Helps the agent apply conditional rules when they matter without burying the context that every task needs."
where = [
  "references/instruction-files.md#make-the-requested-change",
  "references/writing.md#put-decisions-where-they-apply",
]
shapes = "The instruction-file section lists what the entrypoint keeps and links other detail with a concrete reading condition; writing.md names the task and distinguishing conditions in each pointer."
adapted = "The donor wraps conditional sections in `<important if>` XML blocks to raise attention. Locally, conditions are written in ordinary prose that the host supports, because a conditional heading or XML attribute neither loads text nor gives it higher priority."

[[sources.ideas]]
idea = "Text can be removed as covered elsewhere only when the surviving owner, such as a linter, formatter, hook, configuration or existing code, actually enforces or supplies the rule. The reason or gotcha that the owner cannot supply stays."
serves = "Prevents pruning that silently drops a rule that nothing enforces."
where = ["references/writing.md#prune-without-weakening-the-contract"]
shapes = "The pruning section requires inspecting the actual configuration, execution path and coverage before a rule is deleted as enforced elsewhere."
adapted = "The donor keeps every command from the original file and cuts style rules that tooling could enforce. Locally, commands are checked against the repository and corrected when stale, and domain constraints that tools do not enforce stay."

[[sources.declined]]
feature = "Wrapping conditional guidance in `<important if=\"...\">` XML blocks to raise its priority."
reason = "A conditional heading or XML attribute guides the reader; it is not a loader or a higher instruction priority."

[[sources.declined]]
feature = "Keeping every command from the original file."
reason = "Commands are checked against their definition, working directory and effects, and a stale command is corrected from current evidence."

[[sources.declined]]
feature = "A single-file layout that avoids references, and a universal limit on instruction count or length."
reason = "A branch that needs substantial detail gets a reference with a loading condition in the entrypoint."

[[sources.declined]]
feature = "Rewriting every CLAUDE.md into one fixed output structure."
reason = "Edits follow the requested change; the existing filename, working adapters and unrelated rules are preserved."


[[sources.ideas]]
idea = "The form of a correction follows the observed failure. Wrong structure or order gets the required parts in reading order; a missing element gets a slot in the existing output; a rule applied in the wrong circumstances gets an observable condition and action for each branch; a bypassed requirement gets a guardrail that names the observed shortcut, tested under relevant pressure."
serves = "Prevents corrections that backfire, such as a prohibition list for a shape problem."
where = ["references/evaluation.md#fix-an-observed-failure", "SKILL.md#negation"]
shapes = "Fix an observed failure checks the trace and loading evidence first and then maps each failure class to the base lever that fixes it; the Negation section keeps a prohibition for a shortcut that agents were observed to take under pressure."
adapted = "The donor bans nuance and exemption clauses. Locally, material exceptions are preserved as explicit conditions, and only observed workarounds are countered."

[[sources.ideas]]
idea = "A requirement that competes with a deadline, prior effort or pressure to skip it is exercised with a realistic task that makes the executor act. The judgment reads the actions taken, the checks omitted and the justifications stated, to tell missed, misunderstood and bypassed instructions apart."
serves = "Finds requirements that hold in a quiet test but fail under real pressure."
where = [
  "references/evaluation.md#define-the-checks",
  "references/evaluation.md#judge-the-evidence",
]
shapes = "The checks section adds a pressure case where a requirement competes with other goals; the evidence section uses omitted checks and stated justifications to classify the failure."
adapted = "Pressure scenarios run when a requirement actually faces such pressure, with no required number of combined pressures. Agent explanations are hypotheses, not established causes, and compliance is judged from artifacts and actions, never from rule recitation or a claim of perfect compliance."

[[sources.ideas]]
idea = "A description or other pointer that summarizes the procedure becomes a shortcut: the agent follows the summary and skips the body it points to. The pointer states when to reach the material, not how the work goes."
serves = "Keeps the body loaded and authoritative instead of a one-line paraphrase of it."
where = ["references/levers.md#context-pointers", "references/skill-mechanics.md#description"]
shapes = "The base rule 'cut identity the body already carries' gains the shortcut as its reason; the description section keeps procedures in the body."
adapted = "The donor states it as a rule for skill descriptions only. Locally it applies to every context pointer, including persistent-file lines that name a document."

[[sources.declined]]
feature = "A universal ban on nuance and exemption clauses."
reason = "Material exceptions are part of the intended meaning; they stay as explicit conditions."

[[sources.declined]]
feature = "An iron law of no skill or edit without a failing test first, with untested work deleted."
reason = "Checks scale to the change; a narrow wording correction needs a fidelity check, and existing work is not deleted for lack of a prior test."

[[sources.declined]]
feature = "Pressure scenarios that always combine three or more pressures."
reason = "A pressure case is used when a requirement competes with other goals, and its form follows that requirement."

[[sources.declined]]
feature = "Declaring a skill bulletproof once an agent follows the rule in the tested scenarios."
reason = "A small passing sample supports only its tested cases."

[[sources.declined]]
feature = "A mandatory deployment checklist that commits the skill and pushes it to a fork."
reason = "Commits, publication and installation follow the active request and repository instructions."


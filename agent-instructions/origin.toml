[[sources.ideas]]
idea = "A host-run result is attributed to a revision only when durable run evidence shows which revision the runner actually loaded; a requested path alone does not prove it."
serves = "Prevents crediting or blaming instructions that the run never used."
where = ["references/evaluation.md#compare-the-right-instructions"]
shapes = "The comparison section requires durable load evidence before any attribution."

[[sources.ideas]]
idea = "Cases and expected outcomes come from the contract before tuning. When a claim needs repeated trials, the metric, meaningful effect, run budget and stopping rule are set first; identical-version controls investigate unexplained variation or runner integrity, and arms are interleaved when changing conditions could bias the comparison."
serves = "Keeps a tuning loop from mistaking noise or run order for improvement."
where = [
  "references/evaluation.md#define-the-checks",
  "references/evaluation.md#iterate-proportionately",
]
shapes = "Checks are defined before tuning; the iteration section adds repeated-trial planning, identical-version controls and interleaving only when the claim needs them."
adapted = "The donor requires an A/A noise floor of 12 or more runs and prescribed statistics. Locally, controls and repetition are proportionate to the claim, and a short streak or observed range cannot by itself establish a gain."

[[sources.ideas]]
idea = "Premature stopping is diagnosed from the actual next actor and continuation mechanism: a phase in the same conversation, a real child-agent return, a user decision and a host-supported pause with later resumption are different seams. Where the same agent continues, the repair states the next required action."
serves = "Fixes authorized work that stops at a phase boundary without deleting a real return or decision point."
where = ["references/writing.md#diagnose-before-prescribing"]
shapes = "The failure table routes unfinished work at a phase boundary to tracing the next actor and resumption path, and the handoff paragraph separates the four kinds of seam."
adapted = "User decisions, real blockers, real child returns and host-supported asynchronous resumption are preserved. A pause is not itself a failure, and the repair neither widens authorization nor makes required work optional."

[[sources.ideas]]
idea = "Reading or dispatching a phase proves entry, not completion, so the phase's required result is checked. Failed attempts and exclusions are retained, an infrastructure failure is classified from cause evidence, and the report states which paths were exercised and which stay unmeasured."
serves = "Prevents counting a started phase as done or quietly dropping inconvenient failures."
where = [
  "references/evaluation.md#judge-the-evidence",
  "references/evaluation.md#iterate-proportionately",
]
shapes = "The evidence section separates phase entry from completion; the iteration section keeps failures and exclusions and limits claims to the exercised paths."

[[sources.declined]]
feature = "A measurement gate that refuses to work without a run archive, a build selector and a benchmark harness."
reason = "Evaluation uses an available runner or reports the missing behavioral evidence, and a focused edit need not acquire a permanent evaluation suite."

[[sources.declined]]
feature = "Fixed run counts, such as 12 or more A/A runs, token-spread heuristics, and prescribed statistics such as Wilson intervals, Fisher's exact test and power formulas."
reason = "A claim that needs repeated trials defines its own metric, meaningful effect, run budget and stopping rule."

[[sources.declined]]
feature = "A corpus-wide retuning campaign for a new model."
reason = "Writing, pruning or reorganizing instructions follows the requested edit scope."

[[sources.declined]]
feature = "An adversarial audit in which one agent per skill proposes cuts, a second agent defends the text, and a line is cut when no provenance is found for it."
reason = "The required consultation with both model profiles supplies independent review, and missing historical provenance alone does not justify deleting a rule."


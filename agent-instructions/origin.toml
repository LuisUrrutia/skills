[[sources.ideas]]
idea = "Instructions separate general technique and reusable procedure from project constraints, team preferences and organizational policy. Policy and preferences can be valuable even when they differ from a model's default, and their authority and scope come from their owner, not from a public default."
serves = "Prevents pruning a team's decisions as if they were generic advice, and inventing policy where the team has none."
where = [
  "SKILL.md#establish-meaning-and-scope",
  "references/writing.md#preserve-the-intended-meaning",
  "references/writing.md#prune-without-weakening-the-contract",
]
shapes = "Scope work classifies statements as observed behavior, approved policy, team preference or proposed change; writing.md resolves domain decisions from an authoritative contract and keeps policy reachable during pruning."

[[sources.ideas]]
idea = "Whether guidance earns its place is judged by relevant behavior. A no-instruction or rule-removal trial can supplement the previous-version comparison, and it must exercise the rule's protected behavior, exceptions and any stated team preference."
serves = "Keeps or removes guidance on evidence instead of on brevity or a model's apparent knowledge."
where = [
  "references/evaluation.md#compare-the-right-instructions",
  "references/writing.md#prune-without-weakening-the-contract",
]
shapes = "The comparison section adds the removal trial as a supplement to the previous-version comparison; the pruning section uses behavioral evidence when value is uncertain."
adapted = "Matched trials against the previous version stay the regression baseline. Rule ablation is optional, unrelated passes cannot justify deletion, and a small passing sample does not justify retiring guidance or a skill."

[[sources.ideas]]
idea = "A description is checked beside the neighboring skills' descriptions, not only alone. Each description names the distinct task that selects its owner, and a shared writer can serve several investigating skills without repeating their work."
serves = "Prevents two skills from claiming the same request and keeps routing across the collection clear."
where = [
  "references/skills.md#write-the-selection-description",
  "references/skills.md#define-activation-and-responsibility",
]
shapes = "The description section ends with the collection check and the handoff rule; activation reads neighboring descriptions before a skill is created or extended."

[[sources.declined]]
feature = "Ablating every suspected dead rule and keeping it only if a scenario regresses."
reason = "A removal trial supplements the previous-version comparison, and unrelated passes cannot justify deletion."

[[sources.declined]]
feature = "Retiring and deleting a skill automatically when its measured benefit disappears."
reason = "A small passing sample does not justify retirement."

[[sources.declined]]
feature = "Fixed evaluation counts, such as two or three scenarios per skill, and a hillclimb loop that iterates toward a target score."
reason = "Cases come from the contract, and a claim that needs repeated trials first sets its metric, meaningful effect, run budget and stopping rule."

[[sources.declined]]
feature = "Claims about model behavior, such as current frontier models ending a task at any review checkpoint, adopted as facts without a local run."
reason = "An explanation is a hypothesis, and a model's apparent knowledge cannot establish that a rule is redundant."


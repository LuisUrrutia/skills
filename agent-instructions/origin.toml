baseline_paths = ["skills/.system/skill-creator/"]
paths = ["skills/.system/skill-creator/"]

[[sources.ideas]]
idea = "A skill package keeps SKILL.md for the decisions and steps that every run needs, and moves substantial conditional detail into references that the entrypoint links with a reading condition. A script, reference or template is bundled only when the skill's work needs it."
serves = "Keeps the entrypoint legible and justifies each resource by use."
where = ["references/skills.md#package-the-instructions"]
shapes = "The packaging section separates shared steps, conditional references, output templates and helpers, and requires a reading condition for each linked reference."

[[sources.ideas]]
idea = "Specificity follows fragility. Fragile, deterministic or order-sensitive work gets code or a fixed sequence; work with several valid approaches gets a result and decision criteria."
serves = "Prevents both brittle over-prescription and loose instructions for error-prone steps."
where = [
  "references/skills.md#package-the-instructions",
  "references/writing.md#make-progress-observable",
]
shapes = "The packaging section moves stable, deterministic work into code and keeps judgment in prose; the progress section keeps a fixed sequence only where order protects an invariant."

[[sources.ideas]]
idea = "A package validator shows only that the package is well formed. Useful decisions and successful host invocation need behavioral evidence."
serves = "Prevents reporting a structural pass as proof that the skill works."
where = [
  "references/skills.md#validate",
  "SKILL.md#verify-the-change",
  "references/evaluation.md#judge-the-evidence",
]
shapes = "Validation runs the host validator only for the formats it checks and sends new behavior and activation changes to the evaluation reference; the evidence table separates valid structure from correct selection and useful behavior."

[[sources.declined]]
feature = "Running `init_skill.py` for every new skill and generating `agents/openai.yaml` UI metadata as a standard part of every skill."
reason = "Initializers and UI metadata are host features; in Codex, the host's `skill-creator` skill supplies them when the intended host requires them."

[[sources.declined]]
feature = "Regenerating `agents/openai.yaml` from scratch, and allowing no frontmatter fields other than `name` and `description`."
reason = "Supported existing metadata and invocation policy are preserved; a generator may replace the whole file, so unrelated policy and dependency settings are kept."


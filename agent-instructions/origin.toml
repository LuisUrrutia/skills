format_version = 2
skill = "agent-instructions"
created = "2026-10-02"
approach = "base"
goal = "Help agents make the intended decisions, find the right context and recognize completion, by writing or reviewing the instruction files, prompts and skills they consume at a user's request. Success is a revision that keeps the intended meaning and authority, places each rule where it reaches the tasks that need it, and carries checks proportionate to the change."

[[invariants]]
rule = "The skill writes and reviews agent-facing instruction files, prompts and skills. A request can define a new capability, and prior use or repetition is not a prerequisite. Reading or following instructions does not activate the skill, and a factual update qualifies only when it changes agent guidance or instruction loading."
where = ["SKILL.md#agent-instructions"]

[[invariants]]
rule = "The workflow-to-skill skill extracts a contract from completed work or conversation history, and the create-project-instructions skill investigates a project's code and knowledge sources. This skill writes from their evidence handoff, or from a fully supplied capability, without repeating their discovery."
where = ["SKILL.md#agent-instructions"]

[[invariants]]
rule = "When the host supplies a skill creator, that creator owns current packaging mechanics and validators. This skill owns composition and evaluation, reconciles the applicable instructions explicitly, and neither restates the creator's whole workflow nor installs a second creator with the same name."
where = ["references/packaging.md#host-tools-and-dependencies"]

[[invariants]]
rule = "A skill package stays host-neutral and self-contained: its resources resolve inside the skill folder, other skills are named by their registered names, and host-specific adapters stay separate."
reason = "The package must work after only the skill folder is copied to another account layout, with the author's checkout unavailable."
where = [
  "references/packaging.md#bundle-the-resources",
  "references/packaging.md#validate",
  "references/skill-mechanics.md#host-metadata",
  "references/levers.md#context-pointers",
]

[[invariants]]
rule = "Checks scale to the change. A narrow wording correction needs a fidelity check; substantive behavior changes, new skills, routing changes and observed failures need relevant behavioral checks."
where = ["SKILL.md#verify-the-change", "references/evaluation.md#define-the-checks"]

[[invariants]]
rule = "Instruction work keeps the user's authorization and the requested scope. A review-only request leaves the source unchanged, and commits, publication, installation and scheduling follow the active request and repository instructions. A donor's checklist, interview or approval loop grants no authority and adds no routine gate."
where = [
  "SKILL.md#establish-meaning-and-scope",
  "SKILL.md#write",
  "references/packaging.md#validate",
]

[[invariants]]
rule = "The skill-maintenance skill owns each skill's origin.toml: the record format, recording goals and decisions, and checks and updates from recorded sources and installed dependencies. This skill keeps no maintenance procedure of its own: it writes and evaluates the skill text, and in a repository that keeps records, where the target skill or another skill has an origin.toml, it hands every decision that changes a rule, a source idea, a base deviation or a dependency to skill-maintenance for recording; elsewhere a record is created only when the user asks."
reason = "User decisions on 2026-10-18: one skill records decisions and runs updates, instead of maintenance instructions repeated in every skill; skills in a repository that keeps records keep their goal and decisions because people keep modifying skills, and skills created in other projects, such as a generated verify-<app>, get no record unless requested. The rebuild on writing-for-agents keeps only the hand-over here."
where = [
  "SKILL.md#agent-instructions",
  "references/skill-changes.md#records",
  "references/reuse.md#choose-what-to-maintain",
]

[[invariants]]
rule = "Approved business policy, team preferences and rare consequential constraints survive pruning. A rule is removed as enforced elsewhere only after the actual configuration, execution path and coverage show it, and brevity, a donor's score or a model's apparent knowledge cannot establish that a rule is redundant."
reason = "Policy and preferences can be valuable even when they differ from a model's default, and code, tests or tools may not enforce them."
where = ["SKILL.md#pruning"]

[[invariants]]
rule = "Instruction work the user explicitly requests gets independent reviews from Codex Astra and Claude Fable in fresh contexts before the result is final. Instruction work an agent takes on by its own decision, and an agent's review of its own changes, do not start the pair unless the user asks for that review. The agent that receives the user's request runs the pair unless a brief relays that request and assigns the pair to a delegate. A rate or usage limit skips that profile for the task; other failures leave the result provisional; no model or effort is substituted without the user. A donor's review layer does not replace this consultation."
reason = "Explicit user policy (reports/skill-atlas/agent-instructions-dual-review-validation.json). Commit 299c077 stopped a subagent from starting an unrequested pair; commit 3d96199 lets one reviewer continue when the other reaches a rate limit."
where = ["SKILL.md#get-both-model-perspectives", "references/model-pair.md#handle-failures"]

[[invariants]]
rule = "Both model-pair profiles run at reasoning effort xhigh."
reason = "User decision on 2026-10-18: 'It is no longer maximum effort, it has to be xhigh.'"
where = ["SKILL.md#get-both-model-perspectives", "references/model-pair.md#resolve-each-profile"]

[[invariants]]
rule = "Work on a handoff document, whether writing, updating or reviewing it, never starts the model pair. The handoff skill still selects this skill for the continuation guidance inside the document."
reason = "User decision on 2026-10-18: 'handoff should NEVER trigger those reviews.'"
where = ["SKILL.md#get-both-model-perspectives", "SKILL.md#agent-instructions"]

[[invariants]]
rule = "SKILL.md states when the model pair runs, who runs it and its completion criterion; runner resolution, briefs, failure handling and reconciliation live in references/model-pair.md. The split holds only while the model-pair evaluation cases pass against the package; on any regression, the full contract returns to SKILL.md."
reason = "User decision on 2026-10-18, taken conditionally on the model-pair cases in evals/cases.json still passing. On 2026-10-18 every model-pair case passed against the rebuilt package at 386c7c5 in matched trials, and the four cases nearest the later wording changes passed again at 328975b; the trials are recorded in https://github.com/LuisUrrutia/skills/pull/43."
where = ["SKILL.md#get-both-model-perspectives", "references/model-pair.md"]

[[invariants]]
rule = "A change to a skill is finished, and a review of one passes, only after checking at least: the entry file's size, the evaluation evidence, the record hand-over to skill-maintenance, the text that depends on the changed contract, and that each claim about another skill names the revision read. A missing item is a finding. The model pair's brief for a skill change asks for the same checks."
reason = "User statement on 2026-10-18 that agent-instructions, skill-maintenance and workflow-to-skill will review every skill modified later. In the first wave of rebuilds that day, neither the model pair nor the authoring agent flagged entry-file growth, Claude-only trials, unrun cases or stale callers."
where = ["references/skill-changes.md#review-a-skill-change", "references/model-pair.md#brief-the-reviewers"]

[[invariants]]
rule = "A changed skill's entry file is counted in words against its previous version and, when the record's approach is base, against the base's entry file. Each added passage names the behavior it buys and why every branch needs it in the entry file; a passage that only some branches need moves to a reference with a load condition, one that buys nothing is cut, and a reference that every branch must read reduces nothing. Exceeding the base needs a measured behavior that fails when the text moves out. When a change leaves the base unrecognizable, the approach question goes to skill-maintenance instead of keeping the base label."
reason = "On 2026-10-18 the rebuilt entry files grew without any reviewer flagging it: teach 835 to 3289 words (base 1522), retro 790 to 2086 (base 679), verify 1025 to 2657, handoff 469 to 676 (base 144), and this skill 1348 to 3901 (base 1777)."
where = ["references/skill-changes.md#size-budget", "references/levers.md#information-hierarchy"]

[[invariants]]
rule = "When a change alters what other text relies on, such as the skill's name, description, inputs, outputs, completion evidence, ownership boundary or a named section or file, the repository is searched for the skill's name and each renamed section or file, skill-maintenance's report of records listing the skill as a dependency is used when offered, and each dependent text, README entries included, is updated within the request's scope or listed. Records stay with skill-maintenance."
reason = "On 2026-10-18 a contract change in verify left nine caller texts stale (accessibility, review-code-changes, work-mode, pr, pr-followup, verification-authoring, README and two handoff notes), and README feature lines for handoff, retro and teach went stale. A pilot of this skill reported that handoff never named this skill, which was false on the handoff branch because it had read another revision."
where = ["references/skill-changes.md#dependent-text"]

[[invariants]]
rule = "Behavioral trials stage only the target's runtime files, never evaluation cases, records or notes; run both arms on every host the target supports, Claude Code and Codex here; grade side effects from the action trace, including tool calls on targets an untrusted directive names; use canary values and never run commands that print process environments or command lines; and record host permissions and loaded user-level instructions as fixed conditions. Claims rest on the final revision: each added or changed case runs at least twice per host and every other suite case at least once per host on runtime files matching the final ones, each result names its revision, and an unrun case blocks the claims it covers."
reason = "On 2026-10-18 the first wave of rebuilds showed each gap: handoff trial catalogs exposed evals/cases.json and origin.toml to executors; handoff, retro, verify and this skill ran Claude executors only; retro rows ran before three later wording changes, and teach and verify left cases unrun, including verify's trust rule; retro's untrusted-directive runs listed the path the directive named; a `pgrep -fl` process listing printed the host's messaging token into a pilot's context; and a host deny rule on .env files changed how executors worked."
where = [
  "references/evaluation.md#define-the-checks",
  "references/evaluation.md#compare-the-right-instructions",
  "references/evaluation.md#judge-the-evidence",
  "references/evaluation.md#iterate-proportionately",
]

[[invariants]]
rule = "Each model-pair round reviews a frozen candidate, cited by commit and tree hash in a Git repository. Both reviewers get identical inputs, kept private from each other and from the coordinator's dispositions until both results are in, and a round is reconciled only after both results are read in full or the missing profile is skipped or blocked. Only edits that change the reviewed meaning are reconsulted; other findings are applied or declined without another round, and a round with no material finding ends the loop."
reason = "On 2026-10-18: rebase.updateRefs moved backup refs so reviewed commits survived only in the reflog; this skill's pilot appended one reviewer's dispositions to a shared file while the other was still reviewing; the verify pilot reconciled a round before the other result arrived and skipped a result after a declined status call; and minor findings kept starting rounds (verify 8, this skill 5, retro 3)."
where = [
  "references/model-pair.md#brief-the-reviewers",
  "references/model-pair.md#handle-failures",
  "references/model-pair.md#reconcile-the-findings",
]

[[sources]]
id = "mattpocock-writing-for-agents-base"
author = "Matt Pocock"
repository = "https://github.com/mattpocock/skills"
remote = "git@github.com:mattpocock/skills.git"
ref = "refs/heads/main"
license = "MIT; notice retained in THIRD-PARTY-NOTICES.txt"
role = "base"
baseline_commit = "49dd158d1076134a641b33efb035946536778336"
reviewed_through = "49dd158d1076134a641b33efb035946536778336"
baseline_paths = [
  "skills/productivity/writing-for-agents/",
  "docs/productivity/writing-for-agents.md",
  "LICENSE",
]
paths = [
  "skills/productivity/writing-for-agents/",
  "docs/productivity/writing-for-agents.md",
  "LICENSE",
]

[[sources.deviations]]
change = "Renamed writing-for-agents to agent-instructions and moved SKILL-MECHANICS.md to references/skill-mechanics.md."
reason = "The registered skill name, and the repository's layout of conditional material under references/ with lowercase kebab-case names."
where = ["SKILL.md#agent-instructions", "references/skill-mechanics.md#skill-mechanics"]

[[sources.deviations]]
change = "Replaced the base description ('Writing documents for agents. Use when creating or editing skills, or modifying AGENTS.md or CLAUDE.md.') with the local one, which adds review and excludes following instructions and factual updates that leave guidance unchanged."
reason = "The local description passed selection probes (reports/agent-instructions-validation.json description_revision), and its exclusions answer an observed over-activation fixed in commit dc7c930 (evaluation case activation-near-misses)."
where = ["SKILL.md"]

[[sources.deviations]]
change = "Narrowed the scope from any document an agent consumes to agent guidance: skills, persistent instruction files, agent prompts and briefs, and documents they point to. Handoff documents, implementation plans, tickets and human-facing documentation keep their own owners; handoff takes the continuation guidance inside its documents from this skill."
reason = "Upstream extends the base to specs, tickets and READMEs, which local owners already cover (handoff, planning, task-breakdown, issue-workflow, write-documentation). The narrower activation came from the over-activation fixed in commit dc7c930."
where = ["SKILL.md#agent-instructions"]

[[sources.deviations]]
change = "Added owner boundaries and branch pointers to the opening: workflow-to-skill extracts contracts from completed work, create-project-instructions investigates projects, skill-maintenance owns records and source updates, and the opening loads the skill, persistent-file and reuse references by branch."
reason = "The invariants on authoring owners and on skill-maintenance. These replace upstream's relationships with grill-with-docs, which gathers project knowledge, and retro, its one caller."
where = ["SKILL.md#agent-instructions"]

[[sources.deviations]]
change = "Added a step section above the base's reference sections: Establish meaning and scope, Write, Get both model perspectives, Verify the change and Report, each ending on a completion criterion. Write applies Negation and Pruning to each changed line and each lever that the change's pointers, steps, placement and rewording reach, and Verify finishes only when the requested result passes its applicable checks. The information hierarchy's example of an all-reference document ('this skill') now reads 'or both, as this skill does'."
reason = "The local skill writes and reviews instructions at a user's request as a workflow; the base's information hierarchy puts steps on the top rung and lets steps and reference mix. The demand 'every lever applied' turns the base reference into the Write step's completion bar, and the passing-checks rule is the earlier local completion criterion."
where = [
  "SKILL.md#establish-meaning-and-scope",
  "SKILL.md#write",
  "SKILL.md#verify-the-change",
  "SKILL.md#report",
  "references/levers.md#information-hierarchy",
]

[[sources.deviations]]
change = "Added to Establish meaning and scope: authority and callers, explicit type, quantity, depth and completion evidence ('create tests'), domain decisions resolved from an authoritative contract instead of invented defaults, questions on unresolved intent with dependent work paused, review-only requests that leave the source unchanged, and interventions sized to the request. Reconciling overlapping guidance by trigger, owner, action, completion evidence and authority sits in the reuse reference, which loads for combining drafts."
reason = "Trials showed agents turning 'create tests' into execution (reports/agent-instructions-validation.json meaning_revision) and inventing a schema, a precision and a row-discard rule (reports/skill-authoring-validation.json). Evaluation cases ambiguous-test-objective, missing-domain-contract, unresolved-donor-conflict and canonical-instruction-edit."
where = ["SKILL.md#establish-meaning-and-scope", "references/reuse.md#reuse-and-standardization"]

[[sources.deviations]]
change = "Added the Get both model perspectives step and references/model-pair.md: independent Codex Astra and Claude Fable reviews at xhigh for instruction work the user explicitly requests, with who runs them, a completion criterion, runner resolution, briefs, failure handling, reconciliation and when rounds stop."
reason = "The model-pair invariants and the user's decisions of 2026-10-18 on effort, the handoff exemption and the split between SKILL.md and the reference."
where = ["SKILL.md#get-both-model-perspectives", "references/model-pair.md"]

[[sources.deviations]]
change = "Extended 'settle it by running the document' and upstream's 'no automated eval; run the document by hand' into a behavioral evaluation reference: matched trials against the previous version or no instructions, near-miss selection probes, reserved cases, run attribution, an evidence table, runtime-only staging, both hosts and final-revision runs."
reason = "Runs found defects that reading did not, such as invented domain rules (reports/skill-authoring-validation.json) and a pointer into another skill's files written under pressure (reports/skill-atlas/skill-reference-by-name-validation.json). The checks-scale invariant keeps it proportionate."
where = ["SKILL.md#verify-the-change", "references/evaluation.md"]

[[sources.deviations]]
change = "Added to Context pointers: a pointer with no condition names no branch; a pointer that summarizes the procedure becomes a shortcut; and a pointer to another skill names it by registered name with its selecting condition and, when the pointer sends it work rather than reaching its reference, its inputs and completion evidence, never a file or section inside it."
reason = "Commit 0aa8bda, after an agent wrote 'its PR-reply rules' as a pointer into another skill (reports/skill-atlas/skill-reference-by-name-validation.json, evaluation case cross-skill-reference-by-name). The shortcut sentence is the superpowers-writing-skills idea recorded below."
where = ["references/levers.md#context-pointers"]

[[sources.deviations]]
change = "Added to Steps and completion criteria: freedom matched to fragility, a loop's progress signal, end condition and response to a recurring blocker, and naming the next actor at each boundary so a same-conversation phase does not end the turn."
reason = "Ideas recorded below from openai-public-skill-creator and compound-engineering-ce-retune; the loop rule carries the earlier local guidance on observable progress."
where = ["references/levers.md#steps-and-completion-criteria"]

[[sources.deviations]]
change = "Replaced 'Coining your own works if you define it clearly, ... reach for an existing word first' with a guard: a leading word is familiar in its ordinary sense or a standard term of the domain, is defined once where the document narrows that sense, stays the same word, and never replaces the condition, obligation, quantity or exception that governs a behavior. Qualified the example 'a loop you believe in -> red' to apply only when failing on the bug is the meaning the author intended, and to ask when that is unclear."
reason = "User decision on 2026-10-18 to adopt leading words with this guard, reversing the earlier local decline of leading words. The model-pair review of this rebuild (Codex Astra, 2026-10-18) and a trial in which an agent replaced 'a loop you actually trust' with 'red' while citing the example showed the unqualified example licensing a change of meaning without asking."
where = ["references/levers.md#leading-words"]

[[sources.deviations]]
change = "Narrowed the Negation exception: a prohibition stays only for safety, data loss, a format contract, or a shortcut agents were observed to take under pressure after understanding the rule, named as observed and paired with the positive target; added harmful precision as the reason a blanket prohibition fails."
reason = "Ideas recorded below from mblode-agents-md and superpowers-writing-skills; they give the base's 'hard guardrail you cannot phrase positively' observable conditions."
where = ["SKILL.md#negation"]

[[sources.deviations]]
change = "Added to Pruning: new guidance goes into its existing home instead of a parallel rule; each line is graded by what it supplies before it is cut; and compression keeps force (actors, conditions, obligation strength, quantity, authority and completion evidence), with a rule deleted as enforced elsewhere only after the enforcement is inspected."
reason = "The user's direction to integrate rather than append (reports/skill-atlas/agent-instructions-retune-validation.json integrationClarification), the pruning invariant, and evaluation cases preserve-wording-force and project-rule-pruning. The no-op test asks whether a line changes behavior, not whether a rewrite keeps its force."
where = ["SKILL.md#pruning"]

[[sources.deviations]]
change = "Added Fix an observed failure to the evaluation reference: name the failure mode first, check loading evidence, then map each failure class to the lever that fixes it."
reason = "Upstream's documentation for this skill says to name the failure mode first, then fix that (docs/productivity/writing-for-agents.md); the table carries the superpowers-writing-skills and compound-engineering-ce-retune ideas recorded below."
where = ["references/evaluation.md#fix-an-observed-failure"]

[[sources.deviations]]
change = "Replaced the single Claude Code invocation control (disable-model-invocation: true) with a table of each host's control: disable-model-invocation in Claude Code frontmatter and policy.allow_implicit_invocation: false in Codex agents/openai.yaml, where an explicit $name mention still invokes the skill. Each control is verified on its host, and router text no longer assumes a user-invoked skill has no description."
reason = "These skills run in Claude Code and Codex. Upstream's skills/productivity/README.md lists both controls, its changelog for 1.2.2 (commit 4aaccb5) records Codex hiding this very skill, and the Codex skill-creator reference documents the policy (reference document below)."
where = ["references/skill-mechanics.md#invocation", "references/skill-mechanics.md#router-skills"]

[[sources.deviations]]
change = "Replaced 'If it only ever fires by hand, make it user-invoked and pay no context load' with: keep an existing skill's invocation policy, keep new skills model-invoked unless the user chooses otherwise, and propose user invocation with its two-load trade."
reason = "Changing invocation is a product decision, separate from permission for an action, and local skills reach each other by registered name (workflow-to-skill, verification-authoring), which a Claude Code user-invoked skill cannot receive."
where = ["references/skill-mechanics.md#invocation"]

[[sources.deviations]]
change = "Removed agents/openai.yaml with the display name 'Writing for Agents', and added Host metadata: the shared name and description, host adapters kept apart, supported metadata preserved, and Codex's agents/openai.yaml edited through the host creator when one is supplied."
reason = "The local name differs; in this repository only explicit-only skills carry agents/openai.yaml, and the Codex skill-creator owns that file's requirements and may regenerate it."
where = ["references/skill-mechanics.md#host-metadata"]

[[sources.deviations]]
change = "Added a Description section to skill mechanics: the shortest clear answer to when to use the skill, the capability named instead of its subtasks, qualifiers only for a shown ambiguity, and the description read beside its neighbors as one listing."
reason = "Selection trials kept machine examples and capability lists until this rule (reports/skill-authoring-portability-validation.json); evaluation case fleet-description-boundary. It applies the base's pointer rules to the skill's top-level pointer."
where = ["references/skill-mechanics.md#description"]

[[sources.deviations]]
change = "Added to Splitting by invocation: when neither condition holds, extend the existing owner or add a conditional reference instead of a second skill with the same responsibility."
reason = "The earlier local rule that a separate skill is created only for a distinct task or an independent invocation."
where = ["references/skill-mechanics.md#splitting-by-invocation"]

[[sources.deviations]]
change = "Added references/packaging.md: resources bundled inside the package, helpers with explicit inputs, outputs and failure states, host creators and dependencies, and validation that includes a relocation test."
reason = "The package invariants; reports/skill-authoring-portability-validation.json; evaluation cases portable-resource-review, fleet-package-relocation and thin-wrapper."
where = ["references/packaging.md"]

[[sources.deviations]]
change = "Added references/instruction-files.md for persistent instruction files: the canonical source, the scope where a rule belongs, imports and adapters, and command truth."
reason = "The base has only a skill branch; evaluation cases canonical-instruction-edit and project-rule-pruning cover persistent files and their adapters."
where = ["references/instruction-files.md"]

[[sources.deviations]]
change = "Replaced 'push it to a plain file outside the skill system' for reference shared by two user-invoked skills with a model-invoked reference skill, and replaced the reason 'with no descriptions' with 'with both out of the agent's reach', because a Codex user-invoked skill keeps its description."
reason = "The package invariant: a skill must work after only its folder is copied, and a plain file outside the packages would be lost. The model-pair review of this rebuild (Codex Astra, 2026-10-18) found the base advice contradicting references/packaging.md."
where = ["references/skill-mechanics.md#invocation"]

[[sources.deviations]]
change = "Added references/skill-changes.md, read before finishing or reviewing any change to a skill: the entry file's size budget against its previous version and its base, the text that depends on a changed contract, the Records hand-over to skill-maintenance in a repository that keeps records, and the checks a review of a skill change makes."
reason = "User decision on 2026-10-18 that skill-maintenance owns records and this skill keeps only the hand-over; records exist only for skills, so the hand-over sits in the skill branch (model-pair review, Claude Fable, 2026-10-18). The size, dependent-text and review checks are the invariants above."
where = [
  "references/skill-changes.md#size-budget",
  "references/skill-changes.md#dependent-text",
  "references/skill-changes.md#records",
  "references/skill-changes.md#review-a-skill-change",
]

[[sources.deviations]]
change = "Added references/reuse.md for choosing to install, wrap, base, derive or create a skill."
reason = "skill-maintenance's record format chooses each record's approach with this guidance."
where = ["references/reuse.md"]

[[sources.deviations]]
change = "Restructured the base's single reference into two homes. Context pointers, The two loads, Information hierarchy, Steps and completion criteria, When to split and Leading words moved, in the base's order, to references/levers.md, read before writing or reviewing a pointer, a step or its completion criterion, or where material sits, and before rewording existing text. The Negation paragraph became its own SKILL.md section beside Pruning, and the explanations in Negation, relevance and no-ops were condensed to their rules."
reason = "The size-budget invariant: the rebuilt entry file had 3901 words against the base's 1777. The base's own disclosure test keeps in the entry file what every branch needs: negation and pruning apply to every line written, while the other levers serve the branches that touch pointers, steps, placement or rewording."
where = ["SKILL.md#load-what-the-work-needs", "SKILL.md#negation", "SKILL.md#pruning", "references/levers.md"]

[[sources]]
id = "anthropic-skill-creator"
repository = "https://github.com/anthropics/skills"
remote = "git@github.com:anthropics/skills.git"
ref = "refs/heads/main"
license = "Apache-2.0; see skills/skill-creator/LICENSE.txt at the baseline commit; ideas only, no source text copied"
role = "ideas"
baseline_commit = "8a1541c4a3ffa5a20a5a91de0dcf3f0bab1d1ef4"
reviewed_through = "dbd4588f9e1033efb41dad4bef2f7947c8993d44"
baseline_paths = ["skills/skill-creator/"]
paths = ["skills/skill-creator/"]

[[sources.ideas]]
idea = "Instructions are judged by matched trials: a new skill against the same task without it, and a revision against the previous version. Each pair keeps the model, effort, tools, fixtures, authorization and output format equal and runs in independent clean contexts, and the judgment reads the actual artifacts, actions and resulting state."
serves = "Separates the effect of the instructions from changes in the model, task or setup."
where = [
  "references/evaluation.md#compare-the-right-instructions",
  "references/evaluation.md#define-the-checks",
]
shapes = "The comparison section defines the two arms and what stays equal within each pair; the checks section observes artifacts, actions and resulting state."
adapted = "The donor runs both arms through its own subagent, workspace and viewer layout. Locally, any available and authorized runner executes the arms; when none is available, the missing behavioral evidence is reported, and the author's simulated answer never stands in for an execution."

[[sources.ideas]]
idea = "Activation is tested with requests that should select the skill and with near misses that share its terms but need something else. Some cases stay unseen; a reserved case used to revise the instructions becomes a regression case, and a new unseen case is needed before another generalization claim."
serves = "Catches over- and under-triggering, and prevents tuning to the cases that judge the result."
where = [
  "references/evaluation.md#define-the-checks",
  "references/skill-mechanics.md#description",
]
shapes = "The checks section requires positive, near-miss and reserved cases; the description section rewrites a description from the requests it should serve and the near misses it should not."
adapted = "The donor uses a fixed set of about 20 trigger queries with a train and test split and repeated runs. Locally, cases come from the target's own contract, and a focused edit need not acquire a permanent evaluation suite."

[[sources.ideas]]
idea = "A verdict rests on observable evidence: objective checks for formats and postconditions, and a reading of the substantive output for scope, decisions, unnecessary questions and unjustified claims. Keywords and confident self-reports do not count, and a small passing sample supports only its tested cases."
serves = "Prevents overclaiming from a few passes or from the agent's own account."
where = [
  "references/evaluation.md#judge-the-evidence",
  "references/evaluation.md#iterate-proportionately",
]
shapes = "The evidence table ties each claim to the evidence it needs; the iteration section limits a small sample to its tested cases and reports a result where both versions pass without claiming improvement."

[[sources.declined]]
feature = "Descriptions that list many trigger contexts to counter undertriggering."
reason = "The description is the shortest clear answer to when the skill applies; a qualifier stays only when a concrete request or neighboring skill shows the ambiguity it resolves."

[[sources.declined]]
feature = "The donor's eval scripts, HTML review viewer, benchmark schema and sibling workspace layout as required tooling."
reason = "The skill uses the evaluators and runners available on the host; a reference to a donor's tool does not install it or make it necessary."

[[sources.declined]]
feature = "A mandatory user interview before drafting, and a loop that waits for the user to review every iteration in a viewer."
reason = "Evaluation scales to the change, and existing authorization carries the work; the skill asks only when the objective or the needed meaning stays uncertain."


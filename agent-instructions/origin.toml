[[sources.ideas]]
idea = "A persistent instruction file is a working contract. Its entrypoint keeps the project purpose, the verified commands the work requires with when to run them and what configuration does not show, material domain constraints, local conventions and routes to specialized context, plus the reasons and gotchas that configuration cannot reveal; a bare copy of a script list is a cache, and extensive rationale and background go to the project's documentation."
serves = "Keeps the always-loaded file focused on decisions that prevent mistakes."
where = [
  "references/instruction-files.md#make-the-requested-change",
  "SKILL.md#pruning",
]
shapes = "The instruction-file section lists what the entrypoint keeps and where background and conditional detail go; the cache bullet in Pruning keeps the reason or gotcha that discoverable facts lack."

[[sources.ideas]]
idea = "After text is pruned or moved, the result is checked in context: commands still match their definitions, links and imports resolve, the moved rule still reaches the tasks that need it, and rare consequential constraints survived."
serves = "Prevents a reorganization from silently dropping or hiding a rule."
where = [
  "references/instruction-files.md#find-the-source-and-its-scope",
  "references/instruction-files.md#check-the-result",
  "SKILL.md#pruning",
]
shapes = "The check section reads the resulting instruction with its callers and scope and verifies imports and adapters; the scope section requires that a moved rule still reach its tasks; Pruning keeps rare consequential constraints."

[[sources.ideas]]
idea = "A smaller file does not mean less loaded context: an import may expand at startup, and hosts load nested files differently, so a reduction or a move is verified against the host's actual loading."
serves = "Prevents claiming a context saving or a scoped rule that the host does not deliver."
where = [
  "references/instruction-files.md#find-the-source-and-its-scope",
  "references/evaluation.md#define-the-checks",
]
shapes = "The scope section resolves loading and precedence from the configured host and treats imports and nested files as host-specific; the evaluation checks test effective scope, including imports and adapters."

[[sources.ideas]]
idea = "Harmful precision: a blanket prohibition that is wrong on one plausible task in ten is still obeyed on that task, and the agent cannot tell it is the exception. Stating the wanted outcome lets the context choose the path; absolutes stay for safety, data loss, format contracts and rules agents were observed to break."
serves = "Complements the no-op test, which removes rules that change nothing, with its opposite failure: rules that change the wrong things."
where = ["SKILL.md#negation"]
shapes = "The Negation section gives harmful precision as a second reason to prompt the positive and lists the conditions under which a prohibition still earns its place."

[[sources.declined]]
feature = "Migrating every repository to `AGENTS.md` as the single shared source and removing `CLAUDE.md` wrappers and symlinks."
reason = "The existing filename, its case and working adapters are kept unless changing the host arrangement is part of the request."

[[sources.declined]]
feature = "Assuming a particular host version or loader mode, such as a built-in AGENTS.md mode."
reason = "Uncertain loading or precedence is resolved from the configured host."

[[sources.declined]]
feature = "Audit scores with point targets, root-file line-count triggers and a task-frequency percentage for moving detail."
reason = "Placement follows the rule's scope and the host's loading, and findings rest on evidence rather than a score."

[[sources.declined]]
feature = "Auditing user-level home-directory instruction files during every repository audit."
reason = "Inspection covers the target and the ancestor, nested and imported files that affect its scope."


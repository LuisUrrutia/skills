[[local_snapshots.ideas]]
idea = "Instruction work keeps the user's intent and scope: it does not widen the assignment, imply permission for more external actions, or turn a single example, failure or preference into a universal requirement. New skills stay discoverable unless the user requests another invocation mode, and an existing invocation policy is preserved."
serves = "Prevents instructions that quietly expand what an agent may do or change when a skill loads."
where = [
  "SKILL.md#establish-meaning-and-scope",
  "references/instruction-files.md#make-the-requested-change",
  "references/skill-mechanics.md#invocation",
]
shapes = "Scope and authority are established before drafting; the instruction-file section refuses to promote a single incident or task permission into a global rule; the invocation section keeps the existing policy and default discoverability."

[[local_snapshots.ideas]]
idea = "Behavioral checks verify observable behavior or meaningful invariants, not generated wording. An independent executor receives the request, the instructions and the raw artifacts, without the expected answer, suspected defects or proposed fixes."
serves = "Keeps an evaluation from leaking its answer or rewarding matching text."
where = [
  "references/evaluation.md#compare-the-right-instructions",
  "references/evaluation.md#judge-the-evidence",
]
shapes = "The comparison section sets what an independent executor receives and what it is not given; the evidence section rejects keywords and self-reports as proof."


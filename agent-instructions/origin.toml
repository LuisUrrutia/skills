baseline_paths = ["skills/skill-creator/"]
paths = ["skills/skill-creator/"]

[[sources.ideas]]
idea = "Instructions are judged by matched trials: a new skill against the same task without it, and a revision against the previous version. Each pair keeps the model, effort, tools, fixtures, authorization and output format equal and runs in independent clean contexts, and the judgment reads the actual artifacts, actions and resulting state."
serves = "Separates the effect of the instructions from changes in the model, task or setup."
where = [
  "references/evaluation.md#compare-the-right-instructions",
  "references/evaluation.md#define-the-checks",
]
shapes = "The comparison section defines the two arms and what stays equal within each pair; the checks section observes artifacts, actions and resulting state."
adapted = "The donor runs both arms through its own subagent, workspace and viewer layout. Locally, any available and authorized runner executes the arms; when none is available, the missing behavioral evidence is reported, and the author's simulated answer never stands in for an execution."

[[sources.ideas]]
idea = "Activation is tested with requests that should select the skill and with near misses that share its terms but need something else. Some cases stay unseen; a reserved case used to revise the instructions becomes a regression case, and a new unseen case is needed before another generalization claim."
serves = "Catches over- and under-triggering, and prevents tuning to the cases that judge the result."
where = [
  "references/evaluation.md#define-the-checks",
  "references/skills.md#write-the-selection-description",
  "references/skills.md#validate",
]
shapes = "The checks section requires positive, near-miss and reserved cases; the description and validation sections test the name and description against intended and nearby requests."
adapted = "The donor uses a fixed set of about 20 trigger queries with a train and test split and repeated runs. Locally, cases come from the target's own contract, and a focused edit need not acquire a permanent evaluation suite."

[[sources.ideas]]
idea = "A verdict rests on observable evidence: objective checks for formats and postconditions, and a reading of the substantive output for scope, decisions, unnecessary questions and unjustified claims. Keywords and confident self-reports do not count, and a small passing sample supports only its tested cases."
serves = "Prevents overclaiming from a few passes or from the agent's own account."
where = [
  "references/evaluation.md#judge-the-evidence",
  "references/evaluation.md#iterate-proportionately",
]
shapes = "The evidence table ties each claim to the evidence it needs; the iteration section limits a small sample to its tested cases and reports a result where both versions pass without claiming improvement."

[[sources.declined]]
feature = "Descriptions that list many trigger contexts to counter undertriggering."
reason = "The description is the shortest clear answer to when the skill applies; a qualifier stays only when a concrete request or neighboring skill shows the ambiguity it resolves."

[[sources.declined]]
feature = "The donor's eval scripts, HTML review viewer, benchmark schema and sibling workspace layout as required tooling."
reason = "The skill uses the evaluators and runners available on the host; a reference to a donor's tool does not install it or make it necessary."

[[sources.declined]]
feature = "A mandatory user interview before drafting, and a loop that waits for the user to review every iteration in a viewer."
reason = "Evaluation scales to the change, and existing authorization carries the work; the skill asks only when the objective or the needed meaning stays uncertain."


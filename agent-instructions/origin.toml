]
skipped = [
  "skills/agents-md/SKILL.md (linked references/repo-evals.md): The eval guide's budget header, slow verdict, JSONL scoreboard and manual dispatch. Covered by agent-instructions/references/evaluation.md:62-63 and :81-92, and they conflict with the declined fixed run counts and prescribed statistics recorded for compound-engineering-ce-retune.",
  "skills/agents-md/SKILL.md: New Make Drift a Gate section adds a check script that fails on stale script names, links, paths and identifiers. Not applied because it adds repository tooling outside the writing scope and upstream admits the identifier check proves existence rather than visibility; agent-instructions/references/instruction-files.md:43-49 verifies commands at authoring time.",
  "skills/agents-md/SKILL.md: Step 5 item 3 now diffs each project skill against the root file and keeps one copy. agent-instructions/SKILL.md:27-28 deliberately keeps direct edits narrow and one-home deduplication is already in agent-instructions/references/writing.md:16-17 and :95-96; the gap is adopted in create-project-instructions instead.",

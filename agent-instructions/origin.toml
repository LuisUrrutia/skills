[[sources.ideas]]
idea = "Text can be removed as covered elsewhere only when the surviving owner, such as a linter, formatter, hook, configuration or existing code, actually enforces or supplies the rule. The reason or gotcha that the owner cannot supply stays."
serves = "Prevents pruning that silently drops a rule that nothing enforces."
where = ["SKILL.md#pruning"]
shapes = "The force bullet in Pruning requires inspecting the actual configuration, execution path and coverage before a rule is deleted as enforced elsewhere."
adapted = "The donor keeps every command from the original file and cuts style rules that tooling could enforce. Locally, commands are checked against the repository and corrected when stale, and domain constraints that tools do not enforce stay."

[[sources.declined]]

[[sources.ideas]]
idea = "A pointer to out-of-context material, such as a skill description, a persistent-file line or a reference link, decides when that material is reached, so it names the material and the conditions that select it. Guidance that every branch needs stays in the entrypoint; substantial detail that only some branches need moves behind a reference with an explicit loading condition."
serves = "Puts each rule in front of the agent on the tasks that need it, without loading every branch on every run."
where = [
  "references/writing.md#put-decisions-where-they-apply",
  "SKILL.md#choose-the-document-and-write",
  "references/skills.md#package-the-instructions",
]
shapes = "The entrypoint loads writing.md and then only the branch reference that applies; writing.md rejects a bare 'see references' as a loading decision; the packaging section keeps shared steps in SKILL.md and conditional detail in linked references."

[[sources.ideas]]
idea = "Every step or phase ends on a completion criterion that lets the agent tell done from not done: evidence that distinguishes completion from an attempt. A loop also needs a progress signal, an end condition and a response to a recurring blocker."
serves = "Prevents premature completion and steps that end on a vague sense of being finished."
where = [
  "references/writing.md#make-progress-observable",
  "SKILL.md#choose-the-document-and-write",
  "SKILL.md#verify-the-change",
]
shapes = "The progress section requires evidence at each phase end and an end condition for each loop; the entrypoint's writing and verification sections each close on a completion condition."

[[sources.ideas]]
idea = "Each rule, with its reason and exceptions, has one authoritative home. A meaning repeated in several places is removed, so that changing a behavior is a one-place edit."
serves = "Prevents drifting copies and rules that gain false prominence through repetition."
where = [
  "references/writing.md#put-decisions-where-they-apply",
  "references/writing.md#prune-without-weakening-the-contract",
  "SKILL.md#choose-the-document-and-write",
]
shapes = "Writing.md keeps each rule with its reason and exceptions together, and its pruning section removes duplicate meanings; the entrypoint states the one-home rule."

[[sources.ideas]]
idea = "Configuration, scripts, CLI help and the directory layout are sources of truth. Instructions that copy them go stale, so instructions keep only what the agent cannot find by looking: the reason, the unwritten convention or the gotcha."
serves = "Keeps instructions short and current."
where = [
  "references/writing.md#prune-without-weakening-the-contract",
  "references/instruction-files.md#make-the-requested-change",
]
shapes = "The pruning section sends discoverable facts back to configuration and CLI help and keeps what they cannot supply; the instruction-file section grounds commands and paths in the repository."

[[sources.declined]]
feature = "Making a skill user-invoked (`disable-model-invocation: true`) whenever only a person fires it, to save context load."
reason = "New skills stay discoverable unless the user requests another mode; changing invocation is a product decision, separate from permission for a particular action."

[[sources.declined]]
feature = "Treating the donor's skill mechanics, such as description-based model invocation, `disable-model-invocation` and router skills, as true on every host."
reason = "Invocation controls are host features; the skill verifies their current behavior on the intended host before choosing them."

[[sources.declined]]
feature = "Leading words as a required technique: collapsing repeated phrases into one pretrained or coined term."
reason = "Instructions use familiar, precise words; a coined or jargon term is not needed to anchor behavior."

[[sources.declined]]
feature = "Fixed rules for splitting a document by sequence or by invocation."
reason = "A separate skill is created only for a distinct task or an independent invocation; otherwise the existing owner or a conditional reference holds the guidance."


where = ["references/browser-evidence.md#select-the-journeys-and-conditions"]
shapes = "Defines each selected journey by entry, user action, expected result, destination and downstream effect before any probe is chosen."

[[sources.ideas]]
idea = "The affected behavior decides which branch conditions join a journey: re-entry, permission, empty, validation, cancellation or failure states, and adjacent regressions through shared components."
serves = "Covers the states a change can break besides the happy path."
where = [
  "references/browser-evidence.md#select-the-journeys-and-conditions",
  "SKILL.md#match-scope-to-the-claim",

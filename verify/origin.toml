format_version = 2
skill = "verify"
created = "2026-10-03"
approach = "derive"
goal = "Establish whether a software change or completion claim holds by running the checks that can support it against the current state, including real user paths through the project's own verification recipe for application behavior. Success is a report whose claims each rest on current execution evidence, with failures and skipped or blocked checks named, and no completion claimed beyond that evidence."

[[invariants]]
rule = "This skill owns scope, selection and whether the evidence supports a claim. The project-local verify-<app> skill owns launch, doctor, driving, evidence capture and cleanup, and the verification-authoring skill owns creating and maintaining that recipe."
reason = "The record began as a common evidence and selection entrypoint over project-local pstack-style verification recipes."
where = [
  "SKILL.md#verify",
  "SKILL.md#match-scope-to-the-claim",
  "references/browser-evidence.md#browser-evidence",
]

[[invariants]]
rule = "Verification grants no new authority. A verification-only task reports failures without repairing product code, adding tests or weakening expectations. Product repair, dependency or tool installation, production load, commits, PRs, scheduling and learned-rule publication follow the active caller and repository rules."
where = [
  "SKILL.md#resolve-failures-within-authority",
  "SKILL.md#deliver-evidence-that-matches-the-claim",
  "references/performance-evidence.md#make-the-comparison-meaningful",
]

[[invariants]]
rule = "A required check that is blocked, skipped, inconclusive or unrun leaves the claim incomplete, even when another check of the same path passed. An unreachable route counts as blocked coverage, reported with the attempted route and the concrete missing prerequisite, never as a pass."
where = ["SKILL.md#deliver-evidence-that-matches-the-claim"]

[[invariants]]
rule = "Performance evidence criteria live in a reference that this skill reads only for performance claims; ordinary functional verification needs no benchmark. When the debug or prototype skill supplies a claim, that skill keeps the measurement, diagnosis or experiment and receives the verdict back without a recursive handoff."
where = [
  "SKILL.md#match-scope-to-the-claim",
  "references/performance-evidence.md#performance-evidence",
  "references/performance-evidence.md#report-and-return",
]

[[invariants]]
rule = "A supplied harness, benchmark or results packet can be assessed without a project recipe. Its functional checks still apply, and missing application coverage is reported separately."
where = ["references/performance-evidence.md#performance-evidence"]


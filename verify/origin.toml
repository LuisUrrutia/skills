format_version = 2
skill = "verify"
created = "2026-10-03"
approach = "base"
goal = "Decide whether a software change or completion claim holds by running the real software the way its user reaches it: learn from the project how to launch it, confirm the instance is worth driving, drive the affected paths, and keep evidence of the action, the resulting state and the side effects that survives cleanup. Success is a report whose verdict for every required path and criterion matches current evidence, with failed, blocked, skipped and stand-in-only coverage named instead of counted as passing; callers also use it to judge whether supplied measurements support a performance claim."

[[invariants]]
rule = "Verification alone grants no authority to repair product code, write tests, weaken expectations, add dependencies, change a lockfile, install globally, apply production load, commit, publish or schedule. Failures are reported, and repair follows the active task and repository rules."
where = [
  "SKILL.md#7-resolve-failures-within-authority",
  "SKILL.md#8-report-what-the-evidence-supports",
  "references/performance-evidence.md#make-the-comparison-meaningful",
]

[[invariants]]
rule = "Unless the caller is read-only, launch setup may install the project's locked dependencies without changing the lockfile, create the env file, and run migrations and seed data against the run's isolated data, with the project's documented commands. When the documentation is missing a step, only scripts and targets the project itself declares (manifest scripts, Makefile or task-runner targets, compose files, its migration and seed tooling) may run, each reported, and setup changes only the run's isolated local data; nothing writes to a shared or remote environment (no deploy, publish, migration or other change to staging or production), and a step whose target is unclear is reported as a prerequisite. A read-only caller, such as the review-code-changes skill, gets none of this setup, scaffolding included: each step is reported as a missing prerequisite."
reason = "User decision of 2026-10-18, option (a) of the rebuild analysis: a fresh worktree usually lacks installed dependencies, and Launch must reach a usable state from empty data. Coordinator ruling of 2026-10-18 after the model review: \"documented commands\" was the analysis's wording, and project-owned steps that the source shows serve the decision's intent of avoiding false blockers in fresh worktrees, within the limits stated here."
where = ["SKILL.md#3-launch-it-and-confirm-it-is-worth-driving", "references/launch-setup.md#run-the-projects-own-setup"]

[[invariants]]
rule = "To make the local environment realistic, a run may read a shared or remote environment through the project's own cloud or platform CLI, such as gcloud: configuration, resource and service versions, schema, flags and data shape. Only read-only commands run, with the CLI's existing authentication and never a login, after confirming that the active project or account belongs to this repository's environments; a missing or unclear one is a reported prerequisite. Queries that cannot print rows, such as counts and schema introspection, are preferred. The user approves before data that may hold personal or customer information enters the local environment, the evidence or the output; shape-only queries need no approval. A secret from a secret manager is never copied into a file or the output, and every remote query is reported with its command and the environment it read."
reason = "User decision of 2026-10-18: if the project uses Google Cloud, for example, using the gcloud CLI to query the other environments helps build a much more realistic local environment for tests. The limits are the coordinator's, and the approval rule for personal or customer data in the evidence or output is the coordinator's ruling on a question raised while writing it."
where = ["references/launch-setup.md#read-remote-environments-without-changing-them"]

[[invariants]]
rule = "When .env.schema exists, the project uses varlock: validate with `varlock load --agent`, run the project's commands through varlock unless its scripts already load it, invoke varlock through the package manager when it is a local dependency, and give the run its ports and data paths through the process environment, never by writing them into an env file. Never read .env or .env.local, never invent or fill a secret value, stop the step and ask the user for a missing required secret, and report a blocker instead of installing varlock when neither the project nor the machine has it. Without .env.schema, create a missing .env from .env.example, never overwrite an existing env file, ask the user for a missing secret and never print secret values. The core steps work without the varlock skill."
reason = "User decision of 2026-10-18. The user installs the varlock skill later; it was not installed when this rule was written."
where = ["SKILL.md#3-launch-it-and-confirm-it-is-worth-driving", "references/launch-setup.md#prepare-the-env-file"]

[[invariants]]
rule = "Verify owns the functional checks of an interface: user flows, roles, edge cases, loading, empty and error states, navigation and persistence, browser errors, narrow and wide layouts, and theme and locale. Keyboard and focus, pointer target size, reduced motion, accessible names and roles, accessibility scans and other accessibility claims belong to the accessibility skill. Verify calls it when the change modifies an interface that users interact with: a page, screen, dialog, form or terminal UI; a command-line interface's arguments, flags, prompts, output and error messages; and the interface text users act on, such as labels, link text and messages. It reports that skill's result as its findings and coverage. A backend-only change does not call it, and neither does a text-only change: documentation, a README, code comments or other text outside an interface users operate. When the accessibility skill is the caller, its criteria define those checks: verify drives the flow it supplies, including keyboard and focus paths, returns the observations and does not call it back."
reason = "User decision of 2026-10-18: verify checks that the implementation works well for the user it is meant for, covers edge cases and follows a flow, while accessibility tests the accessibility of the components, and the two are different things. The user named keyboard and focus, target size and accessibility claims; reduced motion and automated scanners follow them as accessibility checks by the coordinator's reading of that decision. A later user decision of the same day: a change to a CLI's arguments, flags, prompts, output or error messages also calls accessibility; text-only means documentation and other text outside an interface users operate, by the coordinator's ruling from that answer. The accessibility skill covered terminals only in its terminal-interfaces guidance at that time, and the user plans to extend it separately."
where = [
  "SKILL.md#4-drive-it-the-way-a-user-does",
  "references/browser-evidence.md#drive-and-observe",
]

[[invariants]]
rule = "A required check that failed, was skipped, blocked, inconclusive or not run keeps the result incomplete, even when another check of the same path passed. One entry point is never evidence for another, and an unreachable route is blocked coverage reported with the route attempted and the unmet precondition, never a pass or a product failure."
where = ["SKILL.md#8-report-what-the-evidence-supports"]

[[invariants]]
rule = "Expected results come from requirements and contracts, not from the implementation under test."
where = ["SKILL.md#1-name-the-claim-and-what-would-prove-it"]

[[invariants]]
rule = "When the project has its own verification skill, its launch and drive specifics apply while this skill's isolation, proof and reporting rules still decide. Verify never creates or edits a project verification skill; it offers the verification-authoring skill once, only when discovery was costly or the project's skill drifted."
reason = "User decision for this rebuild: verify owns the verification method and uses the project's verification skill when one exists; verification-authoring owns creating and maintaining those skills."
where = [
  "SKILL.md#2-interview-the-repo-not-the-user",
  "SKILL.md#7-resolve-failures-within-authority",
  "SKILL.md#8-report-what-the-evidence-supports",
]

[[invariants]]
rule = "Performance evidence criteria live in a reference this skill reads only for performance claims; ordinary functional verification needs no benchmark. When the debug, prototype or performance-optimization skill supplies a claim, the verdict returns to that caller without a new experiment, tuning loop or recursive handoff. A supplied harness, benchmark or results packet can be assessed without launching the application."
where = [
  "SKILL.md#1-name-the-claim-and-what-would-prove-it",
  "references/performance-evidence.md#performance-evidence",
  "references/performance-evidence.md#report-and-return",
]

[[invariants]]
rule = "The skill runs in Claude Code and Codex: no Cursor paths, no host-only frontmatter such as disable-model-invocation, and no tool mandate beyond the host's own tools and rules."
reason = "The user's skills run in Claude Code and Codex, through T3 Code, and never in Cursor."
where = ["SKILL.md", "references/browser-evidence.md#browser-evidence"]


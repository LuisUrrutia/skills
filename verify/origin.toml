[[sources]]
id = "pstack-maintain-verification"
author = "Lauren Tan / pstack"
repository = "https://github.com/cursor/plugins"
remote = "git@github.com:cursor/plugins.git"
ref = "refs/heads/main"
license = "MIT; ideas only, notice for the pstack material retained in THIRD-PARTY-NOTICES.txt"
role = "ideas"
baseline_commit = "101b274dd991f694e1f7024be2157e5f3adf07de"
reviewed_through = "101b274dd991f694e1f7024be2157e5f3adf07de"
baseline_paths = ["pstack/skills/maintain-verification-skill/SKILL.md", "pstack/LICENSE"]
paths = ["pstack/skills/maintain-verification-skill/SKILL.md", "pstack/LICENSE"]

[[sources.ideas]]
idea = "A live drive loop holds three invariants whatever fails. Doctor runs before the first drive, on each fresh session and after any failed or surprising drive, and when doctor cannot see the problem, such as a wedged UI on a healthy process, the instance is reset or relaunched. Evidence is checked at its location after every cleanup. Residue of a failed attempt is cleaned whether the session is stuck, exited or shared, and a shared instance loses only the residue, not the instance."
serves = "Keeps a corrupted instance from producing a green result, and keeps failed attempts from stranding processes or eating the proof."
where = [
  "SKILL.md#3-launch-it-and-confirm-it-is-worth-driving",
  "SKILL.md#6-clean-up-without-losing-the-evidence",
]
shapes = "Sets the timing and the reset rule in the doctor paragraph, and opens the second cleanup paragraph with cleanup after every failed attempt and the evidence check."

[[sources.ideas]]
idea = "Each observation belongs to one layer: a wrong or missing description in the project's verification skill is drift, working behavior the harness cannot drive is a harness gap, and broken application behavior is a product defect that is reported and never written into the recipe as intended."
serves = "Keeps recipe faults from being reported as product defects and product defects from being papered over."
where = ["SKILL.md#7-resolve-failures-within-authority"]
shapes = "Opens the failure step with the three-way classification."
adapted = "Verify never edits the project's verification skill: when the correct step is evident it uses that step for this run, reports the drift and leaves corrections to verification-authoring."

[[sources.declined]]
feature = "Driving every mapped feature live on each run and ending with a clean, changed or blocked outcome and one PR of corrections."
reason = "Verify covers the paths a change affects, and the whole map only for a full-application request; maintenance outcomes and their PR belong to verification-authoring."


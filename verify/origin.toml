baseline_paths = ["src/resources/skills/verify-before-complete/SKILL.md", "LICENSE"]
paths = ["src/resources/skills/verify-before-complete/SKILL.md", "LICENSE"]

[[sources.ideas]]
idea = "Before choosing checks, inventory what the claim covers: the original symptom, acceptance criteria, compilation or build, test coverage and user-visible behavior, plus the project's applicable checks."
serves = "Each part of the claim gets a check that can prove it, instead of one check standing for all of them."
where = ["SKILL.md#match-scope-to-the-claim"]
shapes = "Opens the skill with an inventory step that separates the kinds of claim before any check is chosen."

[[sources.ideas]]
idea = "Some claims need one specific observation: a bug claim needs its original reproduction, and a build claim needs the project's real build when the project bundles; lint or typechecking is not that build."
serves = "Prevents a fix or build from being declared good on evidence that never touched the failure or the shipped artifact."
where = ["SKILL.md#run-against-the-actual-state"]
shapes = "Adds the real-build and original-reproduction requirements to the paragraph on reading results."
adapted = "A bug claim needs its original reproduction, not a new test suite, and a red/green cycle is never claimed from a test that only ran after the fix."

[[sources.ideas]]
idea = "The report names incomplete checks and remaining blockers instead of inferring that passing adjacent checks prove the requested behavior."
serves = "Keeps gaps visible so a reader does not mistake neighboring evidence for proof."
where = ["SKILL.md#deliver-evidence-that-matches-the-claim"]
shapes = "Makes the report list skipped or blocked coverage and the next missing check, and states that a passing suite does not prove an unexercised user path."

[[sources.declined]]
feature = "GSD's slice framework and its fixed tools for marking progress, running commands and asserting browser state."
reason = "The skill uses the project's checks and the host's tools."


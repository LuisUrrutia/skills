  "skills/app-verification/references/worktree-isolation.md",
  "skills/app-verification/references/reusable-checks.md",
  "skills/app-verification/references/maintain-mode.md",
  "LICENSE.md",
]

[[sources.ideas]]
idea = "Use the cheapest driver that still reaches a path the way its user does: a direct CLI or HTTP call for commands and endpoints, a browser for rendered interaction, and OS-level control only for native surfaces nothing cheaper reaches. Cheaper checks run first so they fail fast."
serves = "Keeps verification fast without weakening what is proven, now that verify chooses its own drivers."
where = ["SKILL.md#4-drive-it-the-way-a-user-does"]
shapes = "Opens the drive step with the driver choice."
adapted = "The claimed entry point decides, so an API call is never evidence for a UI path; the donor's named rungs and its manual label are not used."

[[sources.ideas]]
idea = "Coverage is accounted per path: a path counts as covered only when a check asserted its expected result, steps that only act cover nothing, and every other path is failed, or skipped or blocked with a concrete reason. A path checked through one entry point stays unchecked for the others, and a tool-consumed proof record keeps an overall result that agrees with that coverage."
serves = "Makes \"covered\" a checkable claim and keeps machine consumers seeing the same gaps as a reader."
where = ["SKILL.md#8-report-what-the-evidence-supports"]
shapes = "Opens the report step with the covered, failed, skipped and blocked accounting, and ends the completion paragraph with the project's proof format."
adapted = "No proof.json schema or fixed record path; the project's existing proof format is used only when a tool consumes the results."

[[sources.ideas]]
idea = "Checked cleanup: each resource a drive creates is registered at once by a stable identifier with its cleanup action, cleanups run in reverse order even after a failure, removal is proven through an authoritative read, resources are never deleted only because their name looks like test data, and a failed or unproven cleanup is reported without hiding the original result."
serves = "Extends the base's process cleanup to the data a drive creates."
where = ["SKILL.md#6-clean-up-without-losing-the-evidence"]
shapes = "Makes the first cleanup paragraph an ordered procedure and ends the second with the cleanup-failure report."

[[sources.ideas]]
idea = "Refuse rather than fall back: an instance that would land on the main checkout's port, database or browser profile stops with the conflict named, and a dependency that cannot be isolated is namespaced with the run's identifier and reported as shared."
serves = "Protects other agents' worktrees and the user's main instance on a shared machine."
where = ["SKILL.md#3-launch-it-and-confirm-it-is-worth-driving"]
shapes = "Opens the isolation paragraph of the launch step."
adapted = "The donor builds the refusal into a harness CLI; verify applies it during its own launch, with no new command. As in the donor, the refusal applies only from a worktree, and a port another instance already holds leads to this run's own instance on a free port."

[[sources.ideas]]
idea = "A missing env file is created from its example with the run's isolated ports and data paths, and an existing env file is never overwritten."
serves = "Lets a fresh worktree start without manual setup while keeping values someone set on purpose."
where = ["references/launch-setup.md#prepare-the-env-file"]
shapes = "Defines the branch of env-file setup for projects without .env.schema."
adapted = "Secrets are never filled or printed: a missing secret goes to the user as a question."

[[sources.declined]]
feature = "A repository harness of verify, doctor and seed commands with a JSON proof record at a fixed path, a guarded sign-in shortcut, and a bug handoff whose first line is a fixed verdict."
reason = "Verify uses the project's existing commands and proof format, creates no product shortcuts, and reports defects with its own three outcomes."

[[sources.declined]]
feature = "Running the skill only when it is called by name."
reason = "The skill is selected whenever a change or completion claim needs verification, and other skills call it by name."


[[sources.ideas]]
idea = "Only the probes and conditions that can decide the claim run, and the session under them is recorded: build or input identity, URL, fixture and role, viewport, and the theme, locale, motion, cache or network conditions, each confirmed to have taken effect."
serves = "Keeps browser work proportionate and makes each observation reproducible under known conditions."
where = ["references/browser-evidence.md#select-the-journeys-and-conditions"]
shapes = "Makes probe choice depend on the claim, and adds a conditions record with a check that each selected state took effect before driving starts."
adapted = "Required coverage from the caller and the feature map stays, sampling is explained, and the selection is never a mandatory full audit or a cross product of viewports, themes, locales and states. A probe is repeated only when repetition can resolve uncertainty."

[[sources.ideas]]
idea = "Each UI probe decides from the effective runtime state and guards against its typical false positive: keyboard access is driven with real keys and observed focus, a target's hit area includes padding, pseudo-elements, delegated handlers and overlays, page overflow is separated from an intentional scroll region, and a theme, locale or motion state counts only after the app shows it applied."
serves = "Prevents confident findings from proxies such as icon size, emulated media or programmatic focus."
where = ["references/browser-evidence.md#drive-and-observe"]
shapes = "Gives the keyboard and focus, pointer or touch target, reflow and content bounds, and theme, locale, direction and motion rows of the probe table their deciding evidence and false-positive guard."
adapted = "Synthetic or narrower observations are labeled with their actual coverage; they do not establish native keyboard, touch, clipboard or composition input, localization, accessibility or field performance."

[[sources.ideas]]
idea = "An injected fault counts only after it is observed to reach the intended request or boundary. The probe observes the failure, then exercises the recovery control and confirms its new request or action and the final state."
serves = "Prevents error-handling claims from an interceptor that never matched or a retry that happened automatically."
where = ["references/browser-evidence.md#control-probes-without-replacing-the-behavior"]
shapes = "Adds a section that confirms the fault reached its boundary, observes the failure, then exercises recovery and restores owned conditions."
adapted = "A safe server fixture can supply the fault boundary when the browser cannot intercept requests; without any suitable mechanism, the check is recorded as blocked. Setup that reaches a test condition is labeled as setup and never bypasses the action being claimed, and owned probe changes are restored, also after a failed attempt."

[[sources.ideas]]
idea = "A suspected defect ends as reproduced, not reproduced under the tested conditions, or inconclusive or blocked. A missing trigger, route, permission or measurement never clears the product, and a harness that drove or measured the wrong thing is not a product failure."
serves = "Keeps both false alarms and false all-clears out of the report."
where = [
  "references/browser-evidence.md#decide-and-report",
  "references/browser-evidence.md#drive-and-observe",
]
shapes = "Opens the decision section with the three outcomes and the condition for withdrawing a claim, and makes missing samples in the layout and performance row an open result rather than a pass."

[[sources.declined]]
feature = "Playwright as the default browser driver, with probe recipes written against its page API."
reason = "The skill uses the host's supported browser tools and the project's harness, and inspects their actual capabilities before choosing a probe."

[[sources.declined]]
feature = "Fixed viewport widths and minimum target sizes as pass thresholds."
reason = "Thresholds and supported states come from the project, not the donor's numeric defaults."

[[sources.declined]]
feature = "Running the full probe battery on every resolved route when no earlier audit narrowed the scope, or a capture matrix across viewports, themes and locales."
reason = "The claim decides the probes; required coverage stays without a mandatory full-site audit."

[[sources.declined]]
feature = "Findings keyed to UI rule IDs in a fixed evidence schema."
reason = "Results use the project's existing proof format, and a short task needs a short record."

[[sources.declined]]
feature = "At least two runs before any failure is reported."
reason = "Uncertain or timing-sensitive observations are repeated when that can resolve them; a deterministic captured failure needs no fixed repeat count."


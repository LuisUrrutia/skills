id = "superpowers-verification"
author = "Jesse Vincent / obra"
repository = "https://github.com/obra/superpowers"
remote = "git@github.com:obra/superpowers.git"
ref = "refs/heads/main"
license = "MIT; original notice retained in THIRD-PARTY-NOTICES.txt"
role = "ideas"
baseline_commit = "bb92a77741419a4ab5f06e711a283343f1ada0c3"
reviewed_through = "bb92a77741419a4ab5f06e711a283343f1ada0c3"
baseline_paths = ["skills/verification-before-completion/SKILL.md", "LICENSE"]
paths = ["skills/verification-before-completion/SKILL.md", "LICENSE"]

[[sources.ideas]]
idea = "A claim gate: before any success statement, name the exact claim and the check whose output would prove it, run that check after the last relevant change, read its full output and exit status, and state only what the output supports."
serves = "Prevents success claims from stale, partial or imagined results."
where = [
  "SKILL.md#1-name-the-claim-and-what-would-prove-it",
  "SKILL.md#5-keep-evidence-that-proves-it",
  "SKILL.md#8-report-what-the-evidence-supports",
]
shapes = "Puts naming the claim and its proving check first, before the repo interview, so every later step serves that check; the evidence step reads full output and exit status, and the report claims completion only on current supporting evidence."

[[sources.ideas]]
idea = "Each common claim has one kind of supporting evidence and named non-evidence: tests pass needs the current test run with zero failures, a build needs the real build rather than lint, a fixed bug needs its original symptom exercised, a regression test needs an observed failure before the fix, delegated work needs its diff and artifacts rather than its report, and requirements need each criterion checked."
serves = "Gives the agent one scannable rule for what proves each kind of claim, instead of scattered prose."
where = ["SKILL.md#1-name-the-claim-and-what-would-prove-it"]
shapes = "Adds the claim, evidence and non-evidence table to the first step."
adapted = "A row for user-visible behavior is added locally, the linter row is left out, and freshness follows relevant inputs rather than the current message."

[[sources.declined]]
feature = "Requiring that the verification command ran in the current message before any claim."
reason = "Evidence stays valid while its inputs and conditions are unchanged; a relevant edit, build, data reset or environment change requires a rerun, and a new chat message alone does not."

[[sources.declined]]
feature = "Red-flag word lists and rationalization tables."
reason = "The claim table and the report rules state what each claim needs; lists of forbidden phrasing add text without changing which check runs."


id = "pstack-performance-evidence"
author = "Lauren Tan / pstack"
repository = "https://github.com/cursor/plugins"
remote = "git@github.com:cursor/plugins.git"
ref = "refs/heads/main"
license = "MIT; original notice retained in THIRD-PARTY-NOTICES.txt"
role = "ideas"
baseline_commit = "e43c7ee26e0038c6c1fa8380dd34ce86ff94cb2a"
reviewed_through = "e5136d82418d2db3165ea1050d17577cd618cc05"
baseline_paths = [
  "pstack/skills/benchmark-checklist/SKILL.md",
  "pstack/skills/principle-explain-the-number/SKILL.md",
  "pstack/LICENSE",
]
paths = [
  "pstack/skills/benchmark-checklist/SKILL.md",
  "pstack/skills/principle-explain-the-number/SKILL.md",
  "pstack/LICENSE",
]

[[sources.ideas]]
idea = "A performance number counts only for work that completed correctly inside the measured region: asynchronous work is awaited, lazy results are consumed, the intended path runs, and outputs or side effects match the contract. Successes, errors, timeouts and retries are counted separately, because a faster rejection or skipped work is not a speedup."
serves = "Prevents speedups that come from work that failed or never happened."
where = ["references/performance-evidence.md#define-what-the-number-must-prove"]
shapes = "Adds an inspection of the harness boundary before any number is accepted, and makes missing work or correctness evidence leave the claim unproved."
adapted = "Caching is judged against the claimed workload, not treated as an automatic defect."

[[sources.ideas]]
idea = "A comparison records the build, runtime, data, workload, concurrency, warm-up, cache state and environment, matches the conditions the claim holds constant, and names intentional differences."
serves = "Prevents a difference in setup from being reported as a difference in implementation."
where = ["references/performance-evidence.md#make-the-comparison-meaningful"]
shapes = "Opens the comparison section with the recorded and matched conditions, and separates a deployed-configuration claim from an adoption decision."
adapted = "A comparison of configurations as deployed stays a valid narrower claim. An adoption choice must resolve material configuration differences or justify them from the user's actual constraints; otherwise it stays unresolved."

[[sources.ideas]]
idea = "A comparison defines a meaningful difference, run budget and stopping rule before running, then uses enough repetitions for the decision, interleaves runs when drift could bias one side, and reports sample counts and variation with failures and exclusions kept."
serves = "Prevents noise, favorable run selection or a short streak from being read as a real difference."
where = [
  "references/performance-evidence.md#define-what-the-number-must-prove",
  "references/performance-evidence.md#make-the-comparison-meaningful",
]
shapes = "Puts the decision criteria before any run and adds the repetition paragraph to the comparison section."
adapted = "Repetitions and thresholds come from the decision and the project's conventions, not a universal count. A requested single run is labeled as one observation; it still needs completed-work and correctness checks and cannot select a winner or establish a durable regression."

[[sources.ideas]]
idea = "Explaining a number is separate from scoring it. Profiling and intrusive tracing run in a diagnostic run whose timings are not scored, the load generator and measurement overhead are watched because a saturated driver limits the result, and a claimed bottleneck needs runtime evidence linked to the code path."
serves = "Prevents instrumented or driver-bound timings and guessed causes from passing as findings."
where = [
  "references/performance-evidence.md#check-relevance-and-explanation",
  "references/performance-evidence.md#report-and-return",
]
shapes = "Opens the relevance section with the separation of diagnostic and scored runs, and makes the report distinguish a measured effect from an established cause."
adapted = "An honest bounded observation may report a measured difference and leave its mechanism unresolved."

[[sources.ideas]]
idea = "A result is checked against what the changed part and the available resources can explain: a gain beyond known workload, resource or time budgets points to wrong units, counters, boundaries, skipped work or changed conditions, and a micro-benchmark gain stays local until the end-to-end path a user waits on is measured."
serves = "Prevents impossible gains and unmeasured application-level claims."
where = ["references/performance-evidence.md#check-relevance-and-explanation"]
shapes = "Adds the budget check and the end-to-end requirement for user-facing claims to the relevance section."

[[sources.declined]]
feature = "Calling a measured difference inconclusive until its limiter is named."
reason = "A bounded observed effect does not need a proven limiter; only a causal claim needs runtime evidence linked to the path."

[[sources.declined]]
feature = "Fixed procedure steps: uptime and nproc before every run, at least five alternating runs per side, and a rank-sum test for close calls."
reason = "Repetition and statistics follow the decision and the project's benchmark conventions."

[[sources.declined]]
feature = "A PR body limited to one primary number."
reason = "Raw results are linked in the project's existing evidence format, and verification grants no publication."

[[sources.declined]]
feature = "Automatic profiling, tuning an untuned side and measuring again before a verdict, and hillclimb loops."
reason = "Verification does not authorize tuning; the verdict returns to the caller, and broader optimization follows its own authorized task."

[[sources.declined]]
feature = "The orchestration and PR procedures of pstack's prove-it-works principle and its perf-issue, hillclimb and opening-a-pr playbooks, or tracking those files as sources."
reason = "They were read only as context for the evidence criteria; this source covers the benchmark checklist and the explain-the-number principle."


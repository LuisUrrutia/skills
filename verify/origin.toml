[[sources.ideas]]
idea = "Only the probes and conditions that can decide the claim run, and the session under them is recorded: build or input identity, URL, fixture and role, viewport, and the theme, locale, cache or network conditions."
serves = "Keeps browser work proportionate and each observation reproducible under known conditions."
where = ["references/browser-evidence.md#select-the-journeys-and-conditions"]
shapes = "Makes probe choice depend on the claim and adds the conditions record."
adapted = "Required coverage from the caller and the feature map stays, sampling is explained, and the selection is never a mandatory full audit or a cross product of viewports, themes, locales and states."

[[sources.ideas]]
idea = "A requested condition counts only after it is observed to take effect: the fixture loaded, the setting applied, the fault reached its request. Identical captures of states that should differ point to a condition that never took effect, so the distinguishing state is asserted before capturing again."
serves = "Prevents proof of a state that was never applied."
where = [
  "SKILL.md#4-drive-it-the-way-a-user-does",
  "references/browser-evidence.md#drive-and-observe",
  "references/browser-evidence.md#select-the-journeys-and-conditions",
]
shapes = "States the general rule once in the drive step and adds the duplicate-capture check to the screenshot paragraph of the browser reference."

[[sources.ideas]]
idea = "Each browser probe decides from the effective runtime state and guards against its typical false positive: page overflow is separated from an intentional scroll region, and a theme or locale counts only after the app shows it applied."
serves = "Prevents confident findings from proxies such as emulated media or a resized window."
where = ["references/browser-evidence.md#drive-and-observe"]
shapes = "Gives the narrow and wide layouts and the theme and locale rows of the probe table their deciding evidence and false-positive guard."

[[sources.ideas]]
idea = "Captures are opened and inspected before reporting; an uninspected capture stays unreviewed, and a capture failure is a visual-evidence gap even when DOM checks pass."
serves = "Keeps screenshots from becoming unexamined decoration."
where = ["references/browser-evidence.md#drive-and-observe"]
shapes = "Opens the screenshot paragraph of the browser reference with the inspection rule."

[[sources.ideas]]
idea = "An injected fault counts only after it is observed to reach the intended request or boundary; the probe observes the failure, then exercises the recovery control and confirms its new request or action and the final state."
serves = "Prevents error-handling claims from an interceptor that never matched or a retry that happened automatically."
where = ["references/browser-evidence.md#control-probes-without-replacing-the-behavior"]
shapes = "Adds the section that confirms the fault reached its boundary, observes the failure, exercises recovery and restores owned conditions."
adapted = "A safe server fixture can supply the fault boundary when the browser cannot intercept requests; without any suitable mechanism the check is recorded as blocked."

[[sources.ideas]]
idea = "A suspected defect ends as reproduced, not reproduced under the tested conditions, or inconclusive or blocked. A missing trigger, route, permission or measurement never clears the product, and a harness that drove or measured the wrong thing is a harness failure, not a product defect."
serves = "Keeps both false accusations and false all-clears out of the report."
where = [
  "SKILL.md#8-report-what-the-evidence-supports",
  "SKILL.md#7-resolve-failures-within-authority",
  "references/browser-evidence.md#decide-and-report",
]
shapes = "Ends the accounting paragraph of the report step with the three outcomes, and adds the harness-failure rule to the failure classification."

[[sources.declined]]
feature = "The focus-walk, target-size and axe-scan probes, and keyboard, reduced-motion and accessibility rows in the browser probe table."
reason = "The interface checks invariant: those checks belong to the accessibility skill."

[[sources.declined]]
feature = "Playwright as the default browser driver, with probe recipes written against its page API."
reason = "The skill uses the project's harness and the host's tools, and inspects their actual capabilities before choosing a probe."

[[sources.declined]]
feature = "Fixed viewport widths as pass thresholds, the full probe battery on every resolved route, and findings keyed to UI rule IDs in a fixed evidence schema."
reason = "The claim decides the probes, thresholds come from the project, and results use the project's existing proof format."


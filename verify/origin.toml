[[sources.ideas]]
idea = "Application behavior is verified through a project-local verify-<app> recipe whose launch, doctor, drive, evidence and cleanup sections give the exact procedure for that app."
serves = "Every run drives the app the same proven way instead of an improvised script."
where = ["SKILL.md#verify", "SKILL.md#match-scope-to-the-claim"]
shapes = "Splits ownership between this skill and the recipe in the opening paragraph, and adds a recipe-resolution step to scoping before any driving."
adapted = "The recipe is resolved by registered name from the installed catalog or from skills the caller supplies, on any host. A supplied recipe guides execution without a global installation and is described as supplied context, not as an invoked skill."

[[sources.ideas]]
idea = "The project's feature map lists each user-facing feature with its source-grounded entry points. A change selects its affected mapped features and entry points, and a full-application request covers the whole map."
serves = "Scope follows what users can actually reach instead of a convenient sample."
where = ["SKILL.md#match-scope-to-the-claim"]
shapes = "Makes the affected mapped features and entry points the unit of scope, and requires reading the map before driving."

[[sources.ideas]]
idea = "Proof drives the real user entry point, captures the action and the resulting state, and checks side effects through an independent observation. Internal setters, test-only endpoints or mocks of the claimed behavior cannot substitute, a dry-run is checked for what it actually does, and proof is kept apart from disposable state so it survives teardown."
serves = "Prevents passing results that never exercised what a user does, and evidence lost in cleanup."
where = ["SKILL.md#run-against-the-actual-state"]
shapes = "Adds the paragraph that requires real entry points, action and result, and independent side-effect checks, and ends the cleanup paragraph with a check that proof survives teardown."

[[sources.ideas]]
idea = "Failures are classified from source and execution evidence as a product failure, recipe or harness drift, or an unavailable prerequisite. Doctor runs again after a failure or surprise, the instance is reset or relaunched when its state cannot be shown usable, and owned resources are cleaned up on every failed attempt and after the final run."
serves = "Prevents blaming the product for harness faults, collecting green results from a corrupted instance, and leaving stray processes."
where = ["SKILL.md#run-against-the-actual-state", "SKILL.md#resolve-failures-within-authority"]
shapes = "Adds the doctor, reset and cleanup paragraph to the run section, and opens the failure section with the three-way classification."
adapted = "This skill classifies and reports recipe drift but does not repair the recipe: recipe corrections go to the verification-authoring skill and requested diagnosis or repair to the debug skill. An unchanged retry needs a stated reason, and the original failed result stays visible."

[[sources.declined]]
feature = "A Cursor-specific recipe location under .cursor/skills/, and tmux or a fixed browser tool as the way to drive the app."
reason = "The skill resolves the recipe by registered name on the current host and uses the host's supported tools."


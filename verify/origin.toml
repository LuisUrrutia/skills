[[sources.ideas]]
idea = "Journeys come from the diff: each changed file maps to the screens, routes or commands that use it (a component to every page that renders it, a layout to the key pages, a handler to its routes), and each is expanded into entry, action, expected result, destination and aftermath, following side effects such as a sent notification to their real end state."
serves = "Without a feature map, verify still selects the right paths and does not stop at \"it renders\"."
where = [
  "SKILL.md#1-name-the-claim-and-what-would-prove-it",
  "references/browser-evidence.md#select-the-journeys-and-conditions",
]
shapes = "Makes the path mapping and the five-part journey the second paragraph of the first step, before anything is driven."

[[sources.ideas]]
idea = "The change decides which branch conditions join a journey: empty, error, permission, re-entry and edge cases, and adjacent regressions through shared code."
serves = "Covers the states a change can break besides the happy path."
where = [
  "SKILL.md#1-name-the-claim-and-what-would-prove-it",
  "references/browser-evidence.md#select-the-journeys-and-conditions",
]
shapes = "Adds the branch conditions to the path mapping of the first step and to journey selection in the browser reference."

[[sources.declined]]
feature = "Reusing whatever server already listens on the port, and reading the port from .env files."
reason = "Doctor requires the port to be owned by this run or a sharing the caller allowed, and env files are not read for values."

[[sources.declined]]
feature = "Auto-fixing small breakages with regression tests and commits, judging scenarios against personas as a verdict, a committed dogfood report, an agent-browser-only driver, mandatory flow diagrams and Compound Packs."
reason = "Verification grants no repair or publication authority, product requirements decide expected behavior, and a short task needs a short record."

[[sources.declined]]
feature = "Accessibility checks in the cross-cutting test matrix."
reason = "The interface checks invariant: accessibility checks belong to the accessibility skill."


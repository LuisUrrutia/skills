paths = ["skills/verification-before-completion/SKILL.md", "LICENSE"]

[[sources.ideas]]
idea = "A completion claim is matched to the exact check that proves it and rests on that check's current output and exit status, read in full, including failures, skips, timeouts and missing prerequisites. An exit 0 with no relevant assertions or no discovered tests does not prove the requested behavior."
serves = "Prevents reporting success that the executed checks do not show."
where = [
  "SKILL.md#run-against-the-actual-state",
  "SKILL.md#deliver-evidence-that-matches-the-claim",
]
shapes = "Ties evidence to its revision or input, command, environment and outputs in the run section, and makes the final claim depend on current evidence for every required check."
adapted = "Current means the evidence's inputs, code and environment are unchanged, not that it appeared in the current message; a relevant change triggers a rerun of the affected checks only. A partial pass is kept and reported with the passing subset, failures and blocked checks named; it never becomes \"tests pass\" or \"done\"."

[[sources.ideas]]
idea = "Earlier logs, another agent's summary, lint or typechecking, and confident reasoning do not replace current behavioral or build evidence. A delegated artifact is useful input, but its decisive claims are checked against the actual artifacts and execution."
serves = "Prevents secondhand or inferred success from standing in for observed results."
where = [
  "SKILL.md#run-against-the-actual-state",
  "SKILL.md#resolve-failures-within-authority",
  "SKILL.md#deliver-evidence-that-matches-the-claim",
]
shapes = "Rules out old logs and other agents' summaries as current results, keeps missing execution access a blocker instead of a reason for source inspection, and makes the final check recheck a delegated artifact's decisive claims."

[[sources.declined]]
feature = "Requiring that the verification command ran in the current message before any claim."
reason = "Evidence stays valid while its inputs and conditions are unchanged; a relevant edit, build, data reset or environment change requires a rerun, and a new chat message alone does not."


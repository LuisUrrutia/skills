[[sources.ideas]]
idea = "Decision records follow the project's record format and status conventions and separate context, considered alternatives, the decision and its consequences. Accepted history is preserved: a superseding decision or dated correction is added instead of rewriting the past to match today's code."
serves = "Keeps the reasoning behind past decisions trustworthy as the code changes."
where = ["references/document-types.md#decision-records"]
shapes = "Adds a decision-record section that requires the project's format and a superseding record instead of an edit of history."

[[sources.ideas]]
idea = "Documentation keeps current behavior distinct from proposals, planned releases, historical decisions and unknowns. Code establishes behavior but not why it was chosen or whether it is approved policy, and missing rationale stays unknown."
serves = "Prevents a document from presenting a guess or a plan as fact."
where = [
  "SKILL.md#find-the-reader-source-and-destination",
  "references/document-types.md#decision-records",
]
shapes = "Adds an evidence rule to the source step and requires consequential contradictions to be surfaced instead of resolved silently."
adapted = "Missing rationale goes to the explain-decisions skill when available instead of being invented, and a documentation edit does not itself approve an architectural decision."

[[sources.declined]]
feature = "Copied technology-specific examples, such as TypeScript and JSDoc API documentation snippets."
reason = "Examples follow the project's own language and framework."

[[sources.declined]]
feature = "Documentation of every public API as a mandatory rule."
reason = "Reference coverage follows the dimensions that actually apply to the interface the reader looks up."

[[sources.declined]]
feature = "Creating an ADR automatically for each significant decision."
reason = "A documentation edit does not approve an architectural decision; decision records follow the request and the project's conventions."


format_version = 2
skill = "write-documentation"
created = "2026-10-04"
approach = "derive"
goal = "Create, update or review human-facing documentation, such as guides, READMEs, API references, runbooks and decision records, so that its intended reader can understand or complete a task from accurate, findable information. Success is content that serves the reader's task, source claims that are supported or explicitly qualified, applicable checks that pass, and a report that names any validation that could not run."

[[invariants]]
rule = "This skill owns documentation structure, source accuracy, examples and validation. The communicate-clearly skill owns prose and voice, the agent-instructions skill owns instructions for agents, and the explain-decisions skill investigates missing decision rationale."
where = ["SKILL.md#write-documentation", "references/document-types.md#decision-records"]

[[invariants]]
rule = "A documentation request does not authorize a production migration, deployment, message or destructive operation because a guide contains its command. Documentation maintenance does not by itself create a docs platform, glossary, CI workflow, policy file or publication step."
where = ["SKILL.md#verify-what-the-reader-will-use", "SKILL.md#integrate-and-finish"]

[[invariants]]
rule = "The project's existing documentation conventions, useful structure and mixed pages, generated-file ownership and user edits are preserved, and examples follow the project's language and framework. A page is not moved or split only to impose a preferred taxonomy."
where = [
  "SKILL.md#find-the-reader-source-and-destination",
  "SKILL.md#organize-for-the-task",
  "SKILL.md#integrate-and-finish",
  "references/document-types.md#document-types",
]

[[invariants]]
rule = "Clarity principles apply in every output language, but English-specific grammar, punctuation and controlled vocabulary are adapted to the target language, and the skill claims no ASD-STE100 compliance."
where = ["SKILL.md#integrate-and-finish"]

[[invariants]]
rule = "The skill is portable prose instructions with no upstream runtime, script or network dependency."
where = ["SKILL.md"]


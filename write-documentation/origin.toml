[[sources.ideas]]
idea = "Content checks depend on the document type instead of a universal list. A README or entry page explains what the project does, who the page is for and where to start, with a working first-use path when relevant; task guides, tutorials, references and decision records have their own checks."
serves = "Applies the checks that matter for each document without demanding irrelevant sections."
where = [
  "references/document-types.md#document-types",
  "references/document-types.md#readme-and-entry-pages",
]
shapes = "Adds a reference of content checks per document type that are explicitly not mandatory headings."
adapted = "A README matches the repository's actual audience: an internal or contributor README stays one and need not become a public page."

[[sources.ideas]]
idea = "Behavior, defaults, commands, limits and examples are checked against code, configuration, tests or current primary documentation, and the documented path that the change affects is followed in order with its expected output."
serves = "Prevents documentation that describes behavior the product does not have."
where = [
  "SKILL.md#find-the-reader-source-and-destination",
  "SKILL.md#verify-what-the-reader-will-use",
]
shapes = "Puts a source check before writing and an execution check of the documented path before finishing."

[[sources.ideas]]
idea = "Documentation-specific checks run before finishing: the project's documentation build, link, schema and example checks, and its established generator for generated documentation instead of edits to derived output."
serves = "Catches broken links, builds and examples before readers find them."
where = ["SKILL.md#verify-what-the-reader-will-use", "SKILL.md#integrate-and-finish"]
shapes = "Adds the project's documentation checks to verification and requires affected navigation and links to be updated."

[[sources.declined]]
feature = "Fixed conventions such as US English as the default spelling, a docs/ directory organized by type, one documentation type per file, and prose lint in CI for every docs change."
reason = "The project's existing conventions apply, and documentation maintenance does not create a CI workflow by itself."

[[sources.declined]]
feature = "Moving build, workspace, release and coding-standard content out of the README into CONTRIBUTING.md or AGENTS.md by default."
reason = "An internal or contributor README serves a legitimate audience."

[[sources.declined]]
feature = "Writing in a private voice profile and preparing text ready to publish to a registry or site."
reason = "The communicate-clearly skill owns voice, and documentation maintenance does not create a publication step."


reviewed_through = "dbd4588f9e1033efb41dad4bef2f7947c8993d44"
baseline_paths = ["skills/doc-coauthoring/SKILL.md", "README.md"]
paths = ["skills/doc-coauthoring/SKILL.md", "README.md"]

[[sources.ideas]]
idea = "The result is read without private conversation context: can a reader with the stated prerequisites find the entry point, supply the required inputs, follow the path and recognize the outcome? For a complex or high-consequence guide, an independent reader check can expose hidden assumptions when it is available and authorized."
serves = "Finds gaps that the author cannot see because the author already knows the missing context."
where = ["SKILL.md#verify-what-the-reader-will-use"]
shapes = "Closes verification with a cold read, then repair and a rerun of the affected checks."
adapted = "The independent check is proportionate and optional, and model feedback counts as a check of one sample, not proof of universal comprehension."

[[sources.declined]]
feature = "A three-stage co-authoring workflow (context gathering, refinement with section-by-section approval, reader testing) as the default path."
reason = "The skill infers the reader and task from the request and existing documentation and asks only about a material unresolved choice; a small correction needs no planning interview."

[[sources.declined]]
feature = "A nested review panel or a Claude-specific runner for reader testing."
reason = "The reader check stays proportionate and works with whatever independent reviewer the host provides."


[[sources.ideas]]
idea = "Structure follows what the reader needs: guided learning, completing a known task, looking up a fact, or understanding an explanation. These Diataxis distinctions choose the structure of a page or a section."
serves = "Lets each reader find the kind of help they came for without wading through the other kinds."
where = ["SKILL.md#organize-for-the-task", "references/document-types.md"]
shapes = "Makes the reader's need the first decision of the organizing step and keys the content checks to these document types."
adapted = "The distinctions can apply to sections, so a useful mixed README or existing page stays intact instead of being split into one document per mode as the donor requires."

[[sources.ideas]]
idea = "Prerequisites and consequential conditions come before the actions they govern, and side effects are described before a consequential action."
serves = "Prevents a reader from acting before learning what the action needs or what it will change."
where = [
  "SKILL.md#organize-for-the-task",
  "references/document-types.md#task-guides-runbooks-and-troubleshooting",
]
shapes = "Fixes the order inside guides: conditions and side effects precede the steps they affect."

[[sources.ideas]]
idea = "Terminology stays stable and exact: identifiers, placeholders, required markup and units are preserved, and terms are checked against the relevant code and configuration."
serves = "Prevents a reader from searching for a synonym that does not exist in the product."
where = ["SKILL.md#find-the-reader-source-and-destination", "SKILL.md#organize-for-the-task"]
shapes = "Adds terminology to the source-accuracy check and adds preservation of identifiers and placeholders to the rules for examples."

[[sources.declined]]
feature = "Sentence-length limits, a list of banned words and the STE instruction rules applied as fixed constraints."
reason = "Clarity principles transfer across languages, while English-specific rules are adapted to the target language."

[[sources.declined]]
feature = "Mandatory invocation of the unslop skill on every text."
reason = "The communicate-clearly skill owns prose and voice."

[[sources.declined]]
feature = "Teaching through the how and why skills with build-up diagram series and generated whiteboard images."
reason = "A tutorial teaches only what its path requires, visuals are used when they clarify, and missing rationale goes to the explain-decisions skill."


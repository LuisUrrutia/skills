[[sources.ideas]]
idea = "Structural diagrams are derived from inspected code and limited to the decision under review. They show actual owners, gates and important failure paths, distinguish an existing path from a proposed one, and never stand in for execution evidence."
serves = "Makes the shape of a change understandable without implying that it ran or works."
where = ["references/visual-evidence.md#diagrams"]
shapes = "Adds a diagram section that ties edges and labels to inspected code and keeps execution evidence separately identified."
adapted = "Diagrams use native GitHub Mermaid inside the repository template's sections, as the smallest useful view, instead of the donor's fixed change-outline section."

[[sources.declined]]
feature = "A fixed body template with a one-sentence Why section, one to three notes and a change outline."
reason = "Written repository rules and the template on the resolved base govern the body."

[[sources.declined]]
feature = "A final answer that lists every changed file."
reason = "The review entry point names the owning module, invariant or critical path instead of a file inventory."

[[sources.declined]]
feature = "Committing task changes and saving the description under .humanlayer/tasks while describing the PR."
reason = "Scratch evidence stays out of commits unless convention or the user asks, and the commit skill owns commits."


[[sources.ideas]]
idea = "Screenshots and recordings reach the PR body through gh pr create or gh pr edit with --attach, which uploads each file and rewrites matching local Markdown references to the uploaded URLs. A local screenshot path is not an attachment."
serves = "Puts real visual evidence where reviewers can see it."
where = ["references/attachments.md#place-and-upload", "references/review-packet.md#evidence-and-continuity"]
shapes = "Makes upload part of the same create or edit operation, with local references placed in the body file first."
adapted = "Only the upload route comes from gh. What to capture, its provenance, current-head claims, the repository template and the publication authorization stay with this skill. Direct attachment to the PR body is preferred over a comment or another route."

[[sources.ideas]]
idea = "The installed command's help establishes which flags exist. After any upload attempt, even a nonzero exit or timeout, the exact PR body is read back as structured state, because uploads stop at the first failure and earlier files, a pushed branch or other metadata can already have changed."
serves = "Prevents retries that duplicate uploads or a report of success that did not happen."
where = [
  "references/attachments.md#select-the-available-route",
  "references/attachments.md#verify-and-recover",
  "references/publication.md#verify-the-result",
]
shapes = "Starts the attachment route with a capability check and adds a read-back and recovery section after every upload."
adapted = "Recovery keeps already uploaded URLs, retries only the missing files, and checks rendering in an authorized view, because upload success alone is not a visual check."

[[sources.declined]]
feature = "A dependency on the gh agent skill, skill installation with gh skill, and release publishing."
reason = "PR attachments need only the installed gh command; gh skill manages agent skills, not PR images."

[[sources.declined]]
feature = "Installing or upgrading gh automatically when --attach is missing."
reason = "Tools are not installed or updated as a side effect of drafting a PR; another available route is used or the gap is reported."

[[sources.declined]]
feature = "Checking out a PR into a worktree with gh pr checkout --worktree."
reason = "The worktrunk skill owns the worktree lifecycle."


[[sources.ideas]]
idea = "The body gives the reviewer the change's purpose, what ran against which revision and what it proved, and where review should begin: the owning module, invariant or critical path rather than every changed file."
serves = "Gives the reviewer an entry point and a basis for trusting the result."
where = ["references/review-packet.md#title-and-body"]
shapes = "Turns purpose, validation and review entry point into questions the body answers, each in one line unless the reviewer needs more, with each check's revision, outcome and limits on its line."

[[sources.ideas]]
idea = "History is judged by reviewer effort. When independent concerns could be reviewed and reverted separately, the skill recommends a split; it does not rewrite published history, reorder a stack, or separate a behavior from its regression test only to shorten the diff."
serves = "Keeps the PR reviewable without breaking published history or the link between behavior and test."
where = ["SKILL.md#understand-the-change-and-repository"]
shapes = "Adds a split check after the diff is understood and limits its outcome to a recommendation."
adapted = "There is no automatic rewrite and no grouping of commits by file type; a behavior stays with its required tests."

[[sources.declined]]
feature = "Regrouping commit history by layer (schema, core logic, wiring, UI, tests) and force-pushing the rewritten branch."
reason = "The skill only recommends a split when it helps review, and a behavior stays with its regression test."

[[sources.declined]]
feature = "Branching from and comparing against origin/main."
reason = "The base is an explicit verified base or the target repository's default, fetched through the target's SSH remote; local main is not trusted."

[[sources.declined]]
feature = "Calling out the rollout plan in the reviewer guidance."
reason = "Rollout reaches the body only as a gate with its default state or a merge or deploy prerequisite; on 2026-10-08 the user rejected release sequencing in a PR body."


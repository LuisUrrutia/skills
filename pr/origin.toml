id = "matt-reviewable-pr"
author = "Matt Pocock"
repository = "https://github.com/mattpocock/skills"
remote = "git@github.com:mattpocock/skills.git"
ref = "refs/heads/main"
license = "MIT; notice retained in THIRD-PARTY-NOTICES.txt"
role = "ideas"
baseline_commit = "d81f3a183412e71a5b1e84ca21bc1a35eea03a60"
reviewed_through = "59db609eb1e18aaf59b63284d0e52255aff0c63c"
baseline_paths = ["skills/engineering/pr/SKILL.md", "LICENSE"]
paths = ["skills/engineering/pr/SKILL.md", "LICENSE"]

[[sources.ideas]]
idea = "A visual is chosen for a concrete review question, and the smallest view that answers it is used: a flow or sequence for what happens to a request, a before-and-after dependency view or call tree for moved ownership, genuine screenshots for a visible change, and a measured comparison for cost or performance."
serves = "Makes the change faster to assess without burying the reviewer in diagrams."
where = ["references/visual-evidence.md#visual-evidence-for-a-pr", "SKILL.md#compose-for-review"]
shapes = "Organizes visual evidence as a table from review question to the smallest useful view, and makes a visual conditional on answering such a question."
adapted = "The view is chosen by the review question, not offered as a menu of formats; a trivial change gets no diagram."

[[sources.ideas]]
idea = "Evidence that the change works is shown as a before and after of the same scenario: genuine screenshots for a visible change, or commands and results from the current head for behavior."
serves = "Lets the reviewer see the effect of the change instead of trusting a description of it."
where = [
  "references/visual-evidence.md#screenshots-and-recordings",
  "references/review-packet.md#title-and-body",
]
shapes = "Requires matched scenario, data, viewport and revisions for before-and-after captures, and adds a before-and-after example to the body opening when it makes a trigger or boundary concrete."
adapted = "When no honest baseline exists, a labeled current-state capture replaces the before view; a baseline is never invented."

[[sources.ideas]]
idea = "The body assesses what needs care when merging or deploying the diff: migration, compatibility, deploy order, rollback, or an irreversible external effect, stated as concrete consequences rather than a generic risk label."
serves = "Tells the reviewer whether the change can be walked back and who it can break."
where = ["references/review-packet.md#title-and-body", "references/claims.md"]
shapes = "Adds a merge-and-deploy question to the list of questions the body covers where they matter, and a claim class that requires facts for risk and impact."
adapted = "Asked as a question where it matters, not as a mandatory Merge Danger section with door and blast-radius labels."

[[sources.declined]]
feature = "A mandatory Summary, Evidence and Merge Danger body skeleton."
reason = "Repository rules, templates and the actual review need set the format."


  "skills/ce-commit-push-pr/references/apply-and-handoff.md",
  "LICENSE",
]

[[sources.ideas]]
idea = "The title and body describe the outcome of the whole change at the scope the branch delivers. The outcome comes from every commit and the full base-to-head diff, not from the latest commit, the branch name or an issue title."
serves = "Prevents a title or opening that describes one commit or the original ask instead of what the PR delivers."
where = [
  "SKILL.md#understand-the-change-and-repository",
  "references/review-packet.md#title-and-body",
]
shapes = "Requires reading every commit and the full diff before composing, and makes the delivered outcome the subject of the title and the body opening."

[[sources.ideas]]
idea = "A failed or incomplete lookup is unknown, never an empty result. The exact PR is matched by branch and head repository and rechecked immediately before creation, and a failed write is inspected before any retry."
serves = "Prevents duplicate PRs and false success reports after a failed query or a timeout."
where = [
  "SKILL.md#establish-identity-and-scope",
  "references/publication.md#create-or-update-metadata",
  "references/publication.md#verify-the-result",
]
shapes = "Makes exact-PR resolution a numbered identity step and adds a recheck immediately before creation."

[[sources.ideas]]
idea = "A sentence or section stays only when cutting it would lower the reviewer's confidence, and a navigation hint appears only when the reviewer would otherwise start in the wrong place, never as a list of changed files."
serves = "Keeps the body short enough to read before the diff without dropping what the review needs."
where = ["references/review-packet.md#title-and-body", "references/review-packet.md#evidence-and-continuity"]
shapes = "Makes the review entry point conditional and adds a per-sentence cut test to the check before delivery."
adapted = "Besides required template content, which the donor also keeps, the cut test yields to the length budget's other exceptions, such as merge/deploy care and others' preserved notes."

[[sources.declined]]
feature = "Previewing a rewritten description and asking for confirmation before editing an existing PR."
reason = "An existing request or standing authorization covers the update, so it needs no second approval."

[[sources.declined]]
feature = "A Compound Engineering branding footer and a concept-teaching section with an archived explainer document."
reason = "The body holds only what helps assess the diff and carries no promotional footer."

[[sources.declined]]
feature = "Creating a new branch whenever work sits on the default branch or a detached HEAD."
reason = "The skill publishes the intended commits to a verified destination; a new branch is not mandatory."

[[sources.declined]]
feature = "Program-altitude framing that places the PR in a multi-PR series with lead-in and lead-out neighbors."
reason = "The body names another ticket only as a merge or deploy prerequisite; on 2026-10-08 the user rejected sibling-ticket scope in a PR body."


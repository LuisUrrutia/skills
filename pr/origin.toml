format_version = 2
skill = "pr"
created = "2026-10-03"
approach = "derive"
goal = "Publish, update or inspect one pull request so that a human reviewer understands the problem, the delivered behavior, the consequential decisions and the evidence needed to assess the change. Success is a PR with verified identity, head and base, a title and body whose every claim rests on evidence for that class of claim, the intended draft state and only the requested metadata, with a creation request continuing into follow-up."

[[invariants]]
rule = "This skill owns publication and PR presentation. The commit skill owns atomic commits, the stacked-pr skill owns stack topology, submit and cascading rebases, the pr-followup skill owns feedback, CI repair and the transition from draft to ready, and the issue-workflow skill owns linked-ticket synchronization. Checkout switches follow the host's checkout ownership and the worktrunk skill."
where = ["SKILL.md#pull-request", "SKILL.md#establish-identity-and-scope"]

[[invariants]]
rule = "An existing request or standing authorization covers its operation, including a full-body update and the relevant attachments. The skill asks only for unresolved material decisions, never for an action already authorized."
where = [
  "SKILL.md#resolve-the-operation",
  "SKILL.md#publish-and-verify",
  "references/publication.md#publication-and-identity",
  "references/attachments.md#attach-screenshots-and-recordings",
]

[[invariants]]
rule = "A request to create a PR continues into the event-driven Drive mode of the pr-followup skill after publication, including when an exact open PR already satisfies creation. Only an explicit create-only instruction, such as asking for the PR without follow-up, returns after publication."
reason = "The user set this continuation policy on 2026-10-05 and restated it on 2026-10-30: every created PR is followed up unless the user asks for it without follow-up."
where = ["SKILL.md#publish-and-verify", "references/continuation.md"]

[[invariants]]
rule = "The body includes a statement only when it helps assess this diff. Rollout appears only as a gate with its default state or as a merge or deploy prerequisite, and another ticket only as a merge or deploy prerequisite. When to enable a gate, release plans across tickets, and sibling or follow-up scope go to the user in the return."
reason = "On 2026-10-08 the user rejected release sequencing and sibling-ticket scope in a PR body."
where = ["references/review-packet.md#write-for-the-reviewer"]

[[invariants]]
rule = "A body stays within a length budget taken from the repository: the second-longest of up to ten non-empty bodies of recent merged PRs not authored by bots, with a floor of 1,000 characters, or 2,500 characters when fewer than three exist or the lookup fails. The budget is a ceiling. Only content a reviewer needs to approve safely and cannot open elsewhere, such as merge/deploy care or one-line validation results, exceeds it, and the return reports the length against the budget."
reason = "On 2026-10-29 the user rejected a body that successive Update rewrites had grown to 14.6k characters for a one-off data-fix script, in a repository whose ten most recent merged bodies ran from 120 to 3,096 characters with one at 7.9k, and asked for concise bodies with a budget anchored to recent merged PRs. Taking the second-longest keeps one outlier from setting the budget; the floor keeps a repository of near-empty bodies from removing deploy care and validation."
where = ["references/review-packet.md#length-budget", "SKILL.md#understand-the-change-and-repository", "SKILL.md#return"]

[[invariants]]
rule = "Each decision and check takes one line unless the reviewer needs more, and a check's line keeps its key result. A decision that only follows a repository template or convention gets no entry. Repository documentation gets at most a one-line summary and a pointer, and commit messages are pointed to, not restated; merge/deploy care stays in the body even when they also state it."
reason = "The user asked on 2026-10-29 for one line per decision and check and for pointers to the README and commit messages; the rejected body restated README rules and per-field counts and gave eight decisions their full rationale. Keeping key results and deploy care guards against cutting below what a reviewer needs."
where = ["references/review-packet.md#title-and-body", "references/review-packet.md#length-budget"]

[[invariants]]
rule = "An Update rewrites the body against the length budget again: a new run enters as one line and replaces the run it supersedes, the same check or environment at an older revision, and an older run stays only as one line for evidence the newer one lacks."
reason = "In the body the user rejected on 2026-10-29, each rewrite kept every earlier run and added the new one in full with sub-bullets, so its validation section grew from 1.4k to 6.4k characters across four rewrites."
where = ["references/review-packet.md#evidence-and-continuity"]

[[invariants]]
rule = "Sub-results within a run, run logs, per-item counts and traces stay out of the body. Detail that still matters goes to an artifact at the PR's visibility, never a gist or external host, or to one detail comment per PR that the body links, that later writes edit in place, and that is inspected for exposure and verified like the body. It is the only comment description work posts, this skill words it, and Draft-only returns it beside the body."
reason = "User decision on 2026-10-29: detail that still matters belongs in a linked artifact or a PR comment, not in the body. Keeping one comment edited in place stops the comments from accumulating the way the body did, and run logs of data fixes can hold production values."
where = ["references/review-packet.md#length-budget", "references/publication.md#before-writing", "references/publication.md#create-or-update-metadata", "references/publication.md#verify-the-result"]

[[invariants]]
rule = "A new PR opens as a draft unless the user's preference says ready, and publication never merges as a side effect."
where = [
  "SKILL.md#resolve-the-operation",
  "SKILL.md#publish-and-verify",
  "references/publication.md#create-or-update-metadata",
  "references/publication.md#verify-the-result",
]

[[invariants]]
rule = "Written repository rules and the template on the resolved base govern the body's format. An exact enforced format applies unless the user explicitly overrides it."
where = ["SKILL.md#understand-the-change-and-repository", "references/review-packet.md#title-and-body"]

[[invariants]]
rule = "Visual evidence is genuine: a screenshot is an observed capture of the stated revision, uploaded where the intended reviewers can access it. A generated or reconstructed image never stands in for runtime evidence."
where = [
  "references/visual-evidence.md#screenshots-and-recordings",
  "references/attachments.md#verify-and-recover",
]


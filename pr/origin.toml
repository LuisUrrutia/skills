id = "mblode-pr"
author = "Matthew Blode"
repository = "https://github.com/mblode/agent-skills"
remote = "git@github.com:mblode/agent-skills.git"
ref = "refs/heads/main"
license = "MIT; notice retained in THIRD-PARTY-NOTICES.txt"
role = "ideas"
baseline_commit = "51e9ae4fd21ff9b0cfe269c874b40342e8538a47"
reviewed_through = "ff92bf5ae675e8108e7d2f14b22a523fd1303e76"
baseline_paths = [
  "skills/pr-creator/SKILL.md",
  "skills/pr-creator/references/pr-polish.md",
  "LICENSE.md",
]
paths = ["skills/pr-creator/SKILL.md", "skills/pr-creator/references/pr-polish.md", "LICENSE.md"]

[[sources.ideas]]
idea = "An update rewrites the whole body from the final published diff and replaces obsolete claims instead of appending a history of successive fixes. Still-valid evidence, links and required template content carry forward after they are revalidated."
serves = "Keeps the PR copy coherent with what the branch now does."
where = [
  "references/review-packet.md#evidence-and-continuity",
  "references/publication.md#publish-the-selected-branch",
]
shapes = "The review packet owns full rewrites, stale-claim corrections and preservation; publication routes material pushes back through Update."
adapted = "Carried-forward evidence follows the invariant that a newer run replaces the run it supersedes, so rewrites do not accumulate validation."

[[sources.ideas]]
idea = "Issue coverage is claimed only when verified. A closing keyword requires coverage of every explicit ask and the authority to close the work item; otherwise a neutral reference states the remaining scope."
serves = "Prevents a merge from closing a ticket that the branch only partly delivers."
where = ["references/review-packet.md#evidence-and-continuity", "references/claims.md"]
shapes = "Adds the closing-keyword condition and a requirement to name unimplemented asks of the PR's own ticket."

[[sources.ideas]]
idea = "A reason or decision appears in the body only when a source establishes it; a rationale invented from the diff is left out rather than presented as the author's intent."
serves = "Prevents unsupported history and motivation claims."
where = ["references/claims.md", "references/review-packet.md#evidence-and-continuity"]
shapes = "Adds a claim class for design decisions that requires a user decision or document for the rationale."

[[sources.declined]]
feature = "A one-paragraph body with no test plan or validation section."
reason = "Repository rules and the review need set the structure, and useful validation evidence stays in the body."

[[sources.declined]]
feature = "Automatic history polish (squashing or restructuring noisy commits or a large diff) before pushing."
reason = "The skill recommends a split when it helps review and does not rewrite history on its own."

[[sources.declined]]
feature = "Fixed length quotas, such as a title under 60 characters."
reason = "The repository's title convention applies, and the body budget comes from the repository's own merged PRs under the invariant on the length budget; a fixed number applies only when the repository offers too few bodies."

[[sources.declined]]
feature = "PR creation triggered by a request to commit."
reason = "A PR is created only on a PR request; the commit skill owns commits."

[[sources.reviews]]
from_commit = "51e9ae4fd21ff9b0cfe269c874b40342e8538a47"
to_commit = "872bc83bdb6dd54a9ff456fbf1181beea6db7875"

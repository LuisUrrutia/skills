id = "ecc-jira-transitions"
author = "Affaan Mustafa / ECC"
repository = "https://github.com/affaan-m/ECC"
remote = "git@github.com:affaan-m/ECC.git"
ref = "refs/heads/main"
license = "MIT; notice retained in THIRD-PARTY-NOTICES.txt"
role = "ideas"

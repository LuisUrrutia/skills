paths = ["skills/engineering/setup-matt-pocock-skills/SKILL.md", "LICENSE"]

[[sources.ideas]]
idea = "Each consuming project keeps its tracker conventions in its own `docs/agents/issue-tracker.md`, or in an existing canonical policy path, and its canonical agent instructions route tracker work to that file. The project file holds destinations and transition rules; the skill holds discovery, guarded execution and evidence."
serves = "Lets one skill serve projects with different trackers and workflows without hard-coding any of them."
where = [
  "SKILL.md#issue-workflow",
  "SKILL.md#establish-identity-policy-and-event",
  "references/project-policy.md#establish-the-policy",
  "assets/issue-tracker.md",
]
shapes = "Splits ownership in the skill's opening between the project file and the skill, and makes Establish the policy create that file from the bundled template and add a routing line to the canonical agent instructions."
adapted = "The file also holds the transition map, which the donor does not supply: events, target branches, allowed source states, destinations, completion conditions and one owner per event. An existing canonical policy path is kept rather than migrated to the default name. The routing line goes into the repository's canonical AGENTS.md or CLAUDE.md, or into user-level instructions for a user-level policy the user asked for, only when edits to those instructions are authorized; it keeps the existing import arrangement, and the skill never creates both host files."

[[sources.declined]]
feature = "Setup that also establishes a triage-label vocabulary and a domain-doc layout."
reason = "Configure covers only tracker policy, and only when it is requested; ordinary synchronization creates no labels, domain docs, issues or policy."


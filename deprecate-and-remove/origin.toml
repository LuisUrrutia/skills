[[sources.ideas]]
idea = "When every consumer of an internal API is under the task's control and can move together, with no incompatible persisted or deployed version left behind, the callers are inventoried and migrated, the required behavior is verified, and the old API is removed in the same change instead of keeping a compatibility layer."
serves = "Ends dual-path maintenance as soon as the conditions allow it."
where = ["SKILL.md#choose-the-path-and-order-the-work"]
shapes = "The path section opens with the coordinated change and its conditions, and the staged retirement covers every case that fails them."
adapted = "The donor's conditions (no external user depends on compatibility, and the project can absorb a coordinated breaking change) also cover stored data, in-flight work and independently deployed versions, which can rule out an atomic change."

[[sources.declined]]
feature = "Deleting the old API at once rather than keeping any compatibility layer, with adapters allowed only as time-boxed exceptions."
reason = "Same-change removal applies only when its external-consumer and coordinated-change conditions hold; otherwise a staged retirement may keep a temporary adapter or flag with a compatibility window and a removal condition."


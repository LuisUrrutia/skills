format_version = 2
skill = "deprecate-and-remove"
created = "2026-10-05"
approach = "derive"
goal = "Retire a dependency, API or feature that the project no longer wants to maintain, with or without a replacement, while the behavior that must remain keeps working. A run ends at the stage that evidence and authority allow, with the affected consumers addressed, obsolete artifacts removed, and any outstanding stage named with its condition and owner."

[[invariants]]
rule = "Notice delivery, changes to live resources and future scheduling follow the active task's authorization. Preparing a notice is not delivering it, and retiring something grants no additional publication authority."
where = [
  "SKILL.md#replace-or-close-access",
  "references/retirement-boundaries.md#external-resources",
]

[[invariants]]
rule = "Retirement removes only obsolete artifacts. Shared contracts, required records and history, legal notices, supported-version guidance, deployed migration history, and tests that protect continuing behavior or the denial of retired entry points stay."
where = ["SKILL.md#remove-obsolete-artifacts-and-verify"]

[[invariants]]
rule = "Ending a feature is separate from disposing of its data. Required access, exports, retention and audit history are settled before any destructive data removal, and the affected records stay while those requirements are unresolved."
where = ["references/retirement-boundaries.md#persistent-data"]

[[invariants]]
rule = "Safety and recovery claims rest on the actual deployment, data and recovery evidence of each stage, not on a rule that additive changes are safe or that every change can be reversed."
where = ["references/retirement-boundaries.md#persistent-data"]

[[invariants]]
rule = "A stage advances on evidence. Elapsed time, an arbitrary rollout percentage or a fixed number of releases or deployment cycles is not proof."
where = [
  "SKILL.md#choose-the-path-and-order-the-work",
  "references/retirement-boundaries.md#versions-and-consumers",
]

[[invariants]]
rule = "Indirect-consumer investigation, replacement design, delivery ordering, guides, verification and review keep their existing local owners. This skill gives them the retirement conditions and continues with their results."
reason = "Copying their full procedures would create a second workflow."
where = [
  "SKILL.md#choose-the-path-and-order-the-work",
  "SKILL.md#remove-obsolete-artifacts-and-verify",
]

[[invariants]]
rule = "Completion is reported at the stage actually reached. Notice prepared, notice delivered, access disabled, consumers transitioned, code removed and removal deployed stay distinct, and full retirement is claimed only when every required consumer and removal condition has evidence."
where = ["SKILL.md#close-at-the-state-actually-reached"]


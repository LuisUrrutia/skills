reviewed_through = "aeac41d4d005999432bb7312f7ff06383a91d59d"
baseline_paths = ["skills/deprecation-and-migration/SKILL.md", "LICENSE"]
paths = ["skills/deprecation-and-migration/SKILL.md", "LICENSE"]

[[sources.ideas]]
idea = "The retirement is owned from the decision through closure, including the move of each affected consumer off the target. A record tracks each consumer's remaining change, its responsible owner and the evidence that permits retirement; announcing an end and leaving consumers to cope is not a transition."
serves = "Prevents a deprecation that announces an end and leaves consumers stranded."
where = [
  "SKILL.md#deprecate-and-remove",
  "SKILL.md#establish-the-retirement",
  "SKILL.md#find-consumers-and-retirement-conditions",
]
shapes = "The sections run from establishing the retirement through closure, and the consumer section keeps a proportionate record of each consumer's remaining change, owner and evidence."
adapted = "A replacement is optional, and the user's chosen replacement and product decision are kept; alternatives are investigated only while those choices remain open."

[[sources.ideas]]
idea = "A deprecation notice, the migration of consumers and the evidence that permits removal are separate steps. A notice announces the change, migration moves consumers, and the old implementation is removed only when evidence shows that no required consumer remains."
serves = "Prevents removing code that a consumer still needs, or treating a notice as a finished retirement."
where = [
  "SKILL.md#find-consumers-and-retirement-conditions",
  "SKILL.md#replace-or-close-access",
  "SKILL.md#remove-obsolete-artifacts-and-verify",
  "SKILL.md#close-at-the-state-actually-reached",
]
shapes = "Notices are prepared in the access section, removal waits for evidence in the removal section, and the closing report keeps each state distinct."
adapted = "An empty search or a lack of recent requests does not prove that an offline client, scheduled job, stored payload or external caller has stopped depending on the target; an inaccessible consumer leaves its removal condition unproven."

[[sources.declined]]
feature = "Building a production-proven replacement before deprecating anything."
reason = "Ending a feature can be the intended outcome, so a replacement is optional."

[[sources.declined]]
feature = "Defaulting to advisory deprecation, migrating consumers one at a time, and routing traffic through fixed percentage phases."
reason = "The coordinated or staged path, and each stage, follow from the real consumers, support obligations and state."

[[sources.declined]]
feature = "Treating additive schema changes as safe in any deploy, and requiring a tested down path so that every migration can be reversed."
reason = "Safety and recovery come from the actual deployment, data and recovery evidence; a down command, a feature flag or a backup does not prove recovery."

[[sources.declined]]
feature = "Removing every reference, test, document and deprecation notice of the old system."
reason = "Only obsolete artifacts go; a string that matches the old name is a lead to classify, not an instruction to delete its file."


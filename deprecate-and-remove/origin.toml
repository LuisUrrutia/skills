[[sources]]
id = "hoang-data-transition"
author = "Hoang Nguyen / Agent Skills Standard"
repository = "https://github.com/HoangNguyen0403/agent-skills-standard"
remote = "git@github.com:HoangNguyen0403/agent-skills-standard.git"
ref = "refs/heads/main"
license = "MIT; original notice retained in THIRD-PARTY-NOTICES.txt"
role = "ideas"
baseline_commit = "1fb0537c339c1e135167f4c15ba603b8849da5bc"
reviewed_through = "c72ce6d4afd3ce73420613921cb3fa871e5411d9"
baseline_paths = [
  "skills/database/database-migrations/SKILL.md",
  "skills/database/database-migrations/references/migration-safety-checklist.md",
  "LICENSE",
]
paths = [
  "skills/database/database-migrations/SKILL.md",
  "skills/database/database-migrations/references/migration-safety-checklist.md",
  "LICENSE",
]

[[sources.ideas]]
idea = "For a changing data contract, the transition is ordered so that the versions running at each step can read and write every intermediate shape: expand the schema, keep new writes compatible, migrate existing data, verify that old and new data converge, switch consumers, and contract only when old consumers and recovery requirements permit it."
serves = "Keeps old and new versions working during the transition and prevents removing a shape that something still reads."
where = ["references/retirement-boundaries.md#persistent-data"]
shapes = "The persistent-data section sets this order for a changing data contract."
adapted = "The order applies only where coexistence requires it, in a reference that is read only when the retirement reaches stored data."

[[sources.ideas]]
idea = "A long data move is bounded, its partial progress is observable, and it can resume after an interruption; the plan defines how concurrent writes stay consistent during the move."
serves = "Prevents a backfill that blocks live traffic, cannot resume, or leaves the data inconsistent."
where = ["references/retirement-boundaries.md#persistent-data"]
shapes = "A paragraph of the persistent-data section sets these requirements for any long data move."
adapted = "Writing to both shapes does not by itself establish atomicity or recovery after one of the writes fails."

[[sources.ideas]]
idea = "Locking, transaction and tool behavior come from the actual database or service documentation, because a change that looks additive can still block live traffic on some engines."
serves = "Prevents a schema change from taking a lock that stops production traffic."
where = ["references/retirement-boundaries.md#persistent-data"]
shapes = "The persistent-data section requires the engine's documentation before a change and states that an additive change is not automatically safe."
adapted = "The donor treats additive migrations as trivially reversible; locally, an additive change is not automatically safe for live traffic."

[[sources.ideas]]
idea = "Recovery is defined for each stage from its completed effects. Reverting code, reversing a schema operation, restoring records and correcting forward are different actions, and a code rollback cannot undo a destructive data change."
serves = "Prevents assuming that a code rollback recovers a destructive data change."
where = ["references/retirement-boundaries.md#persistent-data"]
shapes = "The last paragraph of the persistent-data section defines recovery per stage and sends the actual restore evidence to the delivery and verification owners."
adapted = "A command named down, a feature flag or an existing backup does not prove recovery; the delivery and verification owners supply the restore or compatibility evidence."

[[sources.declined]]
feature = "Treating additive migrations as reversible by ceasing to write the new shape, and waiting a full deployment cycle before the contract step."
reason = "Recovery and safety come from the actual deployment, data and recovery evidence, and a stage advances on evidence rather than on a fixed number of deployment cycles."

[[sources.declined]]
feature = "Prescribing database procedure in the skill, such as key-range batching, throttling between batches and progress dashboards."
reason = "Data guidance stays conditional; project tools and delivery specialists own the implementation details."


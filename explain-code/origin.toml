[[sources.ideas]]
idea = "An explanation comes from the actual implementation: start at the entry point and follow the calls, data transformations, state changes and boundaries until the requested behavior is accounted for. Names or one isolated function do not show which path is active; callers, configuration and tests decide that."
serves = "Prevents explanations guessed from names or from code that never runs on the requested path."
where = ["SKILL.md#trace-the-mechanism"]
shapes = "Makes tracing from the entry point the first step of the section and sets the evidence needed before a path counts as active."

[[sources.ideas]]
idea = "Exploration scales with the question: a narrow question needs one pass, and a cross-component question splits into a few angles such as request handling, state ownership and background work. Findings are reconciled against the source, and a connection that cannot be traced is named as a gap instead of guessed."
serves = "Covers broad questions without padding narrow ones, and keeps conflicting or missing evidence visible."
where = ["SKILL.md#trace-the-mechanism"]
shapes = "Adds the split into exploration angles after the basic trace, and ends evidence gathering with reconciliation against the source and named gaps."
adapted = "The skill investigates directly. Parallel exploration is optional, needs host and task authorization, and keeps the same scope and read-only authority; the donor spawns explorer and explainer subagents."

[[sources.ideas]]
idea = "The explanation gives the reader a working mental model: it answers first, follows a representative input or user action through the real components, puts source locations beside the claims they support, and uses a diagram when components or data stages relate in a way prose does not make clear."
serves = "The reader can follow the mechanism and find the code that implements each part."
where = ["SKILL.md#make-the-explanation-usable"]
shapes = "Orders the section as answer first, then the walk through a representative input, then supporting visuals and source locations."
adapted = "Visual aids are chosen by usefulness and kept consistent with the real path, illustrative inputs are labeled, and the format scales to the question with no fixed sections."

[[sources.ideas]]
idea = "Presentation follows the reader: their purpose and question set the technical depth, needed terms are defined in place, and the explanation walks through what happens instead of listing functions. A list of functions is a navigation aid, not an explanation."
serves = "Makes the explanation usable for the reader in front of it instead of a generic audience."
where = ["SKILL.md#establish-the-question", "SKILL.md#make-the-explanation-usable"]
shapes = "Moves the depth decision into establishing the question, and replaces function inventories with an in-place walk through the flow."
adapted = "Only these presentation criteria come from the teach donor. The requested depth and length set the level, not a fixed senior-engineer audience or a short first answer that waits for follow-up."

[[sources.ideas]]
idea = "Making an explanation easier to read never changes its confidence or attribution. A documented reason keeps its source and uncertainty, and the component's present function stays separate from its authors' historical reasons."
serves = "Prevents simplification from turning a hedged or attributed finding into an unsupported claim."
where = ["SKILL.md#make-the-explanation-usable"]
shapes = "Adds the paragraph that separates present function from historical reasons, keeps attribution and uncertainty, and labels placement recommendations as advice."

[[sources.declined]]
feature = "Required explorer and explainer subagents for every question."
reason = "The skill investigates directly; parallel exploration is optional and needs host and task authorization."

[[sources.declined]]
feature = "Cursor-only skill metadata such as disable-model-invocation, the Task API and a model table that sets each subagent's model."
reason = "The skill activates through a short description and normal host discovery, and it does not require particular models or tools."

[[sources.declined]]
feature = "Writing every explanation for a senior engineer onboarding onto the subsystem."
reason = "The reader's question and purpose set the technical depth."

[[sources.declined]]
feature = "A first answer of one or two sentences that stops until the reader asks for more."
reason = "The answer matches the depth and length requested in the current response."

[[sources.declined]]
feature = "Running a separate why skill alongside the explanation to find the reasons behind the code."
reason = "A relevant documented reason is included with its attribution; the skill does not need to run the explain-decisions skill or an exhaustive historical sweep."

[[sources.declined]]
feature = "A series of diagrams that each add one part for any flow with three or more moving parts, and generated whiteboard-style images for spatial ideas."
reason = "A diagram, example or excerpt is used only when it clarifies a relationship."

[[sources.declined]]
feature = "Writing every response through the unslop skill in plain spoken English."
reason = "Ordinary explanation requires no other skill, and the skill sets no output language."


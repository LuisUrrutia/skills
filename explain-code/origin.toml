format_version = 2
skill = "explain-code"
created = "2026-10-03"
approach = "derive"
goal = "Explain how existing code works or which component owns a behavior, from the actual source, for a reader who wants to get oriented, understand a mechanism or find an owner. Success is an answer at the requested depth that follows the real path, puts source locations beside its claims, and states what remains unknown and which evidence would resolve it."

[[invariants]]
rule = "Upstream skills supply ideas only. The skill is used directly, and ordinary explanation needs no coordinator, upstream skill or other skill."
reason = "The record began as a standalone derivation of source tracing with limited presentation guidance, in which upstream skills are not installed or invoked runtime dependencies."
where = ["SKILL.md#explain-code", "SKILL.md#source-maintenance"]

[[invariants]]
rule = "The skill explains current mechanics and ownership. Guided teaching and exercises belong to the teach skill and study plans to the learning-plan skill; they are used when requested, not for every explanation."
where = ["SKILL.md#make-the-explanation-usable"]

[[invariants]]
rule = "Neighboring tasks keep their owners: diagnosis of an observed failure belongs to the debug skill, historical decisions to the explain-decisions skill, and diff audits, activity reports and implementation to their own tasks. For a requested branch or commit, the skill explains the before and after mechanism from the resolved revision."
where = ["SKILL.md#establish-the-question"]

[[invariants]]
rule = "What the code establishes, what a test or execution actually demonstrated, and what is inferred stay separate. Reading a test does not mean it passed, and read-only inspection does not establish production configuration, external guarantees or runtime success."
where = ["SKILL.md#trace-the-mechanism"]

[[invariants]]
rule = "A guarantee stays at the boundary the evidence covers: an internal status or a provider's acknowledgement does not establish later delivery or user-visible success, and the explanation names the condition that a later worker or external system must meet."
where = ["SKILL.md#trace-the-mechanism"]

[[invariants]]
rule = "Source, tests, configuration and remote state stay unchanged. A requested explanatory artifact is written only at its agreed destination, and answering a question creates no lesson files, learning records or other persistent infrastructure."
where = ["SKILL.md#trace-the-mechanism"]


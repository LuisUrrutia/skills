[[sources.ideas]]
idea = "A comparison runs as one cycle: frame a shared contract, fan out independent complete attempts, have an independent judge assess them while the coordinator reads each one, pick the strongest as the base, graft useful parts from the others, and verify the integrated result."
serves = "Avoids locking in the shape of a single attempt when alternatives could produce a better result."
where = [
  "SKILL.md#frame",
  "SKILL.md#fan-out",
  "SKILL.md#cross-judge-and-pick",
  "SKILL.md#graft",
  "SKILL.md#verify-and-deliver",
]
shapes = "Sets the skill's five sections and their order; the judge starts only after candidates stop writing."
adapted = "Candidates and the judge run through the host's delegation mechanism and available model catalog, and requested models, effort, count and budget are honored. Without a request, the run starts with two candidates; different model families broaden the comparison but are not required."

[[sources.ideas]]
idea = "Before seeing candidates, the coordinator writes a small rubric of observable criteria that distinguish a good result for this task, and the judge and coordinator score candidates criterion by criterion against it."
serves = "Makes the pick depend on what matters for this task instead of a general impression."
where = ["SKILL.md#frame", "SKILL.md#cross-judge-and-pick"]
shapes = "Makes the rubric part of framing, before fan-out, and gives the judge the rubric with neutral candidate labels."
adapted = "Every candidate receives every acceptance requirement; a private rubric must not hide a requirement, and the coordinator's comparison notes and emerging preferences stay out of candidate prompts. Hard constraints trace to the caller's requirements or applicable rules; desirable qualities stay scored preferences, and behavior outside the stated input domain is a documented tradeoff, not a contract failure."

[[sources.ideas]]
idea = "The coordinator reads every candidate end to end before picking, and it records the chosen base, the source candidate of each graft and the reasons for significant rejections."
serves = "Lets a reader check why the result looks as it does and which attempt each part came from."
where = ["SKILL.md#cross-judge-and-pick", "SKILL.md#graft", "SKILL.md#verify-and-deliver"]
shapes = "Opens the pick with a full reading of each candidate, closes the graft step with provenance records, and makes the synthesis note carry the base, grafts and rejections."

[[sources.ideas]]
idea = "Before concurrent work, each candidate gets its own mutable target instead of sharing one, and only the coordinator writes the integrated target."
serves = "Prevents candidates from overwriting each other or the integrated result."
where = ["SKILL.md#frame", "SKILL.md#fan-out"]
shapes = "Adds an output-location step to framing that arranges isolation before any mutation, and makes settling all writers a condition for comparison and integration."
adapted = "Isolation follows the host's scratch, workspace and ownership rules: isolated copies, patches against the snapshot, or workspaces provisioned through the authorized lifecycle. A worktree is one option, not a requirement, and separate filenames do not isolate a shared checkout, database, cache or service."

[[sources.ideas]]
idea = "Among suitable bases, prefer coherent boundaries and the smaller sufficient API over extra machinery, and fold each graft in so the result stays coherent instead of pasting parts together."
serves = "Produces a result a maintainer can extend, not a patchwork of incompatible attempts."
where = ["SKILL.md#cross-judge-and-pick", "SKILL.md#graft"]
shapes = "Ends the pick with the base preference, and makes the graft step reject incompatible architectures, contradictory claims and duplicate findings."
adapted = "Only the parts of the donor's principle skills that decide a base or a graft are stated inline."

[[sources.ideas]]
idea = "The integrated artifact itself is verified against the acceptance requirements, because candidate test results do not show that grafts work together."
serves = "Prevents delivering a synthesis whose combined parts were never checked."
where = ["SKILL.md#verify-and-deliver"]
shapes = "Makes verification of the integrated artifact the last step before delivery."
adapted = "An observed integration defect is fixed and the affected checks are repeated; the whole comparison runs again only on evidence that the framing failed."

[[sources.declined]]
feature = "Fixed model slugs and runner defaults read from a pstack-models rule file, and Cursor-only skill metadata."
reason = "The skill uses the host's delegation mechanism and available model catalog, does not guess model identifiers, and reports what actually ran."

[[sources.declined]]
feature = "Opening a todo list with one entry per phase before launching anything."
reason = "The phases are the skill's own sections; the skill forces no task-manager call."

[[sources.declined]]
feature = "Reframing and rerunning the full contest whenever candidates diverge widely or verification finds a problem the comparison missed."
reason = "Retries and reframing are bounded: a failed seat is retried at most once when its cause is recoverable, and reframing happens only for a material ambiguity, with at most one new round within the authorized budget."

[[sources.declined]]
feature = "Treating candidate convergence as a signal to ship the consensus shape, and judge agreement as confirmation of the pick."
reason = "Agreement does not establish correctness; material claims are resolved against sources or execution, a supported minority finding stays, and unresolved premises are preserved."

[[sources.declined]]
feature = "The donor principle skills in full: the laziness protocol's deletion and call-depth rules, the propagation rules of the redesign-from-first-principles principle, and the scripted-check rules of the prove-it-works principle."
reason = "Only the principles that decide a base, a graft or verification apply to a comparison."

[[sources.declined]]
feature = "Committing the verification trail through the show-me-your-work skill."
reason = "Verification evidence goes into the synthesis note, and a comparison grants no publication authority."


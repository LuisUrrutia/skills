format_version = 2
skill = "compare-solutions"
created = "2026-10-03"
approach = "derive"
goal = "When alternative approaches or independent investigations justify the extra work, run independent complete attempts at one task, compare them, choose a base, incorporate useful parts and verify the result. Success is the requested artifact, checked against the acceptance requirements, with a synthesis note that shows what actually ran, the chosen base, the grafts and the remaining limits."

[[invariants]]
rule = "A comparison counts only attempts that actually ran. The record keeps real task IDs, models, status and artifact paths, and child work is settled or cancelled before the run closes. Prepared prompts or several answers written by the coordinator are not an executed comparison."
where = ["SKILL.md#frame", "SKILL.md#fan-out", "SKILL.md#verify-and-deliver"]

[[invariants]]
rule = "The report claims no more comparison than ran. With one usable candidate, the run verifies it and labels it a single attempt with no winner, judge or graft; with none, it reports the blocker. An unavailable judge is disclosed as \"no independent judge\", a request that requires that judge stays incomplete, and any unmet explicit requirement is disclosed."
where = ["SKILL.md#fan-out", "SKILL.md#cross-judge-and-pick"]

[[invariants]]
rule = "A selected specialist keeps its procedure and output contract. A strict report grammar stays intact, with provenance and scores in a separate synthesis note, and each candidate of the review-code-changes skill remains one complete reviewer with its facet delegation disabled."
where = [
  "references/specialists.md#specialist-candidates",
  "references/specialists.md#review-code-changes",
  "SKILL.md#fan-out",
]

[[invariants]]
rule = "The analyze-change-effects and review-code-changes skills stay distinct procedures, and no candidate or judge invokes the compare-solutions skill or starts further attempts."
where = ["SKILL.md#fan-out", "references/specialists.md#other-supporting-skills"]

[[invariants]]
rule = "A comparison grants no extra repair, publication or deployment authority, and it requires no installation or extra prose-cleanup skill."
where = ["SKILL.md#verify-and-deliver"]


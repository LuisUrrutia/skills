[[sources.ideas]]
idea = "The next action travels with the reason it is next."
serves = "Stops the recipient from second-guessing or re-deriving the chosen step."
where = ["SKILL.md#write-the-document"]
shapes = "Pairs the opening next action with why it is next."

[[sources.ideas]]
idea = "After saving, the writer rereads the file as a stranger without the conversation and asks three questions: what to do next, why, and what not to do. A missing answer means the handoff is incomplete."
serves = "Finds gaps while the writer still has the context to fill them."
where = ["SKILL.md#save-and-report"]
shapes = "Inserts a cold read with these three questions between saving and replying."
adapted = "The what-not-to-do question applies only where limits or abandoned approaches exist, so the document never invents a prohibition. The local check also confirms that each referenced local file exists and labels any that does not."

[[sources.declined]]
feature = "GSD milestone and slice paths, task identifiers and the gsd task tools."
reason = "They belong to the GSD framework; the skill writes a portable document."

[[sources.declined]]
feature = "Updating knowledge and decision files, cancelling background jobs, and the resume rules for keeping or deleting the continue file."
reason = "The skill writes one document; it does not change other project records, control running work or resume a task."

[[sources.declined]]
feature = "Stopping work cleanly as part of writing the handoff, and writing one when the context budget runs low."
reason = "Writing the document does not pause work, and the skill is selected by a request to write a handoff, not by a context threshold."


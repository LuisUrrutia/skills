[[sources.ideas]]
idea = "Work status is recorded by maturity: completed, partial and pending work are kept apart, and a narrowed or changed scope from the latest user direction is preserved."
serves = "Stops the recipient from redoing finished work or treating partial work as done."
where = ["SKILL.md#capture-the-continuation"]
shapes = "Makes completed, partial and pending work the first item of the capture list, together with the objective and constraints."

[[sources.ideas]]
idea = "Each reference to an existing artifact says what matters there, not only where it is."
serves = "Lets the recipient open the right part of a referenced artifact without rereading all of it."
where = ["SKILL.md#capture-the-continuation"]
shapes = "Turns each reference into an annotated pointer: a location plus what matters there."

[[sources.ideas]]
idea = "Decisions carry their origin: the document says whether each one is a user-confirmed choice, an agent proposal or an assumption, with its reason."
serves = "Prevents the writer's own inference from reaching the recipient as the user's decision."
where = ["SKILL.md#capture-the-continuation"]
shapes = "Splits the decisions item by origin: user-confirmed choices, agent proposals and assumptions, each with its reason."

[[sources.ideas]]
idea = "Creation is complete only when the saved file is confirmed. The reply then gives the exact saved location, the intended next task and any material access or retention limit; a local path alone does not make the file accessible elsewhere."
serves = "Gives the caller a location that actually holds the document and the limits that decide whether the recipient can read it."
where = ["SKILL.md#save-and-return"]
shapes = "Makes a confirmed saved file the end of creation and fixes the reply's contents: exact location, next task and access or retention limits."

[[sources.ideas]]
idea = "The handoff is context, not authority. Current user instructions, project rules and verified current state govern continuation, and an old summary grants no new authority."
serves = "Prevents a stale document from authorizing actions the current user did not approve."
where = ["SKILL.md#save-and-return"]
shapes = "Closes the reply rules with a statement that subordinates the document to current instructions and verified state."
adapted = "The donor applies the rule when it resumes from a handoff. The local skill only creates documents, so the rule is stated for the document the writer produces."

[[sources.declined]]
feature = "A managed handoff store with ce-handoff/v1 frontmatter, indexed discovery of saved handoffs, and a resume mode with mandatory confirmation stops."
reason = "The skill only creates the document; finding, reading and resuming a handoff happen in the receiving session."

[[sources.declined]]
feature = "Ending the creation reply with a rendered, copyable resume command."
reason = "The reply gives the saved location and the intended next task; invocation is left to the receiving environment."


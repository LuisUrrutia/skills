[[sources.ideas]]
idea = "A handoff carries only the context that changes how the recipient proceeds, so a fresh agent can continue the work without the original conversation."
serves = "Gives the recipient a usable starting point instead of a transcript to reread."
where = ["SKILL.md#capture-the-continuation"]
shapes = "Makes relevance to the recipient's next steps the filter for the capture list, so the list names kinds of context rather than a full conversation summary."

[[sources.ideas]]
idea = "Material that already exists in plans, issues, commits, diffs or evidence is referenced instead of copied. Context that exists only in the conversation goes into the document, because the recipient cannot open the thread."
serves = "Keeps the document short and prevents copies that drift from their source."
where = ["SKILL.md#capture-the-continuation"]
shapes = "Replaces copied material with references and makes conversation-only context the one exception that is written in full."

[[sources.ideas]]
idea = "Secrets and unrelated personal data are removed from the document before it is saved."
serves = "Prevents the handoff from leaking sensitive data to wherever it travels."
where = ["SKILL.md#save-and-return"]
shapes = "Makes redaction part of the save step rather than a separate review."

[[sources.ideas]]
idea = "A handoff can carry a side task to another agent or session while the original session keeps running."
serves = "Lets work fork without stopping the main session."
where = ["SKILL.md#handoff"]
shapes = "Widens the opening scope from continuing a task to forking a side task, and states that the original session can keep running."

[[sources.ideas]]
idea = "Without a requested destination, the document goes to the operating system's temporary directory, resolved the same way on every run: $TMPDIR when set, else /tmp; %TEMP% on Windows."
serves = "Gives a predictable default location when the request names none."
where = ["SKILL.md#save-and-return"]
shapes = "Orders the destination rules: the requested destination first, then the resolved temporary directory, then a stated limitation when neither fits the pickup."
adapted = "A requested destination takes precedence, and the temporary directory is used within the environment's write constraints. The destination must also fit the access and lifetime of the intended pickup; when that cannot be established, the reply states the limitation and what must be transferred or preserved."

[[sources.ideas]]
idea = "The document can suggest skills that would help the recipient continue."
serves = "Points the recipient at relevant workflows it might not think to load."
where = ["SKILL.md#capture-the-continuation"]
shapes = "Ends the capture section with optional skill suggestions by registered name."
adapted = "Skills are named by registered name, and the receiving environment resolves and invokes them, instead of the donor's instruction to call the Skill tool, so the document stays portable across hosts."

[[sources.declined]]
feature = "Explicit-only invocation through disable-model-invocation and an agents/openai.yaml policy with allow_implicit_invocation set to false."
reason = "The skill keeps the normal discoverability of a local skill, and its description limits selection to requested handoff documents."


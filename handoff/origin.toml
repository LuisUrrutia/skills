format_version = 2
skill = "handoff"
created = "2026-10-04"
approach = "derive"
goal = "Write a focused Markdown handoff document that lets another agent, session or environment continue a task, or take a side task while the original session keeps running, without access to the original conversation. Success is a saved document from which a cold reader knows the next action and why, the status of the work, the basis of each decision and check, and where the referenced material is, plus a reply with the exact saved location and any access or retention limit."

[[invariants]]
rule = "The skill writes the document only. Creating it does not pause work or start a receiving session, and commits, publication, session launch, worktree changes, agent cancellation and continued implementation keep their own authorization and owners; a request to export context does not imply them."
where = ["SKILL.md#save-and-return"]

[[invariants]]
rule = "Creating the document does not establish receipt or transfer execution ownership, and the reply reports only the delivery actually observed."
where = ["SKILL.md#handoff", "SKILL.md#save-and-return"]

[[invariants]]
rule = "The skill is selected for requested creation of a handoff document; it is not an automatic export at phase boundaries."
where = ["SKILL.md"]

[[invariants]]
rule = "The document is written with the environment's existing writing tools; no helper script, transport mechanism or host runtime is required. Ordinary handoff creation neither fetches nor invokes the donor skills."
where = ["SKILL.md#source-maintenance"]


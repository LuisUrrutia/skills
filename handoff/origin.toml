reason = "Without a named destination the document goes to the operating system's temporary directory (user decision of 2026-10-18)."

[[sources.declined]]
feature = "Writing a handoff and starting fresh at every ship, pivot or wait boundary instead of compacting."
reason = "The skill writes a requested document; it is not an automatic export at phase boundaries."

[[sources.declined]]
feature = "Mandatory Acceptance/Verification and Decisions sections, references to a coordinator's charter and log, and a check of the hunk rationale sidecar."
reason = "The document has no fixed template, and the skill depends on no coordinator or hunk tooling."


where = ["SKILL.md#write-the-document"]
shapes = "Puts the next action ahead of everything else and makes the rest of the document support that step."

[[sources.ideas]]
idea = "The document states the boundaries the user set on actions such as publishing, pushing, deploying and approvals."
serves = "Stops the recipient from taking an action the user did not authorize in the original session."
where = ["SKILL.md#write-the-document"]
shapes = "Makes the limits the user set part of the continuation guidance."

[[sources.ideas]]
idea = "For repository work, the document gives the branch, revision and staged and uncommitted changes, and separates the task's changes from other work that must survive."
serves = "Stops the recipient from losing, staging or reverting work that is not part of the task."
where = ["SKILL.md#write-the-document"]
shapes = "Adds repository state as the conditional last item of the status list."
adapted = "Repository state appears only for repository work; a non-repository task carries no Git fields."

[[sources.declined]]

[[sources.ideas]]
idea = "The document carries only what a fresh agent cannot infer from the material it can read."
serves = "Keeps the document a small fraction of the conversation instead of a recap."
where = ["SKILL.md#choose-what-travels"]
shapes = "Narrows the base's tailoring to the stated purpose with a second condition: keep only what bears on the focus and that a fresh agent cannot infer, and leave out the rest."

[[sources.ideas]]
idea = "References are annotated pointers: for each artifact the recipient depends on, the document says what matters there, not only where it is. Repository files use repository-relative paths; an absolute path appears only for machine-local state and is labeled machine-local."
serves = "Lets the recipient open the right part of a referenced artifact, and stops a machine-local path from looking reachable from another machine."
where = ["SKILL.md#choose-what-travels"]
shapes = "Extends the base's rule to reference artifacts by path or URL with what matters at each one and a path rule."

[[sources.ideas]]
idea = "The state of the work is recorded as facts the recipient can check, each with its basis: the objective and its current scope as the user last directed; done, partial or not started and what depends on what; each decision attributed to the user or marked as the writer's proposal or assumption."
serves = "Stops a writer's inference or proposal from reaching the recipient as the user's decision. The base's companion docs name confident unverified claims as the source of false premises in the next session."
where = ["SKILL.md#write-the-document"]
shapes = "Replaces the base's unstructured summary with a status list in which every item carries its basis."
adapted = "The local list also gives each check as observed, with its command and outcome, or as not run, and marks unverified beliefs as unverified."

[[sources.ideas]]
idea = "Approaches already abandoned that the next agent is likely to retry are recorded, with why they were abandoned."
serves = "Stops the recipient from repeating dead ends."
where = ["SKILL.md#write-the-document"]
shapes = "Joins the blockers item of the status list, so it appears only when such approaches exist."

[[sources.ideas]]
idea = "Creation never overwrites another handoff: the writer creates a new file, and creation is complete only after the destination is confirmed to hold the document."
serves = "The temporary directory is shared with other agents on the same machine, and the reply must report observed delivery."
where = ["SKILL.md#save-and-report"]
shapes = "Makes creating a new file part of the save rule, and puts the reread of the saved file before the reply."
adapted = "There is no managed directory or numeric-suffix scheme; an existing file is replaced only when the request names it for update."

[[sources.declined]]
feature = "A managed handoff store under a per-user directory with ce-handoff/v1 frontmatter, indexed discovery of saved handoffs, and a resume mode with mandatory confirmation stops."
reason = "Without a named destination the document goes to the operating system's temporary directory (user decision of 2026-10-18), and resuming belongs to the receiving session or work-mode."

[[sources.declined]]
feature = "A statement inside the document that it is context, not authority, and that current instructions and verified state govern the recipient."
reason = "The recipient never loads this skill; the basis labels on each decision and check carry that distinction, and resumption with its authority rules belongs to work-mode and the receiving session."

[[sources.declined]]
feature = "Ending the creation reply with a rendered, copyable resume command."
reason = "Invocation is left to the receiving environment; the reply gives the path and the next task."

[[sources.declined]]
feature = "Preferring status over work orders, and carrying directives to the next agent only when the user asked the handoff to include them."
reason = "User decision of 2026-10-18: a handoff records the state of the work so that other agents can pick it up, and its continuation guidance is written as agent instructions with agent-instructions. Each decision and check still carries its basis."


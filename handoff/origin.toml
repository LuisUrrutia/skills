format_version = 2
skill = "handoff"
created = "2026-10-04"
approach = "base"
goal = "Write a focused Markdown handoff document that lets another agent, session or environment continue a task, or take a side task while the original session keeps running, without access to the original conversation. Success is a saved document from which a cold reader knows the next action and why, the status of the work, the basis of each decision and check, and where the referenced material is, plus a reply with the exact saved location and any access or retention limit."

[[invariants]]
rule = "The skill writes and saves the document only. Launching or seeding a session, pausing, cancelling agents, committing, publishing, changing worktrees and continuing the work keep their own owners and authorization; a request to export context does not imply them."
where = ["SKILL.md#handoff"]

[[invariants]]
rule = "A saved document proves neither receipt nor a transfer of ownership. The reply reports only what was observed: the saved path, the next task and any access or retention limit."
where = ["SKILL.md#handoff", "SKILL.md#save-and-report"]

[[invariants]]
rule = "Without a destination named in the user's request, including one a calling workflow forwards, the document is saved in the operating system's temporary directory, never in the workspace or repository. When that directory cannot serve the pickup, because the recipient runs on another machine or container or picks up after the directory may be cleared, the skill still saves there, says so and lists exactly what to copy; it does not choose another location, and a calling workflow does not choose one either. A destination named in the user's request wins."
reason = "User decision of 2026-10-18. The previous text let the agent choose any destination whose access and lifetime seemed to fit, which could put an unrequested handoff file into a tracked tree."
where = ["SKILL.md#save-and-report"]

[[invariants]]
rule = "The skill creates no file other than the handoff document: no bundle, patch, archive or other copy of the work, even temporarily or when the temporary directory cannot serve the pickup. It lists what the recipient must copy or fetch instead."
reason = "User decision of 2026-10-18, after a trial run left a git bundle and a patch in the temporary directory and others built scratch clones to test their copy instructions."
where = ["SKILL.md#save-and-report"]

[[invariants]]
rule = "The continuation guidance inside the document is written with agent-instructions, or without it when the skill catalog lacks it, and writing a handoff never starts the two-model review that agent-instructions requires, even when the request asks for guidance aimed at another agent: a handoff request is not a request for instruction authoring."
reason = "User decision of 2026-10-18: a handoff records the state of the work so that other agents can pick it up, so its guidance follows agent-instructions, but a handoff never triggers the two-model consultation."
where = ["SKILL.md#write-the-document"]

[[invariants]]
rule = "The skill stays model-invocable, and its description limits selection to writing a handoff document. It is not an automatic export at phase boundaries, and resuming from a handoff belongs to the receiving session."
reason = "work-mode selects handoff by registered name when context must be transferred, and work-mode owns resumption."
where = ["SKILL.md"]

[[invariants]]
rule = "The document has no fixed template, size cap or context-usage threshold, and repository state appears only for repository work."
reason = "The source review chose the smallest structure that fits the task: no obligatory Git section for non-code work and no fixed context threshold (reports/skill-atlas/handoff-source-review.json, recommendation.proportionality)."
where = ["SKILL.md#write-the-document"]

[[invariants]]
rule = "The skill names no host, host tool, host directory or host-only frontmatter, and refers to other skills by registered name. The document is written with the environment's existing writing tools; no helper script, transport mechanism or host runtime is required."
reason = "The skills run in Claude Code and Codex."
where = ["SKILL.md"]


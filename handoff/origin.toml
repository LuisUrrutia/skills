[[sources.ideas]]
idea = "The next action comes first: the opening of the document tells the recipient what to do now."
serves = "Lets the recipient start at once instead of reconstructing the resume point."
where = ["SKILL.md#capture-the-continuation"]
shapes = "Puts the next useful action ahead of all supporting context in the document's order."

[[sources.ideas]]
idea = "Settled decisions are distinguished from proposals, so the recipient neither asks again about a settled call nor inherits an unconfirmed one as fact."
serves = "Prevents an agent proposal from being carried forward as a user decision."
where = ["SKILL.md#capture-the-continuation"]
shapes = "Makes the settled-or-proposed status part of every recorded decision."

[[sources.ideas]]
idea = "For repository work, the document carries the relevant checkout, branch, revision and staged or uncommitted state, and separates the task's changes from other work that must survive."
serves = "Prevents the recipient from losing, staging or reverting work that is not part of the task."
where = ["SKILL.md#capture-the-continuation"]
shapes = "Adds repository state as a conditional item of the capture list, used only for repository work."
adapted = "Repository state appears only for repository work; a non-repository task carries no Git fields."

[[sources.ideas]]
idea = "Verification actually performed is recorded with its commands or evidence locations and outcomes, together with the acceptance checks that remain."
serves = "Lets the recipient trust what was checked and see what still needs evidence."
where = ["SKILL.md#capture-the-continuation"]
shapes = "Adds a verification item that pairs each performed check with its outcome and lists the remaining acceptance checks."
adapted = "Unverified claims and checks that were not run are labeled, and writing the handoff does not require rerunning them."

[[sources.declined]]
feature = "A fixed ~/.handoffs/ store, references to a coordinator's charter and log, and a check of the hunk rationale sidecar."
reason = "The requested destination or the operating system's temporary directory applies, and the skill depends on no coordinator or hunk tooling."


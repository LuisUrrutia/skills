[[sources.deviations]]
change = "Removed the `argument-hint` frontmatter and replaced 'if the user passed arguments' with the purpose that the request or calling workflow states for the next session; without a stated purpose, the focus is continuing the current task."
reason = "Codex's skill validator accepts only name, description, license, allowed-tools and metadata as frontmatter, and work-mode calls the skill without slash-command arguments."
where = ["SKILL.md#choose-what-travels"]

[[sources.deviations]]
change = "Replaced the description 'Compact the current conversation into a handoff document for another agent to pick up.' with a selection description that starts with 'Use when' and is limited to writing a handoff document; the base description's 'compact' moves into the opening sentence."
reason = "The repository's description convention, and a model-invocable skill must not catch ordinary compaction, planning, resumption or delegation requests. Selection probes chose handoff for a plain request to delegate a question to a parallel agent while the description also named side tasks, so side tasks stay in the body only."
where = ["SKILL.md", "SKILL.md#handoff"]

[[sources.deviations]]
change = "Restructured the five flat paragraphs into an opening and three sections: Choose what travels, Write the document, and Save and report. The opening adds what the document is for: the state of the work for another agent to pick up in another session, host or directory, through a colleague, or as a side task forked while this session keeps running."
reason = "The ideas from the other sources need an order: choose the content, write it, then save, check and report. Each base sentence still maps to one section, so upstream changes stay mergeable. The purpose comes from the user's statement of 2026-10-18 and the four situations in the base's companion docs."
where = ["SKILL.md#handoff", "SKILL.md#choose-what-travels", "SKILL.md#write-the-document", "SKILL.md#save-and-report"]

[[sources.deviations]]

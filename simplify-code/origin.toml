paths = ["cursor-team-kit/skills/deslop/SKILL.md", "cursor-team-kit/LICENSE"]

[[sources.ideas]]
idea = "Clean the changed code with small, focused edits that target recurring kinds of noise: comments that repeat the code, unneeded defensive checks and catches, type escapes that only silence the type checker, deep nesting, and style that differs from the surrounding code."
serves = "Makes the change easier to read without the risk and review cost of a broad rewrite."
where = ["SKILL.md#simplify-code", "SKILL.md#simplify-from-evidence"]
shapes = "The opening limits the skill to focused edits on the requested change; the criteria list in Simplify from evidence has one entry for each of these kinds of noise, and its last entry keeps broad reformatting and unrelated renames out of the cleanup."
adapted = "The donor removes checks and catches that look abnormal for trusted code. Here, removing a check or catch needs evidence about the actual producer, trust boundary and lifetime, and removing a wrapper or wait must keep operation completion and resource-release timing, not only the eventual result."

[[sources.declined]]
feature = "Changing behavior during the cleanup to fix a clear bug."
reason = "A bug fix is a separate behavioral decision that needs existing task authority and its own verification; otherwise the bug is reported and the cleanup continues."


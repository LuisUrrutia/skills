reviewed_through = "aeac41d4d005999432bb7312f7ff06383a91d59d"
baseline_paths = ["skills/code-simplification/SKILL.md", "LICENSE"]
paths = ["skills/code-simplification/SKILL.md", "LICENSE"]

[[sources.ideas]]
idea = "Keep a helper or abstraction that names a useful concept, and keep a boundary that isolates a cohesive responsibility, even when inlining it would make the code shorter."
serves = "Prevents over-simplification that makes call sites harder to understand."
where = ["SKILL.md#simplify-from-evidence"]
shapes = "The helpers criterion keeps such helpers and abstractions and judges them by what the reader must understand."

[[sources.ideas]]
idea = "Simplicity is measured by what a reader must understand, not by line count. A shorter expression is not automatically simpler."
serves = "Prevents dense rewrites that save lines but cost comprehension."
where = ["SKILL.md#simplify-from-evidence", "SKILL.md#check-and-finish"]
shapes = "The nesting and helpers criteria reject line count as the test, and the final review confirms that each edit has a concrete benefit and that no constraint disappeared only to reduce lines."

[[sources.ideas]]
idea = "On a performance-sensitive path, a simpler form can change cost. Keep the relevant performance and resource constraints, and measure against them before adopting a form that could change cost materially."
serves = "Prevents a readability edit from causing a performance regression."
where = ["SKILL.md#simplify-from-evidence"]
shapes = "The performance criterion requires measurement before such a change is adopted."

[[sources.declined]]
feature = "Numeric refactoring thresholds, such as nesting depth, function length, duplicated line counts or a line limit for manual edits."
reason = "Value is judged by what the reader must understand, not by counts."

[[sources.declined]]
feature = "Mandatory separate PRs for refactoring and feature or fix work."
reason = "Commit and publication follow the active task and the repository rules."

[[sources.declined]]
feature = "Automatic removal of single-use abstractions."
reason = "A helper stays when it names a useful concept or isolates a cohesive responsibility; the number of callers does not decide."

[[sources.declined]]
feature = "Shorter rewrites, as in the donor's examples, that change data representation, failure delivery or resource timing, for example turning an object-building reduce into a Map or removing an async wrapper."
reason = "Such a rewrite breaks the behavioral equivalence the skill requires, which includes how and when failures reach callers, resource timing and public data representations."

[[sources.declined]]
feature = "Running the full test suite after every small simplification."
reason = "Verification is proportional to the changed behavior and the repository's checks: the relevant behavior checks and the required type, lint, build and smoke checks run against the final code."


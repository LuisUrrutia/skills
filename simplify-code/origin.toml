[[sources]]
id = "pstack-comments"
author = "Lauren Tan / pstack"
repository = "https://github.com/cursor/plugins"
remote = "git@github.com:cursor/plugins.git"
ref = "refs/heads/main"
license = "MIT; original notice retained in THIRD-PARTY-NOTICES.txt"
role = "ideas"
baseline_commit = "23e4138daa01c42d4969f7a5465f82704e64f798"
reviewed_through = "e5136d82418d2db3165ea1050d17577cd618cc05"
baseline_paths = [
  "pstack/skills/no-comments/SKILL.md",
  "pstack/agents/comment-sicko.md",
  "pstack/LICENSE",
]
paths = ["pstack/skills/no-comments/SKILL.md", "pstack/agents/comment-sicko.md", "pstack/LICENSE"]

[[sources.ideas]]
idea = "Judge each comment against the nearby code it describes. When a comment claims a consequential constraint, such as a workaround or a 'do not remove' warning, trace the claim through the code and its history, and check that it still has an effect today as well as why it was added."
serves = "Prevents both keeping stale justifications and deleting a constraint that still protects behavior."
where = ["SKILL.md#simplify-from-evidence"]
shapes = "The comment criterion reads comments against the code, and the paragraph after the criteria list sends an unclear consequential workaround to relevant history or the explain-decisions skill, checking its present effect as well as its original motivation."
adapted = "Tracing uses relevant history or the local explain-decisions skill, called by registered name, instead of the donor's how and why skills."

[[sources.ideas]]
idea = "Separate narration, which repeats what the code says and can be removed, from comments that carry what code cannot: public API contracts, constraints from external dependencies or platforms, legal notices and meaningful tooling directives."
serves = "Removes noise while keeping the comments a reader or tool depends on."
where = ["SKILL.md#simplify-from-evidence"]
shapes = "The first criterion removes comments that repeat the code and lists the kinds of comment to keep."
adapted = "The keep list also covers non-obvious reasons and internal invariants of the project's own code, which the donor deletes and flags for a reshape. Clearer names or a small refactor can replace narration, but they do not automatically replace a reason."

[[sources.ideas]]
idea = "When a constraint stated in a comment can be expressed in code within the current scope, such as a type, a runtime check, a test or a lint rule, and that encoding preserves the constraint, encode it and remove only the prose the encoding makes redundant."
serves = "Moves a constraint into a form that tools enforce, without losing it."
where = ["SKILL.md#simplify-from-evidence"]
shapes = "The comment criterion closes with the encode-then-remove rule, so a constraint moves into code before any prose about it is deleted."
adapted = "The donor offers the encoding and waits for approval, and deletes the comment when approval is not given. Here, the encoding happens when it fits the scope and preserves the constraint; otherwise the comment stays."

[[sources.ideas]]
idea = "A lint or type suppression is a claim about the code it hides. Look up what the suppressed rule protects and, when it protects correctness or safety, correct the cause instead of keeping the suppression."
serves = "Prevents suppressions that hide real defects, and prevents removing a suppression in a way that only moves the problem."
where = ["SKILL.md#simplify-from-evidence", "SKILL.md#check-and-finish"]
shapes = "The type criterion corrects unsafe type escapes, unchecked conversions and suppressions at their cause; the final review confirms that no constraint disappeared only to reduce warnings."
adapted = "The donor deletes such a suppression first and flags the symbol for a later fix. Here, a suppression is removed only when its underlying reason is resolved and the checks still pass."

[[sources.declined]]
feature = "Deleting a comment whenever a keep exception is not proven, including comments about surprises in the project's own code."
reason = "Necessary internal invariants stay. Missing evidence is a reason to keep the uncertain part and explain the gap, not evidence that it is redundant."

[[sources.declined]]
feature = "A mandatory Comment Sicko subagent, architect call, deletion quota or approval ritual for routine authorized cleanup."
reason = "The cleanup request already authorizes routine edits, and the skill applies its criteria directly. Specialists such as the explain-decisions skill are used only when a consequential constraint stays unclear."


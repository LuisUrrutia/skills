format_version = 2
skill = "simplify-code"
created = "2026-10-03"
approach = "derive"
goal = "Make a caller's changed code easier to read and maintain through focused edits that preserve its behavior. Success is a cleanup in which every edit has a concrete benefit and checked equivalence, with a report of the exact checks and of anything kept because its necessity or verification is unresolved."

[[invariants]]
rule = "The scope is the caller's files, diff, commit or task boundary. A branch or PR uses the merge-base with its actual target base, not an assumed main branch or earlier stack layers, and uncommitted work is included only when it belongs to the requested scope."
where = ["SKILL.md#fix-the-scope"]

[[invariants]]
rule = "Behavioral equivalence covers evaluation order, side effects, how and when failures reach callers, resource lifetime and release timing, public data representations and distinctions among valid values. A shorter form is not automatically equivalent or simpler."
where = ["SKILL.md#simplify-from-evidence"]

[[invariants]]
rule = "The criteria stay language-neutral and apply through the project's own language, runtime semantics and conventions, without language-specific code examples or syntax prescriptions."
where = ["SKILL.md#simplify-code"]


[[sources.ideas]]
idea = "The question decides the artifact. A question about states and transitions and a question about layout or interaction need different artifacts, so each kind of question has its own guidance file, and only the file that matches the question is loaded."
serves = "Prevents building the wrong kind of artifact, which wastes the whole experiment."
where = ["SKILL.md#frame-the-experiment", "references/logic.md", "references/ui.md"]
shapes = "The table in Frame the experiment routes each kind of question to one reference file, so logic and interface guidance live in separate files that are combined only when the question needs both surfaces."
adapted = "Behavior and timing questions are a third conditional branch, references/experiment.md. The activation description stays short and names UI, state model and uncertain behavior."

[[sources.ideas]]
idea = "A state model demo shows all state relevant to the decision after each action, with readable labels. It allows free exploration of the actions in any order, and each guided walkthrough resets to known initial conditions and runs real model actions instead of a separate scripted story."
serves = "Lets a domain expert see how the model behaves on sequences that are hard to reason about on paper."
where = ["references/logic.md"]
shapes = "The logic reference requires visible state after each action, free exploration, a reset, and walkthroughs built from real model actions, in place of a scripted demonstration."

[[sources.ideas]]
idea = "Interface alternatives differ in the structure or interaction being decided, not in cosmetic details. Each alternative has a clear label and, when several share one artifact, a visible selector."
serves = "Makes the comparison answer the design question instead of comparing small variations of one idea."
where = ["references/ui.md"]
shapes = "The comparison paragraph limits the number of alternatives to what the question needs, requires structural differences with comparable data and tasks, and asks for labels, a selector and, when useful, a shareable variant URL that survives a reload."

[[sources.ideas]]
idea = "Judge interface alternatives inside enough application context to expose design problems: surrounding navigation, realistic data density, loading and empty states, and the relevant viewport sizes. Unrelated data fetching, authentication and production behavior stay intact, and the prototype's mutations are stubbed."
serves = "Prevents a design that looks fine in isolation but fails next to the rest of the application."
where = ["references/ui.md", "SKILL.md#build-and-observe"]
shapes = "ui.md opens with the context the design needs and the rules for a local route; Build and observe stubs mutations that are not part of the question."
adapted = "The donor prefers rendering variants on the existing production route. Here, fixtures or an isolated preview that keeps the context come first; a local application route is used only when necessary, and then the whole experimental surface is isolated from production and the isolation is verified."

[[sources.declined]]
feature = "Placing prototype code next to the production module or page it prototypes."
reason = "Disposable work goes in the repository's permitted scratch location, here the ignored .tmp/<task>/, and a requested deliverable keeps its requested or established destination."

[[sources.declined]]
feature = "A single self-contained HTML file with inline styles and scripts for every logic demo."
reason = "Plain HTML uses semantic markup and an external stylesheet unless the requested deliverable calls for another format; a script is enough when only the computed result matters."

[[sources.declined]]
feature = "Forbidding tests, error handling and frameworks in every prototype."
reason = "Frameworks, assertions and project checks are conditional: existing components and frameworks are used when their behavior matters to the decision, and checks stay when they are needed to trust the result or the project requires them."

[[sources.declined]]
feature = "Capturing the result after the decision: folding the winner into production code, committing the prototype to a throwaway archive branch, and leaving a pointer on the implementation issue."
reason = "The skill reports evidence and uncertainty. Production promotion, archive branches, issue updates and other delivery work are separate and do not start automatically."

[[sources.declined]]
feature = "Hiding only the variant switcher in production builds while the variants stay on a production route."
reason = "The entire experimental UI must be isolated from production; hiding its selector is not sufficient."


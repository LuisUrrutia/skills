[[sources]]
id = "pstack-prototype-playbook"
author = "Lauren Tan / pstack"
repository = "https://github.com/cursor/plugins"
remote = "git@github.com:cursor/plugins.git"
ref = "refs/heads/main"
license = "MIT; original notice retained in THIRD-PARTY-NOTICES.txt"
role = "ideas"
baseline_commit = "7022c81efb48d8b5eb15498ce6043a3bd74b694c"
reviewed_through = "e5136d82418d2db3165ea1050d17577cd618cc05"
baseline_paths = ["pstack/skills/poteto-mode/playbooks/prototype.md", "pstack/LICENSE"]
paths = ["pstack/skills/poteto-mode/playbooks/prototype.md", "pstack/LICENSE"]

[[sources.ideas]]
idea = "A prototype exists to resolve one concrete decision. It is a disposable experiment, kept separate from production source. When the request already settles the choice, no prototype is built and the work follows its normal workflow."
serves = "Keeps experiments cheap and focused, and prevents them from replacing settled implementation work."
where = ["SKILL.md#prototype", "SKILL.md#frame-the-experiment", "SKILL.md#build-and-observe"]
shapes = "The opening defines the skill as one disposable experiment for one question; Frame the experiment sends a specified implementation or bug fix to its normal workflow; Build and observe keeps experiments separate from production behavior."

[[sources.ideas]]
idea = "Besides visual alternatives, a question about behavior, an algorithm, an API, an integration, resource use or timing can be settled by the smallest script or harness that exercises it."
serves = "Answers empirical questions with an observation instead of speculation."
where = ["references/experiment.md", "SKILL.md#frame-the-experiment"]
shapes = "The routing table gains a third row that sends behavior and timing questions to experiment.md, which builds the smallest harness for the conditions that could change the decision."
adapted = "The donor treats the observation itself as the test. Here, compared approaches must first produce the required behavior, and a performance claim goes to the verify skill for assessment. When the verify skill is unavailable, this skill still keeps inputs, workload, environment, warm-up, cache state and measurement boundary comparable, reports repetitions, units and a range, and states which conclusions stay unverified."

[[sources.ideas]]
idea = "Observe the result on the surface that matches the question: render and drive the interface for a visual decision, and run the harness and read its output for a behavioral one. Deliver the evidence, the tradeoffs, a recommendation and the artifact."
serves = "Bases the recommendation on what the experiment actually showed."
where = ["SKILL.md#build-and-observe", "SKILL.md#deliver-and-stop", "references/ui.md"]
shapes = "Build and observe ends with running the experiment and inspecting the matching surface; Deliver and stop lists the evidence, recommendation, tradeoffs and artifact to return; ui.md requires rendering every alternative and driving the decisive interaction."

[[sources.declined]]
feature = "Running as a playbook inside the parent poteto-mode."
reason = "The source is a playbook inside poteto-mode, not an independently installable skill. This skill works directly from the user's request and needs no parent mode."

[[sources.declined]]
feature = "Cursor tool names."
reason = "The skill uses the tools of the host it runs in."

[[sources.declined]]
feature = "Handing the chosen direction automatically to the donor's Feature playbook or architect skill for the real build."
reason = "Production implementation is separate work. The skill returns to the caller, which continues only when the wider task already authorizes the next phase."

[[sources.declined]]
feature = "Proposing variations the user did not ask for, and a reference and moodboard step in which the user picks directions before building."
reason = "References and alternatives are gathered only when the question needs them: references when the direction is open and they would change the options, and alternatives only for a choice that is not settled."


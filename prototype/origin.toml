format_version = 2
skill = "prototype"
created = "2026-10-02"
approach = "derive"
goal = "Resolve one open question about a UI, a state model or uncertain behavior before implementation, with a disposable experiment. Success is a runnable artifact with exact rerun instructions, observed evidence with its limits, and a recommendation with tradeoffs or the specific uncertainty that remains."

[[invariants]]
rule = "A prototype request does not authorize changing the live application. Production implementation, promotion of prototype code, archive branches, issue updates and PRs are separate work that this skill does not start automatically."
where = ["SKILL.md#build-and-observe", "SKILL.md#deliver-and-stop"]

[[invariants]]
rule = "When the wider task already authorizes the next phase, the skill returns to the caller and adds no new approval gate."
where = ["SKILL.md#deliver-and-stop"]

[[invariants]]
rule = "The skill runs standalone from the user's request: it invokes no upstream runtime skill and needs no state from the work-mode skill."
where = ["SKILL.md#prototype"]


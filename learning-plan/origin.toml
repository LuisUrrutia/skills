format_version = 2
skill = "learning-plan"
created = "2026-10-04"
approach = "derive"
goal = "Design or revise a study plan or course that takes a specific learner from what they know to an outcome they want, in a technical or nontechnical subject and within their known constraints. Success is the requested plan or complete course, with objectives ordered by prerequisites, practice with feedback criteria, observable checkpoints and a clear starting point, revised from the learner's observed progress."

[[invariants]]
rule = "This skill owns the sequence, scope, workload and adjustments of a plan; the teach skill owns the content and feedback of individual lessons and is used for requested lesson content when it is available."
where = ["SKILL.md#learning-plan", "SKILL.md#connect-plans-to-lessons"]

[[invariants]]
rule = "No donor skill is a runtime dependency. Planning and teaching require no plugin installation or new workspace, and ordinary planning does not fetch donor skills."
reason = "The record began as a standalone derivation of selected teaching and learning-design mechanisms."
where = ["SKILL.md#connect-plans-to-lessons"]

[[invariants]]
rule = "A plan uses an existing learning record only when it clearly belongs to this learner and topic; a shared installation or workspace does not make another person's profile this learner's."
where = ["SKILL.md#establish-the-outcome", "references/progress.md#resume-the-right-context"]

[[invariants]]
rule = "Files and progress are saved only when requested, at the designated destination under existing conventions; ordinary planning creates no learning database."
where = ["SKILL.md#deliver", "references/progress.md#save-only-useful-continuity"]

[[invariants]]
rule = "A request for a schedule or calendar never authorizes creating calendar events, reminders, enrollments or recurring tasks."
where = ["SKILL.md#review-and-adjust"]


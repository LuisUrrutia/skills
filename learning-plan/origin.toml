[[sources.ideas]]
idea = "A plan orders objectives from the foundations the learner needs to applied practice, groups them into milestones the learner can reach in the available time, and gives each milestone practice with feedback criteria."
serves = "The learner reaches the outcome through achievable steps and knows what good work looks like at each one."
where = ["SKILL.md#sequence-the-learning"]
shapes = "Sets the section's order: work backward from the outcome, order objectives by prerequisites, then give each chapter or milestone an objective, a worked example, a practice task with feedback criteria and a checkpoint."
adapted = "Only the foundation needed for the next meaningful application comes first. An explicit request for no exercises or assessment replaces practice with worked examples and optional self-review."

[[sources.ideas]]
idea = "At a milestone, the plan compares the learner's actual work with the target outcome, reinforces the weak concepts, and revises the pacing, the upcoming practice and the next milestone with its checkpoint."
serves = "Keeps the plan matched to the learner's real progress instead of its original schedule."
where = ["SKILL.md#review-and-adjust", "references/progress.md#evaluate-the-next-step"]
shapes = "Makes review a separate step that feeds observed difficulty back into the example, prerequisite, workload or next task, and ends the progress reference with a revision of the next milestone and its criteria."

[[sources.declined]]
feature = "Asking the learner for information through a mandatory question tool."
reason = "The skill asks for missing constraints only when they materially change the plan."

[[sources.declined]]
feature = "A week-by-week plan with a fixed number of weeks."
reason = "The plan follows the learner's known time constraints; when available time is unknown, it uses milestones with an adjustable workload instead of an invented weekly commitment."


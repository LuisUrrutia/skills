[[sources.ideas]]
idea = "The plan starts from the learner's real goal, stated as something they can explain, perform or evaluate. That goal decides what to teach, which resources to use and when to advance."
serves = "Keeps every objective tied to an outcome the learner can demonstrate, so the plan does not drift into abstract coverage."
where = ["SKILL.md#establish-the-outcome"]
shapes = "Puts goal-setting first: the opening section identifies the learner, outcome, prior knowledge and constraints before any sequencing, and expresses success as an observable ability."
adapted = "The goal lives in the plan itself, not in a separate mission file, and the skill asks for missing details only when they materially change the plan."

[[sources.ideas]]
idea = "A plan uses a small number of reliable, level-appropriate resources and says what each contributes. Titles, availability, access requirements and changing facts are verified before a resource is recommended, and gaps that no resource covers are stated."
serves = "Prevents resource overload, invented links and false confidence that the materials cover the whole outcome."
where = ["SKILL.md#sequence-the-learning"]
shapes = "Adds a closing paragraph to the sequencing section that limits, annotates and verifies the recommended materials and states their gaps."
adapted = "Resources are listed in the plan rather than in a resources file. Paid materials and communities are recommended only when the request needs them, while the donor sends questions that need practitioner experience to a community by default."

[[sources.ideas]]
idea = "The next task challenges the learner just beyond what they have shown they can do: a difficult checkpoint reduces or changes the task and reinforces the prerequisite that matters, and a comfortable one skips redundant practice or adds a useful variation."
serves = "Keeps practice at a useful level of difficulty instead of repeating mastered material or outrunning the learner."
where = ["references/progress.md#evaluate-the-next-step"]
shapes = "Splits the next-step decision into a branch for difficult checkpoints and a branch for comfortable ones."

[[sources.ideas]]
idea = "Progress evidence has distinct levels: material the learner only saw, knowledge they report, application that succeeded with support, and application without support. Only an attempt, explanation or application reveals understanding; a completed chapter or a confident self-report does not."
serves = "Prevents treating coverage or claimed knowledge as learning when deciding whether to advance."
where = ["references/progress.md#evaluate-the-next-step", "SKILL.md#review-and-adjust"]
shapes = "Opens the next-step evaluation with the four evidence levels, and makes every checkpoint use an attempt, explanation or application."
adapted = "Self-reported knowledge stays reported, not assumed mastery, and the skill uses no mastery percentages or permanent ability labels."

[[sources.ideas]]
idea = "When a later attempt contradicts what a saved record says the learner understands, the plan reassesses that prerequisite and keeps the correction visible instead of treating the old record as fact."
serves = "Stops stale or wrong progress records from steering the next steps."
where = [
  "references/progress.md#resume-the-right-context",
  "references/progress.md#save-only-useful-continuity",
]
shapes = "Makes resumption check saved understanding against current attempts before reuse, and makes saved records keep material corrections and dates where stale facts matter."

[[sources.declined]]
feature = "A teaching workspace with fixed files and formats as the state of every plan: a mission file, a resources file, a glossary, numbered learning records, HTML lessons and shared assets."
reason = "A lightweight plan works without a course workspace; a single plan with a short progress section can be enough, and separate files are optional structures for a need."


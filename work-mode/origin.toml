format_version = 2
skill = "work-mode"
created = "2026-10-07"
approach = "derive"
goal = "Carry one selected development task from its actual state to the requested, authorized result by choosing the next necessary phase, running it through the local skill that owns it, and reading that phase's actual result. Success is that the requested endpoint has its required current evidence, or that the report names what was completed, what remains, the exact blocker, and the next actor or action."

[[invariants]]
rule = "The skill is a small coordinator over registered local skills. It owns route selection, phase transitions and continuation; each specialist owns its procedure and can also be used directly without this coordinator."
reason = "Wrapping a donor coordinator would mean replacing its authority, tooling, worker policy and delivery throughout."
where = ["SKILL.md#work-mode", "SKILL.md#choose-the-next-necessary-phase"]

[[invariants]]
rule = "Authority stays task-specific. A generic implementation request ends with the scoped change, the required checks and any commits that the task or standing rules require; publication, merge, deployment and background scheduling need their own authority from the request or standing rules. Already-authorized phases need no new approval."
where = ["SKILL.md#establish-the-task-and-endpoint", "references/delivery.md"]

[[invariants]]
rule = "When one branch of the work is blocked, the coordinator continues independent authorized work. It asks immediately about an unresolved choice that materially changes scope, behavior, a contract or execution authority, and it never turns agent assumptions into policy."
where = ["SKILL.md#establish-the-task-and-endpoint", "SKILL.md#choose-the-next-necessary-phase"]

[[invariants]]
rule = "Delivery follows the request: review is proportionate and conditional, commits happen at completed atomic boundaries under task or standing authority, local-only work stays local, the delivery scope is explicit, and PR follow-up waits on events through a host-supported watch instead of polling or an unrequested recurring schedule."
where = [
  "SKILL.md#verify-review-and-repair",
  "references/delivery.md#preserve-continuation-and-waiting",
]


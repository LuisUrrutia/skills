[[sources.ideas]]
idea = "Route work by its shape, because implementation, bug repair, behavior-preserving restructuring and read-only investigation each end in a different result: a built change, a verified repair with its original reproduction, preserved behavior with evidence, or an answer with no code change."
serves = "Prevents running the wrong procedure for the task and keeps each kind of task from ending in another kind's deliverable."
where = ["SKILL.md#choose-the-next-necessary-phase"]
shapes = "The routing table maps each current need to its owner and to the result needed before continuing, and a request for only a specialist result ends at that owner's artifact without appended implementation or delivery."
adapted = "Routes go to registered local skills, and a small settled change has a direct route with no direction map or decomposition ceremony, instead of the donor's Cursor playbooks."

[[sources.declined]]
feature = "Cursor playbooks as the phase procedures, with their steps copied into a todo list."
reason = "Each phase goes to the registered local skill that owns it, and a small settled change is implemented directly."

[[sources.declined]]
feature = "Fixed model roles: an explicit model for each role and a reasoning level and speed for each subagent."
reason = "Model choice follows the host and the applicable task or specialist policy; the skill sets no model roster."

[[sources.declined]]
feature = "Mandatory delegation of implementation to subagents."
reason = "Implementation runs directly unless delegation is requested or allowed and serves a concrete need; skill composition does not imply child agents."

[[sources.declined]]
feature = "Automatic external writes, such as ticket updates and team chat messages, without asking."
reason = "External writes need authority from the request or standing rules."

[[sources.declined]]
feature = "A universal PR tail: opening a PR at the end of every playbook."
reason = "A task ends at its requested endpoint; PR work runs only when that endpoint includes it."

[[sources.declined]]
feature = "A standing program in which one coordinator runs a multi-day project."
reason = "The skill carries one selected task; new backlog work and recurring jobs are separate tasks."


[[sources.ideas]]
idea = "Each phase handoff carries the selected work source, the phase scope and authorization, the actual implementation, the evidence and who continues afterward. The coordinator reads the returned artifact, changes and evidence against the phase contract instead of trusting a completion label."
serves = "Keeps continuation correct across specialists and prevents a phase from being treated as done because it says so."
where = [
  "SKILL.md#run-a-phase-and-read-its-result",
  "SKILL.md#retain-the-next-action-and-finish-honestly",
]
shapes = "Run a phase and read its result defines what the owner receives and how its return is inspected; the last section defines what a multi-phase record keeps."
adapted = "Each local owner's existing return contract is reused; there are no engine carriers, controller runtime or mandatory result schema."

[[sources.ideas]]
idea = "A fix returned by diagnosis is already the implementation, so it is not dispatched again. Existing artifacts and valid evidence are reconciled first, and only the missing evidence is recovered."
serves = "Prevents duplicate implementation and repeated work after a phase returns or a session resumes."
where = [
  "SKILL.md#choose-the-next-necessary-phase",
  "SKILL.md#run-a-phase-and-read-its-result",
  "SKILL.md#retain-the-next-action-and-finish-honestly",
]
shapes = "The routing table's row for the debug skill treats a returned fix as implementation; reading a result reuses completed work and valid evidence before recovering what is missing; resumption reconciles the record with current state before acting."

[[sources.declined]]
feature = "Engine carriers, a controller runtime and a mandatory structured result schema for phase returns."
reason = "Each local owner's return contract is reused, and the coordinator imposes no new schema on specialists."

[[sources.declined]]
feature = "Stopping the whole run when one child return is not complete, and proceeding on agent assumptions instead of asking about consequential choices."
reason = "Independent authorized work continues across a blocked branch, and an unresolved consequential choice is asked about immediately."

[[sources.declined]]
feature = "A fixed shipping tail after every code change: simplification, review, learning capture, browser tests, commit, push, PR and CI watch."
reason = "Review is conditional, commits are atomic, local-only work stays local, delivery scope is explicit, and follow-up is event-driven."


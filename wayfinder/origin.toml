format_version = 2
skill = "wayfinder"
created = "2026-10-06"
approach = "derive"
goal = "Turn an ambiguous initiative into an evidence-backed direction that can be planned, keeping its connected decisions and their context in a durable map that later sessions and contributors can resume. Success is a direction whose outcome, boundaries, material choices and constraints permit planning without guessing a consequential decision; narrowing, deferring or abandoning the initiative, or an exact blocker with the action that clears it, can also be the result."

[[invariants]]
rule = "Settled choices stand unless new evidence or scope affects their basis. Judgment the user already delegated is exercised within its bounds and recorded; the skill asks only for a consequential choice that evidence and delegated judgment do not settle."
where = ["SKILL.md#ground-the-destination"]

[[invariants]]
rule = "A recommendation to narrow, defer or abandon the initiative stays distinct from an authorized decision. Each decision, deferral and exclusion records who or what authorized it."
where = ["SKILL.md#keep-the-map-current", "SKILL.md#hand-over-a-direction"]

[[invariants]]
rule = "When planning was already requested, the skill continues into the available planning workflow; it requires no particular planning skill, planning package or extra approval."
where = ["SKILL.md#hand-over-a-direction"]

[[invariants]]
rule = "The skill owns product, architecture and migration direction. The implementation approach belongs to the planning skill, and delivery decomposition belongs to the task-breakdown skill."
reason = "The skill exists to resolve the uncertainty that prevents good planning, not to plan or decompose the work itself."
where = ["SKILL.md#wayfinder"]

[[invariants]]
rule = "Tracker writes, publication, delegation and other external writes need the active task's authority; a local map grants none of them."
where = ["SKILL.md#chart-the-map", "SKILL.md#resolve-what-matters-next"]


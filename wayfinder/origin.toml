[[sources.ideas]]
idea = "A suggested solution is a candidate until the user chooses it. The skill checks whether it addresses the underlying problem, duplicates an existing capability or commits more scope than the outcome needs, using evidence of current behavior, workarounds and pain. Implementation feasibility alone does not show user value."
serves = "Prevents committing the direction to a solution that does not solve the real problem."
where = ["SKILL.md#ground-the-destination", "assets/decision-map.md#destination"]
shapes = "Adds a check of a suggested solution to the grounding step, before the map is charted, and gives the template's destination a line for current behavior, workarounds and evidence of the problem."

[[sources.ideas]]
idea = "For a question that changes the direction, the comparison includes materially different ways to meet the outcome, such as keeping or extending what exists, a smaller intervention, or doing nothing when that is credible. No alternative is invented to fill a menu, and no settled choice is reopened to create one."
serves = "Prevents a choice between variants of one idea while a simpler or existing path is ignored."
where = ["SKILL.md#resolve-what-matters-next"]
shapes = "Makes the comparison step for a direction-changing question start by widening the options to these real alternatives, and forbids padding the menu."

[[sources.ideas]]
idea = "When the user cannot assess an unfamiliar area, the skill first explains the relevant options and hazards from evidence, then asks. The explanation and the question stay tied to decisions in this initiative."
serves = "Turns guesses into informed choices in territory the user does not know."
where = ["SKILL.md#ground-the-destination"]
shapes = "Inserts an explanation step before a question about an unfamiliar area in the questioning paragraph."
adapted = "The skill explains directly when the need shows; it does not first offer a separate teaching pass for the user to accept or decline."

[[sources.ideas]]
idea = "The investigation looks for evidence that could disconfirm the leading direction and keeps conflicting evidence and its limits visible. Its depth follows how costly a wrong choice would be and how hard the choice is to reverse."
serves = "Prevents framing or momentum from carrying a direction that the evidence does not support."
where = ["SKILL.md#resolve-what-matters-next"]
shapes = "Makes the opening of Resolve what matters next weigh the impact of being wrong against the cost of learning, and makes the Facts method keep conflicting evidence and its limits visible."

[[sources.declined]]
feature = "Compound Engineering configuration files, the unified-plan artifact contract, model-tier dispatch and a prescribed artifact folder."
reason = "One portable decision map in the requested or project-conventional location carries the work."

[[sources.declined]]
feature = "Mandatory challenge, confirmation and teaching-offer gates, such as a confirmation question after the scoping synthesis and an offer before mapping unfamiliar territory."
reason = "Settled choices and already delegated authority stand; the skill asks only for a consequential choice that evidence and delegated judgment do not settle."

[[sources.declined]]
feature = "Fixed research floors and counts, such as required project and external evidence floors, two or three approaches, or three to seven blindspot items."
reason = "The skill gathers the evidence the decision needs and stops when more detail would not change the choice or its readiness."


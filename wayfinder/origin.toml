[[sources.ideas]]
idea = "The work starts by naming the destination: who needs what outcome, how success shows, and what must be known before planning. One canonical decision map then carries the initiative across sessions. Each session reads it first, compares its recorded premises with current evidence, and updates it after each answer."
serves = "Lets an initiative larger than one session resume from recorded state instead of private recollection or repeated discussion."
where = [
  "SKILL.md#ground-the-destination",
  "SKILL.md#chart-the-map",
  "assets/decision-map.md#destination",
]
shapes = "Puts grounding the destination first and makes a resumed session start by reading the existing map. The map template opens with the destination, its planning-readiness condition and the current next action."
adapted = "The map lives in the requested or existing authoritative document or tracker, or follows the project's artifact conventions, so local Markdown is enough. The skill checks that the next session can find and access the map, and states the retention limit and the action that preserves it when storage is temporary or checkout-local. A read-only run returns the map and says it was not saved."

[[sources.ideas]]
idea = "The map keeps three kinds of item apart. A decision question is recorded once it can be stated precisely, even while it is blocked. An area that matters but cannot yet be phrased as a precise question stays visible as not yet specified, and no speculative question is invented for it. An exclusion records its reason and authority and does not count as an answered question."
serves = "Keeps the map honest about what is decided, what is still vague and what is out of scope."
where = [
  "SKILL.md#chart-the-map",
  "SKILL.md#keep-the-map-current",
  "assets/decision-map.md#decisions",
  "assets/decision-map.md#not-yet-specified",
  "assets/decision-map.md#destination",
]
shapes = "Splits the map template into a decisions table, a Not yet specified section and an out-of-scope line, and adds a step to Keep the map current that promotes a vague area once its question becomes precise."
adapted = "An exclusion can come back through an authorized scope change; the donor lets it back only as a fresh effort with a redrawn destination. Deferral is a separate state that records its authority and a condition for reconsideration."

[[sources.ideas]]
idea = "Each question is resolved through the kind of evidence that can settle it: inspection for facts, a prototype or small experiment for behavior, and the user for preferences or private context. The answer is recorded with its authority, rationale and evidence, and the questions that depend on it are updated in the same pass."
serves = "Answers rest on evidence that can settle them, and dependent decisions do not go stale."
where = ["SKILL.md#resolve-what-matters-next", "SKILL.md#keep-the-map-current"]
shapes = "Organizes Resolve what matters next around a list that matches each kind of missing answer to a method, and makes Keep the map current record each answer and update dependent questions and the next action in one pass."
adapted = "Behavior questions go to the local prototype skill and software-structure questions to the local design-code-structure skill when they are available, resolved by registered name, and their results come back to the map. Prototype code stays experimental unless integration is authorized, and no implementation step or approval gate comes with these skills. Where the donor updates or deletes tickets that an answer invalidates, the local skill reopens the affected decisions when a premise changes, blocks dependent planning and keeps the superseded rationale."

[[sources.ideas]]
idea = "Each decision has one authoritative detail record. The map holds a compact index of IDs, questions, states, dependencies and links, and its summaries point to those records."
serves = "Prevents conflicting copies of a decision and keeps the map small enough to read at the start of each session."
where = [
  "SKILL.md#chart-the-map",
  "assets/decision-map.md#decisions",
  "assets/decision-map.md#decision-record-id-and-question",
]
shapes = "Pairs the template's decisions table with one decision record per ID, and makes the chart section require stable IDs and links when a map is created or restructured."
adapted = "Small maps keep the index and the records in one file; details move to separate records only when that helps resumption."

[[sources.declined]]
feature = "A map that must be a labelled issue on the issue tracker, with decision tickets as child issues that sessions claim by assignment, and research findings pushed to branches."
reason = "The map lives in the requested, existing or project-conventional record, which can be local Markdown. Tracker writes, labels, branches, assignments and delegation happen only when the task authorizes them."

[[sources.declined]]
feature = "The `disable-model-invocation` setting, which stops a model from selecting the skill on its own."
reason = "The skill stays discoverable so a model can select it when an ambiguous initiative needs it."

[[sources.declined]]
feature = "A fixed ticket size of one 100K-token session, a limit of one resolved ticket per session, and required specialists: the grilling, domain-modeling and research skills, research subagents, and setup through the setup-matt-pocock-skills skill."
reason = "Investigation scales to each question's uncertainty and reversibility. Specialists are optional and resolved by registered name."


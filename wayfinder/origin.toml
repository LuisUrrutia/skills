[[sources.ideas]]
idea = "Options are compared through concrete differences: who benefits, what changes, relevant costs and failure modes, and how hard the choice is to reverse. Consequential claims are inspected or measured where practical, and estimates and unknowns are labelled as such."
serves = "Lets the user judge options from facts instead of prose impressions."
where = [
  "SKILL.md#resolve-what-matters-next",
  "assets/decision-map.md#decision-record-id-and-question",
]
shapes = "Sets the criteria that the option-judging paragraph applies to every option, and gives the decision record a line for real alternatives, tradeoffs and the cost of reversal."
adapted = "A sketch, example or comparison table is used only where it makes a choice easier to assess. There is no word budget, and a numerical cost estimate is not required for every option."

[[sources.ideas]]
idea = "The recommendation names the assumption or missing fact it turns on and the evidence that would change it. When that fact is a preference or private context that only the user has, the question asks about that fact instead of asking the user to pick among options."
serves = "Gets a fast, informed answer and makes the weak point of the recommendation explicit."
where = [
  "SKILL.md#resolve-what-matters-next",
  "assets/decision-map.md#decision-record-id-and-question",
]
shapes = "Closes option comparison with the decisive assumption, turns the Human judgment method into a question about that fact, and gives the decision record a line for what would change the recommendation."

[[sources.ideas]]
idea = "Each recorded answer keeps what would change it. When a premise changes, the affected decisions are reopened and revalidated instead of being kept as if their basis still held."
serves = "Prevents planning on decisions whose basis no longer holds."
where = ["SKILL.md#ground-the-destination", "SKILL.md#keep-the-map-current"]
shapes = "Makes Keep the map current record what would change each answer and reopen affected decisions on a premise change, and makes a resumed session compare recorded premises with current evidence before it chooses the next question."

[[sources.ideas]]
idea = "A consequential claim is tested through the smallest relevant evidence surface. The actual observations, inputs and limits are recorded, and each claim is marked supported, contradicted or inconclusive; an inconclusive result is not counted as support."
serves = "Prevents a plausible design, a proposed experiment or mixed evidence from passing as a tested result."
where = [
  "SKILL.md#resolve-what-matters-next",
  "assets/decision-map.md#decision-record-id-and-question",
]
shapes = "Adds a recording rule after the method list for observations, inputs, limits and the three outcomes, and an investigation line in the decision record for the deciding observation, the actual result and its limits."

[[sources.declined]]
feature = "Implementation plans, ticket splitting and plan-review scorecards."
reason = "The skill reaches a direction before execution planning; the planning skill owns the implementation plan and the task-breakdown skill owns delivery units."

[[sources.declined]]
feature = "A word budget per decision, a preview for every option and a measured cost for each option."
reason = "Previews appear where they clarify a decision; claims are measured where practical, and estimates are labelled."

[[sources.declined]]
feature = "A decision log written into a plan file, and an offer to write decision context into AGENTS.md, a roadmap or the agent's memory."
reason = "Durable context stays in the existing authoritative map; the skill does not create another plan or propose memory writes on its own."


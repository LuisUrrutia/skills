[[sources.ideas]]
idea = "Rigor scales with the impact of being wrong and how reversible the decision is: a one-way or high-impact choice gets deeper investigation, and a cheap, reversible one gets less."
serves = "Spends investigation where a wrong direction would cost the most."
where = ["SKILL.md#resolve-what-matters-next"]
shapes = "Ties the depth of each investigation to uncertainty and reversibility in the opening of Resolve what matters next, and limits what cheap reversal can justify in the recommendation paragraph."
adapted = "Cheap reversal can justify a bounded experiment, but it never makes an option that violates a hard constraint acceptable."

[[sources.ideas]]
idea = "When a choice is genuinely open, the options compared differ in structure, not as variants of one shape. When constraints leave one viable path, the skill states it and why instead of exploring further."
serves = "Prevents settling on the first shape when a materially different one could serve the outcome better."
where = ["SKILL.md#resolve-what-matters-next"]
shapes = "Requires materially different options in the comparison paragraph and adds a rule to state a single viable path and its reason instead of inventing alternatives."
adapted = "There is no required number of options or prototypes."

[[sources.ideas]]
idea = "Before an experiment, the skill states the observation that would support or reject the option, runs the smallest experiment that distinguishes it, and judges the actual result against the original question. A finished subtask or a report of success does not answer the question."
serves = "Prevents a completion report or a passing proxy from standing in for evidence."
where = ["SKILL.md#resolve-what-matters-next"]
shapes = "Makes the Behavior or feasibility method define the deciding observation before the experiment, and adds a rule that specialist results are assessed against the original question."
adapted = "An experiment or prototype runs only when it resolves a decision and is authorized, and prototype code stays experimental unless integration is authorized."

[[sources.declined]]
feature = "The full figure-it-out pipeline: a designed execution workflow, the implementation loop, delivery of landed units, a committed audit log and judge review of delegated work."
reason = "This skill stops at a direction ready for planning; execution, delivery and review belong to later workflows."

[[sources.declined]]
feature = "Building two or three competing prototypes before committing to a novel design."
reason = "A prototype runs only when it resolves a decision and is authorized; the number of options follows the decision."

[[sources.declined]]
feature = "A separate decision-trail log through the show-me-your-work skill, and fan-out to workers on their own worktrees or branches."
reason = "The existing decision map is the audit trail; delegation and external writes follow the active task's permissions."


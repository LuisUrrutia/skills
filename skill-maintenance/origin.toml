format_version = 2
skill = "skill-maintenance"
created = "2026-10-18"
approach = "create"
goal = "Keep each skill's origin.toml true to the skill, recording its goal, the decisions that shape it and the outside material it builds on, and update a skill from its recorded sources or installed dependencies when asked. Success is a record that lets an agent who never saw the original conversation keep those decisions in later edits and updates, and an update that incorporates compatible changes without losing them."

[[invariants]]
rule = "This skill owns each skill's origin.toml: its format, the checker, recording goals and decisions, and updates from recorded sources and installed dependencies. The agent-instructions skill writes and evaluates skill text, including the text that an update incorporates. Other skills carry no maintenance instructions of their own."
reason = "User decision on 2026-10-18: one skill records decisions and runs updates, instead of a maintenance reference repeated in every skill."
where = [
  "SKILL.md#skill-maintenance",
  "references/updates.md#decide-and-incorporate",
]

[[invariants]]
rule = "In a repository that keeps records, where the skill itself or another skill in that repository has an origin.toml and skills installed in the host outside it do not count, every skill has one with at least its approach and goal, including a skill built without outside sources; elsewhere a record is created only when the user asks. A change that adds, removes or alters a rule, an adopted idea, a base deviation or a dependency is recorded; a wording fix that keeps the meaning is not."
reason = "User decisions on 2026-10-18: a skill always has a goal and people keep modifying it, so the decisions behind each change are kept; skills created in other projects, such as a generated verify-<app>, get no record unless requested."
where = ["SKILL.md#record-decisions"]

[[invariants]]
rule = "Each entry describes the idea or decision itself, so that a model that never saw the source, the conversation or the diff understands what the skill does and why. A donor quote, a bare 'adopt X' or a list of additions is not an entry."
reason = "User request on 2026-10-17: format 1 records read as lists of what to add instead of which idea the skill incorporated."
where = [
  "SKILL.md#record-decisions",
  "references/origin-format.md#ideas-and-declines",
]

[[invariants]]
rule = "Reasons come from the user or from the evidence. An invariant with an unknown reason leaves it out, and a deviation or decline takes its reason from the request or the evidence and waits for the user when neither supplies one. Commits, hashes and dates come from the repository or file, and an upstream commit is never assigned to a snapshot without matching evidence. The goal changes only on the user's statement."
where = [
  "SKILL.md#record-decisions",
  "references/origin-format.md#other-records",
]

[[invariants]]
rule = "Check mode leaves the skill and its record unchanged. Update mode incorporates compatible changes within the existing contract without another routine approval and asks only for a material decision outside it. Neither mode creates a schedule, and using a skill never fetches its sources."
where = [
  "SKILL.md#skill-maintenance",
  "references/updates.md#choose-the-requested-mode",
]

[[invariants]]
rule = "A source's reviewed_through advances only when its full scoped range is resolved and the required validation passes. Otherwise a pending review keeps the reason and the cursor stays, and the run reports what stayed unresolved instead of claiming the skill is fully synchronized."
where = [
  "SKILL.md#check-or-update-from-sources",
  "references/updates.md#read-the-record",
  "references/updates.md#decide-and-incorporate",
  "references/origin-format.md#reviews",
]

[[invariants]]
rule = "Upstream adoption of a new tool, approval gate, trigger, external write or authority does not authorize a local one; incorporating it needs the user's decision."
where = ["references/updates.md#decide-and-incorporate"]

[[dependencies]]
kind = "local"
name = "agent-instructions"
required = false
role = "Required in Update mode: writes the text that an update incorporates and chooses its behavioral checks. Record and Check run without it."

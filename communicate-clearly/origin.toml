format_version = 2
skill = "communicate-clearly"
created = "2026-10-04"
approach = "derive"
goal = "Help a reader understand, decide or act through prose in any language: answers, explanations, drafts, rewrites and reviews. Success is text that the intended reader follows on the first read, with its meaning, the author's voice and protected material intact and without generic or mechanical patterns."

[[invariants]]
rule = "The guidance applies by default to prose in any language."
reason = "The user explicitly chose default communication guidance in any language."
where = ["SKILL.md#communicate-clearly"]

[[invariants]]
rule = "Writing controls expression only. Drafting or adapting text to a channel does not authorize posting, sending or publication; those happen only when the active request covers them."
where = [
  "SKILL.md#establish-the-task",
  "SKILL.md#check-and-deliver",
  "references/explanations-and-channels.md#match-the-destination",
]

[[invariants]]
rule = "Neighboring owners keep their work: the write-documentation skill owns documentation structure and evidence, the explain-code and explain-decisions skills own code-mechanism and rationale investigation, the commit and pr skills own their artifacts, and the agent-instructions skill owns agent instructions. This skill continues to govern the prose."
where = ["SKILL.md#check-and-deliver"]

[[invariants]]
rule = "The skill is portable prose instructions with no upstream runtime, script or network dependency."

[[sources]]
id = "blader"
author = "Siqi Chen"
repository = "https://github.com/blader/humanizer"
remote = "git@github.com:blader/humanizer.git"
ref = "refs/heads/main"
license = "Original notice retained in THIRD-PARTY-NOTICES.txt"
role = "ideas"
baseline_commit = "e2e92e7b4b8229253ed5c8e81dc65463fdeddda5"
reviewed_through = "225a6f39ac85f76ee48dbad772ea4abe4ed6c9d8"
baseline_paths = ["SKILL.md", "LICENSE"]
paths = ["SKILL.md", "LICENSE"]

[[sources.ideas]]
idea = "Prose that feels generated is diagnosed against a catalog of pattern families, such as lexical tells, significance padding, formulaic syntax, outline artifacts, punctuation tells and chatbot residue. Each family states why the pattern is suspicious, its false positives, and a concrete repair that replaces the pattern with the actual claim, actor or evidence."
serves = "Removes generic, mechanical writing with repairs that add clarity instead of swapping words."
where = ["REFERENCE.md", "SKILL.md#make-it-natural-in-the-target-language"]
shapes = "The catalog is a separate reference with a route map: a writing-pattern review reads all of it, while drafting or targeted repair loads only the families that match."
adapted = "The catalog is loaded conditionally and judged by clusters and density; a single word, dash or tidy sentence is not a defect."

[[sources.ideas]]
idea = "Supplied voice samples set rhythm, vocabulary and register without mechanical imitation, and personality, warmth, humor and deliberate style stay where they fit the writer and the genre."
serves = "Keeps the author's voice while generic phrasing goes."
where = [
  "SKILL.md#establish-the-task",
  "SKILL.md#make-it-natural-in-the-target-language",
  "references/explanations-and-channels.md#match-the-destination",
]
shapes = "Task setup reads voice samples before writing, and the channel guidance forbids flattening personal writing into corporate prose."
adapted = "The voice never supplies invented experiences, opinions or facts, whereas the donor lets a rewrite add an opinion when the writer's voice calls for one."

[[sources.ideas]]
idea = "Before a pattern is flagged, check whether it appears alone, follows house style or a genre convention, sits in quoted or discussed text, or carries concrete detail or the writer's real voice; if so, soften the finding to a targeted edit. These guardrails protect human choices and do not license adding tells during a rewrite."
serves = "Prevents rewriting legitimate human prose because it resembles a pattern."
where = [
  "REFERENCE.md#detection-principles",
  "REFERENCE.md#19-false-positive-guardrails",
  "REFERENCE.md#review-rubric",
]
shapes = "Each family carries its own false positives, and the catalog ends with the guardrail checklist and a rubric that weighs counterevidence."
adapted = "A concern level describes the prose, never its authorship, and the skill promises no detector evasion."

[[sources.ideas]]
idea = "After drafting, the result is read as the intended reader without the source in view. A rewrite then gets a claim-by-claim fidelity pass that confirms each unique claim keeps its certainty, scope, polarity, conditions, causality, attribution and support. A rescan covers the diagnosed patterns and the tells that rewrites most often add, and both checks repeat after a substantive repair."
serves = "Catches meaning drift and newly introduced tells before the text is returned."
where = [
  "SKILL.md#check-and-deliver",
  "FIDELITY.md#meaning-contract",
  "FIDELITY.md#claim-by-claim-fidelity-pass",
]
shapes = "The final section orders the reader pass, the fidelity pass and the rescan, and FIDELITY.md holds the meaning contract and the ordered steps of the pass."
adapted = "Rewriting is recomposition: every unique substantive claim stays unless the user authorizes cuts, and an unsupported promotional wrapper may be replaced when the author's material point, stance and support survive."

[[sources.declined]]
feature = "Judging whether a person or a model wrote the text, for example from the date of an edit."
reason = "Prose alone cannot establish authorship; findings describe the writing, and the skill promises no detector evasion."

[[sources.declined]]
feature = "Removing every em and en dash from the final rewrite unless a writer's sample uses them."
reason = "A single dash is not a defect; the catalog judges punctuation in clusters and keeps deliberate style."

[[sources.reviews]]

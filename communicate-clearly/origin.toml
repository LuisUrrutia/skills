[[sources.ideas]]
idea = "Each concept keeps one stable term with clear referents, instead of cycling synonyms to avoid repetition."
serves = "Prevents the reader from taking one thing for several."
where = [
  "SKILL.md#build-the-readers-route",
  "references/explanations-and-channels.md#make-the-explanation-usable",
]
shapes = "The recomposition paragraph requires one term per concept and clear referents, and the explanation guidance puts stable naming above variety."

[[sources.ideas]]
idea = "The syntax shows how ideas relate, such as cause, condition, contrast or sequence, and punctuation expresses that relationship instead of serving as an all-purpose connector."
serves = "Lets the reader follow the logic without reconstructing missing links."
where = ["SKILL.md#build-the-readers-route", "SKILL.md#make-it-natural-in-the-target-language"]
shapes = "Recomposition moves support beside its claim and states relationships in the syntax, and the language section stops using a colon or dash as an all-purpose connector."

[[sources.ideas]]
idea = "Writing starts from what the reader already knows and supplies the missing prerequisite. Expert terminology stays where it makes an expert's task easier, and a precise term is explained rather than replaced with a different concept."
serves = "Gives each reader the gap they lack without losing precision."
where = [
  "SKILL.md#build-the-readers-route",
  "references/explanations-and-channels.md#make-the-explanation-usable",
]
shapes = "The route section introduces unfamiliar concepts before relying on them, and the explanation guidance starts from the reader's existing knowledge."

[[sources.ideas]]
idea = "Conditions come before the actions they govern, and the actor is clear: active voice when the actor matters, passive voice when the actor is unknown or the object deserves the focus."
serves = "Makes instructions safe to follow in reading order."
where = ["SKILL.md#make-it-natural-in-the-target-language", "SKILL.md#build-the-readers-route"]
shapes = "The language section names stable terminology, clear actors and conditions before actions as the ASD-STE100 principles to transfer, and the route section sets the rule for active and passive voice."
adapted = "Only the principles transfer, adapted to each language's grammar and punctuation; the controlled dictionary, tense rules and word limits are not imposed, and no STE compliance is claimed."

[[sources.ideas]]
idea = "Before delivery, the text is read once more as the intended reader for naturalness: the reader must follow the thought without reconstructing missing links or rereading to decode it."
serves = "Prevents text that obeys every rule and still reads as machine-written."
where = ["SKILL.md#check-and-deliver"]
shapes = "The check section opens with this reader pass, before the evidence and fidelity checks."

[[sources.declined]]
feature = "Sentence-length caps of about 20 or 25 words, and a fixed blacklist of AI words to replace."
reason = "The catalog judges clusters rather than single words, and shorter is better only while the reader can still understand the point and act correctly."

[[sources.declined]]
feature = "Applying STE's controlled rules, and English punctuation rules such as avoiding em dashes entirely, in every language."
reason = "Only clarity principles transfer; grammar and punctuation adapt to the target language, and the skill claims no STE compliance."

[[sources.declined]]
feature = "Mandatory teaching workflows, generated images, and applying the unslop skill to every text."
reason = "Everyday clarity does not become a lesson plan, visuals appear only when requested or materially helpful with supported tools, and this skill governs its own prose."


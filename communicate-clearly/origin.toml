  "skills/ghostwriter/references/surfaces.md",
  "skills/ghostwriter/references/tells.md",
  "LICENSE.md",
]

[[sources.ideas]]
idea = "The reader, purpose, language, channel and expected detail are inferred first, and the content is adapted to its destination: a conversation answers directly, team chat makes the needed response easy to find with the context recipients lack, email states its purpose early, a status note separates completed work from uncertainty, and personal writing keeps its voice."
serves = "Delivers the same substance in the form each audience and channel needs."
where = [
  "SKILL.md#establish-the-task",
  "references/explanations-and-channels.md#match-the-destination",
]
shapes = "Task setup infers the audience and channel first, and the reference gives one entry per destination."
adapted = "No universal one-line limit applies to chat, and private source details are checked against the destination's audience before broader distribution."

[[sources.ideas]]
idea = "Protected material stays exact: quotations, titles, proper names, identifiers, paths, commands, numbers, units, citations, placeholders and language-specific quotation forms. The explanation is written around it."
serves = "Prevents a clearer sentence from breaking a command, a name or a quotation."
where = ["SKILL.md#establish-the-task", "SKILL.md#make-it-natural-in-the-target-language"]
shapes = "Task setup lists the protected material, and the punctuation rule keeps protected text and native quotation marks exact."

[[sources.ideas]]
idea = "An explanation does not condescend: a request for plain language does not imply low intelligence, and technical detail that an expert needs stays."
serves = "Keeps plain explanations respectful and complete."
where = [
  "references/explanations-and-channels.md#make-the-explanation-usable",
  "SKILL.md#make-it-natural-in-the-target-language",
]
shapes = "The explanation guidance states this limit right after starting from what the reader knows, and the language section lists condescension among the habits to avoid."

[[sources.ideas]]
idea = "When an explanation fails, the route changes rather than the volume: a smaller case, an intermediate step or a named missing prerequisite, with a focused question when the point of confusion cannot be inferred."
serves = "Resolves the actual gap instead of repeating the same jargon with more words."
where = ["references/explanations-and-channels.md#make-the-explanation-usable"]
shapes = "A dedicated paragraph of the explanation guidance handles the failed explanation."

[[sources.ideas]]
idea = "Examples and analogies clarify only the relevant relationship. A material limit is explained before the reader could use the analogy to decide wrongly, and an invented example is labeled as illustrative and never becomes evidence, a product capability or the author's history."
serves = "Prevents an illustration from being read as fact."
where = [
  "references/explanations-and-channels.md#make-the-explanation-usable",
  "SKILL.md#build-the-readers-route",
]
shapes = "The explanation guidance sets when an analogy helps and how examples are labeled, and the route section forbids turning illustrations into evidence."

[[sources.declined]]
feature = "Mandatory author voice profiles and persistent storage of style preferences."
reason = "Supplied voice samples guide a single task; the skill requires no profile and stores none without a request."

[[sources.declined]]
feature = "Paid voice APIs, a video toolchain, and fixed output lengths such as a one-to-three-minute explainer."
reason = "Visuals are used when requested or materially helpful with tools the environment supports, and length follows what the reader needs."


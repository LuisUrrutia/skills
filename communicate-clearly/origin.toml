[[sources.ideas]]
idea = "A concept is grounded before later material relies on it: the reader either brings it or meets it earlier in the text, and a term arrives together with its idea, defined close to its first use."
serves = "Prevents passages that lean on an idea the reader does not have yet."
where = [
  "SKILL.md#build-the-readers-route",
  "references/explanations-and-channels.md#make-the-explanation-usable",
]
shapes = "The route section introduces unfamiliar concepts before relying on them, and the explanation guidance defines terms close to their first use."

[[sources.ideas]]
idea = "The text is recomposed around a throughline that orders points as the reader needs them, built from the supplied material, and each part takes the form that fits its information: prose for a relationship, a list for parallel items or steps, a table for a comparison, a diagram for a flow."
serves = "Gives the reader one coherent route instead of a sequence of separately polished sentences."
where = [
  "SKILL.md#build-the-readers-route",
  "references/explanations-and-channels.md#make-the-explanation-usable",
]
shapes = "The route section recomposes around the throughline instead of polishing sentences in place, and the explanation guidance matches each form to its information."

[[sources.declined]]
feature = "Settling prerequisites with the user first, offering candidate openings or beats for the user to pick, approving the piece paragraph by paragraph, and writing each block to an article file as it lands."
reason = "The skill composes the requested content directly. It asks only when a missing choice would materially change the result, writes no article file on its own, and does not turn clarity into a persistent course."


to_commit = "225a6f39ac85f76ee48dbad772ea4abe4ed6c9d8"
incorporated = [
  "Adapted from SKILL.md pattern 25: REFERENCE.md section 8 flags text that describes how it was made (generated from, compiled from, flagged rather than guessed), keeps followable source credits and caveats that change what the reader does, and treats one instance as weak evidence; the layout announcement 'the table below compares' joins section 16's meta-announcements.",
  "Adapted from SKILL.md pattern 1: REFERENCE.md section 4 flags a contrast split across sentences ('This does not mean X. It means Y.') and keeps a contrast when its negative half corrects a belief the reader holds or both halves carry information; upstream's 'only when' became a false-positive guard.",
  "Adapted from SKILL.md step 3: the final check in communicate-clearly/SKILL.md rescans the diagnosed patterns and the tells rewrites most often introduce or leave behind (contrasts, closers, triads, dashes, bold labels); the REFERENCE.md route map now defers to SKILL.md for the rescan.",
]
skipped = [
  "SKILL.md: Ranks patterns by strength so that patterns 1 to 5 justify an edit on one sighting and the others are weak alone. Conflicts with the local density rule at communicate-clearly/REFERENCE.md:17 and communicate-clearly/SKILL.md:78-79 and with the conditional-catalog local choice.",
  "SKILL.md: Pattern 20 adds decorative headings, rules between every section, a top heading that repeats the title and arrows. Low value because many Markdown documents use rules on purpose, so local section 6 at communicate-clearly/REFERENCE.md:105 stays unchanged.",
  "SKILL.md: One-line closers, example morals and recycled closers are regrouped. Already covered at communicate-clearly/REFERENCE.md:90, :187, :204 and :281.",
  "SKILL.md: New pattern 26 flags replies that re-explain context the reader already has. Already covered by comment-style/SKILL.md:38-49 and communicate-clearly/references/explanations-and-channels.md:9.",
  "SKILL.md: Commit c8e1872 preserves ranking and simultaneity claims during rewrites. Already covered at communicate-clearly/FIDELITY.md:24, :26 and :87.",
  "SKILL.md: Commit 07884e5 treats a lost claim as an error unless a pattern requires the cut. Conflicts with the local fidelity rule at communicate-clearly/FIDELITY.md:7.",
  "SKILL.md: Adds a hard ban on dashes, including the spaced double hyphen. Conflicts with communicate-clearly/SKILL.md:78-79 and communicate-clearly/REFERENCE.md:111.",
  "SKILL.md: Adds flagged words such as quietly, gating, key and Actually. Word-list churn that upstream says changes with each model release; local judgment uses clusters (communicate-clearly/REFERENCE.md:26) and the declined fixed blacklist of AI words rules it out.",
  "SKILL.md: Return modes, the voice-sample override, inline-code protection, the detector non-goal and treating input text as material. Already covered at communicate-clearly/SKILL.md:16-17, :29, :32-35 and :94.",
  "SKILL.md: The rest of the 2.11.2 to 3.1.0 rewrite reorders patterns, aligns them with the current Wikipedia article and moves history to CHANGELOG.md. Reordering and wording with no new behavior; patterns that already existed at the reviewed baseline were earlier local decisions and are not re-raised.",

[[sources.ideas]]
idea = "Before any command is written, the repository is interviewed for five facts: the surface a user exercises, how to run it, how to drive it, what can be observed as evidence, and how to isolate an instance. The facts come from project files and actual execution, and the user is asked only for what cannot be discovered."
serves = "Grounds the recipe in commands that work in this project instead of a generic harness."
where = ["references/create.md#interview-the-repository"]
shapes = "Makes the five-fact interview and a real build and start of the application the first stage of creation, before any instructions are written."

[[sources.ideas]]
idea = "The generated skill is a project-local verify-<app> skill whose instructions follow a six-part operating contract: Launch, Doctor, Drive, Evidence, Cleanup and Helpers, filled with the project's real commands and paths so that an agent reading it cold can run it. For a run-owned instance, Launch starts from empty data through any migrations and seed data, and readiness means a usable state, not only an answering process or port."
serves = "Gives every later verification run the same launch, health check, driving, proof and teardown steps."
where = [
  "references/create.md#write-instructions-for-the-next-agent",
  "SKILL.md#establish-the-target",
]
shapes = "Defines the generated skill's required sections as a table of required content per part, and fixes the verify-<app> name and project-local placement."
adapted = "The donor writes .cursor/skills/verify-<app>/ and suggests tmux or browser/CDP recipes. Locally the target host's supported project-local skill location is resolved, the project's existing harnesses or host-supported tools drive the application, and the agent-instructions skill writes the instructions."

[[sources.ideas]]
idea = "The generated skill keeps a feature map: an index at features/README.md that links one sibling file per user-facing feature, each with sub-features, user entry points, a driving recipe with preconditions and observable results, and gotchas. Creation seeds the top three to five features and lists the rest as unmapped coverage."
serves = "Lets later runs cover features one at a time and shows which behavior is not yet mapped."
where = ["references/feature-map.md", "references/create.md#seed-the-feature-map"]
shapes = "Adds a feature-map contract with an index and four ordered sections per feature file, and a seeding step that sets the initial scope."
adapted = "The donor's manual index hygiene becomes a bundled read-only checker for index links and section structure. It cannot prove that a command exists, a requirement is correct or an outcome was observed, so source review and live proof still establish correctness. The donor's example commands are not copied."

[[sources.ideas]]
idea = "Proof exercises the real public path, captures both the action and the resulting state, checks side effects through an independent second view, and stays readable after cleanup. Internal setters and test-only endpoints prove nothing about a user path, and a dry-run mode is observed rather than trusted by its name."
serves = "Prevents a recipe from claiming behavior it never observed or deleting its own proof."
where = [
  "references/create.md#seed-the-feature-map",
  "references/feature-map.md",
  "references/create.md#write-instructions-for-the-next-agent",
  "SKILL.md#check-the-package-and-the-live-result",
]
shapes = "Sets the proof rules for every feature recipe, and makes evidence that survives cleanup a requirement of the Evidence and Cleanup parts and of completion."

[[sources.ideas]]
idea = "Creation is done only when the generated instructions have driven one mapped feature end to end as written: launch, doctor, drive, capture evidence and clean up, with the evidence still readable afterwards. A recipe that was never executed is a draft."
serves = "Catches broken instructions before handover."
where = [
  "references/create.md#prove-the-generated-instructions",
  "SKILL.md#check-the-package-and-the-live-result",
]
shapes = "Ends creation with a live run of the recipe that names the feature and entry points exercised, and makes that run the condition for delivery."

[[sources.ideas]]
idea = "Maintenance reads every feature against source through one read-only worker per feature, run concurrently. Each worker returns the user-visible behavior, source entry points, suspected drift with citations, and one live recipe; workers never drive the application or edit files. The coordinator reconciles every returned assessment, spot-checks drift citations and looks for unmapped features with a concrete source path."
serves = "Covers every feature from source while keeping readers away from shared state."
where = ["references/maintain.md#source-wave"]
shapes = "Adds a source wave before the live pass, with a fixed worker brief, return shape and reconciliation step."
adapted = "Delegation happens only when it is available and authorized. If independent readers cannot run, the coordinator reviews source directly when the caller permits and discloses that no independent review took place."

[[sources.ideas]]
idea = "In maintenance the coordinator alone drives the mutable application, follows the target's launch model, and exercises every feature live at least once, even when source review looks clean. It records which entry points and sub-features the evidence covers; a proof through one entry point does not verify another."
serves = "Proves that each feature still works for users and keeps a single writer on shared state."
where = ["references/maintain.md#drive-every-feature", "references/maintain.md"]
shapes = "Makes the live pass of every feature mandatory and requires per-entry-point coverage records."
adapted = "The donor's verified-unreachable result becomes blocked coverage. An unreachable route is recorded with the attempted route and the concrete missing auth, entitlement, OS or external state, which verifies only that it could not be reached, never that its behavior works."

[[sources.ideas]]
idea = "Each observation is assigned to its layer. A wrong or missing description is recipe drift and the map is corrected; working behavior the harness cannot drive is a harness gap and the owned harness is fixed; broken application behavior is a product defect that is reported, never written into the map as intended. The clean, changed and blocked outcomes describe the recipe, and product failures are reported separately."
serves = "Keeps the map from endorsing regressions and keeps recipe fixes apart from product repair."
where = [
  "references/maintain.md#correct-the-right-layer",
  "references/maintain.md#report-the-outcome",
  "SKILL.md#establish-the-target",
]
shapes = "Adds a table that maps each kind of observation to its action, and separates recipe outcomes from product results in the report."
adapted = "The donor forbids product edits during a run. Locally product repair happens only when the active task already authorizes it, and recipe corrections and product defects stay distinguishable either way."

[[sources.ideas]]
idea = "Every attempt is bounded and cleans up after itself. Doctor runs before the first drive, on each fresh session and after any failed or surprising drive; a doctor failure caused by recipe drift gets one in-scope correction and one retry that restarts only what the correction invalidated. Owned processes, sessions and fixtures are removed after each failed iteration and at final teardown, never by process name or by claiming whatever answers on a port, and a shared instance loses only the residue this run created."
serves = "Prevents stranded processes, killed user instances and unbounded retry loops."
where = [
  "references/maintain.md#drive-every-feature",
  "references/create.md#prove-the-generated-instructions",
  "references/create.md#write-instructions-for-the-next-agent",
]
shapes = "Sets three invariants and a single-retry rule for the live pass, cleanup before every retry in the creation proof, and ownership rules for instances after the contract table."

[[sources.ideas]]
idea = "A proof that ran in a stand-in for the target environment, such as a container in place of a fresh VM or a local stack in place of a remote one, lists the setup that the stand-in supplied and the target will not. That setup stays unverified until a run in the target environment covers it."
serves = "Prevents a stand-in run from being reported as proof for the real environment."
where = ["SKILL.md#check-the-package-and-the-live-result"]
shapes = "Adds the rule to the shared completion paragraph so that creation and maintenance both apply it."

[[sources.declined]]
feature = "Generating into .cursor/skills/verify-<app>/ with fixed harness choices, such as tmux for CLIs or a browser/CDP recipe for web apps, or installing the generated skill globally."
reason = "The target host's supported project-local skill location and the project's own harnesses or host-supported tools decide; the request never becomes a global installation."

[[sources.declined]]
feature = "Ending a changed maintenance pass with one PR of proven corrections."
reason = "A maintenance pass does not itself require a PR; publication follows the caller and the commit and pr skills when they apply."


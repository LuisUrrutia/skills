format_version = 2
skill = "verification-authoring"
created = "2026-10-03"
approach = "derive"
goal = "Create and maintain a project-local verify-<app> skill that another agent can use cold to start the real application, confirm which instance it drives, exercise user behavior, keep proof and clean up its own resources. Success is a recipe proven by live execution, one mapped feature at creation and every feature from source and live at maintenance, with recipe drift, harness gaps and product defects reported separately."

[[invariants]]
rule = "The verify skill owns selection, scope and result claims; each project-local verify-<app> skill owns its application's executable procedures; this skill owns their creation and maintenance. A request for verification evidence alone goes to the verify skill."
where = ["SKILL.md#verification-authoring", "SKILL.md#establish-the-target"]

[[invariants]]
rule = "The agent-instructions skill, resolved by registered name, owns instruction writing and host packaging. This skill supplies only the application-verification contract and keeps no copy of general writing rules. A missing agent-instructions skill blocks writing, not repository inspection."
where = [
  "SKILL.md#verification-authoring",
  "references/create.md#write-instructions-for-the-next-agent",
]

[[invariants]]
rule = "Product repair, new dependencies, lockfile changes, global installs, commits, PRs and scheduling follow the active caller and repository rules. A failed check alone never expands the authoring scope."
where = [
  "SKILL.md#establish-the-target",
  "SKILL.md#check-the-package-and-the-live-result",
  "references/maintain.md#correct-the-right-layer",
]

[[invariants]]
rule = "Unless the caller is read-only, a launch may install the project's locked dependencies without changing the lockfile, create the env file, and run migrations and seed data against the run's isolated data, with the project's documented commands or, when the documentation is missing a step, only the scripts and targets the project itself declares and the environment variables its source reads, never a setup command composed from its internals, every step, documented or discovered, read before it runs together with what it calls, followed by the remote-query limits when it only reads and never run when it writes to a shared or remote environment (an export or dump into a remote bucket is a write), with setup changing only the run's isolated local data and never writing to a shared or remote environment, and an unclear target reported as a prerequisite. To make the local environment realistic, a launch may read a shared or remote environment through the project's own cloud or platform CLI, such as gcloud, or a declared step that reading shows only reads remote state, with read-only commands, existing authentication and no login, after confirming the active project or account belongs to the repository; that data may be copied into the run's local data without asking, a configuration read that can include secret values selects only the fields the launch needs, no command of the run brings a remote secret into a file, the output, the evidence or the process environment while the project's documented launch may resolve its own secrets with existing authentication only (a locked vault or sign-in prompt is a reported prerequisite), each query is reported with its command and environment, and a read-only caller gets none of these queries. A read-only caller gets each setup step as a reported prerequisite. When .env.schema exists, the project uses varlock: validate with `varlock load --agent`, run commands through varlock unless the project's scripts already load it, give the run its ports and data paths through the process environment, which overrides every env file, never read .env or .env.local, never invent or fill a secret, ask the user for a missing required secret, and report a blocker instead of installing varlock when neither the project nor the machine has it. Otherwise a missing .env is created from .env.example without overwriting an existing one, a missing secret goes to the user, and secret values are never printed. When the run's ports and data paths cannot go into an env file it created, they pass through the process environment and are never written into an env file the run did not create, and an env file the run created is removed at cleanup. The rule governs the authoring run's own launches and the generated Launch section."
reason = "User decision of 2026-10-18, made for the verify skill and extended to this skill's recipe Launch step. The limits on undocumented steps follow the coordinator's ruling of the same day. Read-only remote queries through the project's cloud CLI are a further user decision of the same day, with limits set by the coordinator; the user later removed the approval step for copying personal or customer data. The secret scoping and the permission for other read-only tools are the coordinator's rulings of the same day. Read-only callers run no remote queries, by the coordinator's ruling: the queries are setup, and read-only callers often run on untrusted PR content and publish their output."
where = [
  "references/create.md#launch-setup",
  "references/create.md#write-instructions-for-the-next-agent",
  "references/maintain.md#drive-every-feature",
  "references/maintain.md#correct-the-right-layer",
]


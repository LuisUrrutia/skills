id = "gsd-observability"
author = "Lex Christopherson / GSD-2"
repository = "https://github.com/gsd-build/gsd-2"
remote = "git@github.com:gsd-build/gsd-2.git"
ref = "refs/heads/main"
license = "MIT; original notice retained in THIRD-PARTY-NOTICES.txt"
role = "ideas"
baseline_commit = "33c00aaffa56e5d394bccce1c8df59fb842e84c5"
reviewed_through = "33c00aaffa56e5d394bccce1c8df59fb842e84c5"
baseline_paths = ["src/resources/skills/observability/SKILL.md", "LICENSE"]
paths = ["src/resources/skills/observability/SKILL.md", "LICENSE"]

[[sources.ideas]]
idea = "Record decisions, not activity: a structured event names a meaningful outcome or decision and carries the safe values or classifications that drove it. Function entry and exit chatter rarely answers an operational question."
serves = "Lets a later reader learn why the code acted as it did without rerunning it with extra logging."
where = ["SKILL.md#instrument-the-deciding-boundaries"]
shapes = "Opens the instrumentation section with structured decision and outcome records, and gives duplicate reports of one failure a clear owner."

[[sources.ideas]]
idea = "Failure evidence from background jobs, watchers and long-running processes must stay available after a crash or restart. Keep a record with safe operation identity, phase, time, attempt and failure classification."
serves = "Lets a reader without the original session find what failed in unattended work."
where = ["SKILL.md#preserve-evidence-for-unattended-work"]
shapes = "Adds a section for unattended work that starts from what survives a crash or restart and then sets the fields of a failure record."
adapted = "The donor writes a last-error file under its own runtime directory. Here the existing durable sink or state store is reused, and a failure record is added only where the diagnostic question needs one. State is scoped to its run or work item, the store's atomicity and concurrency controls protect it, and a freshness rule defines how success, recovery, restart or expiration updates it, so one job's success cannot erase another job's failure."

[[sources.ideas]]
idea = "A long-running process exposes a cheap status surface that has no business side effects and shows its current state."
serves = "Lets a reader tell whether unattended work is running, ready and progressing."
where = [
  "SKILL.md#preserve-evidence-for-unattended-work",
  "SKILL.md#instrument-the-deciding-boundaries",
]
shapes = "Adds the health or status row to the signal table and closes the unattended-work section with status-surface rules."
adapted = "The donor reports one healthy, degraded or down status. Locally liveness, readiness and progress stay distinct under the project's existing contract, a dependency outage does not by itself justify declaring the process dead, and the surface exposes only the detail its reader is authorized to see."

[[sources.ideas]]
idea = "Before finishing, remove temporary diagnostic probes and keep instrumentation with lasting diagnostic value. Then simulate a plausible failure and confirm that the signals tell a reader without the original context what happened."
serves = "Leaves durable signals instead of debugging noise, and proves they answer the question they were added for."
where = ["SKILL.md#verify-the-signals-at-their-destination"]
shapes = "Ends verification with a test that the emitted data alone explains each addition, records a coverage gap when it does not, and removes only temporary probes and fault controls owned by the task."

[[sources.declined]]
feature = "Writing a failure-state file to a fixed runtime path for every failure, with the GSD runtime directories and atomic-write helpers."
reason = "The skill reuses the project's existing durable telemetry and has no dependency on the GSD runtime or its repository paths."

[[sources.declined]]
feature = "Replacing silent error handling with a log line plus a thrown typed error."
reason = "Instrumentation records an otherwise silent failure with safe classification and operation identity but keeps the caller's error contract. Replacing a return value with an exception is a change for the error-handling skill and must be in scope on its own."


format_version = 2
skill = "observability"
created = "2026-10-05"
approach = "derive"
goal = "Equip a project with the logs, metrics, traces and health signals it needs to understand its operation, through an assessment, an initial setup or instrumentation added during feature work. Success is prioritized coverage that a reader without the original context can inspect at its destination, with safe and bounded signals and with the project's behavior and error contracts unchanged."

[[invariants]]
rule = "The debug skill owns investigating an observed failure. This skill owns lasting instrumentation and its collection, storage and inspection setup, and its work needs no prior incident or existing monitoring stack."
reason = "The user set the skill's scope to assessing and building project observability, with incident investigation left to the debug skill."
where = ["SKILL.md#observability"]

[[invariants]]
rule = "Scope comes from the active request. An assessment, review or design request produces recommendations without changing the project; authorized feature work includes useful instrumentation, and unrelated project-wide improvements are reported as separate recommendations."
reason = "The user made instrumentation during feature work part of the skill's scope, and a small change should not acquire an entire stack."
where = ["SKILL.md#choose-the-scope-of-the-addition"]

[[invariants]]
rule = "Suitable project tooling is reused. When it is absent or insufficient, the skill establishes the smallest collection and inspection path that the requested coverage needs."
reason = "The user's scope for the skill includes bootstrapping missing collection facilities."
where = ["SKILL.md#establish-or-extend-the-collection-path"]

[[invariants]]
rule = "Routine local setup choices are resolved within the task. A material backend, billing, data-residency or external-service decision follows the user's constraints or decision."
where = ["SKILL.md#establish-or-extend-the-collection-path"]

[[invariants]]
rule = "Every diagnostic surface, including logs, spans, metrics, persisted failure records and status responses, emits only allowlisted fields under the project's access and retention policy. Raw exception messages, stacks, URLs and payloads are never copied unrestricted."
reason = "Raw error details and payloads can contain secrets or personal data even when the public error is generic."
where = [
  "SKILL.md#keep-diagnostic-data-safe-and-affordable",
  "SKILL.md#preserve-evidence-for-unattended-work",
]

[[invariants]]
rule = "Missing or sampled-away data is unknown. It is never reported as a zero error rate or as verified health."
reason = "Sampling and collection gaps mean that an absent record proves nothing."
where = [
  "SKILL.md#verify-the-signals-at-their-destination",
  "SKILL.md#add-actionable-alerts-when-needed",
]

[[invariants]]
rule = "The skill grants no authority for production disruption, threshold changes, real notifications, deployment, paging or ongoing monitoring; these follow the active task's existing authority."
where = ["SKILL.md#verify-the-signals-at-their-destination"]

[[invariants]]
rule = "Instrumentation preserves results, exceptions, cancellation, effects, retry ownership and the caller's error contract unless the task also changes them. Telemetry overhead or exporter failure never silently changes business behavior."
where = [
  "SKILL.md#instrument-the-deciding-boundaries",
  "SKILL.md#keep-diagnostic-data-safe-and-affordable",
]


[[sources.ideas]]
idea = "Every instrumentation addition starts from an operational question. For each one, name the operation or boundary, the information missing there, the signal to add, where someone will inspect it and what an operator should learn from it."
serves = "Prevents telemetry that is emitted but answers nothing."
where = ["SKILL.md#find-and-prioritize-instrumentation-points"]
shapes = "Makes the section turn the architecture and workflow review into a prioritized list of additions, each tied to the question it answers."
adapted = "The donor asks for two to four on-call questions per feature. Here the questions come from assessing the project's architecture and critical workflows, additions are prioritized by user impact, operational uncertainty and cost, and no observed incident is needed to justify coverage."

[[sources.ideas]]
idea = "Match each signal type to the question it answers: a structured log or event for what happened in one operation and why, a metric for how much, how often, how slow or how saturated, and a trace for where an operation spent time across components."
serves = "Puts each question on the signal that can answer it at a reasonable cost."
where = ["SKILL.md#instrument-the-deciding-boundaries"]
shapes = "Organizes signal choice as a table of signal types, the question each answers and what each must preserve."
adapted = "The donor samples traces at a low default rate. Here sampling and retention are chosen against diagnostic need and cost, and the skill states that sampled traces cannot establish complete event counts or prove that an unrecorded failure never happened."

[[sources.ideas]]
idea = "Create or validate correlation context at the trusted entry point and propagate it through the affected calls, queues and workers. When several entry points write to one sink, record which entry point started the work next to its run identity, because a correlation ID identifies a run but not the path that started it."
serves = "Lets a reader reconstruct one operation, and attribute it to its starting path, from interleaved records."
where = ["SKILL.md#instrument-the-deciding-boundaries"]
shapes = "Adds a correlation step after signal choice that sets context at the trusted entry point and records the starting entry point for shared sinks."
adapted = "Incoming identifiers are treated as untrusted, bounded input so that diagnostic context stays trustworthy. Retries and child operations stay associated without merging separate executions, and the project's propagation format is reused."

[[sources.ideas]]
idea = "Metric dimensions come from a small bounded vocabulary, such as operation, route template or outcome class. Request IDs, user IDs, raw URLs and arbitrary error text belong in logs or traces, and tail-latency questions need a histogram or an existing distribution."
serves = "Prevents cardinality growth that overloads the metrics backend, and averages that hide slow requests."
where = ["SKILL.md#instrument-the-deciding-boundaries"]
shapes = "Gives the metrics paragraph a bounded-dimension rule and requires confirming what an instrument counts, including retries, partial results and zero traffic, before deriving a rate."
adapted = "The donor forbids averages outright. Locally an average alone does not answer a tail-latency question, but legitimate aggregate statistics stay."

[[sources.ideas]]
idea = "Add an alert only when its condition justifies an action, usually user-visible errors, latency or delayed work. Derive its threshold, duration and recovery condition from service objectives, observed behavior or an explicit requirement, name the responder, and link the first useful query, mitigation or runbook."
serves = "Prevents noisy alerts that train responders to ignore them."
where = ["SKILL.md#add-actionable-alerts-when-needed"]
shapes = "Makes alerting a conditional section that states each alert's action, threshold derivation, responder and first step."
adapted = "Existing ownership, severity, threshold and delivery conventions stay. A resource alert stays when it predicts a concrete operational consequence, and when ownership or the information for an actionable condition is missing, the alert is proposed with the observations or decisions it still needs instead of being enabled."

[[sources.ideas]]
idea = "Instrumentation is code and can be wrong. Trigger the affected success and representative failure paths, confirm the trigger occurred, and read the resulting events, metric series, traces or status at the consumer; a configured exporter or a passing test command does not prove that a signal arrived."
serves = "Prevents reporting coverage that never reaches the place where someone reads it."
where = ["SKILL.md#verify-the-signals-at-their-destination"]
shapes = "Makes verification read the signals at the consumer and check correlation, safe fields, counts, units and state lifecycle instead of trusting configuration."
adapted = "Failure injection and alert tests use an isolated environment, test collectors and notification sinks. Real delivery, threshold changes and production disruption need the active task's authority, and unavailable destinations are reported separately."

[[sources.declined]]
feature = "Mandatory OpenTelemetry for tracing and metrics."
reason = "OpenTelemetry is an option, not a required migration; suitable project tooling is reused."

[[sources.declined]]
feature = "RED metrics on every endpoint and dependency, USE metrics on every resource, and a pre-launch gate that requires dashboards and a test-fired alert for every feature."
reason = "Coverage is prioritized by user impact, operational uncertainty and cost; dashboards and alerts are added where they serve the requested coverage."

[[sources.declined]]
feature = "Fixed quotas and schemes: two to four on-call questions per feature, exactly two alert severities (page and ticket), and universal thresholds such as an error rate above 1% for 5 minutes."
reason = "The project's severity and threshold conventions stay, and thresholds come from service objectives, observed behavior or an explicit requirement."

[[sources.declined]]
feature = "Blanket rules such as never tracking averages and keeping every cause or resource signal off the pager."
reason = "Legitimate aggregate statistics stay, and a resource alert stays when it predicts a concrete consequence that needs an action."

[[sources.declined]]
feature = "Forcing errors in staging and test-firing each new alert to its real channel as a completion step."
reason = "Failure and alert tests use isolated environments and sinks; real delivery or disruption needs the active task's authority."


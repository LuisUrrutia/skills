[[sources.ideas]]
idea = "Code that type-checks can still lose a promise. An `async` function fits a `void` callback whose caller ignores the returned promise, so check that completion and rejection reach the intended owner."
serves = "Catches floating promises and unhandled rejections that the compiler accepts."
where = ["SKILL.md#keep-types-honest"]
shapes = "Adds the asynchronous-completion bullet, which checks who owns completion and rejection rather than whether the types line up."
adapted = "The donor fixes such code with `await` or `.catch()`. Here the check is about ownership: `void promise` only discards the value and is not rejection handling, and the error-handling skill designs recovery policy when it is needed."

[[sources.ideas]]
idea = "Keep compiler strictness intact: weakening a compiler setting to reach a passing check hides real mismatches, and a configuration change that relaxes strictness needs attention."
serves = "Keeps the checker's guarantees from eroding to produce a green result."
where = ["SKILL.md#keep-types-honest", "references/compiler-and-modules.md"]
shapes = "Adds weaker compiler settings to the list of forbidden ways to silence a mismatch, and limits strictness changes in the reference to the task's scope."

[[sources.ideas]]
idea = "Report which checks actually ran. A type-check script that was absent or skipped, or transpile-only output, is not a clean type check."
serves = "Prevents a skipped or partial check from being reported as a pass."
where = ["SKILL.md#verify-the-contract", "references/compiler-and-modules.md"]
shapes = "Makes the verification section state that transpilation is not type checking, and makes the reference end by reporting the checked programs, execution paths and unavailable checks."

[[sources.declined]]
feature = "The reviewer agent's severity levels and approve, warning or block output template."
reason = "The review-code-changes skill coordinates reviews and their findings; this skill supplies TypeScript judgment."

[[sources.declined]]
feature = "Fixed error rules such as always wrapping `JSON.parse` in try/catch or adding `.catch()` to every unawaited promise."
reason = "The error-handling skill owns recovery policy. This skill does not prescribe catch-and-log or wrapping every error; it only checks that completion and rejection reach their owner."


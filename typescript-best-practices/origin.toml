[[sources.ideas]]
idea = "A static type does not act at runtime: a generated client type or an assertion does not validate data received from outside, and a `readonly` view or `as const` does not freeze an object."
serves = "Prevents treating compile-time descriptions as runtime protection."
where = ["SKILL.md#keep-types-honest"]
shapes = "Places each limit next to the rule it qualifies: generated types in the boundary bullet, and readonly views in the bullet about keeping guarantees valid until use."

[[sources.ideas]]
idea = "Let inference carry types inside the code, and keep public contracts deliberate: a stable public interface does not depend on private implementation details and keeps its legitimate callers and documented states."
serves = "Avoids redundant annotations inside the code and accidental breaking changes at its public surface."
where = ["SKILL.md#keep-types-honest"]
shapes = "Makes the authoritative-contract bullet protect public interfaces and end with a preference for inference over redundant annotations or elaborate type machinery."
adapted = "The donor types every API explicitly. The local rule instead keeps public interfaces independent of private details, preserves existing callers and documented states, and requires a generic to express a real relationship."

[[sources.ideas]]
idea = "Use a discriminated union when the presence of fields depends on a variant, and keep a field optional when it can be absent independently of the other fields."
serves = "Prevents invalid state combinations without forcing unrelated optional data into variants."
where = ["SKILL.md#keep-types-honest"]
shapes = "Pairs discriminated unions for dependent fields with optional fields for independent absence in the first bullet."

[[sources.declined]]
feature = "Copying the tutorials and worked examples of the guide's nine skills."
reason = "The skill keeps concise judgment rules selected from them."

[[sources.declined]]
feature = "Preferences on enums versus unions, interfaces versus types, naming, export style, folder layout, React architecture, test coverage and formatting."
reason = "The project's conventions or an existing specialist skill own these choices."


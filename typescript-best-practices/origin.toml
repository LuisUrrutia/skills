format_version = 2
skill = "typescript-best-practices"
created = "2026-10-04"
approach = "derive"
goal = "Help an agent implement or review TypeScript code with the simplest types that make the required operations safe and that claim no more than they prove. Success is a change whose type contracts pass the repository's real compiler setup and consumer checks, whose runtime boundaries are validated or tested separately, and whose task scope and public contracts stay intact."

[[invariants]]
rule = "A type annotation, assertion, generated type, `satisfies` check or `readonly` view is static evidence only and never creates a runtime invariant; a runtime guarantee needs runtime validation or a test."
reason = "Donor examples overclaimed what durations, mutable tuples, readonly views, satisfies and trusted internal code guarantee at runtime, and the skill corrects that class of claim for every source."
where = ["SKILL.md#keep-types-honest"]

[[invariants]]
rule = "The skill holds only TypeScript-specific judgment rules; general engineering principles stay with the skills that own them."
reason = "All 24 pstack principle skills were reviewed, and only their TypeScript-relevant decisions were kept."
where = ["SKILL.md#typescript-best-practices", "references/upstream-updates.md"]

[[invariants]]
rule = "The error-handling skill owns recovery policy, the review-code-changes skill owns review coordination and finding format, and the project's conventions or specialist skills own style, naming, layout and framework architecture."
where = ["SKILL.md#keep-types-honest", "SKILL.md#verify-the-contract"]

[[invariants]]
rule = "Work stays within the task's implementation or inspection scope and keeps the repository's public contracts. Strictness, dependency versions, module formats and build architecture change only when the task needs it."
where = ["SKILL.md#typescript-best-practices", "references/compiler-and-modules.md"]


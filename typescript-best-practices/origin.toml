[[sources.ideas]]
idea = "Verify a package's exports from a consumer of the built or packed artifact, through its advertised entrypoints and each module format it supports, including declaration resolution. A passing producer build or source aliases can hide broken consumer imports."
serves = "Catches packages that build but fail to import, or import without types, for their consumers."
where = ["references/compiler-and-modules.md"]
shapes = "Adds a consumer-side package check to the reference, which also adds no other module format without a need."

[[sources.declined]]
feature = "Prescribing dual ESM and CommonJS publishing, a root export in every package, or a CLI bin."
reason = "The check covers the entrypoints and module formats that a package actually advertises."

[[sources.declined]]
feature = "Additional audit dependencies, such as publint and @arethetypeswrong/cli."
reason = "A consumer of the built or packed artifact is the check; the skill adds no dependency for it."

[[sources.declined]]
feature = "The broader developer-experience audit rules around this export rule."
reason = "This is a TypeScript language skill; developer-experience auditing stays outside it."


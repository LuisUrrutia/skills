[[sources.ideas]]
idea = "Strengthen a type only where a required operation would otherwise be partial, such as where code needs `!`, a cast or a 'should never happen' throw. Keep the plain type, such as `T[]`, while every operation on it stays total."
serves = "Keeps types as simple as the code allows while removing the assertions that hide runtime failures."
where = ["SKILL.md#typescript-best-practices", "SKILL.md#keep-types-honest"]
shapes = "Sets the skill's opening rule, and makes the first bullet add a stronger representation only where an operation or contract needs it."
adapted = "Meaningful absence stays a valid answer: an empty collection can have a valid result or explicit absence, and a non-empty representation is introduced only when the contract requires one."

[[sources.ideas]]
idea = "Model the domain so that invalid combinations do not compile: a discriminated union for fields that depend on a state, compiler-checked exhaustiveness for closed variants, and a brand for primitives whose identities or units must not mix."
serves = "Moves errors from impossible states, mixed identifiers and unhandled variants to compile time."
where = ["SKILL.md#keep-types-honest"]
shapes = "Gives the first bullet its list of representations, each paired with the condition that justifies it."
adapted = "Independently optional fields stay optional, and a brand is added only where mixing identities or units causes a concrete error. The skill states that a brand alone proves no runtime constraint."

[[sources.ideas]]
idea = "When a schema or generated source already owns a contract, derive the type from it instead of writing a parallel type that can drift."
serves = "Keeps types consistent with the contract that the data actually follows."
where = ["SKILL.md#keep-types-honest"]
shapes = "Opens the authoritative-contract bullet, so inference from an owning schema comes before any hand-written type."

[[sources.ideas]]
idea = "External data is untyped until parsed. Treat it as `unknown`, validate it with the project's existing validator at the boundary that owns its contract, and do not silence a real type mismatch with `any`, `!`, double casts, suppression comments or weaker compiler settings."
serves = "Prevents unvalidated data and hidden mismatches from reaching code that trusts its types."
where = ["SKILL.md#keep-types-honest"]
shapes = "Makes boundary parsing the default for untyped data and lists the silencing shortcuts it replaces; a necessary assertion is confined to a justified boundary with a test of the invariant it relies on."
adapted = "The donor trusts internal code unconditionally after the boundary. Here a guarantee holds only until mutation through an alias or callback, or an `await`, can invalidate it; the code then keeps ownership, captures a stable value or rechecks. `satisfies` checks static compatibility only and does not repair a mismatch."

[[sources.ideas]]
idea = "A type guard or assertion function must justify its whole claim. For `value is T`, true must mean `T` and false must exclude `T`; property presence or one checked field rarely proves a whole object."
serves = "Prevents unsafe narrowing that hides behind a name that sounds safe."
where = ["SKILL.md#keep-types-honest"]
shapes = "Adds a separate bullet that checks both branches of a type predicate and the guarantee an assertion function claims after it returns."
adapted = "The donor asks that a guard verify its claim; the local rule extends this to the false branch and to assertion functions."

[[sources.ideas]]
idea = "A claimed type guarantee needs evidence that can fail. Run the repository's checker on the changed files and the affected consumers, and test valid and invalid uses of a changed contract with assertions that fail on regression; transpilation, or a type alias that evaluates to `false`, proves nothing."
serves = "Prevents reporting a contract as checked when nothing could have caught a regression."
where = ["SKILL.md#verify-the-contract"]
shapes = "Makes the verification section require a checker run over changed files and consumers, type-level tests that fail on regression, and separate runtime boundary tests."

[[sources.ideas]]
idea = "A rule that a formatter, linter or compiler can enforce belongs in that tooling, not in instructions; the skill keeps only decisions that need judgment."
serves = "Keeps the skill short and stops it from repeating or contradicting checks that tools already enforce."
where = ["SKILL.md#verify-the-contract"]
shapes = "Closes the verification section by handing formatting and enforceable style to existing tooling, which keeps style rules out of the skill."

[[sources.declined]]
feature = "Branding semantic primitives, such as user and order IDs, as a general rule."
reason = "A brand is added only where mixing identities or units causes a concrete error."

[[sources.declined]]
feature = "Representing a time range as a start plus a plain-number duration and presenting it as making a negative range impossible."
reason = "A plain number can still be negative or use the wrong unit, so the representation does not create the invariant it claims."

[[sources.declined]]
feature = "Treating a mutable non-empty tuple such as `[T, ...T[]]` as a lasting non-empty guarantee."
reason = "Mutation through aliases, callbacks or across an `await` can empty it."

[[sources.declined]]
feature = "Describing `satisfies` as validating a value."
reason = "`satisfies` checks static compatibility only; it does not validate runtime data."

[[sources.declined]]
feature = "Trusting internal code unconditionally once a boundary has validated the data."
reason = "Narrowing and other guarantees can stop holding after a mutation or an `await`, so the skill rechecks at the relevant transition."

[[sources.declined]]
feature = "A fixed argument style (one object parameter instead of positional parameters) and a structured-logger rule that bans `console.log` in shipped code."
reason = "Argument style and logging policy are project conventions, not TypeScript type judgments."

[[sources.declined]]
feature = "Broad agent autonomy, required verification scripts, repository-wide rewrites and host activation metadata from the general principle skills."
reason = "The skill keeps only TypeScript-relevant decisions within the task's scope, and the host's skill format sets activation."


[[sources.ideas]]
idea = "Type-check with the repository's installed compiler, its package scripts and the effective leaf configuration, including inherited options and included files. A solution root with `files: []` can pass without checking any implementation file, so confirm that the changed file belongs to a checked program before trusting a green result."
serves = "Prevents a green result from a program that never checked the change."
where = ["references/compiler-and-modules.md"]
shapes = "Opens the reference with a check that the changed file belongs to a checked program before a green result counts."
adapted = "The donor is a standalone configuration workflow. Here its detail sits in a reference that SKILL.md loads only for compiler, import/export or package changes, so ordinary type work stays short."

[[sources.ideas]]
idea = "Choose module settings that match the actual runtime or bundler and the published contract, and never switch resolution modes only to remove an error. TypeScript `paths` informs the type checker only; emitted specifiers and runtime resolution need their own configuration."
serves = "Prevents code that type-checks but fails to resolve imports when it runs."
where = ["references/compiler-and-modules.md"]
shapes = "Makes the reference's module paragraph separate compile-time effects from runtime resolution, including erased type-only imports and `lib` entries that add no polyfill."

[[sources.declined]]
feature = "Compiler version migration procedures, such as the TypeScript 7 migration path."
reason = "Version changes stay within the task's scope, and dated migration steps do not belong in a judgment skill."

[[sources.declined]]
feature = "A table of framework-specific checker commands."
reason = "The reference requires including the project's framework checker without fixing the commands."

[[sources.declined]]
feature = "A default compiler-flag bundle, such as `strict` with `noUncheckedIndexedAccess` and `skipLibCheck` enabled."
reason = "The project keeps its compiler policy, and a small change does not become a configuration migration."

[[sources.declined]]
feature = "Allowing `mock as unknown as Service` casts in test files."
reason = "Tests get no cast exemption; a necessary assertion stays isolated at a justified boundary with a test of its invariant."

[[sources.declined]]
feature = "Blanket ESM and CommonJS interoperability claims, such as keeping `esModuleInterop` on because it matches bundler and Node behavior."
reason = "Such claims date quickly and depend on the host; the skill checks the actual host and a consumer of the built artifact."


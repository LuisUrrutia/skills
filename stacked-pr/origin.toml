[[sources.ideas]]
idea = "A stack is planned before any branch exists. The work forms one coherent story; each layer owns one concern that a reviewer can accept in one sentence and depends only on the same or lower layers; unrelated work goes to a separate stack. Multi-part work starts as a stack instead of being split after it is written."
serves = "Keeps each PR reviewable on its own and avoids restructuring a chain whose dependencies point the wrong way."
where = ["references/stack-design.md#find-the-dependency-chain", "references/stack-design.md#stage-deliberately"]
shapes = "stack-design.md is a planning step whose output is a bottom-to-top layer plan with a check table per layer; every route loads it before creating branches."
adapted = "The donor plans layers for gh stack init. Locally the plan serves the CLI, API and manual routes, starts from task-breakdown units when they are supplied, adds verification and review-budget checks per layer, keeps tests in the first layer that can exercise the behavior, and treats a short stack as a pressure rather than a quota."

[[sources.ideas]]
idea = "Branch names follow the repository's convention first; otherwise they combine a shared topic with the layer's concern, such as billing/monthly-total."
serves = "Makes the layers of one stack recognizable as a group."
where = ["references/stack-design.md#name-branches-by-topic-and-concern"]
shapes = "A naming section in the design reference."
adapted = "Locally, explicit names also keep the layer plan stable across the CLI, API and manual routes."

[[sources.ideas]]
idea = "Each layer receives only its own changes: its paths or hunks are staged explicitly, several commits are allowed when they all serve the layer's concern, and other uncommitted work stays out of the layer across branch switches."
serves = "Prevents one concern from leaking into another layer and protects unrelated work."
where = ["references/stack-design.md#stage-deliberately", "references/cli-create.md#build-or-adopt"]
shapes = "The staging section shows explicit git add with staged-diff checks per layer, and the CLI build step stages explicit paths or hunks."
adapted = "The donor stages before gh stack add. Locally plain Git staging with git diff --cached checks works on every route, unrelated dirty-tree changes stay unstaged, and the dirty tree is checked again after every branch change."

[[sources.ideas]]
idea = "A change to an existing stack is made on the layer that owns its concern, and every layer above it is then replayed onto the change."
serves = "Keeps each concern in its owning layer and keeps every upper layer based on its parent."
where = [
  "references/cli-maintain.md#edit-one-layer-and-cascade-upward",
  "references/manual-maintain.md#edit-one-layer",
  "references/api-maintain.md#edit-or-restack-branches",
]
shapes = "Each route's maintenance branch starts by editing the owning layer and cascading upward."
adapted = "The CLI route uses the current cascading-rebase command from live help; the manual and API routes replay with plain Git and push rewritten refs atomically with leases."

[[sources.ideas]]
idea = "When the local stack and the stack on GitHub diverge, one side becomes the source. Keeping GitHub's chain drops stale local tracking and checks the remote stack out again; keeping the local chain removes the GitHub grouping and submits the local order again."
serves = "Resolves divergence without silently losing either side's work."
where = ["references/troubleshooting.md#local-and-remote-stacks-diverged"]
shapes = "The divergence section offers these two resolutions."
adapted = "Locally the differences are shown and the user chooses the source before any mutation. Because gh stack unstack also removes local tracking, keeping the local chain re-adopts the recorded branches through init before submitting, and every original commit must stay reachable."

[[sources.ideas]]
idea = "A stack whose order or membership must change is rebuilt rather than edited in place: the old tips are preserved, Git ancestry is rewritten bottom-up, the stack is recreated in the new order, and the existing PRs are reused."
serves = "Changes the order without losing PRs or commits."
where = [
  "references/troubleshooting.md#restructure-a-native-stack",
  "references/api-maintain.md#restructure-or-dissolve",
  "references/manual-maintain.md#retarget-or-restructure",
]
shapes = "Each route has a restructuring operation that preserves tips, rewrites ancestry and recreates membership."
adapted = "Locally current CLI and REST documentation is checked first for a supported in-place edit, and the combined top diff must change only as requested."

[[sources.ideas]]
idea = "When another tool owns the branches, such as Jujutsu, Sapling or git-town, that tool keeps navigation and rebasing, and the stack on GitHub is published through a membership-only link without local tracking. Linked Git worktrees are not such a tool: they share one gh-stack catalog, a layer checked out elsewhere is located through the path-printing form of navigation or checkout, and rebase and sync update clean owning worktrees and stop at dirty ones."
serves = "Prevents two tools from writing the same branches while keeping worktree-based stacks on the native CLI path."
where = ["SKILL.md#route-the-request", "references/troubleshooting.md#worktrees-and-other-branch-managers", "references/troubleshooting.md#adopt-existing-branches-or-prs"]
shapes = "The interoperability section separates external branch managers, which use the link path, from linked worktrees, which stay on the CLI route; routing states that WorkTrunk worktrees are not another branch manager."
adapted = "Locally link receives existing PRs by URL, because a branch-name argument makes it push and create a PR. Path output is used only after a successful exit, and a dirty owning worktree is reported instead of changed. A layer in its own WorkTrunk worktree is created on its parent and adopted; WorkTrunk keeps only the worktree lifecycle, because its merge and rebase steps would bypass gh-stack."

[[sources.ideas]]
idea = "Merging a stack PR also merges every unmerged PR below it, and a merge queue can queue the stack instead of merging it. The affected set is resolved before the merge, and a queued result is reported as queued."
serves = "Prevents merging more than intended and reporting queued work as merged."
where = ["references/cli-merge.md", "references/api-merge.md"]
shapes = "The merge steps resolve the exact unmerged set before the approval is used and distinguish merged, queued and failed results."
adapted = "Locally the user approves the exact set and merge method immediately before the command, and the CLI merge receives the target and method explicitly."

[[sources.ideas]]
idea = "Every gh stack command runs in its non-interactive form, because prompts and full-screen views block an agent's session."
serves = "Keeps CLI operations from hanging."
where = ["references/cli-workflow.md#establish-the-live-contract"]
shapes = "The live-contract step derives the non-interactive form of every planned command before the operation starts."
adapted = "The donor lists fixed commands and flags. Locally the form is read from gh stack <command> --help each time, because live help and GitHub documentation outrank examples while the tool is in preview."

[[sources.ideas]]
idea = "Setup installs the github/gh-stack extension and requires Git 2.36 or later and an authenticated GitHub CLI."
serves = "A missing or outdated extension does not push the agent toward ordinary PRs."
where = ["references/cli-workflow.md#establish-the-live-contract"]
shapes = "The live-contract step installs an absent extension pinned to the newest release past the cooldown, replaces an older one before a mutation, and records the Git and extension versions."
adapted = "The donor lists the install as one-time setup. Locally the route installs before its first command, pinned because install and upgrade otherwise take a release younger than the cooldown; it upgrades only before a mutation with no pending recovery, by remove and pinned install because --force ignores the pin, keeping a copy of the old extension to restore; worktree stacks need v0.2.0; a failed install is routed by SKILL.md."

[[sources.ideas]]
idea = "Submit fails with a distinct result when stacked PRs are disabled on the repository; under a TTY it instead offers to create ordinary unstacked PRs."
serves = "Keeps unstacked PRs from passing as a native stack."
where = ["references/cli-create.md#submit"]
shapes = "The submit step confirms the result against the stack endpoint before treating it as GitHub's unavailability report, and declines the offer of regular PRs."
adapted = "v0.3.0 returns that result after any failed stack lookup, and GitHub documents its 404 only as Resource not found, so locally only a stack-list 404 with a readable repository counts; other failures keep the CLI route and are reported without claiming unavailability."

[[sources.ideas]]
idea = "Stack pushes are atomic by default from v0.3.0, with an opt-out that allows partial updates; PR and stack API steps after the push stay non-atomic."
serves = "Recovery after a rejected push starts from the actual remote state."
where = ["references/cli-maintain.md#push-an-already-verified-stack"]
shapes = "The push step confirms atomicity in live help and refetches the remote refs after a rejection."
adapted = "The version is named only as context; live help decides."

[[sources.ideas]]
idea = "When GitHub retargets a stack after its base branch is deleted, sync and rebase move it onto the new base and drop the old base's commits; a non-interactive run needs an explicit flag when the old base did not merge into the new one."
serves = "Prevents commits from being dropped without a decision."
where = ["references/cli-maintain.md#maintain-a-native-cli-stack"]
shapes = "The maintenance preamble requires the user's approval before rebase or sync receives the flag."
adapted = "The donor treats the flag as the non-interactive answer to its prompt; locally it is a user decision because it discards commits."

[[sources.ideas]]
idea = "Unstacking that GitHub accepts only partly, because some PRs are merged or queued, still removes local tracking; tracking remains only when GitHub rejects the whole operation."
serves = "The migration to manual knows whether local tracking still exists before any Git write."
where = ["references/troubleshooting.md#move-a-tracked-chain-to-manual"]
shapes = "The migration section checks for remaining local tracking after a partial dissolution."
adapted = "Locally the remaining GitHub stack is reported and the user decides before continuing."

[[sources.ideas]]
idea = "PR titles and bodies that submit generates are changed afterwards with gh pr edit, because submit has no flag for custom copy."
serves = "Lets the stack keep native submission while PRs follow the repository's conventions."
where = ["references/cli-create.md#submit"]
shapes = "After submit, the pr skill drafts copy for each PR that submit created, applied with gh pr edit."
adapted = "Locally only created PRs get new copy; a reused PR loses only a stack map unless the request changes it."

[[sources.ideas]]
idea = "With several remotes, gh-stack needs a push remote, through remote.pushDefault or the remote flag, before non-interactive commands can run."
serves = "Prevents fork setups from failing submit and falling back to another path."
where = ["references/cli-workflow.md#establish-the-live-contract"]
shapes = "Setup passes the recorded push remote to every command that accepts it."
adapted = "The donor sets remote.pushDefault in setup; locally the flag is used and writing that setting needs the user's approval."

[[sources.ideas]]
idea = "A conflict is resolved and staged in the worktree that the conflict message names, and a sync conflict restores every branch, so a rebase reproduces it before resolution."
serves = "Keeps conflict resolution in the right checkout and state."
where = ["references/troubleshooting.md#interrupted-or-conflicting-rebase"]
shapes = "The rebase recovery section names the owning worktree and the sync case."
adapted = "Continuation forms come from live help."

[[sources.declined]]
feature = "A fixed reference of gh stack commands, flags and exit codes as the operating contract, with recovery chosen from an exit-code table."
reason = "The CLI and APIs are in preview; the skill reads live help and current GitHub documentation for every planned command and classifies failures from observed stderr and state."

[[sources.declined]]
feature = "Keeping the PR titles and bodies that gh stack submit generates as the final copy."
reason = "PR titles and bodies follow the repository's conventions through the pr skill, and a PR in a native stack carries no stack map."


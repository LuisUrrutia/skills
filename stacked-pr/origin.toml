[[dependencies]]
kind = "local"
name = "pr"
required = false
role = "Supplies PR titles, bodies and templates when the skill creates or adopts PRs, in Draft-only mode on the CLI route where gh stack submit creates them, measures each layer in Check cap mode when a review-size cap applies, and reviews each new layer in Review gate mode, bottom-up, before it is pushed; this skill applies the fixes and restacks. Read-only operations do not need it."

[[dependencies]]
kind = "local"
name = "task-breakdown"
required = false
role = "Supplies delivery units that the stack design uses as layers when they exist."

[[dependencies]]
kind = "local"
name = "pr-followup"
required = false
role = "Follows each new layer in Drive unless the user asked for no follow-up; this skill keeps topology, rebases and landing."

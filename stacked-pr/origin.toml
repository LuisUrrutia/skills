format_version = 2
skill = "stacked-pr"
created = "2026-08-22"
approach = "derive"
goal = "Design and operate GitHub stacked pull requests and dependent PR chains so that each PR shows one reviewable concern and the chain stays consistent across Git ancestry, PR bases and GitHub's stack state. Success is the requested operation completed on the route that a recorded observation selected, with every original commit recoverable and merges limited to what the user approved or the personal-repository merge policy covers, or a report of the blocker."

[[invariants]]
rule = "Work stays within the requested operation. Explanations, reviews and status checks are read-only; creation and maintenance change only the local branches and linked PRs that the operation needs; a later lifecycle stage runs only when the request includes it, except that new layers continue into pr-followup Drive unless the user asks for no follow-up. Unrelated dirty-tree work is preserved, and the current branch and relevant tips are recorded before ancestry is rewritten so that every original commit stays reachable until verification."
reason = "The follow-up exception is the user decision of 2026-10-30 that every created PR is followed up unless the user says otherwise."
where = ["SKILL.md#scope-and-safety"]

[[invariants]]
rule = "A merge needs the user's explicit approval of the exact PR set and merge method immediately before the merge command, except the user's own PRs in a repository that the pr-followup skill's personal-repository merge policy covers, which land bottom-up under that standing authorization once each layer passes its gates. Otherwise a manual chain merges only its approved bottom PR, and each further layer needs another approval."
reason = "The personal-repository exception is the user decision of 2026-10-30: in the user's personal repository, the user's own stacked PRs merge automatically."
where = ["SKILL.md#scope-and-safety", "references/cli-merge.md", "references/api-merge.md", "references/manual-merge.md"]

[[invariants]]
rule = "All three routes enter their merge and maintenance branches under the root's standing landing authorization. That policy merges only the current bottom PR, repairs the remainder through the selected route, and rebuilds the next bottom's head/base evidence before landing it. Outside that policy the explicit approval remains binding."
reason = "The user's personal-repository policy applies to every stack route. Landing a lower layer can change the next layer's base and head, invalidating its earlier merge evidence."
where = ["SKILL.md#scope-and-safety", "references/cli-workflow.md#mutation-branches", "references/api-workflow.md#mutation-branches", "references/manual-chain.md#mutation-branches", "references/cli-merge.md", "references/api-merge.md", "references/manual-merge.md"]

[[invariants]]
rule = "The stack owner completes each new layer's Drive pass before waiting, receives pending watch actions, refreshes layers affected by mutations and arms T3 watches together through the pr-followup adapter. Existing watches are reused and failed activations are reported."
reason = "T3 Code requires the turn to end after watch activation; arming the first layer during its Drive pass can prevent the remaining layers from receiving follow-up."
where = ["SKILL.md#follow-up-layers"]

[[invariants]]
rule = "The route is decided in a fixed order and recorded with its deciding observation: stack-aware CI and integrations, then REST, then gh extension list. Manual applies only on the user's explicit choice of ordinary dependent PRs; otherwise the CLI route installs an absent extension and applies. Only the user or a project rule prohibits installation. Untracked branches and PRs, and branches in linked Git worktrees, do not decide the route; a CLI mutation adopts them first."
reason = "On 2026-10-07 an agent took the manual route on a two-PR stack although github/gh-stack was installed, because the CLI route read as requiring branches that the extension already tracked (commit bf0dae6; reports/skill-atlas/stacked-pr-routing-validation.json). On 2026-11-01 the user reported that stacks were still sometimes not created natively and stated that a missing extension must be installed."
where = ["SKILL.md#route-the-request"]

[[invariants]]
rule = "Every request for stacked or dependent PRs asks for a native stack unless the user explicitly asks for ordinary dependent PRs. A prohibited or failed install is a blocker that offers ordinary dependent PRs or, with the user's authorization, the API route; GitHub's unavailability report is a blocker that offers ordinary dependent PRs; the manual route follows only the user's choice."
reason = "A CodeRabbit review of PR 19 found that a prohibited or failed install selected the manual route despite a native-stack request (commit 9e65db4, 2026-10-07). On 2026-11-01 the user decided that a plain stacked-PR request counts as a native-stack request, so neither condition falls back to ordinary PRs without the user's choice."
where = ["SKILL.md#route-the-request"]

[[invariants]]
rule = "One tool owns mutations for the whole operation. Once gh-stack tracks a chain, a plain git rebase or push on its branches switches the writer, so a chain moving to the manual route has its ownership migrated through troubleshooting.md first."
reason = "Switching writers during a mutation can desynchronize local tracking and GitHub state."
where = ["SKILL.md#route-the-request", "references/troubleshooting.md#move-a-tracked-chain-to-manual"]

[[invariants]]
rule = "A PR in a native stack carries no stack map, and a map that a PR brings into a native stack is removed. Every other open PR in a dependent chain carries the bottom-to-top map with the current PR marked."
reason = "GitHub shows a native stack's order and navigation on every member PR and shows no chain for ordinary dependent PRs (commit 632da2f, 2026-10-16)."
where = [
  "SKILL.md#stacked-pull-requests",
  "references/cli-create.md#submit",
  "references/api-create.md#create-or-adopt-prs",
  "references/manual-chain.md#mutation-branches",
]

[[invariants]]
rule = "On the CLI route, commands with hidden side effects run in their safe form: submit runs without --open when existing drafts must stay drafts, merge receives the authorized target and method explicitly, and gh stack link receives existing PRs by URL after missing PRs were published through the pr skill."
reason = "Side effects of gh stack v0.2.0 named on 2026-10-16 (commit 53a66b3): --open also marks existing PRs ready, a non-interactive merge without a target merges the whole stack with the last-used method, and link pushes branch-name arguments and creates PRs."
where = ["references/cli-create.md#submit", "references/cli-merge.md", "references/troubleshooting.md#adopt-existing-branches-or-prs"]

[[invariants]]
rule = "On the CLI route only gh stack submit creates layer PRs, never a subset through another command; the pr skill supplies titles and bodies for the PRs submit created in Draft-only mode, applied with gh pr edit. A submit failure counts as GitHub's unavailability report only when the stack list returns 404 while the repository read succeeds. Submission completes only when a read of that endpoint places every requested PR in one native stack in bottom-to-top order, or a single submitted layer is reported with membership pending."
reason = "On 2026-11-01 the user reported that agents still sometimes left stacks without native GitHub stack membership. The submit step loaded the pr skill without a mode, whose Create mode opens ordinary PRs, and checked bases but not membership. gh-stack v0.3.0 reports stacks unavailable after any failed lookup and can exit 0 when linking fails (cmd/submit.go)."
where = ["references/cli-create.md#submit"]

[[invariants]]
rule = "This skill owns stack topology, submission and cascading rebases, and the selected route keeps mutation and remediation ownership. The pr skill supplies PR titles, bodies and templates. When a request, project rule or task record sets a review-size cap, the pr skill measures each layer in Check cap mode against that layer's immediate PR base, never cumulatively against trunk, and capped publication waits for a current within-cap result."
where = ["SKILL.md#scope-and-safety", "references/cli-create.md#submit", "references/manual-create.md#open-or-adopt-prs"]

[[invariants]]
rule = "Live gh stack help and current GitHub documentation decide commands, flags, API fields, webhook fields and recovery steps; examples in the skill do not. Failures are classified from observed stderr and state."
reason = "GitHub's stacked PR CLI, APIs and webhooks may change while in preview."
where = [
  "references/cli-workflow.md#establish-the-live-contract",
  "references/api-workflow.md#establish-the-live-contract",
  "references/automation.md#establish-the-live-event-contract",
  "references/troubleshooting.md#diagnose-before-recovery",
]

[[sources]]
id = "github-gh-stack"
author = "GitHub"
repository = "https://github.com/github/gh-stack"
remote = "git@github.com:github/gh-stack.git"
ref = "refs/heads/main"
license = "MIT; ideas only, no source text copied"
role = "ideas"
baseline_commit = "14fc42ed9b6c376a53b2f999f138d3bd26dac546"
reviewed_through = "2a49e6751238633db504655d8a8eba3e433e827d"
baseline_paths = [

format_version = 2
skill = "performance-optimization"
created = "2026-10-05"
approach = "derive"
goal = "Improve the latency, throughput, resource use or cost of an operation the user cares about through measured changes whose benefit justifies their complexity. A run ends with a verified improvement, evidence that the tried changes are not worthwhile, or the specific missing evidence that blocks the decision."

[[invariants]]
rule = "Local experiments never authorize production load, deployments, new spending, publication or recurring monitoring."
reason = "A performance search runs under the active task's authorization, which covers local work only."
where = ["SKILL.md#performance-optimization"]

[[invariants]]
rule = "Reverting a rejected experiment removes only this task's edits and keeps unrelated work and independently justified changes."
where = ["SKILL.md#keep-only-justified-changes"]

[[invariants]]
rule = "A neutral simplification may stay for its own authorized benefit, but it is never reported as a performance win."
where = ["SKILL.md#keep-only-justified-changes"]

[[invariants]]
rule = "The verify skill judges whether a measurement supports a claim; this skill keeps no copy of verify's benchmark checklist."
reason = "One owner for measurement validity keeps the two skills from drifting apart."
where = ["SKILL.md#establish-evidence-and-find-the-limiting-work"]

[[invariants]]
rule = "Neighboring work keeps its owners: the debug skill owns an observed regression or unexplained failure, the prototype skill owns a disposable experiment that settles an uncertain mechanism, and the observability skill owns diagnostic signals that must outlive the experiment."
where = [
  "SKILL.md#keep-neighboring-responsibilities-clear",
  "SKILL.md#run-bounded-experiments",
]


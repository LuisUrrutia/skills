[[sources.ideas]]
idea = "Locate the limiting work with the cheapest measurement that could change what gets tried or skipped."
serves = "Spends diagnostic effort only where it changes a decision."
where = ["SKILL.md#establish-evidence-and-find-the-limiting-work"]
shapes = "The paragraph on locating expensive or repeated work picks the cheapest evidence that can change what to try or skip, and treats static patterns as hypotheses only."

[[sources.ideas]]
idea = "Rank opportunities by the measured cost of the limiting work, likely user benefit, confidence, implementation cost and risk."
serves = "Puts effort where the operation actually spends time, not where a microbenchmark looks impressive."
where = ["SKILL.md#establish-evidence-and-find-the-limiting-work"]
shapes = "The ranking paragraph orders candidates by these factors and warns that a large microbenchmark gain in an insignificant part of the operation may not be worth it."

[[sources.ideas]]
idea = "Changes that each helped can interact, so the final combined change is measured again against the original operation instead of adding the isolated gains."
serves = "Prevents reporting a total gain that was never measured."
where = ["SKILL.md#keep-only-justified-changes"]
shapes = "The section ends with a recheck of the final integrated change against the original operation and its guardrails."


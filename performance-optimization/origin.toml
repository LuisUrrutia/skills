[[sources.ideas]]
idea = "Prefer removing unnecessary or repeated work before adding scheduling or concurrency."
serves = "Tries simpler changes before ones that add coordination, contention and new failure modes."
where = ["SKILL.md#establish-evidence-and-find-the-limiting-work"]
shapes = "The ranking paragraph places this preference after ranking by measured cost, benefit, confidence and risk, so removal candidates are tried first among comparable options."

[[sources.ideas]]
idea = "Each attempt tests one interpretable hypothesis. The baseline, the best accepted variant and every rejected attempt stay reproducible with their keep or revert evidence."
serves = "Makes each result attributable and keeps later work from repeating or hiding failed attempts."
where = ["SKILL.md#run-bounded-experiments"]
shapes = "The section changes one coherent cause at a time, keeps the baseline and best variant reproducible, and records every tried variant."

[[sources.declined]]
feature = "A minimum attempt quota or a requirement to push past a plateau."
reason = "The search stops at a justified goal or at its bounded budget."

[[sources.declined]]
feature = "A required model, subagent, worktree, branch, PR or publication workflow."
reason = "The active task's tools and authorization decide how experiments run."

[[sources.declined]]
feature = "Tracking pstack's shared measurement rules through this skill's source record."
reason = "The verify skill owns measurement validity; this source covers only the performance-search playbooks."

[[sources.declined]]
feature = "Capturing a baseline trace and a post-fix trace through a matching control skill for every performance issue."
reason = "The limiting work is located with the cheapest evidence that can change what to try or skip; a trace is one option, not a required step."


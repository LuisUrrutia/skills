[[sources.ideas]]
idea = "Before tuning, fix the operation, a correctness gate, the primary metric with its guardrails, the baseline and an explicit search budget."
serves = "Gives every experiment the same yardstick and a stopping point, so a primary-metric gain cannot hide a regression elsewhere."
where = ["SKILL.md#define-the-operation-and-decision"]
shapes = "The skill starts by defining the operation, its guardrails, the decision criterion and the search budget."
adapted = "Resource and behavior guardrails are part of the yardstick; the fastest primary metric is never promoted on its own."

[[sources.ideas]]
idea = "Reject candidates that fail correctness, compare the rest with the best accepted variant as well as the original when those answer different decisions, and confirm the final variant. The best variant observed is not a proven optimum."
serves = "Prevents keeping a broken variant or claiming that no further improvement exists."
where = ["SKILL.md#keep-only-justified-changes"]
shapes = "The section holds the comparison rule and the report's limit on optimality claims."
adapted = "A retained claim needs a measured benefit beyond normal variation; a causal explanation guides the next test but does not replace measurement."


[[sources.ideas]]
idea = "Optimization is a measured cycle: capture a baseline, locate the bottleneck, change one thing, check correctness and the metric, then keep or revert the change. A retained gain gets regression protection that stays maintainable."
serves = "Every retained change rests on a measurement instead of a plausible edit."
where = [
  "SKILL.md#establish-evidence-and-find-the-limiting-work",
  "SKILL.md#run-bounded-experiments",
  "SKILL.md#keep-only-justified-changes",
]
shapes = "The cycle sets the order of these three sections; the rule on adding a regression benchmark or budget closes the last one."

[[sources.ideas]]
idea = "A reuse or caching change is valid only when it preserves the identity, authorization, freshness and resource bounds of what it reuses."
serves = "Prevents speedups that serve stale data, leak across tenants or grow without bound."
where = ["SKILL.md#run-bounded-experiments"]
shapes = "The reuse and caching paragraph states these as validity conditions for a candidate."
adapted = "Stated as a condition on any reuse rather than a list of cache techniques; a legitimate cache security or freshness policy is never weakened to gain speed."

[[sources.declined]]
feature = "Universal frontend, bundle-size and API latency budgets."
reason = "The worthwhile improvement depends on the operation and the project."

[[sources.declined]]
feature = "A copied library of domain optimization recipes."
reason = "Domain patterns stay conditional hypotheses; existing domain skills own their mechanisms."

[[sources.declined]]
feature = "Checking field data before optimizing every operation."
reason = "Many operations are local; the verify skill judges which evidence a claim needs, and local measurements are reported as local."

[[sources.declined]]
feature = "Profiling first as a required step of every optimization, and treating an optimization without profiling data as a red flag."
reason = "The limiting work is located with the cheapest evidence that can change what to try or skip, such as existing traces, profiles, query plans, allocation data or a smaller diagnostic measurement; no particular profiler is required."


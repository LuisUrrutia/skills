[[local_snapshots.ideas]]
idea = "A run handles one atomic boundary at a time through a fixed sequence: choose the boundary, inspect its diffs, stage it, validate it, write the message, then commit or propose, and publish only when authorized. Each boundary ends in a terminal state, and the next boundary starts from a fresh baseline."
serves = "Keeps separate intents from merging into one commit and makes each boundary's outcome explicit."
where = ["SKILL.md#modes", "SKILL.md#workflow"]
shapes = "Steps 1-6 select, inspect, stage, validate, describe and finish each boundary. Split mode repeats them from a fresh baseline; step 7 conditionally publishes after all intended commits are verified."

[[local_snapshots.ideas]]
idea = "Git state and earlier claims are evidence to verify, not facts. Branch names, staged state, validation results and earlier claims count only after fresh Git checks, and every commit attempt is compared with a recorded baseline of HEAD, status, message and staged diff before a terminal state is reported; hook rewrites, retries and amendments follow fixed rules."
serves = "Prevents reporting a commit, amendment or push that Git does not show."
where = ["SKILL.md#commit", "SKILL.md#6-commit-amend-or-propose", "references/hooks-and-amend.md", "SKILL.md#output"]
shapes = "Step 6 records and verifies each attempt; its conditional reference owns hook recovery and current-task amendments. Unsafe changes and identity mismatches take precedence over retry eligibility, preserving the boundary before another write."

[[local_snapshots.ideas]]
idea = "Commit and push permission come from the user's authority. A commit request alone does not authorize a push, PR work is a separate phase owned by the `pr` skill, and secrets, mixed concerns, `main` or `master`, and destructive or unrequested actions are conditions to resolve before staging."
serves = "Keeps the run's side effects inside the authorization the user gave."
where = [
  "SKILL.md#modes",
  "SKILL.md#resolve-boundaries-before-writing",
  "SKILL.md#7-publish-when-authorized",
]
shapes = "Modes resolve authority once before staging. Step 7 routes authorized publication to its reference and requested PR work to `pr`, keeping commit-only and proposal paths independent."
adapted = "The snapshot pushed only on an explicit request in the same message and stopped to ask at every listed condition. A later local change made the skill honor existing publication authorization: it also accepts a standing user instruction or an authorized caller such as the `pr` or `pr-followup` skill, applies existing authorization first, and asks only about a material decision that the task and repository leave unresolved."


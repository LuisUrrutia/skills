format_version = 2
skill = "commit"
created = "2026-10-03"
approach = "derive"
goal = "Turn working-tree changes into verified Conventional Commits, one atomic boundary at a time, with messages grounded in the verified index and the supplied context. A run ends with each boundary committed, amended, proposed, blocked or refused with evidence, unrelated work preserved in its original staged and unstaged state, and any push limited to the authorized scope."

[[invariants]]
rule = "Each boundary runs the narrowest check that covers it, or the report states why none exists. A commit is reported only after its HEAD, parent, message, committed boundary and residual state are verified."
reason = "Branch names, staged state, validation results, commit success and earlier claims are untrusted until Git verifies them."
where = ["SKILL.md#commit", "SKILL.md#workflow", "SKILL.md#output"]

[[invariants]]
rule = "A behavior change stays in the same commit as its regression tests and the schema or generated output it requires."
reason = "Together they establish one working change that can be understood and checked at its own revision."
where = ["SKILL.md#workflow"]

[[invariants]]
rule = "The skill uses the existing checkout and branch. Committing never starts PR work: the `pr` skill owns it, and the `pr` or `stacked-pr` skill owns a lease push after an authorized rebase."
reason = "Routine commit publication does not rewrite remote history."
where = ["SKILL.md#commit", "SKILL.md#modes", "SKILL.md#7-publish-when-authorized", "references/publication.md"]


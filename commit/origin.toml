[[sources.ideas]]
idea = "Commit history is judged by the effort a reader needs to understand it. Each commit has one coherent purpose and a reviewable size, and its subject names the concrete result, so a reader who scans the log understands why the change matters without opening the diff."
serves = "Makes the history quick to review and to search."
where = ["SKILL.md#workflow"]
shapes = "Step 1 confirms one coherent purpose and reviewable size before staging; step 5 rejects a subject that could describe several unrelated diffs."

[[sources.ideas]]
idea = "A reviewer needs to know how a change was verified. Each boundary is validated before the commit, and the command and its result are reported with the commit."
serves = "Lets a reader trust the commit without repeating the check, and shows when no check ran."
where = ["SKILL.md#workflow", "SKILL.md#output"]
shapes = "Step 4 runs the narrowest covering check or records why none exists; the shared output contract carries Validation for every boundary and adds fields for completed commits or proposals and blockers."
adapted = "The donor writes verification and risk notes into the PR description. Locally, they stay in the assistant's report and out of the commit message, and PR descriptions belong to the `pr` skill."

[[sources.declined]]
feature = "Creating a fresh branch from the latest `main` and opening a PR as part of the commit workflow."
reason = "The skill uses the existing checkout, and the `pr` skill owns PR work as a separate phase."

[[sources.declined]]
feature = "Grouping commits by layer in a fixed order, with tests in a separate final commit."
reason = "Boundaries follow intent, and changes are never split merely by file type or by production versus test code."

[[sources.declined]]
feature = "Rewriting branch history and force-pushing to tidy commits for review."
reason = "A rebase or history rewrite belongs to its authorized branch workflow, not routine commit preparation."

[[sources.declined]]
feature = "Assuming `origin` as the remote and `main` as the base branch."
reason = "The push destination comes from the request or verified branch configuration; neither `origin` nor an upstream proves the intended repository."


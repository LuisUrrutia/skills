baseline_paths = ["skills/ce-commit/SKILL.md", "LICENSE"]
paths = ["skills/ce-commit/SKILL.md", "LICENSE"]

[[sources.ideas]]
idea = "A commit contains only its selected intent. Every change outside that boundary stays uncommitted and keeps its original state, including entries that were already staged before the run."
serves = "Prevents unrelated or user-staged work from riding into a commit or being lost."
where = ["SKILL.md#resolve-boundaries-before-writing", "SKILL.md#workflow"]
shapes = "Steps 2 and 3 account for every hunk, classify the rest as preserved work, and save and restore unrelated staged entries around the commit."
adapted = "The donor stages whole files and commits a named path list so that other index entries stay out. Locally, hunks are patch-staged and the verified index is committed, because a path list after hunk staging can commit unstaged content from those paths."

[[sources.ideas]]
idea = "Publishing needs its own permission. A commit request alone does not authorize a push, and a push happens only within the scope resolved at entry, after the commit is verified."
serves = "Prevents unrequested publication of local work."
where = ["SKILL.md#modes", "SKILL.md#7-publish-when-authorized", "references/publication.md"]
shapes = "Modes resolve commit and push authority; Commit-and-push mode and step 7 publish only within it."
adapted = "The donor never pushes. Locally, a push is allowed when the request, a standing user instruction or an authorized caller such as the `pr` skill grants it."

[[sources.declined]]
feature = "Committing with a trailing path list (`git commit -F <file> -- <paths>`)."
reason = "After hunk staging, a path list can commit unstaged content from those paths; the skill commits the verified index."

[[sources.declined]]
feature = "Creating a feature branch without asking when the checkout is on the default branch or a detached HEAD."
reason = "The skill uses the existing checkout. Committing on `main` or `master` is a condition to resolve unless the user explicitly wants to commit there."

[[sources.declined]]
feature = "File-level splitting capped at two or three commits, with no hunk staging."
reason = "The skill handles every clear boundary in sequence and patch-stages hunks when the boundary is clear."


[[sources.ideas]]
idea = "A commit boundary follows independently understandable intent and reversibility. Mechanical cleanup stays separate from behavior when each part remains coherent, and dependent commits are ordered so that each one can be understood and checked at its own revision."
serves = "Keeps history reviewable and revertable one purpose at a time, without broken intermediate commits."
where = ["SKILL.md#workflow"]
shapes = "Step 1 chooses the boundary by intent and reversibility, separates cleanup from behavior and orders dependent commits."
adapted = "The donor puts each type of change, such as tests or a refactor, in its own commit. Locally, a behavior stays with its regression tests and required schema or generated output when together they form one working change."

[[sources.ideas]]
idea = "A commit message explains a consequential reason. A body is added for breaking changes, migrations, non-obvious fixes, tradeoffs or multi-file behavior whose relation the subject cannot hold, and it states the reason before the change."
serves = "Lets a future reader understand a decision that the diff alone does not show."
where = ["SKILL.md#workflow"]
shapes = "The body rules in step 5 make the body optional for an obvious small commit and put the reason first when one is needed."
adapted = "The reason must come from the user's request, a linked issue or supplied project context; recent commits supply only format and tone. The subject names the concrete result that becomes true, not the act of editing."

[[sources.declined]]
feature = "Commit size targets, such as about 100 lines per commit and a split above about 1000 lines."
reason = "Boundaries follow intent and reversibility; the skill avoids arbitrary file or line quotas."

[[sources.declined]]
feature = "Trunk-based development with short-lived feature branches as the required branching model."
reason = "The skill commits on the existing branch. Committing on `main` or `master` is a condition to resolve unless the user explicitly wants to commit there."

[[sources.declined]]
feature = "Runtime-specific tooling: npm check commands before every commit, and a release flow that tags versions and writes a changelog."
reason = "Validation runs the narrowest check that covers the staged boundary, and the skill never publishes tags without authorization."

[[sources.declined]]
feature = "Installing commit hooks with husky and lint-staged."
reason = "The skill works with the hooks that the repository already runs, through its hook decision table, and never bypasses them."

[[sources.declined]]
feature = "Recovering from a failed change with `git reset --hard HEAD`."
reason = "Excluded and unrelated work must stay recoverable, and a destructive Git action outside the task is a condition to resolve with the user."


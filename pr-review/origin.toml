[[dependencies]]
kind = "local"
name = "review-code-changes"
required = true
role = "Canonical audit methodology, severity, report grammar and validator, resolved by registered name."
decisions = [
  "Each engine is one non-delegating comparison participant over the full frozen PR scope.",
  "Each run freezes the resolved auditor protocol and its validator; the skill maintains no copied audit core.",
  "2026-10-13, at the user's direction: the caller-evidence rule for caller-, host- and mode-specific failures went into the auditor protocol as an authorized auditor update, because it governs every audit and both the engines and this coordinator judge with it.",
  "2026-10-25, at the user's direction: the rule that a reachable trigger's rarity narrows Affected rather than severity went into the auditor protocol as an authorized auditor update, because the engines grade severity before the coordinator does.",
  "2026-10-25, with the user's approval of the change: carrying a pre-existing defect that lies in an expression the change edits, and counting repetition the change extends as part of its resulting structure, went into the auditor protocol as an authorized auditor update, because the auditor owns Class and Action.",
  "2026-10-25, with the user's approval of the change: making optional an unmet standard whose remedy would no longer serve the change went into the auditor protocol as an authorized auditor update, because the auditor owns Class and Action.",
  "2026-10-31, at the user's direction: every remaining review criterion this skill held, its caller lenses, seam semantics, maintainability, comment and test checks and the brief's intent rules, went into the auditor, so this skill keeps no audit criteria; its parent still runs the seam and census checks itself.",
]

[[dependencies]]
kind = "local"
name = "compare-solutions"
required = true
role = "Independent full-attempt and evidence-based synthesis contract."
decisions = [
  "The parent remains the sole synthesis owner; in T3 it uses app-owned child tasks, and on other hosts it uses the CLI supervisor.",
  "The roster is the user-selected Codex and Claude engines on identical scope and criteria.",
  "The parent performs the synthesis; the skill deliberately omits an additional independent judge and recursive coordination.",
  "T3 native reviewers run inside the host permission boundary, and CLI guards apply only to CLI workers. The report states that difference, and stricter project isolation requirements are honored.",
]

[[dependencies]]
kind = "local"
name = "comment-style"
required = true
role = "Compact wording and PR-specific comment rules; placement and review publication remain with pr-review."

[[dependencies]]
kind = "local"
name = "communicate-clearly"
required = false
role = "Optional general prose guidance through comment-style."

[[dependencies]]
kind = "local"
name = "accessibility"
required = false
role = "Web and platform accessibility reference passed to both engines under the review-practice class when a diff changes rendered UI; a run without it records the gap and continues."

[[dependencies]]
kind = "local"
name = "pr-review-followup"
required = false
role = "Follows the PR after a published review whose event is not APPROVE, unless the user asked for the review without follow-up; a missing package is reported as the follow-up gap."

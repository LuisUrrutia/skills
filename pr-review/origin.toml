reason = "User decision of 2026-10-25. On the same benchmark review, one engine's question named both the API-layer and the frontend consumers of a contract change, and the merged question kept only the API layer."
where = ["references/ledger.md#questions-seams-and-synthesis"]

[[local_snapshots.deviations]]
change = "Added to the caller supplement that a test asserting behavior a finding shows defective, or covering only a shape the writers can no longer produce while the failing shape stays untested, is an affected site of that finding with its own anchor and remedy."
reason = "User decision of 2026-10-25. On the same benchmark review, a new integration test pinned a regression with a record the backfill already resolves, and the coordinator cited the test only as evidence of that regression instead of asking for it to be fixed."
where = ["references/audit-supplement.md"]

[[local_snapshots.deviations]]
change = "Added to comment selection that a test site of a finding outside tests is posted with that finding, whatever the test-only selection rule says."
reason = "User decision of 2026-10-25 that a new test pinning a regression be fixed before merge; the test-only selection rule would otherwise keep that site internal."
where = ["SKILL.md#word-select-and-publish"]

[[local_snapshots.deviations]]
change = "Added to the caller supplement three lenses: compare each variant of a changed expression that several variants share, such as API versions or payment methods, at base and head; trace what clears each error, loading, disabled or selected state the diff sets in a UI or form; and treat a comment the diff makes untrue as a finding."
reason = "User decision of 2026-10-25 to fix the weak aspects that each benchmark comparison against another review skill exposes. On a second benchmark PR the other skill found a builder link change made for one API version that broke the other, an answer error that stayed after the input was corrected, and a doc comment the change made false; both engines had reviewed those files."
where = ["references/audit-supplement.md"]

[[local_snapshots.deviations]]
change = "When a diff adds or changes rendered UI, the packet carries the accessibility skill's web or platform reference as review practice, and the supplement asks for distinct accessible names or a labelled group for repeated controls and a defined focus destination after an element is added, removed or disabled."
reason = "User decision of 2026-10-25 to fix the weak aspects that each benchmark comparison against another review skill exposes. On the same PR the other skill found repeated row labels with no group name and focus lost after deleting a row; no accessibility criteria reached the engines."
where = ["SKILL.md#prepare-one-reproducible-review", "references/audit-supplement.md"]

[[local_snapshots.deviations]]
change = "Added to the seam sweep that a migration, backfill or job that rewrites stored values opens a seam for each published contract that returns them, recording what its consumers see before and after."
reason = "User decision of 2026-10-25 to fix the weak aspects that each benchmark comparison against another review skill exposes. On the same PR a backfill changed what integrator-facing APIs return, and no seam opened because the sweep opens seams by changed path."
where = ["references/seams.md"]

[[local_snapshots.deviations]]
change = "Refined the maintainability sweep to search the same app or package first, hand-written test helpers and mocks included, and to compare what each copy of copied data counts or matches, such as characters, UTF-16 units or bytes, not only its value."
reason = "User decision of 2026-10-25 to fix the weak aspects that each benchmark comparison against another review skill exposes. On the same PR the sweep compared story handlers only with generated helpers and missed a hand-written copy in the same app, and listed copies of a length limit without noticing that two of them count different units."
where = ["references/maintainability.md"]

[[local_snapshots.deviations]]
change = "Added to candidate reduction that synthesized severity follows consequence: a rare trigger keeps the severity of what it causes, such as data deleted beyond recovery, and its rarity belongs in Affected."
reason = "User decision of 2026-10-25 to fix the weak aspects that each benchmark comparison against another review skill exposes. On the same PR the coordinator lowered an irreversible deletion of integrator data and a data loss during rollout to low because their triggers were rare."
where = ["references/ledger.md"]

[[dependencies]]
kind = "local"
name = "review-code-changes"
required = true
role = "Canonical audit methodology, severity, report grammar and validator, resolved by registered name."
decisions = [
  "Each engine is one non-delegating comparison participant over the full frozen PR scope.",
  "Each run freezes the resolved auditor protocol and its validator; the skill maintains no copied audit core.",
  "Later caller lenses stay in references/audit-supplement.md until a separately authorized auditor update.",
  "2026-10-13, at the user's direction: the caller-evidence rule for caller-, host- and mode-specific failures went into the auditor protocol as an authorized auditor update, because it governs every audit and both the engines and this coordinator judge with it.",
]

[[dependencies]]
kind = "local"
name = "compare-solutions"
required = true
role = "Independent full-attempt and evidence-based synthesis contract."
decisions = [
  "The parent remains the sole synthesis owner; in T3 it uses app-owned child tasks, and on other hosts it uses the CLI supervisor.",
  "The roster is the user-selected Codex and Claude engines on identical scope and criteria.",
  "The parent performs the synthesis; the skill deliberately omits an additional independent judge and recursive coordination.",
  "T3 native reviewers run inside the host permission boundary, and CLI guards apply only to CLI workers. The report states that difference, and stricter project isolation requirements are honored.",
]

[[dependencies]]
kind = "local"
name = "comment-style"
required = true
role = "Compact wording and PR-specific comment rules; placement and review publication remain with pr-review."

[[dependencies]]
kind = "local"
name = "communicate-clearly"
required = false
role = "Optional general prose guidance through comment-style."

[[dependencies]]
kind = "local"
name = "accessibility"
required = false
role = "Web and platform accessibility reference passed to both engines as review practice when a diff adds or changes rendered UI."

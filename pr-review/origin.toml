  "2026-10-13, at the user's direction, from the human review of the same PR: read the parent ticket's description, acceptance criteria and comments and the subject's linked designs, since the owning reviewer cited the parent epic as asking for the soft delete the PR lacked, which the brief had named but not read; compare the semantics of an operation both sides of a seam perform, such as soft or hard delete; and establish which entry points of a domain change must emit its events, since partners also change those records through the system of record's public API.",
  "2026-10-13, at the user's direction: profiles.md defines the rule authority classes, adding owner convention for rules the owning reviewer of the touched paths enforces, as an optional finding of the subject's class. On that PR the engines received that reviewer's mined conventions as leads and dropped them, while the author applied 23 of the reviewer's 29 threads; over six months up to 86% of the reviewer's comments on those paths were applied, counting changed or resolved lines.",
  "Preserve explicit-only invocation and the existing audit, comparison and wording owners."

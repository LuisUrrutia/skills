  "2026-10-07, at the user's direction: publish reviews directly instead of leaving a PENDING draft, rename pr-review-draft to pr-review, approve only a complete and clean review, never request changes, and continue a same-topic point in its existing thread. Follow-up, thread resolution and later approval moved to pr-review-followup.",
  "2026-10-08, at the user's direction: the published review speaks as the user. It never names the engines, models or agents behind it, says the review is incomplete or describes what it could not cover; engine status and coverage gaps stay in the ledger and the report to the user, and a fact the author can see on the PR may still be stated. The earlier rule to name the missing engine in an incomplete review's body published 'reviewed with Codex and Claude' under the user's account.",

[[dependencies]]
name = "review-code-changes"
required = true
role = "Canonical audit methodology, severity, report grammar and validator, resolved by registered name."
local_choices = [
  "Each engine is one non-delegating comparison participant over the full frozen PR scope.",
  "Freeze the resolved protocol and validator per run; do not maintain a copied audit core.",
  "Keep later caller lenses in references/audit-supplement.md until a separately authorized auditor update.",
  "2026-10-13, at the user's direction: the caller-evidence rule for caller-, host- and mode-specific failures went into the auditor protocol as an authorized auditor update, because it governs every audit and both the engines and this coordinator judge with it."
]

[[dependencies]]
name = "compare-solutions"
required = true
role = "Independent full-attempt and evidence-based synthesis contract."
local_choices = [
  "The parent remains the sole synthesis owner; T3 uses app-owned child tasks and other hosts use the CLI supervisor.",
  "Use the user-selected Codex, Claude and local CodeRabbit roster on identical scope and criteria.",
  "The parent performs synthesis; deliberately omit an additional independent judge and recursive coordination.",
  "Retain native CodeRabbit output without manufacturing canonical coverage.",
  "T3 native reviewers use the host permission boundary; CLI guards apply only to CLI workers. Report that difference and honor stricter project isolation requirements."
]

[[dependencies]]
name = "comment-style"
required = true
role = "Compact wording and PR-specific comment rules; placement and review publication remain with pr-review."

[[dependencies]]
name = "communicate-clearly"
required = false
role = "Optional general prose guidance through comment-style."

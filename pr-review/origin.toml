[[local_snapshots.deviations]]
change = "Added that the review body starts with its first unanchored finding, as a list when there are several, with no lead-in about why those findings are in the body."
reason = "User decision of 2026-10-22, after a published review body opened with 'a few things that have no line in the diff:', which the user judged a human reviewer would not write."
where = ["SKILL.md#word-select-and-publish"]

[[local_snapshots.deviations]]
change = "Added to the caller supplement a test census: for each validation rule, mapping, mapping ignore or result-changing branch whose behavior the diff adds or changes, the engine finds the test that fails without it (deleted or inverted when new, the previous behavior when changed), reports a member without one and an added test that passes with its target deleted, excuses an evidenced behavior-neutral member, and records the census on that path's single Coverage line."
reason = "User decision of 2026-10-23. On a private repository's PR a human reviewer raised six such gaps; the engines held the team test standard but reported one, and their reports did not show which rules went unchecked."
where = ["references/audit-supplement.md"]

[[local_snapshots.deviations]]
change = "Added that the brief records each passed rule file's scope as the file's own text sets it, never narrower, so a rule that asks for a failing test per production change covers the production hunks and not only the changed tests."
reason = "User decision of 2026-10-23. On the same PR the brief scoped the team test standard to changed test files, and the engines judged the existing tests instead of looking for a test per changed rule."
where = ["references/profiles.md"]

[[local_snapshots.deviations]]
change = "Added to the caller supplement a sibling-parity check for a public contract concept that the change adds or alters, such as a date range, pagination, masking or an enum: compare its semantics with the sibling endpoints of the same API version and run the supplied conventions' or specification's examples and the most common realistic input through the code. A divergence from those semantics, or from siblings that follow them, without a recorded decision is a finding or a question; a PR body disclosure is no decision."
reason = "User decision of 2026-10-23. On the same PR two human reviewers found that a date-only createdTo meant midnight, unlike the sibling v2 lists and the conventions' own example; both engines and the coordinator accepted the author's disclosure and the literal spec text."
where = ["references/audit-supplement.md"]

[[local_snapshots.deviations]]
change = "Added to the brief that a subject or parent ticket that is a conformance or consistency initiative contributes its rules for the concepts the PR changes as requirements and its audit findings for them as evidence, not as a summary, and that the brief names the sibling endpoints of each public contract concept the PR changes."
reason = "User decision of 2026-10-23. On the same PR the parent epic was a consistency initiative whose audit listed date-range drift across endpoints, and the brief reduced it to one line."
where = ["SKILL.md#brief"]

[[local_snapshots.deviations]]
change = "Added to candidate reduction that the coordinator judges each candidate with the caller supplement as well as the protocol, treats an author's PR body disclosure as a claim rather than a recorded decision, and censuses every member of a family, such as the rules of one validator, before settling a candidate's extent."
reason = "User decision of 2026-10-23. On the same PR the coordinator verified a missing test for one validator rule against two sibling rules that had tests and stopped there; a human reviewer then raised the untested remaining rules."
where = ["references/ledger.md"]

[[local_snapshots.deviations]]
change = "Added to the seam sweep a version-skew comparison for a contract field removed, renamed or newly required between sides that can run different versions, through separate deploys, a rolling rollout or a client keeping an old build: each side at base against the other at head, in both directions, each a row naming its window. A skew gap where the old side reads, sends or omits the field is a candidate: a defect when its window can outlast a release or it writes lasting data, otherwise an optional improvement. An earlier PR with the same pattern records no decision."
reason = "User decisions of 2026-10-25. On a benchmark review of a PR that removed contract fields, a break between a backend service and the API layer that reads it while old and new versions run together stayed an unposted question, and the same break between the single-page app and that service was never examined. The user then confirmed that releases deploy every service together, which leaves the rollout and old browser tabs as the windows; the coordinator proposed classing gaps by how long the window lasts and whether it writes lasting data, and the user accepted it."
where = ["references/seams.md"]

[[local_snapshots.deviations]]
change = "Added a parent maintainability sweep, run beside the seam sweep while the workers review. It censuses near copies of what the diff adds or rewrites, blocks repeated across changed files and computations repeated within a function; data copied without a single source or equality test; writers of one stored value compared on the same input, where a difference is a cost without a caller and a new writer's difference is the diff's; newly read keys without a constraint, which writer validation does not replace; and work rebuilt from static data."
reason = "User decisions of 2026-10-25. On a benchmark review of a PR, both engines received the protocol's structure lens and still raised one of ten maintainability issues that another reviewer found; the user chose a check owned by this skill over consulting that reviewer, which this skill never reads. Later runs missed a fixture repeated in 30 files and a new backfill that trims differently, skipped copies the diff rewrote rather than added, dropped writer differences for want of a caller and accepted writer canonicalization in place of a constraint."
where = ["references/maintainability.md", "SKILL.md#run-and-reconcile", "references/ledger.md#questions-seams-and-synthesis"]

[[local_snapshots.deviations]]
change = "Added to candidate reduction that a defect an engine names but sets aside on a premise it could not settle is a pending candidate tied to that premise, judged again once the seam sweep, a resolved question or the parent's trace settles it."
reason = "User decision of 2026-10-25. On a benchmark review, an engine named a carried display defect and set it aside because it could not tell whether an external system writes the triggering value; the seam sweep later read that system's writer, and the coordinator never returned to the defect."
where = ["references/ledger.md#candidate-entries"]


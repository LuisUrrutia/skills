format_version = 2
skill = "pr-review"
created = "2026-10-06"
approach = "create"
goal = "Publish one GitHub review of another author's PR under the user's own account, built from independent Codex and Claude reviews that the parent verifies and synthesizes. Success is a Comment review that carries only verified, correctly anchored findings, or an Approve review when the review is complete and nothing that blocks approval remains, with read-back confirming what was published and every gap reported to the user."

[[invariants]]
rule = "The record keeps no base: the private draft-review package this skill was migrated from is Git history, not a tracked base or snapshot."
reason = "User decision of 2026-10-31 to remove draft-review from the record."

[[invariants]]
rule = "Users and the pr-review-followup skill start the skill. Implicit invocation stays enabled in Codex so follow-up ticks can re-review a new head, and the description limits selection to a review that is published on GitHub."
reason = "User decision on 2026-10-30. Codex hides a skill whose agents/openai.yaml sets allow_implicit_invocation false from the model's prompt; only an explicit $name still invokes it (codex-rs/ext/skills/src/provider/host.rs and the skill-creator openai_yaml reference in openai/codex, checked 2026-10-30)."
where = ["SKILL.md", "scripts/validate.sh"]

[[invariants]]
rule = "The review-code-changes skill owns audit criteria, evidence, severity, report grammar and private profile resolution; the compare-solutions skill owns the independent-attempt and synthesis contract; the comment-style skill owns wording. This skill owns the fixed roster, its coordination, comment selection, placement and GitHub writes, and holds no audit criteria."
reason = "User decisions of 2026-10-31: rules for how to review code, and the repository profiles that say how to review a specific repository, belong to review-code-changes."
where = ["SKILL.md#pr-review", "references/profiles.md"]

[[invariants]]
rule = "The parent keeps a matched profile's Checkouts, Tracker access, Comment bindings and Author names; the packet carries only the profile sections workers may receive."
reason = "Profiles hold checkout and access details, tracker setup and personal wording bindings that engines do not need."
where = ["references/profiles.md", "scripts/snapshot.py"]

[[invariants]]
rule = "The workflow never requests changes, resolves threads or modifies the reviewed code."
reason = "User decision of 2026-10-07; thread resolution belongs to the pr-review-followup skill."
where = ["SKILL.md#pr-review", "references/github.md#feedback-and-review-publication"]

[[invariants]]
rule = "After a published COMMENT review, the skill starts the pr-review-followup skill on the PR and passes it the review's inputs, unless pr-review-followup ran the review or the user asked for the review without follow-up. A delegated child returns that handoff to its parent."
reason = "User decision on 2026-10-30: every PR the user reviews is followed up unless the user says otherwise. An APPROVE review needs no follow-up because it already meets pr-review-followup's stopping condition."
where = ["SKILL.md#word-select-and-publish"]

[[invariants]]
rule = "The review is published directly: a Comment review with the verified findings, or an Approve review only when every engine succeeded and no supported required finding, open decisive question or unresolved required thread of the actor remains."
reason = "User decision of 2026-10-07: publish reviews directly and approve only a complete and clean review."
where = ["SKILL.md#pr-review", "SKILL.md#word-select-and-publish", "references/github.md#publish-and-verify", "scripts/publish_review.py"]

[[invariants]]
rule = "A supported same-topic point, such as a partial fix with a remaining gap or new evidence for the same issue, continues as a reply in its existing thread."
reason = "User decision of 2026-10-07: a same-topic point continues in its existing thread."
where = ["SKILL.md#run-and-reconcile"]

[[invariants]]
rule = "Each thread reply is posted on its own in its existing thread once the review is submitted and read back; a Comment plan with only replies publishes no review."
reason = "User decision of 2026-10-21, after a reply published inside the run's review appeared twice on the PR's Conversation tab: GitHub showed the one comment in its thread and again under that review."
where = ["SKILL.md#word-select-and-publish", "references/github.md#feedback-and-review-publication", "references/github.md#publish-and-verify", "scripts/publish_review.py"]

[[invariants]]
rule = "When the pr-review-followup skill runs this review, the event is capped at COMMENT and approval stays with that skill."
reason = "User decision of 2026-10-07: follow-up, thread resolution and later approval moved to the pr-review-followup skill."
where = ["SKILL.md#pr-review", "SKILL.md#word-select-and-publish", "references/github.md#publish-and-verify"]

[[invariants]]
rule = "The published review speaks as the user: its body, comments and replies never name the engines, models or agents behind it, cite ledger sources, say that the review is incomplete or describe what it could not cover. Engine status and coverage gaps stay in the ledger and the report to the user; a fact the author can see on the PR may still be stated."
reason = "User decision of 2026-10-08, after an earlier rule to name the missing engine in an incomplete review's body published 'reviewed with Codex and Claude' under the user's account."
where = ["SKILL.md#word-select-and-publish"]

[[invariants]]
rule = "The roster is exactly Codex and Claude; the local CodeRabbit CLI is not a reviewer."
reason = "User decision of 2026-10-22: CodeRabbit almost always caused problems in review runs."
where = ["SKILL.md#pr-review", "SKILL.md#run-and-reconcile", "references/reviewers.md", "references/t3-subagents.md", "references/ledger.md", "scripts/adapters.py", "scripts/reviewers.py"]

[[invariants]]
rule = "The brief labels each passed rule file with its auditor authority class, including owner convention mined from how authors resolved the owning reviewer's comments, and records its scope as the file's own text sets it."
reason = "User decision of 2026-10-13. On that PR the engines received that reviewer's mined conventions as leads and dropped them, while the author applied 23 of the reviewer's 29 threads; over six months up to 86% of the reviewer's comments on those paths were applied, counting changed or resolved lines. User decision of 2026-10-23. On the same PR the brief scoped the team test standard to changed test files, and the engines judged the existing tests instead of looking for a test per changed rule."
where = ["references/profiles.md"]

[[invariants]]
rule = "The review body starts with its first unanchored finding, as a list when there are several, with no lead-in about why those findings are in the body."
reason = "User decision of 2026-10-22, after a published review body opened with 'a few things that have no line in the diff:', which the user judged a human reviewer would not write."
where = ["SKILL.md#word-select-and-publish"]

[[invariants]]
rule = "The brief names the sibling endpoints of each public contract concept the PR changes."
reason = "User decision of 2026-10-23. On a PR whose parent epic was a consistency initiative, two human reviewers found a date-only bound that diverged from the sibling endpoints."
where = ["SKILL.md#brief"]

[[invariants]]
rule = "A defect an engine names but sets aside on a premise it could not settle is a pending candidate tied to that premise, judged again once a seam verdict, a resolved question or the parent's trace settles it."
reason = "User decision of 2026-10-25. On a benchmark review, an engine named a carried display defect and set it aside because it could not tell whether an external system writes the triggering value; the parent's seam check later read that system's writer, and the coordinator never returned to the defect."
where = ["references/ledger.md#candidate-entries"]

[[invariants]]
rule = "Optional findings are posted, a follow-up ticket suggestion included, unless an existing ticket's text already names the remedy, which the ledger then cites."
reason = "User decision of 2026-10-25 that maintainability findings reach the author as a ticket suggestion or a solution; on a benchmark review the coordinator kept two verified ticket suggestions internal as follow-ups."
where = ["SKILL.md#word-select-and-publish"]

[[invariants]]
rule = "Test, story and tooling findings are selected like any other finding, and a test site of a finding outside tests is posted with that finding."
reason = "User decision of 2026-10-25 to fix the weak aspects that each benchmark comparison against another review skill exposes. On both benchmark PRs the rule kept verified test gaps, story mock defects and typed-fixture violations on code the PR added internal, while the other skill surfaced them. User decision of 2026-10-25 that a new test pinning a regression be fixed before merge; the test-only selection rule would otherwise keep that site internal."
where = ["SKILL.md#word-select-and-publish"]

[[invariants]]
rule = "Every selected finding without a line anchor goes in the review body."
reason = "User decision of 2026-10-25 that an unmet standard whose remedy no longer serves the change is optional, with a follow-up. Such a finding, like a branch name, has no line anchor, and comment selection posts optional findings."
where = ["SKILL.md#word-select-and-publish"]

[[invariants]]
rule = "A merged question keeps every member its sources name, such as each contract or consumer; dropping a member needs its own reason."
reason = "User decision of 2026-10-25. On the same benchmark review, one engine's question named both the API-layer and the frontend consumers of a contract change, and the merged question kept only the API layer."
where = ["references/ledger.md#questions-seams-and-synthesis"]

[[invariants]]
rule = "When a diff changes rendered UI and the accessibility skill resolves, its reference enters the packet under a path-derived name with the review-practice class; otherwise the run continues."
reason = "User decision of 2026-10-25 to fix the weak aspects that each benchmark comparison against another review skill exposes. On the same PR the other skill found repeated row labels with no group name and focus lost after deleting a row; the packet's accessibility baseline covered contrast, visible focus and labels but not those checks."
where = ["SKILL.md#prepare-one-reproducible-review", "references/profiles.md"]

[[invariants]]
rule = "Synthesized severity follows the auditor's consequence rule, under which a rare trigger narrows Affected, not severity."
reason = "User decision of 2026-10-25 to fix the weak aspects that each benchmark comparison against another review skill exposes. On the same PR the coordinator lowered an irreversible deletion of integrator data and a data loss during rollout to low because their triggers were rare."
where = ["references/ledger.md"]

[[invariants]]
rule = "Both seats request effort xhigh, or the highest the model offers below it, unless the user requests other settings. In T3 the effort goes in target.options under the catalog's option id, an empty options list being the catalog default, and the returned options are compared with the request."
reason = "User decision of 2026-10-25 to fix the weak aspects that each benchmark comparison against another review skill exposes. On the same PR one seat ran at its catalog default effort while earlier benchmark runs used xhigh, which made the runs incomparable."
where = ["references/t3-subagents.md", "references/reviewers.md"]

[[invariants]]
rule = "Open suggestions and nits never block approval. Each published comment, reply and review body records the Action of what it carries and the receipt keeps it per thread; an Approve review may carry optional comments and replies; the actor's unresolved threads block approval only when they hold a required point; and only an optional finding takes the `nit:` or `suggestion:` label."
reason = "User decision of 2026-10-27, after the follow-up of a private repository's PR kept listing a lone `suggestion:` thread as an approval blocker. The action is recorded at publication rather than read from the label because the user edits published comments, and an earlier review had labeled a required low-severity finding `nit:`."
where = ["SKILL.md#word-select-and-publish", "references/github.md#review-identity-and-comment-plan", "references/github.md#publish-and-verify", "scripts/publish_review.py"]

[[invariants]]
rule = "A conversation dedicated to reviewing one PR is titled `[REVIEW] #<number> <ticket> <author>` when the host can rename it: the subject ticket in its tracker's canonical form, or `NO_TICKET`, and the author's login unless the profile's Author names give another name."
reason = "User decision of 2026-10-30 to name review threads by PR number, ticket and author, with `NO_TICKET` when there is none, a short name for an app author, and tickets from any tracker rather than only Jira."
where = ["SKILL.md#prepare-one-reproducible-review", "references/profiles.md"]

[[invariants]]
rule = "pr.json captures the PR's closing issue references, so the subject ticket can come from an issue the PR closes."
reason = "Inferred from the user's 2026-10-30 decision that the title's ticket comes from any tracker; the PR that prompted it named its GitHub issue only as a closing reference."
where = ["SKILL.md#prepare-one-reproducible-review"]

[[invariants]]
rule = "While the engines review, the parent opens the seams and runs the census checks of the frozen auditor protocol itself and records each seam verdict and census in the ledger; each census member that fails its check becomes a candidate."
reason = "User decisions of 2026-10-25: engines that carried the same checks still missed items, and two runs of one revision each kept comment findings the other missed. On 2026-10-31 the user kept this redundancy in this skill when the checks moved into review-code-changes."
where = ["SKILL.md#run-and-reconcile", "references/ledger.md#questions-seams-and-synthesis"]


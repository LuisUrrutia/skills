format_version = 2
skill = "pr-review"
created = "2026-10-06"
approach = "base"
goal = "Publish one GitHub review of another author's PR under the user's own account, built from independent Codex and Claude reviews that the parent verifies and synthesizes. Success is a Comment review that carries only verified, correctly anchored findings, or an Approve review when the review is complete and clean, with read-back confirming what was published and every gap reported to the user."

[[invariants]]
rule = "The skill runs only on explicit invocation."
where = ["agents/openai.yaml"]

[[invariants]]
rule = "The review-code-changes skill owns audit criteria, evidence, severity and report grammar; the compare-solutions skill owns the independent-attempt and synthesis contract; the comment-style skill owns wording. This skill owns the fixed roster, its coordination, comment selection, placement and GitHub writes."
where = ["SKILL.md#pr-review"]

[[invariants]]
rule = "Private repository profiles stay outside the package as external runtime inputs. A profile supplies local context, never permission to waive required repository behavior."
reason = "Profiles hold checkout and access details, tracker setup, personal wording bindings and historical calibration that the portable package must not bundle."
where = ["references/profiles.md", "SKILL.md#prepare-one-reproducible-review"]

[[invariants]]
rule = "The workflow never requests changes, resolves threads or modifies the reviewed code."
reason = "User decision of 2026-10-07; thread resolution belongs to the pr-review-followup skill."
where = ["SKILL.md#pr-review", "references/github.md#feedback-and-review-publication"]


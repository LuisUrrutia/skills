[[sources.ideas]]
idea = "Agent history is read in bounded, decoded reads of supported record shapes, with full session and message IDs or exact file, line or database locators. An unsupported source is recorded as a gap instead of being exported whole."
serves = "Keeps history reads safe and traceable and makes partial coverage explicit."
where = ["references/agent-history.md#agent-conversations"]
shapes = "Orders agent-history collection as cheap enumeration, then bounded reads of selected messages with retained locators."
adapted = "Messages are selected by their own timestamps, including sessions created before the period; session creation, modification and directory dates are only discovery hints."

[[sources.ideas]]
idea = "Mirrored messages, export branches, resumed sessions and child or parent summaries are deduplicated by stable identity or explicit lineage, and a later correction that changes a completion claim is kept."
serves = "Prevents double counting and prevents a superseded claim of completion from reaching the report."
where = [
  "references/agent-history.md#agent-conversations",
  "references/extraction.md#self-contained-worker-brief",
]
shapes = "Adds a deduplication step by identity or lineage, and requires workers to preserve corrections."

[[sources.declined]]
feature = "Bundling the chat-history adapter or its retrieval scripts."
reason = "Host history tools, supported local reads or the chat-history skill, when it is already installed, own retrieval, and the skill does not install it implicitly."


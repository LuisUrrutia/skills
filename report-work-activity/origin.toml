[[sources.ideas]]
idea = "Every report names its exact period. The period is resolved once and kept with its inclusive start, exclusive end, timezone and snapshot time."
serves = "Makes it clear which work the report covers and lets later questions use the same window."
where = ["SKILL.md#establish-the-report"]
shapes = "Makes period resolution the first step of the report, before any collection."
adapted = "The period is a calendar interval (yesterday, the previous week, the previous month or an explicit interval) instead of a rolling window, and it applies to every connected source, not only commits."

[[sources.ideas]]
idea = "Work is summarized as concise stories of the observed result, without invented impact or motivation."
serves = "Keeps the report factual and short enough to use."
where = ["SKILL.md#verify-and-synthesize", "SKILL.md#save-and-inspect-the-html"]
shapes = "Turns linked PRs, tickets, messages, meetings and chats into work stories whose wording is limited to the observed result."
adapted = "A commit does not prove shipment: commits, merges and deployment stay distinct events."

[[sources.declined]]
feature = "A report built only from authored commits over a rolling 7–10-day window."
reason = "The report covers all connected sources over calendar intervals."


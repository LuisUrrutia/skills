format_version = 2
skill = "report-work-activity"
created = "2026-10-04"
approach = "derive"
goal = "Produce a concise, private HTML report of the user's activity over a requested period from every connected source, with work separated from open source, and a separate as-of snapshot of outstanding commitments and assignments. Success is a report whose numbers come from accepted, attributed records, whose coverage gaps are visible instead of looking like zero activity, and whose retained evidence answers follow-up questions without repeating collection."

[[invariants]]
rule = "Reporting is read-only. Workers and the primary make no source mutations, such as sending, drafting, triage, acknowledgments, ticket changes or incident commands, and generating the bundle does not authorize sharing, sending, committing its personal data or scheduling future reports."
where = [
  "SKILL.md#extract-each-source-with-luna",
  "SKILL.md#save-and-inspect-the-html",
  "references/engineering-sources.md#jsm-pagerduty-and-equivalent-incident-systems",
]

[[invariants]]
rule = "Existing tools and connectors own retrieval. The skill vendors no history adapter or universal client; the chat-history skill, when it is already installed, can own agent-history retrieval."
where = [
  "SKILL.md#extract-each-source-with-luna",
  "references/agent-history.md#agent-conversations",
]

[[invariants]]
rule = "Every selected source or workstream gets a first-pass extraction by a Codex Luna child, including sources collected with a CLI. Another model or primary-only extraction needs an explicit user change. The primary owns all shared output, and workers write to isolated paths."
reason = "It is part of the user-defined multi-source reporting contract."
where = [
  "SKILL.md#extract-each-source-with-luna",
  "references/extraction.md#source-extraction-with-codex-luna",
]

[[invariants]]
rule = "A report period is a calendar interval [start, end) in the user's timezone, resolved once by the bundled helper, and a historical event belongs to it by its action time."
where = ["SKILL.md#establish-the-report", "references/evidence.md#time-and-attribution"]

[[invariants]]
rule = "A count credits the user only for actions that a verified identity of the user performed in the stated role; assignment, on-call duty or a team result alone does not credit the user."
where = [
  "references/evidence.md#time-and-attribution",
  "references/engineering-sources.md#jsm-pagerduty-and-equivalent-incident-systems",
]


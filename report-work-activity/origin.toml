[[sources.ideas]]
idea = "For a message or ticket that matters, the surrounding thread or ticket history is read to find the outcome, promises, requests and later corrections, including in-period replies to older parent messages."
serves = "Prevents a single message from being reported without the context that decides its outcome."
where = [
  "references/collaboration-sources.md#slack-and-documentdesign-work",
  "references/engineering-sources.md#jira-linear-and-reviews-of-tickets",
]
shapes = "Adds a context read after the authored-message search and keeps reopened or reassigned tickets traceable."
adapted = "Context establishes the user's work and current obligations, not the motivation behind code, which is what the donor reads it for."

[[sources.ideas]]
idea = "Each source records its search visibility, private-channel or direct-message permissions, retention and page limits, and when each status was checked, so access gaps and stale state appear in coverage."
serves = "Prevents an inaccessible or outdated source from looking like no activity or a current fact."
where = [
  "references/evidence.md#coverage-and-obligations",
  "references/collaboration-sources.md#slack-and-documentdesign-work",
  "SKILL.md#verify-and-synthesize",
]
shapes = "Adds per-source coverage fields and a printed check time for each obligation status."

[[sources.declined]]
feature = "Quoting deciding threads in full as standard evidence."
reason = "The bundle keeps minimal relevant excerpts with native IDs."


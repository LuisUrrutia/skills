[[sources.ideas]]
idea = "Collection runs in two stages: cheap deterministic metadata collection, then a bounded child extraction for each source that reads the selected content. The complete countable inventory stays separate from the short relevance summary, so filtering prose never removes items from metrics."
serves = "Keeps collection affordable without losing items from the counts."
where = [
  "SKILL.md#extract-each-source-with-luna",
  "references/extraction.md#source-extraction-with-codex-luna",
]
shapes = "Splits extraction into metadata collection and child extraction, and separates the metric inventory from the story summary."
adapted = "Every selected source gets a Codex Luna child, whether its data comes from a connector or a CLI. When a child lacks a connector, the primary fetches a bounded batch for it; the primary owns shared output and workers write to isolated paths."

[[sources.ideas]]
idea = "Each extracted item keeps its native ID, source link and the thread context that decides it, and truncated or unfinished retrieval is recorded explicitly."
serves = "Lets the primary verify items and report partial coverage honestly."
where = [
  "references/extraction.md#self-contained-worker-brief",
  "references/evidence.md#coverage-and-obligations",
]
shapes = "Puts native IDs, locators, coverage and unfinished portions into the required worker output."

[[sources.declined]]
feature = "A cap of five sessions and filtering of session history by the current branch."
reason = "A complete period needs every relevant session; a relevance cap may limit deep reads but not coverage."

[[sources.declined]]
feature = "Sweep acknowledgments, source writes and a received-mail cursor."
reason = "Reporting is read-only and selects mail by sent time within the period."


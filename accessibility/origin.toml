reviewed_through = "aeac41d4d005999432bb7312f7ff06383a91d59d"
baseline_paths = [
  "skills/frontend-ui-engineering/SKILL.md",
  "references/accessibility-checklist.md",
  "LICENSE",
]
paths = [
  "skills/frontend-ui-engineering/SKILL.md",
  "references/accessibility-checklist.md",
  "LICENSE",
]

[[sources.ideas]]
idea = "Choose keyboard, screen-reader, visual and form checks from the affected interaction and the coverage the claim needs, not from a fixed number of screens or a tool's default scan."
serves = "Spends checking effort where the changed interaction can fail."
where = ["SKILL.md#collect-evidence-that-matches-the-claim"]
shapes = "Turns the evidence section into a set of check kinds from which the claim selects."

[[sources.ideas]]
idea = "Prefer native controls and the project's established design-system components, keep the product's behavior and visual identity unless a barrier requires a change, and repair at the responsible component or shared primitive."
serves = "Fixes barriers without fragmenting the design system or changing unrelated behavior."
where = ["SKILL.md#define-the-interaction-before-changing-it"]
shapes = "Orders repairs from native controls to established components to custom patterns, and requires checking affected callers when a shared control changes."

[[sources.ideas]]
idea = "Trace the loading, empty, invalid, denied, interrupted and success states that exist in the flow, and make each one perceivable with an outcome the user can discover."
serves = "Prevents state changes that sighted mouse users notice and others miss."
where = ["SKILL.md#define-the-interaction-before-changing-it"]
shapes = "Makes the state list the first step before any change to the interaction."

[[sources.declined]]
feature = "The UI-building workflow, its aesthetic rules and its 200-line component limit."
reason = "The skill takes only the accessibility coverage."

[[sources.declined]]
feature = "Large text from 18 px and 44 by 44 px touch targets as the general minimum."
reason = "Large text is 18 pt regular or 14 pt bold, and the AA target size is 24 by 24 CSS px with exceptions."

[[sources.declined]]
feature = "Universal keyboard rules: every interactive element as its own Tab stop, and Enter and Escape on every custom widget."
reason = "The applicable APG pattern decides the keys; a composite widget can use one Tab stop with arrow keys inside, and controls that already handle a key get no redundant handler."

[[sources.declined]]
feature = "A dialog example that sets aria-modal without making the background unavailable."
reason = "aria-modal alone does not implement modal behavior; the modal pattern is tested through opening, containment, dismissal and focus return."

[[sources.declined]]
feature = "Moving focus whenever content changes."
reason = "Not every content update warrants moving focus; status changes are exposed without unnecessary interruption."

[[sources.declined]]
feature = "Presenting accessibility work as meeting a legal requirement."
reason = "The baseline is a scoped engineering target, not a legal compliance claim."


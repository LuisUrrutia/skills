baseline_paths = ["pkg/cmd/accessibility/accessibility.go", "LICENSE"]
paths = ["pkg/cmd/accessibility/accessibility.go", "LICENSE"]

[[sources.ideas]]
idea = "A terminal interface can need a stable line-oriented prompt or a supported noninteractive equivalent, readable text progress instead of animated spinners, and configurable colors with meaning that does not depend on color, because cursor redraws and animation are hard for speech and braille output to follow."
serves = "Lets terminal users with assistive technology perceive the prompt, answer it, correct it, cancel and understand the result."
where = ["references/platforms.md#terminal-interfaces"]
shapes = "Adds a terminal section that checks the prompt, answer, correction, cancellation and result through the relevant terminal and assistive technology."
adapted = "GitHub CLI's implementation is a conditional design reference for terminal work; its particular flags and settings are not requirements for other programs."

[[sources.declined]]
feature = "Requiring GitHub CLI's accessible-colors, accessible-prompter and spinner settings, or changing a user's global terminal or CLI configuration to test."
reason = "The program's own conventions apply, and the test names the actual environment instead of changing the user's settings."


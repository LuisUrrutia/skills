[[sources.ideas]]
idea = "Accessibility covers each supported platform through its own semantics and assistive technologies: web roles, names and states, and native traits, values and actions. Each platform is checked through its own accessibility tree and its keyboard, switch, voice or screen-reader access."
serves = "Prevents treating one platform's checks as proof for another."
where = ["SKILL.md#establish-the-task-and-authority", "references/platforms.md#native-applications"]
shapes = "Separates web guidance from native-platform guidance in their own references, and makes the skill choose between them by platform before it selects checks."
adapted = "Platform-specific references and the project's existing components replace the donor's React-only examples and its fixed web, iOS and Android attribute mapping."

[[sources.ideas]]
idea = "Connect instructions and errors to their fields and expose required, invalid and similar states, so users can identify the field, understand the error and reach the correction."
serves = "Lets assistive-technology users find and fix what blocks a submission."
where = [
  "references/web.md#semantics-and-content",
  "references/web.md#forms-authentication-and-recovery",
]
shapes = "Adds field-to-error association to the semantics checks and makes the form section follow a submission through invalid input, correction and outcome."
adapted = "Status changes use live regions or alerts chosen by their actual urgency; field errors do not all become assertive alerts."

[[sources.ideas]]
idea = "Check native apps under the real system settings that users change: text scaling at the supported accessibility sizes, themes, increased contrast and reduced motion."
serves = "Finds layouts and controls that fail only under the settings users actually rely on."
where = ["references/platforms.md#native-applications"]
shapes = "Adds a settings pass to the native checks that covers controls, long content and failure states."

[[sources.declined]]
feature = "React-only code examples and a fixed web, iOS and Android attribute mapping table."
reason = "Platform references and the project's existing components decide the actual APIs."

[[sources.declined]]
feature = "Citing 2.4.11 as the visible-focus criterion and presenting Focus Appearance as a core WCAG 2.2 AA requirement."
reason = "Visible focus (2.4.7) and focus not entirely obscured (2.4.11) are AA; Focus Appearance (2.4.13) is AAA."

[[sources.declined]]
feature = "A fixed 44 by 44 point minimum for native touch targets."
reason = "Android recommends at least 48 by 48 dp, and Apple distinguishes a 44 pt default from a 28 pt minimum on iOS and iPadOS; the current platform table and input context decide."

[[sources.declined]]
feature = "Marking every field error with role=alert."
reason = "Urgency decides between a live region and an alert; not every field error interrupts the user."


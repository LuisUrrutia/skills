  "LICENSE.md",
]

[[sources.ideas]]
idea = "Drive the real keyboard or platform input path through the task and observe focus entry, movement, visibility, dismissal and return, instead of inferring them from source."
serves = "Finds focus losses, traps and hidden focus that markup review cannot show."
where = [
  "SKILL.md#collect-evidence-that-matches-the-claim",
  "references/web.md#keyboard-focus-and-dynamic-interfaces",
]
shapes = "Adds a driven keyboard walk to the evidence list and a focus check after each route change, removal, validation, update and overlay closure."

[[sources.ideas]]
idea = "Measure a control's effective hit region, including expanded hit areas, occlusion and nearby targets, instead of its drawn size."
serves = "Prevents false findings on controls whose real target is larger, and missed findings on targets that neighbors cover."
where = [
  "SKILL.md#collect-evidence-that-matches-the-claim",
  "references/web.md#visual-conditions-and-input-alternatives",
  "references/platforms.md#native-applications",
]
shapes = "Replaces size-by-appearance with measurement of the effective clickable region in the visual-condition and native checks."
adapted = "The threshold comes from the applicable criterion: WCAG 2.5.8 AA uses 24 by 24 CSS px or its spacing and other exceptions, and 44 by 44 CSS px belongs to the enhanced AAA criterion 2.5.5."

[[sources.ideas]]
idea = "Run automated scans on the reachable states that matter, such as dialogs and errors, and report their engine, rules, scope, exclusions, inconclusive results and false positives. An empty violation list proves only what that run could check."
serves = "Keeps an automated result from claiming more coverage than it had."
where = [
  "SKILL.md#collect-evidence-that-matches-the-claim",
  "references/web.md#evidence-limits-and-primary-references",
]
shapes = "Makes scan scope and inconclusive results part of the evidence a scan contributes."
adapted = "Required embedded third-party steps, such as payments, identity or consent, stay in the task coverage. Cross-origin content that cannot be inspected remains unverified or a demonstrated barrier, and attribution to a vendor is a remediation decision, not an exemption."

[[sources.ideas]]
idea = "Record missing evidence explicitly: a check that could not run, an unavailable device or assistive technology, or a blocked step is a limitation with the next check named, never a pass."
serves = "Prevents a partial run from being reported as a complete result."
where = [
  "SKILL.md#collect-evidence-that-matches-the-claim",
  "SKILL.md#report-barriers-and-coverage",
  "references/platforms.md#native-applications",
]
shapes = "Adds untested, blocked and inconclusive states to the report beside passed and failed, and keeps required missing checks from completing the result."

[[sources.declined]]
feature = "A fixed browser automation tool with Playwright-only recipes and a mandatory battery of probes."
reason = "The verify skill and the local recipe own the environment, and checks are chosen from the affected interaction."

[[sources.declined]]
feature = "Excluding third-party iframes and consent banners from scans as a blanket rule."
reason = "Essential embedded steps stay in the task coverage; third-party ownership does not turn a blocked task into a pass."

[[sources.declined]]
feature = "Deciding focus visibility by a changed-pixel threshold."
reason = "Visible focus is judged against the applicable criterion, which a pixel ratio does not measure."

[[sources.declined]]
feature = "44 by 44 CSS px as the conformance floor for target size."
reason = "The AA criterion is 24 by 24 CSS px with exceptions; 44 by 44 CSS px is the enhanced AAA criterion."

[[sources.declined]]
feature = "Treating a clean pass at a 320 px viewport as browser zoom or as the full reflow result."
reason = "Viewport narrowing, text-only resizing and browser zoom exercise different conditions, and the report names the one actually tested."


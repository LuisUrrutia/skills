format_version = 2
skill = "accessibility"
created = "2026-10-04"
approach = "derive"
goal = "Help someone who designs, implements or audits a web, native or terminal interface make the intended task perceivable, operable and understandable through every supported way of accessing it. Success is evidence that users can complete the whole flow, including state changes, errors, recovery and the resulting destination, with each claim backed by checks that match it and untested coverage stated."

[[invariants]]
rule = "The verify skill and the matching local verification recipe own startup, health, fixtures, driving and cleanup; this skill supplies the flow and its accessibility criteria."
reason = "The skill was derived to retain the verify skill as the execution owner."
where = ["SKILL.md#collect-evidence-that-matches-the-claim"]

[[invariants]]
rule = "Technical requirements come from primary standards and platform documentation. The exact criterion and its exceptions are confirmed before a preference, pattern recommendation or enhanced target is treated as a requirement, and web attributes, CSS pixels and platform units are not interchangeable."
reason = "Several donors misstate conformance levels, units or target sizes, so the skill takes requirements from primary sources and rechecks them when a technical requirement changes."
where = [
  "SKILL.md#establish-the-task-and-authority",
  "references/web.md#web-accessibility-checks",
  "references/platforms.md#native-and-terminal-interfaces",
]

[[invariants]]
rule = "For web work the baseline is the project's accessibility target, or WCAG 2.2 Level AA when the project sets none. It is a scoped engineering target, never a claim of legal compliance or whole-product conformance."
where = ["SKILL.md#establish-the-task-and-authority"]

[[invariants]]
rule = "Work stays within the request's authority: an audit produces findings and coverage, corrections happen only when the active task authorizes them, and a user's global settings are never changed to make a test pass."
where = ["SKILL.md#establish-the-task-and-authority", "references/platforms.md#terminal-interfaces"]


[[sources.ideas]]
idea = "Accessibility means a user can complete the whole task with each supported input method and assistive technology: entry, state changes, consequences, errors, recovery and the resulting destination. A component with the right attributes can still prevent someone from finishing."
serves = "Prevents passing a flow because its first control is correctly labeled."
where = [
  "SKILL.md#accessibility",
  "SKILL.md#define-the-interaction-before-changing-it",
  "SKILL.md#report-barriers-and-coverage",
]
shapes = "Makes the complete flow the unit of work: the skill traces it through its reachable states before any change, and the report forbids judging a whole flow from its first screen."

[[sources.declined]]
feature = "A product-design router with request modes, a rule-ID registry that every finding cites, a P0 to P2 severity rubric and visual-design scope."
reason = "The skill stays an accessibility specialist and prioritizes findings by blocked tasks, impact, reach and available alternatives."


  "LICENSE",
]

[[sources.ideas]]
idea = "Coverage reaches beyond controls to content alternatives (images, charts, captions, transcripts and audio description), page language, input alternatives, timing and moving content, and understandable forms, each judged by meaning and accuracy rather than presence."
serves = "Finds barriers in content and timing that a control-only review misses."
where = [
  "references/web.md#semantics-and-content",
  "references/web.md#visual-conditions-and-input-alternatives",
  "references/web.md#forms-authentication-and-recovery",
]
shapes = "Adds content-alternative, language, timing, motion and form checks to the web reference, each judged by meaning and accuracy rather than presence."
adapted = "The checks follow WCAG 2.2 with each criterion's precise exceptions instead of the donor's abbreviated WCAG 2.1 checklist."

[[sources.ideas]]
idea = "Automated and source-only audits have limits: a screenshot does not establish keyboard behavior, accessible names or spoken output, and a tree, synthetic event or automated scan cannot replace the assistive-technology interaction."
serves = "Keeps manual keyboard and screen-reader checks in scope where the claim needs them."
where = [
  "SKILL.md#establish-the-task-and-authority",
  "SKILL.md#collect-evidence-that-matches-the-claim",
  "SKILL.md#report-barriers-and-coverage",
]
shapes = "Limits what each kind of evidence can prove, and makes the report reject a whole-flow verdict built on a screenshot, source patch or automated score."
adapted = "No automated score or empty result certifies conformance, and an unavailable manual check is never replaced with a passing automation score."

[[sources.declined]]
feature = "The abbreviated WCAG 2.1 checklist, including the obsolete 4.1.1 Parsing criterion."
reason = "The skill uses WCAG 2.2 with each criterion's exact exceptions."

[[sources.declined]]
feature = "Large text defined as at least 18 px, or 14 px bold."
reason = "Large text is at least 18 pt regular or 14 pt bold, about 24 or 18.67 CSS px."

[[sources.declined]]
feature = "Language-specific code snippets and global installation of audit packages."
reason = "The skill uses the host's tools and the project's existing harness."

[[sources.declined]]
feature = "Fixed severity tiers for every finding."
reason = "Findings are prioritized by blocked tasks, impact, reach and available alternatives."


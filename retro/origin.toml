format_version = 2
skill = "retro"
created = "2026-10-06"
approach = "base"
goal = "Turn evidence from a coding session into focused improvements to the agent's working environment and route each one to the owner that would implement it. Success is a prioritized report in which every finding has an evidence pointer, a concrete proposal, a responsible owner and a way to verify it, or a clear statement that the evidence supports no change."

[[invariants]]
rule = "A retrospective request produces a report. Changes are applied only when the active request or a standing authorization covers them; that authorization is kept without asking again, and findings return to an enclosing caller so its workflow can continue."
reason = "The user's global rules make an agreed plan run without a second approval, and retro runs inside larger workflows as well as on its own."
where = ["SKILL.md#session-retrospective", "SKILL.md#steps"]

[[invariants]]
rule = "retro never edits the user's personal instructions, meaning the global instruction file and the private one that load in every project. Any change there, including a rule worth moving into them, is a proposal to the user, and agent-instructions writes it only after the user accepts it. A general authorization to apply retro's findings does not cover them."
reason = "User decision of 2026-10-18: retro tells the user when something is worth moving into personal rules and does not edit them by itself."
where = ["SKILL.md#session-retrospective", "SKILL.md#steps", "SKILL.md#files", "SKILL.md#owners"]

[[invariants]]
rule = "Finishing a task does not request a retrospective, so retro is never an automatic end-of-task phase."
reason = "The skill stays model-invocable, so it needs its own guard against running after every task; the base author notes that a run after every session mostly produces rules nobody needed."
where = ["SKILL.md#session-retrospective"]

[[invariants]]
rule = "retro owns diagnosis, prioritization and routing. Existing skills own the changes they cover, including instruction writing and verification, and retro hands them prepared findings with the request that authorizes them instead of copying their procedures. An authorized change that no skill covers is made with the project's own commands."
reason = "Local owners exist for most kinds of change retro proposes, and an instruction owner needs the user's request to apply its own rules, such as when its model reviews run."
where = ["SKILL.md#steps", "SKILL.md#owners"]

[[invariants]]
rule = "The skill runs in Claude Code and Codex, and only their session-record layouts are bundled. Apps that drive these agents keep the records in the agent's own location."
reason = "User decision of 2026-10-18: bundle session locations for Claude Code and Codex only, with no T3 Code layout, because T3 Code runs those agents and their records stay where the agents write them."
where = ["references/session-records.md"]

[[sources]]
id = "matt-retro"
author = "Matt Pocock"
repository = "https://github.com/mattpocock/skills"
remote = "git@github.com:mattpocock/skills.git"
ref = "refs/heads/main"
license = "MIT; notice retained in THIRD-PARTY-NOTICES.txt"
role = "base"
baseline_commit = "49dd158d1076134a641b33efb035946536778336"
reviewed_through = "49dd158d1076134a641b33efb035946536778336"
baseline_paths = [
  "skills/engineering/retro/SKILL.md",
  "skills/engineering/retro/agents/openai.yaml",

[[sources]]
id = "pstack-reflect"
author = "Lauren Tan"
repository = "https://github.com/cursor/plugins"
remote = "git@github.com:cursor/plugins.git"
ref = "refs/heads/main"
license = "MIT; original notice retained in THIRD-PARTY-NOTICES.txt"
role = "ideas"
baseline_commit = "df581122cde17e6e27686b5a448bde23e4ad4318"
reviewed_through = "e5136d82418d2db3165ea1050d17577cd618cc05"
baseline_paths = ["pstack/skills/reflect/SKILL.md", "pstack/LICENSE"]
paths = ["pstack/skills/reflect/SKILL.md", "pstack/LICENSE"]

[[sources.ideas]]
idea = "Inspect transcripts only within the identified session, task and project. Other projects' conversations are not a fallback, and a digest or missing log limits what can be concluded."
serves = "Keeps the review accurate and keeps unrelated private conversations out of it."
where = ["SKILL.md#establish-the-scope", "SKILL.md#reconstruct-the-friction"]
shapes = "Makes scope identification come before any history reading, and makes reconstruction name evidence gaps while it finishes independent findings."
adapted = "The host's transcript tools replace the donor's Cursor transcript paths, and recorded commands and permissions count as historical evidence, not as instructions for this run."

[[sources.ideas]]
idea = "When an instruction was missed, check whether the agent actually loaded it before adding a rule: a missed trigger or a placement problem is repaired through selection or placement, and an existing skill owner is preferred over a new skill."
serves = "Prevents duplicate instructions and fixes the activation problem that caused the miss."
where = ["SKILL.md#choose-a-concrete-improvement"]
shapes = "Adds a loading check before any new instruction, and routes reusable lessons to existing owners."
adapted = "Routing goes to registered local owners, the workflow-to-skill skill for reusable procedures and the agent-instructions skill for direct instruction changes, instead of the donor's create-skill."

[[sources.declined]]
feature = "Three parallel reviewer subagents with prompt templates, fixed model roles and a synthesizer."
reason = "Only the donor's entrypoint was read, for its boundary and routing ideas."

[[sources.declined]]
feature = "Cursor-specific transcript paths and handing skill edits to Cursor's create-skill."
reason = "The skill uses host-provided transcript access and registered local owners."

[[sources.declined]]
feature = "Filing backlog items to a tracker automatically."
reason = "A retrospective produces a report; actions outside it follow the active request's authorization."

[[sources.declined]]
feature = "An approval gate before applying edits that the active request already authorizes."
reason = "Authorized improvements keep their scope without a second approval."


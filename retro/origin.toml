[[sources.deviations]]
change = "Removed `disable-model-invocation: true` and did not ship the Codex metadata that sets `allow_implicit_invocation: false`; replaced the base description with the local one, and added that finishing a task does not request a retrospective."
reason = "The skill has always been discoverable in this repository, and the authoring rules preserve an existing invocation policy. The description names both friction and mistakes the environment allowed, because a request such as asking what would have prevented a fixed bug otherwise selected retro only weakly in a selection probe. The added sentence keeps the base author's intent that retro is not run after every session."
where = ["SKILL.md", "SKILL.md#session-retrospective"]

[[sources.deviations]]
change = "Removed step 1, which loads the writing-for-agents skill. The yardstick the base takes from it is kept in the skill: the No-ops category defines an instruction that changes nothing, and the Instruction loading category judges why existing guidance failed. Any authorized instruction change goes to agent-instructions."
reason = "writing-for-agents is not a local skill, and another skill's internal references cannot be loaded by path. The base keeps the load because the No-ops and Skills candidates need a yardstick even in a report-only run, so the local skill carries that yardstick instead of loading a writing workflow."
where = ["SKILL.md#steps", "SKILL.md#owners"]

[[sources.deviations]]
change = "Replaced searching through session logs on this machine with locating the record inside the current project, using bundled Claude Code and Codex layouts that the agent verifies on the current host."
reason = "User decision of 2026-10-18. Codex stores records by date rather than by project, so a same-project rule needs an explicit filter on the record's working directory or repository."
where = ["SKILL.md#steps", "references/session-records.md"]

[[sources.deviations]]
change = "Replaced presenting the candidates to the user and waiting with a report by default: changes the active request or a standing authorization covers are handed to their owners in a new final step, without asking again, and findings return to an enclosing caller."
reason = "The authority invariant. The base assumes a user at the keyboard and no calling workflow."
where = ["SKILL.md#session-retrospective", "SKILL.md#steps"]

[[sources.deviations]]
change = "Replaced the reviewer agent and `CODING_STANDARDS.md` with the project's standards document that review-code-changes reads, such as `CONTRIBUTING.md`, `CODING_STANDARDS.md` or a style guide; `CODING_STANDARDS.md` is proposed only when the project has none. The principle that the reviewer imposes standards now covers project rules only."
reason = "User decision of 2026-10-18: standards belong to the reviewer for project rules only. review-code-changes searches for those documents, and the base author accepts any standards document already kept."
where = ["SKILL.md#implementation-vs-review", "SKILL.md#steps", "SKILL.md#files"]

[[sources.deviations]]
change = "Restructured the Global AGENTS.md category around scope: a project judgement rule moves to the project's standards document, a rule that holds across the user's projects moves to personal instructions, and a personal rule that applies to one project moves to that project. Personal cross-project rules are not moved to a reviewer document, and every personal-instruction change is a proposal. Added personal instructions to the Files list."
reason = "User decision of 2026-10-18: the user's personal cross-project rules have no reviewer-only home and stay at personal scope, and retro proposes, never edits, changes to them. A check lives in one project, so it cannot make a cross-project rule a no-op."
where = ["SKILL.md#steps", "SKILL.md#implementation-vs-review", "SKILL.md#files"]

[[sources.deviations]]
change = "Widened the Coding standards trigger from a reviewer that failed to catch a mistake to also cover a session with no review in which the user caught it."
reason = "Many sessions run with no reviewer agent; the user's correction is then the only sign that review would have needed a rule."
where = ["SKILL.md#steps"]

[[sources.deviations]]
change = "Restructured the steps: added a step that marks the struggles before the categories, a step that filters candidates before they are presented, and a final hand-off step. Added an Instruction loading category, and extended the Automated checks, No-ops and Information access triggers."
reason = "The ideas taken from pstack correct and reflect, which the ideas entries describe, and the authority invariant for the hand-off step."
where = ["SKILL.md#steps"]

[[sources.deviations]]
change = "Extended presenting in order of severity with the fields each finding carries: evidence and effect, causal uncertainty, proposal with its level and why no higher level works, owner, verification criterion and status, plus the reviewed scope, the missing evidence, and keeping private session details out of shared files."
reason = "The goal requires each finding to carry evidence, a proposal, an owner and a way to verify it."
where = ["SKILL.md#steps"]

[[sources.deviations]]
change = "Replaced the Skills entry's pointer to writing-for-agents with an Owners table that names the local skill for each kind of change an authorized run hands off, the user for host configuration and personal instructions, and the agent running retro for any other authorized change."
reason = "The routing invariant: the base only proposes and names no implementer, while the local skill also carries out authorized changes. Host settings such as MCP servers and permissions differ between Claude Code and Codex and fall outside the skill's authority."
where = ["SKILL.md#files", "SKILL.md#owners"]

[[sources]]
id = "pstack-correct"
author = "Lauren Tan"
repository = "https://github.com/cursor/plugins"
remote = "git@github.com:cursor/plugins.git"
ref = "refs/heads/main"
license = "MIT; original notice retained in THIRD-PARTY-NOTICES.txt"
role = "ideas"
baseline_commit = "df581122cde17e6e27686b5a448bde23e4ad4318"
reviewed_through = "e5136d82418d2db3165ea1050d17577cd618cc05"
baseline_paths = ["pstack/skills/correct/SKILL.md", "pstack/LICENSE"]
paths = ["pstack/skills/correct/SKILL.md", "pstack/LICENSE"]

[[sources.ideas]]
idea = "Model the next contributor as an agent that sees only the files it opens, copies the nearest example and takes the shortest path that compiles. For each struggle, ask what in the environment made the wrong path look right, such as a misleading nearby example, an old way that still exists, two supported ways to do one task, or a hidden dependency."
serves = "Findings name a cause in the environment instead of asking the next agent to be more careful."
where = ["SKILL.md#session-retrospective", "SKILL.md#steps"]
shapes = "The opening states the contributor model, and the step that marks the struggles asks its causal question of each moment."

[[sources.ideas]]
idea = "Fix a mistake at the highest level that works: remove the wrong path (one owner for each piece of state, one supported way for each task, hidden internals, deleted old ways), then types that make the bad state unwritable, then a check whose error names what to use instead and fails only on new violations when the pattern is common, then a behavior test, and prose last, only for judgement calls. Each finding states the level chosen and why a higher level does not work."
serves = "Prevents the next agent from making the same mistake instead of asking it to remember a rule."
where = ["SKILL.md#fix-at-the-highest-level-that-works", "SKILL.md#steps"]
shapes = "Adds the Fix at the highest level that works reference section, which the Coding standards category uses for mechanical violations and which replaces the base's list of check mechanisms, and adds the level field to each finding."
adapted = "retro proposes the level and routes the change to its owner; it fixes nothing during diagnosis."

[[sources.ideas]]
idea = "A proposed check is proven only when its command rejects the session's real mistake and runs the same way locally and in CI."
serves = "Keeps prevention proposals tied to the observed failure and testable."
where = ["SKILL.md#fix-at-the-highest-level-that-works", "SKILL.md#steps"]
shapes = "Gives every finding a verification criterion and states that prevention stays a hypothesis until the check runs."
adapted = "The check must also accept a valid nearby example, so it cannot block good code, and a labeled reconstruction can stand in for the real mistake. The verify skill runs the examples after an authorized change."

[[sources.ideas]]
idea = "Drop a prose rule once a check makes its mistake impossible."
serves = "Instruction files get shorter as enforcement grows, which is the base's own success signal."
where = ["SKILL.md#steps", "SKILL.md#fix-at-the-highest-level-that-works"]
shapes = "Extends the No-ops category to rules a check now enforces."
adapted = "The deletion is proposed only after the check's actual coverage is verified, not because a check appears to cover the rule."

[[sources.declined]]
feature = "Fixing the most frequent mistake classes during diagnosis, with one commit per class."
reason = "retro proposes and routes changes within the user's authority; implementation owners carry out authorized work."

[[sources.declined]]
feature = "A fixed recurrence threshold under which a mistake counts as a class once it has happened twice."
reason = "retro usually sees one session; severity weighs consequence, recurrence, confidence and cost instead."

[[sources.declined]]
feature = "A mandatory table in the agent instruction file that pairs each rule with what enforces it."
reason = "It adds always-loaded text, against keeping `AGENTS.md` for navigation pointers."

[[sources.declined]]
feature = "Exceptions that must carry an expiry date and a human's approval on the offending line."
reason = "No universal exception policy; exceptions stay with their instruction owner."

[[sources.declined]]
feature = "Running the procedure each time the operator corrects the agent."
reason = "An automatic trigger; finishing a task or receiving a correction does not request a retrospective."


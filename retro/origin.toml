[[sources]]
id = "pstack-correct"
author = "Lauren Tan"
repository = "https://github.com/cursor/plugins"
remote = "git@github.com:cursor/plugins.git"
ref = "refs/heads/main"
license = "MIT; original notice retained in THIRD-PARTY-NOTICES.txt"
role = "ideas"
baseline_commit = "df581122cde17e6e27686b5a448bde23e4ad4318"
reviewed_through = "e5136d82418d2db3165ea1050d17577cd618cc05"
baseline_paths = ["pstack/skills/correct/SKILL.md", "pstack/LICENSE"]
paths = ["pstack/skills/correct/SKILL.md", "pstack/LICENSE"]

[[sources.ideas]]
idea = "Fix a recurring mistake at the highest level that works: remove the invalid path through a clearer boundary or single owner, then use types, constraints, lint, CI or behavioral tests, and keep prose rules for judgment calls."
serves = "Prevents the next agent from making the same mistake instead of asking it to remember a rule."
where = ["SKILL.md#choose-a-concrete-improvement"]
shapes = "Orders the candidate mechanisms from structural removal through executable checks to instructions, which keep only judgment and justified exceptions."
adapted = "Legitimate exceptions stay with their instruction owner, and a rule is retired only after the actual coverage of the mechanism that replaces it is established."

[[sources.ideas]]
idea = "Ground each proposed guard in a real mistake and show that the check would reject it."
serves = "Keeps prevention proposals tied to observed failures and testable."
where = ["SKILL.md#choose-a-concrete-improvement"]
shapes = "Requires every proposal to carry a way to check it, and requires a new guard to have a failing example from the session or a labeled reconstruction."
adapted = "The guard must also accept a valid nearby example. The verify skill owns execution evidence and the agent-instructions skill owns instruction evaluation, and proposed prevention remains a hypothesis until their checks support it."

[[sources.declined]]
feature = "Fixing every mistake class during diagnosis, with one commit per class."
reason = "The skill proposes and routes changes within the user's scope; implementation owners carry out authorized work."

[[sources.declined]]
feature = "A fixed recurrence threshold under which a mistake counts as a class once it has happened twice."
reason = "The report records whether the evidence shows one occurrence or recurrence, and neither alone decides significance."

[[sources.declined]]
feature = "One supported way for every task as a universal implementation policy."
reason = "A clearer boundary or single owner is preferred when practical, not imposed everywhere."

[[sources.declined]]
feature = "A mandatory table in the agent instruction file that pairs each rule with its enforcement."
reason = "The skill avoids another copy of instructions that already cover a decision."

[[sources.declined]]
feature = "Exceptions that must carry an expiry date and a human's approval on the offending line."
reason = "Legitimate exceptions stay with their instruction owner without a required expiry."


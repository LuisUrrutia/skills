format_version = 2
skill = "retro"
created = "2026-10-06"
approach = "derive"
goal = "Turn evidence from a coding session into focused improvements to the agent's working environment and route each one to the owner that would implement it. Success is a prioritized report in which every finding has an evidence pointer, a concrete proposal, a responsible owner and a way to verify it, or a clear statement that the evidence supports no change."

[[invariants]]
rule = "This skill owns diagnosis, prioritization and routing. Existing specialists own implementation, instruction writing and verification, and the skill hands them prepared findings instead of copying their procedures."
reason = "The skill was derived to compose with existing instruction and implementation owners."
where = ["SKILL.md#session-retrospective", "SKILL.md#choose-a-concrete-improvement"]

[[invariants]]
rule = "A retrospective request produces a report. Improvements are carried out only when the active request or standing authorization includes them; that authorization is kept without asking again, and findings return to an enclosing caller so its workflow can continue."
where = ["SKILL.md#establish-the-scope"]

[[invariants]]
rule = "The report includes only supported, useful changes. When the evidence supports no candidate, the report says so instead of inventing generic advice."
where = ["SKILL.md#reconstruct-the-friction", "SKILL.md#return-the-findings"]

[[invariants]]
rule = "Completing implementation alone does not request a retrospective."
where = ["SKILL.md#establish-the-scope"]

[[sources]]
id = "matt-retro"
author = "Matt Pocock"
repository = "https://github.com/mattpocock/skills"
remote = "git@github.com:mattpocock/skills.git"
ref = "refs/heads/main"
license = "MIT; original notice retained in THIRD-PARTY-NOTICES.txt"
role = "ideas"
baseline_commit = "7a030a8b0dcaa601bb0dda9aaf174affb3d61145"
reviewed_through = "49dd158d1076134a641b33efb035946536778336"
baseline_paths = ["skills/engineering/retro/SKILL.md", "LICENSE"]
paths = ["skills/engineering/retro/SKILL.md", "LICENSE"]

[[sources.ideas]]
idea = "A retrospective reads the session's primary evidence, meaning the deciding exchanges, tool results and resulting artifacts, and looks for improvements to the agent's working environment rather than to the delivered work."
serves = "Bases each improvement on what actually happened, so future sessions avoid the same friction."
where = ["SKILL.md#reconstruct-the-friction", "SKILL.md#return-the-findings"]
shapes = "Makes reconstruction from primary records the first diagnostic step, and ends the skill with a prioritized list of findings."
adapted = "The donor orders candidates by severity. Locally priority combines consequence, recurrence, confidence and cost of correction, and each finding carries its evidence pointer, causal uncertainty, owner and verification criterion."

[[sources.ideas]]
idea = "Friction shows up in a few areas worth investigating: navigation and information access, checks that could have caught an error, instruction friction, and tool and workflow economy."
serves = "Directs the review to the environment problems that most often slow an agent down."
where = ["SKILL.md#reconstruct-the-friction"]
shapes = "Gives the reconstruction section its four investigation areas, each paired with the session signals that justify looking there."
adapted = "The areas are conditional prompts, not a quota. A successful session can need no change, and a required human decision, deliberate exception or genuine blocker is not a process defect merely because it interrupted progress."

[[sources.ideas]]
idea = "Before adding a check, read the repository's actual check command and where it runs, because an existing check that is unwired, bypassed or broken is itself the finding. A mechanical violation gets deterministic enforcement rather than a prose rule."
serves = "Prevents reinventing checks that exist and keeps mechanical rules out of instructions."
where = ["SKILL.md#reconstruct-the-friction", "SKILL.md#choose-a-concrete-improvement"]
shapes = "Adds unwired, bypassed or broken checks to the checks area, and makes improvement selection inspect the current owner and check wiring before prescribing a replacement."

[[sources.declined]]
feature = "Disabling model invocation so that the retrospective runs only on an explicit command."
reason = "Normal skill discovery stays."

[[sources.declined]]
feature = "Loading the writing-for-agents skill and keeping a reviewer-only coding-standards file."
reason = "Established local owners keep this work: the agent-instructions skill writes and evaluates instructions, and the verify skill owns execution evidence."


format_version = 2
skill = "analyze-change-effects"
created = "2026-10-03"
approach = "derive"
goal = "Find what an existing or proposed change could break beyond the changed code, and test the assumptions that would make it safe against the actual implementation. Success is a bounded account that keeps confirmed breakage, cleared risks and unproven conditions apart, ties each to source locations or observed execution, and names the next useful check."

[[invariants]]
rule = "The skill runs directly, with no coordinator or upstream skill. It and the review-audit skill are independent: neither is a donor, wrapper, extension or prerequisite for the other."
where = ["SKILL.md#analyze-change-effects"]

[[invariants]]
rule = "Existing changes are the core use. Proposed-change analysis is a local extension, not the reason the skill exists: it investigates current consumers and contracts without implementing the proposal, and a probe that uses a proposed value tests only that scenario, never an implementation that does not exist yet."
where = ["SKILL.md#establish-the-change"]

[[invariants]]
rule = "Investigation leaves product source, committed tests, dependency pins, configuration and remote state unchanged. Disposable probes and generated output go in scratch storage that the caller permits, and the skill does not install, upgrade, repair, publish or call a live mutating service to obtain proof."
where = ["SKILL.md#test-the-deciding-assumptions"]

[[invariants]]
rule = "Execution is the central evidence, but an explicit inspection-only request or execution restriction takes precedence. When execution or the real dependency is unavailable, the analysis marks the affected claim unproven, names the smallest missing check and never quietly substitutes another version."
where = ["SKILL.md#test-the-deciding-assumptions"]

[[invariants]]
rule = "The skill analyzes and reports; an analysis request never becomes repair or delivery. A caller with a wider authorized task chooses the next action from the result."
where = ["SKILL.md#deliver-the-impact-and-evidence"]


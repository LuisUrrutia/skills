id = "pstack-correct"
author = "Lauren Tan / pstack"
repository = "https://github.com/cursor/plugins"
remote = "git@github.com:cursor/plugins.git"
ref = "refs/heads/main"
license = "MIT; original notice retained in THIRD-PARTY-NOTICES.txt; ideas only, no source text copied"
role = "ideas"
baseline_commit = "e43c7ee26e0038c6c1fa8380dd34ce86ff94cb2a"
reviewed_through = "e5136d82418d2db3165ea1050d17577cd618cc05"
baseline_paths = ["pstack/skills/correct/SKILL.md", "pstack/LICENSE"]
paths = ["pstack/skills/correct/SKILL.md", "pstack/LICENSE"]

[[sources.ideas]]
idea = "Route a lesson toward removing the invalid path or enforcing its invariant through the project's existing types, constraints, lint or behavioral checks before relying on a prose reminder."
serves = "Makes a repeated mistake impossible or detected instead of relying on an agent to remember a rule."
where = ["SKILL.md#choose-what-to-retain"]
shapes = "Adds an enforcement-first routing step after the destination list, ahead of any new instruction."
adapted = "Extraction names the existing enforcement owner and proposes the proof without changing the repository. The project's check owner implements project enforcement under its own authorization, and the agent-instructions skill writes instructions and skill-bundled helpers. Judgment, reasons and exceptions stay with their instruction owner, and a rule is removed as redundant only after its actual enforcement and coverage are verified."

[[sources.ideas]]
idea = "A proposed check counts only after it rejects a reproduction of the mistake: supply a minimized failing case with its expected rejection reason, preferably from an observed failure, and run the check on it before claiming enforcement."
serves = "Prevents claiming enforcement from a check that was never seen to fail."
where = ["SKILL.md#write-and-verify-the-result"]
shapes = "Adds a required proof package (failing case, expected rejection reason and named executor) to the handoff for proposed automation."
adapted = "As a local strengthening beyond the donor, the proof also needs a valid nearby case with its expected acceptance, and both cases must run. A case reconstructed from the confirmed contract is labeled as such, and a meaningful case or expected outcome that cannot be established stays unresolved instead of being invented. The adoption trials are recorded in reports/skill-atlas/workflow-upstream-adoption-validation.json."

[[sources.ideas]]
idea = "Keep preventing new violations separate from migrating violations that already exist, which is scoped as its own work."
serves = "Lets a new check land without forcing an unplanned migration, and keeps existing debt visible."
where = ["SKILL.md#choose-what-to-retain"]
shapes = "Ends the enforcement paragraph with a split between prevention and a separately scoped migration."

[[sources.declined]]
feature = "An automatic audit of recent commits, reverts and review comments to find mistake classes across the repository."
reason = "Extraction stays within the requested history and project."

[[sources.declined]]
feature = "A mandatory table in the agent instruction file that pairs each rule with what enforces it, updated on every correction."
reason = "Rules stay with their existing instruction owner; the skill adds no fixed instruction-file structure."

[[sources.declined]]
feature = "Exceptions on the offending line that need a reason, an expiry date and a human's approval."
reason = "Exception handling belongs to the project's enforcement owner; the skill adds no expiry policy or approval gate."

[[sources.declined]]
feature = "Writing docs and agent rules last, after architecture, types, lint and tests."
reason = "Judgment, reasons and exceptions keep their instruction owner whatever enforcement is proposed, and prose is not deleted merely because a check is proposed."

[[sources.declined]]
feature = "Fixing the most frequent mistake classes in the repository during the same run, one commit each."
reason = "Extraction proposes enforcement and its proof without unrequested repository changes."


[[sources.ideas]]
idea = "Extract from the available history the tools used, the sequence of steps, the user's corrections and the observed input and output formats, each with an evidence pointer, before asking the user anything."
serves = "Captures the workflow as it actually ran instead of as it is remembered."
where = ["SKILL.md#inspect-the-work"]
shapes = "Makes evidence-backed extraction the first output of the inspection, ahead of any question to the user."
adapted = "The local form also separates successful decisions from abandoned attempts and user choices from agent assumptions. It asks the user only when the sources leave the intended objective or a conflict unresolved, not for confirmation before each step."

[[sources.ideas]]
idea = "Identify the future request that should activate the skill, its expected result, its activation boundaries, and which outputs admit objective checks."
serves = "Gives the writer a testable contract and a clear trigger boundary."
where = ["SKILL.md#choose-what-to-retain", "SKILL.md#write-and-verify-the-result"]
shapes = "Opens retention with the future request, result and activation boundaries, and makes the objectively checkable outputs part of the handoff to the agent-instructions skill."

[[sources.declined]]
feature = "Running the interview, drafting, test-case, evaluation-viewer and packaging loop inside the capture step."
reason = "The extraction layer hands its contract to the agent-instructions skill, which owns writing, packaging and evaluation."

[[sources.declined]]
feature = "Pushy descriptions that list many trigger contexts to counter undertriggering."
reason = "Descriptions stay short activation cues."

[[sources.declined]]
feature = "A proactive interview about edge cases, formats, success criteria and dependencies before writing."
reason = "The skill asks only for material decisions that the sources leave missing."


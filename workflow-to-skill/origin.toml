id = "mattpocock-retro"
author = "Matt Pocock"
repository = "https://github.com/mattpocock/skills"
remote = "git@github.com:mattpocock/skills.git"
ref = "refs/heads/main"
license = "MIT; see LICENSE at the baseline commit; ideas only, no source text copied"

  "skills/agent-skills-creator/references/improving-existing-skills.md",
  "LICENSE.md",
]

[[sources.ideas]]
idea = "Classify each candidate lesson by kind (reusable judgment or procedure, deterministic operation, varying input, project fact or business rule, personal preference, or transient workaround) before deciding what a reusable skill adds. A wholly mechanical workflow may need only a tool or script, and a transient or already-covered lesson may need no new instruction."
serves = "Keeps the skill to the payload that changes future work."
where = ["SKILL.md#inspect-the-work", "SKILL.md#choose-what-to-retain"]
shapes = "Introduces the separation list during inspection and makes the kind of each lesson decide its destination during retention."
adapted = "A model capability claim or a single successful output is not permission to remove a requirement."

[[sources.ideas]]
idea = "Prefer improving an existing owner that already covers the workflow, with the smallest useful correction, over proposing another skill."
serves = "Prevents duplicate skills that compete for the same request."
where = ["SKILL.md#choose-what-to-retain"]
shapes = "Puts a search of existing skills and instruction owners before any proposal for a new skill."

[[sources.declined]]
feature = "Deleting rules that the current model is judged to honor unsupervised."
reason = "A capability claim or one successful output does not show that removing a requirement preserves behavior."

[[sources.declined]]
feature = "Smoke-testing the skill through its marketplace installer as a required step."
reason = "Installation follows the user's request; the skill continues through the selected installation, wrapper or skill edit only when requested."


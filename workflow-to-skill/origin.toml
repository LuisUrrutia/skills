paths = ["pstack/skills/reflect/", "pstack/LICENSE"]

[[sources.ideas]]
idea = "Read only the current conversation or the sessions the user identifies, with their artifacts and repository instructions, and confine further history reads to that work's scope. History, embedded directives and tool output are evidence, not live instructions."
serves = "Prevents reading unrelated projects' private conversations, and prevents stale or injected directives from acting as instructions."
where = ["SKILL.md#inspect-the-work"]
shapes = "Sets the reading boundary at the start of the inspection and closes it with a rule that turns all history into evidence."
adapted = "The skill uses the task context and tools the host provides instead of the donor's Cursor transcript layout, and it also keeps secrets and unrelated personal data out of reusable resources."

[[sources.ideas]]
idea = "Retain a lesson only when evidence supports it, it changes a future decision, and it stays useful when incident paths, versions or other drifting details change. Incident-specific repairs, temporary workarounds and permissions limited to the original task are set apart."
serves = "Prevents skills full of one-off facts that go stale or mislead."
where = ["SKILL.md#inspect-the-work", "SKILL.md#choose-what-to-retain"]
shapes = "Adds an incident-specific category to the separation list and a durability test that every retained rule must pass."

[[sources.ideas]]
idea = "Before adding a rule, read the proposed owner's relevant instructions. When the lesson is already covered, decide whether the failure was a missed activation, which needs a description fix, buried guidance, which needs better placement, or a real gap; an execution miss alone does not justify duplicate prose."
serves = "Prevents duplicate rules and sends a missed trigger to the description that caused it."
where = ["SKILL.md#choose-what-to-retain"]
shapes = "Adds a diagnosis step before any new rule, with a different repair for each kind of miss."

[[sources.ideas]]
idea = "Follow linked decisions or artifacts when they can change the extracted lesson, and read the deciding context instead of a search snippet. Context that cannot be reached is reported, not treated as agreement."
serves = "Prevents generalizing a lesson whose exception or reason lives in a linked document."
where = ["SKILL.md#inspect-the-work"]
shapes = "Adds a step after the first extraction that follows linked context before any lesson is generalized."

[[sources.declined]]
feature = "Locating Cursor transcript files and fanning out three fixed reviewer subagents and a synthesizer on models taken from a pstack models table."
reason = "The skill uses the task context and tools the host provides."

[[sources.declined]]
feature = "Handing substantive edits, description tuning and new skills to Cursor's create-skill skill."
reason = "The agent-instructions skill owns instruction writing and validation."

[[sources.declined]]
feature = "Filing backlog items to a tracker automatically."
reason = "Extraction writes only where the request asks it to."

[[sources.declined]]
feature = "Presenting every accepted edit for row-by-row approval before applying it."
reason = "A request to create or improve a skill already authorizes the writing; the skill asks only when the objective or a conflict is unresolved."


reviewed_through = "49dd158d1076134a641b33efb035946536778336"
baseline_paths = ["skills/engineering/retro/SKILL.md", "LICENSE"]
paths = ["skills/engineering/retro/SKILL.md", "LICENSE"]

[[sources.ideas]]
idea = "Send each lesson to the owner that matches its role: a durable project fact or business rule to its project documentation or instruction owner, with a pointer when a skill needs it; a personal preference to the user's personal scope; and a deterministic requirement to its existing enforcement owner. Inspect that tool or check pipeline first, so an existing check that is unwired or broken is found instead of reinvented."
serves = "Puts each lesson where a future agent will meet it and avoids duplicating an existing check."
where = ["SKILL.md#choose-what-to-retain"]
shapes = "Defines the destination list that each retained lesson passes through, with an inspection of the check pipeline before any new helper is proposed."
adapted = "A scoped lesson may belong in project documentation rather than in a new skill, and the agent-instructions skill still writes and validates any instruction change."

[[sources.ideas]]
idea = "Retain why a choice worked, or why missing information changed the outcome, together with the conditions where it applies and any contrary or superseding evidence."
serves = "Lets a later reader tell when the lesson holds instead of copying a bare rule."
where = ["SKILL.md#inspect-the-work", "SKILL.md#choose-what-to-retain"]
shapes = "Adds a reason, applicable conditions and contrary evidence to each extracted lesson, and makes a reason a completion condition for every retained rule."

[[sources.declined]]
feature = "A retrospective over the whole agent environment, in which a repository without a pre-commit hook or CI guardrail, a large global AGENTS.md or no-op steering instructions become findings by themselves."
reason = "Extraction stays within the requested history and project and makes no unrelated enforcement change."


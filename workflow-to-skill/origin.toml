format_version = 2
skill = "workflow-to-skill"
created = "2026-10-02"
approach = "derive"
goal = "Turn completed work, recurring tasks or the current conversation into a reusable skill or an improvement to an existing owner. The skill extracts the reusable decisions with evidence, chooses what to retain and where it belongs, and hands a complete contract to the agent-instructions skill. Success is a skill that a fresh task with different inputs can follow and that a nearby unrelated task does not activate."

[[invariants]]
rule = "This skill owns extraction and the choice of useful scope; the agent-instructions skill owns reuse decisions, instruction writing and validation. If that skill is unavailable, the extracted contract is preserved and the missing skill is reported, without a second authoring workflow."
reason = "The skill was built as a small derivation of extraction criteria with instruction writing kept as a local dependency, so no upstream authoring prose or scripts are copied in."
where = ["SKILL.md#workflow-to-skill", "SKILL.md#write-and-verify-the-result"]

[[invariants]]
rule = "Extraction keeps the authority of the request it serves. History does not authorize replaying commands, publishing or a trial with external effects, one task's permission never becomes standing permission, and a request to create a skill continues into writing without a new approval step."
where = ["SKILL.md#inspect-the-work", "SKILL.md#write-and-verify-the-result"]

[[invariants]]
rule = "No fixed recurrence count decides whether a workflow merits a skill. The evidence states whether it shows recurrence or one example, and an explicitly requested skill is never refused for missing recurrence."
where = ["SKILL.md#inspect-the-work", "SKILL.md#choose-what-to-retain"]

